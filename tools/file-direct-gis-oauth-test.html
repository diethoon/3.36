<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wayward file:// 직접 GIS OAuth 검증</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;color:#222}
button{font:inherit;padding:12px 16px;margin:8px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:12px;border-radius:8px}
.note{background:#fff5d6;padding:12px;border-radius:8px}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<h1>file:// 직접 Google OAuth 테스트</h1>
<p class="note">이 페이지는 별도의 인증 웹페이지나 중계 서버를 사용하지 않습니다. 현재 페이지 자체에서 Google Identity Services를 호출합니다. 게임 저장 데이터는 읽거나 업로드하지 않습니다.</p>
<p>페이지 주소 / 출처:</p><pre id="origin"></pre>
<p>OAuth 클라이언트 ID (기본값은 Wayward의 기존 웹 클라이언트):</p>
<input id="client" style="width:100%;box-sizing:border-box;padding:10px" value="35944231952-p82giir62o28bo001j9uvmqo3kgp9c99.apps.googleusercontent.com">
<p><button id="go">1. 이 페이지에서 Google Drive 권한 요청</button></p>
<p><button id="drive" disabled>2. 토큰으로 Drive appDataFolder 읽기 테스트</button></p>
<pre id="log">준비 중…</pre>
<script>
(function(){
 const $=id=>document.getElementById(id);
 let token=null, client=null;
 const log=(...args)=>{$('log').textContent += '\n'+args.map(x=>typeof x==='string'?x:JSON.stringify(x,null,2)).join(' ');};
 $('origin').textContent='location.href = '+location.href+'\nlocation.origin = '+location.origin+'\nprotocol = '+location.protocol;
 $('log').textContent='GIS 로딩 여부 확인 중…';
 const waitForGIS=()=>new Promise((resolve,reject)=>{
   let n=0; const tick=()=>{if(window.google&&google.accounts&&google.accounts.oauth2)return resolve();
     if(++n>60)return reject(new Error('GIS script가 로드되지 않았습니다. 네트워크 또는 브라우저 정책을 확인하세요.'));
     setTimeout(tick,250);
   };tick();
 });
 waitForGIS().then(()=>log('GIS script 로드 완료. 직접 인증을 시도할 수 있습니다.')).catch(e=>log('GIS 로딩 오류:',e.message));
 $('go').onclick=async()=>{
   $('log').textContent='';
   token=null;$('drive').disabled=true;
   try{
     await waitForGIS();
     client=$('client').value.trim();
     if(!client)throw new Error('OAuth client ID를 입력하세요.');
     log('요청 시작', {href:location.href, origin:location.origin, protocol:location.protocol, client_id:client, scope:'https://www.googleapis.com/auth/drive.appdata'});
     const tc=google.accounts.oauth2.initTokenClient({
       client_id:client,
       scope:'https://www.googleapis.com/auth/drive.appdata',
       callback:resp=>{
         log('GIS callback 응답:',resp);
         if(resp&&resp.access_token){token=resp.access_token;$('drive').disabled=false;log('인증 성공: 액세스 토큰은 화면에 출력하지 않고 메모리에만 보관했습니다.');}
         else log('인증 실패: callback에 access_token이 없습니다.');
       },
       error_callback:err=>log('GIS popup 오류:',err),
       // deliberately no hosted auth page, redirect URI, backend, or token relay
     });
     tc.requestAccessToken({prompt:'consent'});
     log('Google 권한 팝업 호출 완료. 다음에 나타나는 오류 문구를 그대로 기록하세요.');
   }catch(e){log('호출 예외:',e&&e.stack||String(e));}
 };
 $('drive').onclick=async()=>{
   if(!token)return;
   log('Drive API appDataFolder 목록 요청 시작');
   try{
     const r=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,mimeType)',{headers:{Authorization:'Bearer '+token}});
     const body=await r.text();
     log('Drive API HTTP '+r.status,body);
   }catch(e){log('Drive API fetch 예외:',e&&e.stack||String(e));}
 };
})();
</script>
</body>
</html>
