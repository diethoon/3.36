<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Wayward 웹 OAuth file:// 실증 테스트</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark}body{max-width:760px;margin:0 auto;padding:18px;line-height:1.5}
h1{font-size:1.35rem}.box{border:1px solid #8888;border-radius:10px;padding:14px;margin:12px 0}
button{padding:10px 14px;margin:5px 5px 5px 0;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:45vh;overflow:auto}
.note{font-size:.9em;opacity:.85}.ok{font-weight:700}
</style>
</head>
<body>
<h1>Wayward 웹 OAuth · file:// 실증 테스트</h1>
<p>설치형 앱이나 기기 코드 인증을 사용하지 않습니다. 기존 Google <b>웹 클라이언트</b>의 HTTPS 인증 팝업을 열고, 토큰을 이 HTML 창으로 직접 전달한 다음 Drive appDataFolder의 읽기·생성·내용 확인·삭제를 시험합니다. 세이브 중계 서버는 사용하지 않습니다.</p>
<div class="box">
<div id="status" class="ok">대기 중</div>
<p class="note">게임 파일을 file://로 직접 연 상태에서 시작하세요. 팝업 차단이 켜져 있으면 허용해야 합니다. 토큰은 이 페이지 메모리에만 유지되며 로그에 출력하지 않습니다.</p>
<button id="start">1. 웹 OAuth 로그인 + Drive 실증 시작</button>
<button id="stop" disabled>인증 대기 중지</button>
</div>
<div class="box"><b>검증 로그</b><pre id="log"></pre></div>
<script>
(function(){
'use strict';
const CLIENT_ID='35944231952-p82giir62o28bo001j9uvmqo3kgp9c99.apps.googleusercontent.com';
const AUTH_URL='https://wayward-cloud-auth.vercel.app/popup.html';
const AUTH_ORIGIN=new URL(AUTH_URL).origin;
const $=id=>document.getElementById(id);
let popup=null,timer=0,timeout=0,state='',token='',expiresAt=0,settled=false;
function log(s){$('log').textContent+=new Date().toLocaleTimeString()+' '+s+'\n';}
function status(s){$('status').textContent=s;log(s);}
function cleanup(){window.removeEventListener('message',onMessage);if(timer)clearInterval(timer);if(timeout)clearTimeout(timeout);}
function stop(){settled=true;cleanup();try{if(popup&&!popup.closed)popup.close()}catch(_){}$('start').disabled=false;$('stop').disabled=true;status('사용자가 중지했습니다.');}
function onMessage(event){
 if(event.origin!==AUTH_ORIGIN||event.source!==popup)return;
 const d=event.data;
 if(!d||d.type!=='wayward-google-drive-auth'||d.state!==state)return;
 if(settled)return;
 if(d.error){settled=true;cleanup();status('OAuth 실패: '+String(d.error));$('start').disabled=false;$('stop').disabled=true;return;}
 if(!d.accessToken){settled=true;cleanup();status('인증 창에서 토큰을 받지 못했습니다.');$('start').disabled=false;$('stop').disabled=true;return;}
 settled=true;cleanup();token=String(d.accessToken);expiresAt=Date.now()+Math.max(60,Number(d.expiresIn)||3600)*1000;
 status('OAuth 성공: 웹 클라이언트 토큰을 게임 창과 같은 file:// 페이지에서 받았습니다. Drive API 검증 중…');
 runDriveTest().catch(e=>status('Drive 검증 실패: '+String(e&&e.message||e))).finally(()=>{$('start').disabled=false;$('stop').disabled=true;token='';});
}
async function drive(url,opts){
 if(!token||Date.now()>expiresAt-15000)throw new Error('액세스 토큰이 없거나 만료되었습니다.');
 const r=await fetch(url,Object.assign({mode:'cors',cache:'no-store',credentials:'omit'},opts||{},{headers:Object.assign({Authorization:'Bearer '+token},opts&&opts.headers||{})}));
 const raw=await r.text();let data;try{data=JSON.parse(raw)}catch(_){data={text:raw}};
 log('Drive HTTP '+r.status+' '+url.replace(/\?.*$/,'')+' → '+(r.ok?'OK':JSON.stringify(data).slice(0,900)));
 if(!r.ok)throw new Error('Drive HTTP '+r.status+': '+JSON.stringify(data));
 return {data,raw};
}
async function runDriveTest(){
 let fileId='';
 try{
  const list=await drive('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=10&fields=files(id,name,mimeType)');
  log('읽기 성공: appDataFolder 파일 목록 '+((list.data.files||[]).length)+'개');
  const boundary='wayward_file_web_oauth_'+Date.now();
  const expected='Wayward file:// web-client test '+Date.now();
  const metadata={name:'wayward-web-oauth-probe-'+Date.now()+'.txt',mimeType:'text/plain',parents:['appDataFolder']};
  const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n--'+boundary+'\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n'+expected+'\r\n--'+boundary+'--';
  const created=await drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
  fileId=created.data.id;
  if(!fileId)throw new Error('파일 생성 응답에 id가 없습니다.');
  log('생성 성공: '+created.data.name);
  const read=await drive('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId)+'?alt=media');
  if(read.raw!==expected)throw new Error('생성 파일을 다시 읽은 내용이 일치하지 않습니다.');
  log('내용 확인 성공: 업로드한 문자열과 다시 읽은 문자열이 일치합니다.');
  await drive('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId),{method:'DELETE'});
  fileId='';
  status('실증 성공: file:// 페이지에서 기존 웹 클라이언트 OAuth → Drive 목록 읽기 → 파일 생성 → 내용 재확인 → 파일 삭제까지 완료했습니다.');
 }finally{
  if(fileId){try{await drive('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId),{method:'DELETE'});log('정리: 테스트 파일 삭제를 재시도했습니다.')}catch(e){log('주의: 테스트 파일 자동 삭제 실패. Drive appDataFolder에서 wayward-web-oauth-probe 파일을 확인하세요. '+String(e&&e.message||e))}}
 }
}
$('start').onclick=()=>{
 if(!/^file:|^https?:$/.test(location.protocol)){status('이 테스트는 file://, HTTP 또는 HTTPS 페이지에서 실행해야 합니다.');return;}
 token='';settled=false;
 try{
  const bytes=new Uint8Array(24);
  if(globalThis.crypto&&crypto.getRandomValues)crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);
  state=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  const url=new URL(AUTH_URL);url.searchParams.set('state',state);
  popup=window.open(url.toString(),'waywardWebOAuthFileTest','popup,width=520,height=700');
  if(!popup){status('팝업이 차단되었습니다. 팝업을 허용하고 다시 시도하세요.');return;}
  $('start').disabled=true;$('stop').disabled=false;
  window.addEventListener('message',onMessage);
  timeout=setTimeout(()=>{if(!settled){settled=true;cleanup();try{if(popup&&!popup.closed)popup.close()}catch(_){}status('인증 시간 초과: 인증 창에서 로그인/권한 승인을 완료했는지 확인하세요.');$('start').disabled=false;$('stop').disabled=true;}},180000);
  timer=setInterval(()=>{try{if(popup&&popup.closed&&!settled){settled=true;cleanup();status('인증 창이 결과 전달 전에 닫혔습니다. 웹 인증 팝업의 opener/postMessage 연결을 확인해야 합니다.');$('start').disabled=false;$('stop').disabled=true;}}catch(_){}},500);
  status('HTTPS 인증 팝업을 열었습니다. Google 계정을 선택하고 Drive appData 접근을 승인하세요.');
 }catch(e){status('팝업 시작 실패: '+String(e&&e.message||e));$('start').disabled=false;$('stop').disabled=true;}
};
$('stop').onclick=stop;
})();
</script>
</body>
</html>
