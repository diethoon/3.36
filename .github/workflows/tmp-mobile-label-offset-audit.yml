name: tmp-mobile-label-offset-audit

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find all target label offsets
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          P=Path("Wayward_MOD_v3.36.html"); C=65536
          for needle in ["주목도","신뢰도","흥분도","기분","현재 위치","준비 중"]:
              nb=needle.encode(); carry=b""; base=0; hits=[]
              with P.open("rb") as f:
                  while 1:
                      b=f.read(C)
                      if not b: break
                      q=carry+b; start=0
                      while True:
                          i=q.find(nb,start)
                          if i<0: break
                          hits.append(base+i-len(carry)); start=i+len(nb)
                      base+=len(b); carry=q[-(len(nb)-1):] if len(nb)>1 else b""
              print("\n",needle,len(hits),hits[:100])
              for p in hits[-10:]:
                  with P.open("rb") as f:
                      f.seek(max(0,p-180));print("OFF",p, f.read(500).decode("utf-8","replace"))
          PY
      - name: Cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-mobile-label-offset-audit.yml
          git commit -m "chore: remove temporary label offset audit"
          git push
