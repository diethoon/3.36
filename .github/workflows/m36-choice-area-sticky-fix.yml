name: m36-choice-area-sticky-fix

on:
  push:
    branches: [mobile-migration-v1]
    paths-ignore:
      - "__m36_sticky_trigger.txt"
      - "__m36_forensic_choice_area.txt"
      - "__m36_forensic_choice_trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Patch fixed area above choices
        shell: python
        run: |
                    from pathlib import Path
          
                    p=Path("Wayward_MOD_v3.36.html")
                    s=p.read_text(encoding="utf-8")
                    if 'className:"m36-mobile-choice-fixed"' in s:
                        print("M36_STICKY_ALREADY_PRESENT")
                        raise SystemExit(0)
          
                    marker='function M36MobilePleasureFixed'
                    anchor=s.find(marker)
                    assert anchor>=0, "fixed-gauge anchor not found"
          
                    root='return u.jsxs("div",{children:[u.jsxs("h3",{className:"text-sm font-bold text-amber-400 uppercase tracking-wider mb-1 m36-mobile-dialogue-source-title"'
                    start=s.find(root,anchor)
                    assert start>=0, "event choice root not found"
          
                    grid='u.jsxs("div",{className:"grid grid-cols-1 gap-2",children:[m326CompletionChoices'
                    g=s.find(grid,start)
                    assert g>=0, "event choice grid not found"
          
                    s=s[:start]+s[start:].replace(
                        'return u.jsxs("div",{children:[',
                        'return u.jsxs("div",{children:[u.jsx("div",{className:"m36-mobile-choice-fixed",children:u.jsxs(u.Fragment,{children:[',
                        1
                    )
                    g=s.find(grid,start)
                    assert g>=0
                    s=s[:g]+']})}),' + s[g:]
          
                    style='''<style id="wayward-mobile-choice-fixed-v1">
                    @media(max-width:1023px){
                      .mobile-action-scroll .m36-mobile-choice-fixed{
                        position:sticky;top:0;z-index:28;
                        margin:0 -0.25rem .25rem;
                        padding:.25rem .25rem .35rem;
                        background:rgb(28 25 23);
                        border-bottom:1px solid rgba(68,64,60,.78);
                      }
                    }
                    @media(min-width:1024px){.m36-mobile-choice-fixed{display:contents;}}
                    </style>'''
                    assert s.count("</head>")==1
                    s=s.replace("</head>",style+"</head>",1)
                    p.write_text(s,encoding="utf-8")
                    print("M36_STICKY_PATCH_APPLIED")

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): keep choice context fixed above scrolling options"
          git push
