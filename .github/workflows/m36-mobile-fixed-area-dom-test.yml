name: One-shot mobile fixed-area DOM verification
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-mobile-fixed-area-dom-test.yml
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Verify real mobile layout and disabled reason pseudo-labels
        shell: bash
        run: |
          set -euo pipefail
          cat > mobile-dom-test.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url='https://static-3-36.onrender.com/Wayward_MOD_v3.36.html';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true
          });
          const page=await context.newPage();
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(1000);

          async function clickIfVisible(text) {
            const loc=page.getByText(text,{exact:true}).first();
            if(await loc.count() && await loc.isVisible().catch(()=>false)) {
              await loc.click({timeout:8000}).catch(()=>{});
              await page.waitForTimeout(500);
              return true;
            }
            return false;
          }
          await clickIfVisible('예');
          await clickIfVisible('이해하고 동의합니다');
          await clickIfVisible('새 게임');
          await page.waitForTimeout(1200);
          await clickIfVisible('피파');
          await clickIfVisible('계속하기 — 피파 →');
          const fate=page.getByText('운명에 맡김',{exact:true});
          for(const el of await fate.all()) {
            if(await el.isVisible().catch(()=>false) && await el.isEnabled().catch(()=>false)) {
              await el.click().catch(()=>{});
              await page.waitForTimeout(60);
            }
          }
          await clickIfVisible('시작 — 피파 →');
          await page.waitForTimeout(1600);
          await clickIfVisible('건너뛰기');
          await page.waitForTimeout(900);

          const injected=await page.evaluate(()=>{
            const root=document.querySelector('.mobile-layout');
            const panel=document.querySelector('.mobile-action-panel');
            const wrapper=panel?.querySelector(':scope > .flex-1.min-h-0.flex.flex-col');
            const sc=document.querySelector('.mobile-action-scroll');
            if(!root||!panel||!wrapper||!sc) return {ok:false,reason:'layout or scroll element missing'};
            const synthetic={};
            let dialogue=wrapper.querySelector('.m36-mobile-dialogue-fixed');
            if(!dialogue){
              dialogue=document.createElement('div');
              dialogue.className='m36-mobile-dialogue-fixed';
              dialogue.textContent='[검증용] 대화/이벤트 내용 고정';
              dialogue.style.cssText='min-height:44px;padding:8px;background:#342819;border:1px solid #a87925;color:#fff;';
              wrapper.insertBefore(dialogue,sc); synthetic.dialogue=true;
            }
            let gauges=wrapper.querySelector('.m36-mobile-pleasure-fixed');
            if(!gauges){
              gauges=document.createElement('div');
              gauges.className='m36-mobile-pleasure-fixed';
              gauges.textContent='[검증용] 당신 / 그녀 게이지';
              gauges.style.cssText='min-height:36px;padding:6px;background:#252941;border:1px solid #5267a1;color:#fff;';
              wrapper.insertBefore(gauges,sc); synthetic.gauges=true;
            }
            let heading=sc.querySelector('.m36-mobile-choice-fixed');
            if(!heading){
              heading=document.createElement('div');
              heading.className='m36-mobile-choice-fixed';
              heading.textContent='선택지 (검증용)';
              heading.style.cssText='padding:6px;background:#302b25;border-bottom:1px solid #a87925;color:#fff;';
              sc.prepend(heading); synthetic.choiceHeading=true;
            }
            const button=document.createElement('button');
            button.disabled=true;
            button.className='m36-mobile-disabled-choice';
            button.setAttribute('data-m36-disabled-choice-label','마을 둘러보기');
            button.setAttribute('data-m36-disabled-choice-status','종료');
            button.textContent='마을 둘러보기 종료';
            sc.appendChild(button);
            synthetic.disabledRow=true;
            for(let i=0;i<35;i++){
              const row=document.createElement('button');
              row.disabled=true;
              row.className='m36-mobile-disabled-choice';
              row.setAttribute('data-m36-disabled-choice-label','비활성 선택지 '+(i+1));
              row.setAttribute('data-m36-disabled-choice-status',i%2?'완료':'시간 부족');
              row.textContent=row.getAttribute('data-m36-disabled-choice-label');
              sc.appendChild(row);
            }
            const rect=el=>{const r=el.getBoundingClientRect(),c=getComputedStyle(el);return {top:r.top,bottom:r.bottom,height:r.height,position:c.position,overflowY:c.overflowY,clientHeight:el.clientHeight,scrollHeight:el.scrollHeight,scrollTop:el.scrollTop}};
            return {ok:true,synthetic,viewport:{width:innerWidth,height:innerHeight,scrollY},root:rect(root),panel:rect(panel),wrapper:rect(wrapper),scroll:rect(sc),
              targets:{dialogue:rect(dialogue),gauges:rect(gauges),heading:rect(heading)},
              reasons:{label:getComputedStyle(button,'::before').content,status:getComputedStyle(button,'::after').content},
              scrollerFound:true};
          });
          if(!injected.ok) throw new Error('DOM fixture setup failed: '+JSON.stringify(injected));

          const afterScroll=await page.evaluate(async()=>{
            const selectors=['.mobile-layout','.mobile-action-panel','.m36-mobile-dialogue-fixed','.m36-mobile-pleasure-fixed','.mobile-action-scroll','.m36-mobile-choice-fixed'];
            const sc=document.querySelector('.mobile-action-scroll');
            const get=()=>Object.fromEntries(selectors.map(s=>{const e=document.querySelector(s);return [s,e?{top:e.getBoundingClientRect().top,bottom:e.getBoundingClientRect().bottom,scrollTop:e.scrollTop,clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,position:getComputedStyle(e).position}:null]}));
            const before=get(), pageY=scrollY, old=sc.scrollTop;
            sc.scrollTop=Math.min(240,sc.scrollHeight-sc.clientHeight);
            await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
            const after=get();
            return {before,after,oldScrollTop:old,newScrollTop:sc.scrollTop,pageScrollYBefore:pageY,pageScrollYAfter:scrollY,
              scrollHeight:sc.scrollHeight,clientHeight:sc.clientHeight};
          });
          await page.screenshot({path:'mobile-fixed-area-dom-test.png',fullPage:false});
          const report={url,injected,afterScroll,pageErrors};
          fs.writeFileSync('mobile-fixed-area-dom-test.json',JSON.stringify(report,null,2));
          console.log('MOBILE_DOM_REPORT',JSON.stringify(report));
          const failed=[];
          if(injected.root.height<=0||injected.panel.height<=0)failed.push('PANEL_HAS_NO_HEIGHT');
          if(injected.scroll.clientHeight<=0||injected.scroll.scrollHeight<=injected.scroll.clientHeight+10)failed.push('CHOICES_NOT_SCROLLABLE');
          if(afterScroll.newScrollTop<=afterScroll.oldScrollTop)failed.push('SCROLLTOP_DID_NOT_INCREASE');
          if(afterScroll.pageScrollYAfter!==afterScroll.pageScrollYBefore)failed.push('PAGE_SCROLLED_INSTEAD_OF_CHOICES');
          for(const s of ['.mobile-layout','.mobile-action-panel','.m36-mobile-dialogue-fixed','.m36-mobile-pleasure-fixed']) {
            const a=afterScroll.before[s],b=afterScroll.after[s];
            if(a&&b&&Math.abs(a.top-b.top)>2)failed.push('FIXED_POSITION_CHANGED:'+s+':'+(b.top-a.top));
          }
          if(!injected.reasons.label.includes('마을 둘러보기'))failed.push('DISABLED_LABEL_NOT_RENDERED');
          if(!injected.reasons.status.includes('종료'))failed.push('DISABLED_REASON_NOT_RENDERED');
          if(pageErrors.length)failed.push('PAGE_ERRORS:'+pageErrors.slice(0,3).join('|'));
          await browser.close();
          if(failed.length){console.error('MOBILE_DOM_TEST_FAILED',JSON.stringify(failed));process.exit(1);}
          console.log('MOBILE_DOM_TEST_PASS');
          EOF
          node mobile-dom-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-fixed-area-dom-test
          path: |
            mobile-fixed-area-dom-test.png
            mobile-fixed-area-dom-test.json
          if-no-files-found: ignore
      - name: Remove temporary runtime workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/m36-mobile-fixed-area-dom-test.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary mobile fixed-area DOM test"
            git push origin HEAD:mobile-migration-v1
          fi
