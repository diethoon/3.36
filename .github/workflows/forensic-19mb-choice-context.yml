name: Temporary 19MB choice layout context
on:
  pull_request:
    branches: [mobile-migration-v1]
    paths:
      - .github/workflows/forensic-19mb-choice-context.yml
permissions:
  contents: read
jobs:
  emit-bounded-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 0
      - name: Read exact byte windows only
        shell: bash
        run: |
          set -euo pipefail
          TARGET=dfa49f156ac72d0b49d201782bc06a696bf866b9
          git show "${TARGET}:Wayward_MOD_v3.36.html" > /tmp/legacy.html
          python3 - <<'PY'
          import hashlib, os
          p='/tmp/legacy.html'; size=os.path.getsize(p)
          terms=[b'M36MobileRoomActivity',b'M36MobileRoomCustomer',b'function AOe()',b'function x3e(props)',b'M36MobileDialogueFixed',b'M36MobilePleasureFixed',b'M36MobileStockStatus',b'm36-mobile-prep-detail',b'm36-mobile-prep-compact',b'm36-mobile-room-activity']
          data={}
          # Read 4096-byte chunks to EOF, record chunk digests; search across boundaries.
          h=hashlib.sha256(); manifest=hashlib.sha256(); overlap=b''; off=0; chunks=0
          found={t:[] for t in terms}
          with open(p,'rb') as f:
            while True:
              c=f.read(4096)
              if not c: break
              h.update(c); manifest.update(off.to_bytes(8,'big')+len(c).to_bytes(4,'big')+hashlib.sha256(c).digest()); chunks+=1
              d=overlap+c; base=off-len(overlap)
              for t in terms:
                i=0
                while True:
                  j=d.find(t,i)
                  if j<0: break
                  pos=base+j
                  if pos+len(t)>off and (not found[t] or found[t][-1]!=pos): found[t].append(pos)
                  i=j+1
              overlap=d[-max(map(len,terms)):]; off+=len(c)
          print('VERIFY bytes=%d chunks=%d sha256=%s manifest=%s'%(size,chunks,h.hexdigest(),manifest.hexdigest()))
          for t,ps in found.items(): print('ANCHOR %r %s'%(t,ps[:10]))
          # Print separate contexts, each <= 7,800 bytes.
          windows=[
            ('customer-row',18953714,6500),
            ('room-activity',18953633,5200),
            ('action-panel-component',18963370,7800),
            ('prep-renderer',18771301,7800),
            ('fixed-and-prep-css',19525678,7800),
            ('narration-and-choice-css',19502355,7800)
          ]
          for label,center,n in windows:
            a=max(0,center-n//2); b=min(size,a+n)
            with open(p,'rb') as f: f.seek(a); raw=f.read(b-a)
            print('\\n===== %s offset=%d range=%d..%d bytes=%d ====='%(label,center,a,b,len(raw)))
            print(raw.decode('utf-8','replace'))
          PY
