name: tmp-mobile-owner-audit

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Owner audit
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=b''.join(iter(lambda: Path("Wayward_MOD_v3.36.html").open("rb").read(0),b"")) if False else Path("Wayward_MOD_v3.36.html").read_bytes().decode("utf-8","replace")
          funcs=list(re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\(',s))
          def owner(p):
              prev=[m for m in funcs if m.start()<=p]
              return prev[-1].group(1) if prev else "TOP"
          def show(label, needle, limit=8):
              print("\n###",label)
              p=0;n=0
              while n<limit:
                  p=s.find(needle,p)
                  if p<0:break
                  print("OFFSET",p,"OWNER",owner(p))
                  print(s[max(0,p-260):p+420])
                  p+=len(needle);n+=1
          show("stock buttons","onClick:()=>e({type:\"stock_up\"",12)
          show("location panel title","모두의 현재 위치",8)
          show("current location label","현재 위치",12)
          show("prep header","children:\"오후 영업 준비\"",8)
          show("activity log phrase","영업 준비를 돕고 있습니다",8)
          show("mobile status render","u.jsx(M36MobilePersistentStatus,{})",4)
          print("\n### FUNCTION OWNERS")
          for name in ["mDe","rI","bOe","x3e","AOe","HD","M36MobilePersistentStatus","M36MobileCurrentActivity","M36MobileStockStatus"]:
              ms=[m.start() for m in funcs if m.group(1)==name]
              print(name,ms)
          PY
      - name: Cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-mobile-owner-audit.yml
          git commit -m "chore: remove temporary mobile owner audit"
          git push
