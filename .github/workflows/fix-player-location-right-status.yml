name: fix-player-location-right-status
on:
  pull_request:
    branches:
      - mobile-migration-v1
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: patch validate and clean
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("Wayward_MOD_v3.36.html")
          data=p.read_bytes()
          old=b'const state=re(d=>d.state),dispatch=re(d=>d.dispatch),wife=g(state),playerLoc=re(d=>be(d.state)),activePatronInteraction=G9(state),'
          new=b'const state=re(d=>d.state),dispatch=re(d=>d.dispatch),wife=g(state),playerLoc=re(d=>vt(d.state)),activePatronInteraction=G9(state),'
          n=data.count(old)
          print("player location selector",n)
          if n!=1:
              raise SystemExit(f"expected 1, got {n}")
          data=data.replace(old,new,1)
          p.write_bytes(data)
          s=p.read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>",s,re.S)
          target=next((x for x in scripts if "function AOe(" in x and "function M36MobileStoreStatus(" in x),None)
          if target is None:
              raise SystemExit("main JS block not found")
          Path("/tmp/wayward-main.js").write_text(target,encoding="utf-8")
          if 'playerLoc=re(d=>vt(d.state))' not in target:
              raise SystemExit("vt selector not present after patch")
          if 'playerLoc=re(d=>be(d.state))' in target:
              raise SystemExit("stale be selector still present")
          PY
          node --check /tmp/wayward-main.js
          git diff --check -- Wayward_MOD_v3.36.html
          git diff --stat 3fc9aad51ed890d730913c6de37b888806888b65 -- Wayward_MOD_v3.36.html
          git diff -- Wayward_MOD_v3.36.html
          git config user.name "diethoon"
          git config user.email "jhy67439787@gmail.com"
          git add Wayward_MOD_v3.36.html
          git rm -f .github/workflows/fix-player-location-right-status.yml
          git commit -m "fix(mobile): show player location in right status"
          git push origin "HEAD:$HEAD_BRANCH"
