name: Temporary 19MB choice layout forensic
on:
  pull_request:
    branches: [mobile-migration-v1]
    paths:
      - .github/workflows/forensic-19mb-choice.yml
      - .github/workflows/forensic-19mb-choice-context.yml
permissions:
  contents: read
jobs:
  inspect-exact-legacy-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 0
      - name: Inspect exact historical source in bounded binary chunks
        shell: bash
        run: |
          set -euo pipefail
          TARGET=dfa49f156ac72d0b49d201782bc06a696bf866b9
          git cat-file -e "${TARGET}:Wayward_MOD_v3.36.html"
          git show "${TARGET}:Wayward_MOD_v3.36.html" > /tmp/Wayward_MOD_v3.36.html
          python3 - <<'PY'
          import hashlib, re, os
          p='/tmp/Wayward_MOD_v3.36.html'
          expected_size=19677368
          expected_sha='37d5efdc9cc6af6f92d0024a9ed5a438998ff092aed56326c5da8f3d43b3040d'
          h=hashlib.sha256(); manifest=hashlib.sha256(); size=0; chunks=0
          terms=[
            b'mobile-layout',b'mobile-main-panel',b'mobile-action-panel',
            b'mobile-action-scroll',b'M36MobileRoomCustomer',b'M36MobileRoomActivity',
            b'mobile-prep-detail',b'facilityOnly', '영업준비'.encode(),
            '물자 채우기'.encode(), '물자채우기'.encode(),
            '나레이션'.encode(), b'narration',b'position:sticky',
            b'position: sticky',b'customerRow'
          ]
          hits={t:[] for t in terms}
          overlap=b''; offset=0
          with open(p,'rb') as f:
            while True:
              chunk=f.read(4096)
              if not chunk: break
              h.update(chunk); chunks+=1; size+=len(chunk)
              manifest.update(offset.to_bytes(8,'big')+len(chunk).to_bytes(4,'big')+hashlib.sha256(chunk).digest())
              data=overlap+chunk; base=offset-len(overlap)
              for t in terms:
                start=0
                while True:
                  i=data.find(t,start)
                  if i<0: break
                  absolute=base+i
                  if absolute+len(t)>offset:
                    if not hits[t] or hits[t][-1]!=absolute: hits[t].append(absolute)
                  start=i+1
              overlap=data[-max(map(len,terms)):]
              offset+=len(chunk)
          print('SOURCE bytes=%d chunks=%d sha256=%s manifest_sha256=%s'%(size,chunks,h.hexdigest(),manifest.hexdigest()))
          if size!=expected_size or h.hexdigest()!=expected_sha:
            raise SystemExit('EXACT SOURCE MISMATCH')
          for t,positions in hits.items():
            print('HIT %r count=%d offsets=%s'%(t,len(positions),positions[:20]))
          # Focused windows: no output window exceeds 8192 bytes.
          focus=[
            b'M36MobileRoomCustomer',b'M36MobileRoomActivity',
            b'mobile-prep-detail',b'facilityOnly',
            '영업준비'.encode(),'물자 채우기'.encode(),
            b'mobile-action-panel',b'mobile-action-scroll',
            b'mobile-main-panel'
          ]
          emitted=[]
          for t in focus:
            for pos in hits.get(t,[])[:3]:
              a=max(0,pos-1800); b=min(size,pos+2200)
              if any(not (b<=x or a>=y) for x,y in emitted): continue
              emitted.append((a,b))
              with open(p,'rb') as f:
                f.seek(a); snippet=f.read(b-a)
              print('\\n===== CONTEXT term=%r offset=%d range=%d..%d bytes=%d ====='%(t,pos,a,b,len(snippet)))
              print(snippet.decode('utf-8','replace'))
              if len(emitted)>=12: break
            if len(emitted)>=12: break
          print('CONTEXT_WINDOWS=%d (each <=4000 bytes)'%len(emitted))
          PY
