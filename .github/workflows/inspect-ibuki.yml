name: Inspect Ibuki addon archive
on:
  push:
    branches: [ibuki-analysis]
    paths: [.github/workflows/inspect-ibuki.yml]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ibuki-analysis
      - name: Extract addon archive
        run: |
          python - <<'PY'
          import zipfile, pathlib
          z=zipfile.ZipFile('WifeAddon_ibuki_WML_preload_fixed.zip')
          out=pathlib.Path('ibuki-unpacked')
          out.mkdir(exist_ok=True)
          for item in z.infolist():
              p=pathlib.PurePosixPath(item.filename)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit('unsafe path: '+item.filename)
              if item.is_dir(): continue
              dest=out.joinpath(*p.parts[1:])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(z.read(item))
          PY
      - name: Commit extracted source for inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ibuki-unpacked
          git commit -m "chore: unpack Ibuki addon for analysis"
          git push origin ibuki-analysis
