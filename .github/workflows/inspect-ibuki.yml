name: Build corrected Ibuki WML mod ZIP

on:
  push:
    branches:
      - ibuki-analysis

permissions:
  contents: write

jobs:
  package:
    if: ${{ !contains(github.event.head_commit.message, 'build: package corrected Ibuki WML addon') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ibuki-analysis
      - name: Validate and package native WML mod
        shell: bash
        run: |
          set -euo pipefail
          test -s ibuki-unpacked/mod.js
          test -s ibuki-unpacked/README.txt
          node --check ibuki-unpacked/mod.js
          rm -rf /tmp/WifeAddon_ibuki
          mkdir -p /tmp/WifeAddon_ibuki
          cp ibuki-unpacked/mod.js /tmp/WifeAddon_ibuki/
          cp ibuki-unpacked/README.txt /tmp/WifeAddon_ibuki/
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          out = Path("WifeAddon_ibuki_WML_preload_fixed.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path("/tmp/WifeAddon_ibuki").iterdir()):
                  z.write(p, "WifeAddon_ibuki/" + p.name)
          data = out.read_bytes()
          print(f"Built {out}: {len(data)} bytes; sha256={hashlib.sha256(data).hexdigest()}")
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None, "ZIP integrity failure"
              names = set(z.namelist())
              assert names == {"WifeAddon_ibuki/README.txt", "WifeAddon_ibuki/mod.js"}, names
              mod = z.read("WifeAddon_ibuki/mod.js").decode("utf-8")
              assert "WML.define({" in mod
              assert "requires: ['addon-compat']" in mod
              assert "globalThis.__WML_LEGACY__.registerWives();" in mod
              assert "document.createElement('script')" not in mod
              assert "legacy preload registration executed before the game module" not in mod
              assert "http://127.0.0.1:8189" not in mod
              print("Verified: native WML wrapper, dependency, wife registration, no preload injection/fallback.")
          PY
      - name: Commit packaged ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add WifeAddon_ibuki_WML_preload_fixed.zip
          if git diff --cached --quiet; then
            echo "Packaged ZIP already current."
            exit 0
          fi
          git commit -m "build: package corrected Ibuki WML addon"
          git push origin ibuki-analysis
