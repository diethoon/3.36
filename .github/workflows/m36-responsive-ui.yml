name: m36 responsive ui one-shot
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Smoke
        shell: bash
        run: echo M36_RUNNER_SMOKE_OK
