name: forensic-dialogue-sticky

on:
  push:
    branches: [mobile-migration-v1]
    paths-ignore:
      - "__forensic_dialogue_report.txt"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Inspect giant HTML structure
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p = Path("Wayward_MOD_v3.36.html")
          raw = p.read_text(encoding="utf-8")
          out = []
          out.append(f"HTML_BYTES={len(raw.encode('utf-8'))}")
          out.append(f"CURRENT_COMMIT={subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()}")

          for needle in [
              "m36-mobile-dialogue-fixed",
              "m36-mobile-dialogue-label",
              "m36-mobile-dialogue-box",
              "m36-mobile-dialogue-source-title",
              "m36-mobile-dialogue-source-body",
              "mobile-action-scroll",
              'className:"m36-mobile-dialogue-fixed"',
              'position:sticky',
              'M36MobileStockStatus',
          ]:
              poss = [m.start() for m in re.finditer(re.escape(needle), raw)]
              out.append(f"\n### {needle}: count={len(poss)}")
              for i,pos in enumerate(poss[:10],1):
                  lo=max(0,pos-1400); hi=min(len(raw),pos+1800)
                  out.append(f"--- occurrence {i} offset={pos} ---")
                  out.append(raw[lo:hi])

          # Target exact relationships using a compact local neighborhood.
          target="m36-mobile-dialogue-fixed"
          pos=raw.find(target)
          if pos>=0:
              out.append("\n### FIXED_BLOCK_NEIGHBORHOOD")
              out.append(raw[max(0,pos-3500):min(len(raw),pos+4500)])

          # Find the mobile action scroll occurrence closest before the fixed block.
          if pos>=0:
              prev=raw.rfind("mobile-action-scroll",0,pos)
              out.append(f"\n### PRECEDING_MOBILE_ACTION_SCROLL_OFFSET={prev}")
              if prev>=0:
                  out.append(raw[max(0,prev-2500):min(len(raw),prev+3500)])

          # Locate AOe function text around its declaration and the HD call.
          for needle in ["function AOe", "AOe=", "function HD", "HD=", "u.jsx(HD,{})"]:
              poss=[m.start() for m in re.finditer(re.escape(needle),raw)]
              out.append(f"\n### {needle}: count={len(poss)}")
              for pos2 in poss[:5]:
                  out.append(raw[max(0,pos2-1200):min(len(raw),pos2+3500)])

          Path("__forensic_dialogue_report.txt").write_text("\n".join(out),encoding="utf-8")
      - name: Commit forensic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __forensic_dialogue_report.txt
          git commit -m "chore: temporary dialogue sticky forensic report" || exit 0
          git push
