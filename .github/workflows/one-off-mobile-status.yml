name: One-off mobile status migration

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/one-off-mobile-status.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply targeted mobile layout patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'Wayward_MOD_v3.36.html';
          let s = fs.readFileSync(path, 'utf8');

          const start = s.indexOf('function M36MobileStatusPanel(){');
          const end = s.indexOf('function M36MobileRoomActivity(', start);
          if (start < 0 || end < 0) throw new Error('M36MobileStatusPanel block not found');

          const newStatus = `function M36MobileStoreStatus(){
            const state=re(d=>d.state),wife=g(state),playerLoc=be(state);
            const playerEnergy=Math.round(state.player?.stats?.energy??0);
            const playerMagic=state.player?.magic;
            const playerMana=playerMagic?.grimoireFound?Math.round(po(playerMagic)):null;
            const wifeEnergy=Math.round(wife.stats?.energy??0),wifeMood=Math.round(wife.stats?.mood??0);
            const wifeTrust=Math.round(wife.relationship?.trust??0),wifeAllure=Math.round(vr(wife));
            const wifeArousal=Math.round(wife.stats?.arousal??0);
            const wifeTask=jF(wife,state),topFeeling=mf(wife,1).filter(x=>x.intensity>15)[0];
            const feeling=topFeeling?u.koLabel("emotion",topFeeling.emotion):"평온";
            const gauges=[
              {key:"energy",label:"기력",value:wifeEnergy,tone:Xl(wifeEnergy)},
              {key:"mood",label:"기분",value:wifeMood,tone:Xl(wifeMood)},
              {key:"trust",label:"신뢰도",value:wifeTrust,tone:"bg-blue-400"},
              {key:"allure",label:"주목도",value:wifeAllure,tone:"bg-purple-400"},
              {key:"arousal",label:"흥분도",value:wifeArousal,tone:"bg-pink-400"}
            ];
            return u.jsxs("section",{className:"m36-mobile-store-status",children:[
              u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
                u.jsx("span",{className:"m36-mobile-store-label",children:gs(playerLoc).replace(/^the /,"")}),
                u.jsx("span",{className:"m36-mobile-store-value",children:"현재 위치"})
              ]}),
              u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
                u.jsx("span",{className:"m36-mobile-store-label",children:"당신"}),
                u.jsx("span",{className:"m36-mobile-store-value",children:yOe(state)}),
                u.jsxs("span",{className:"m36-mobile-store-meta",children:[
                  "기력 ",playerEnergy,
                  playerMana!==null?u.jsxs(u.Fragment,{children:[" · 마나 ",playerMana]}):null
                ]})
              ]}),
              u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
                u.jsx("span",{className:"m36-mobile-store-label",children:wife.name||"엘레나"}),
                u.jsx("span",{className:"m36-mobile-store-value",children:wifeTask}),
                u.jsx("span",{className:"m36-mobile-store-meta",children:feeling})
              ]}),
              u.jsx("div",{className:"m36-mobile-store-gauges",children:gauges.map(bar=>u.jsxs("span",{className:"m36-mobile-store-gauge",children:[
                u.jsx("span",{className:"m36-mobile-store-gauge-label",children:bar.label}),
                u.jsx("span",{className:"m36-mobile-store-gauge-track",children:u.jsx("span",{className:"m36-mobile-store-gauge-fill "+bar.tone,style:{width:Math.max(0,Math.min(100,bar.value))+"%"}})})
              ]},bar.key))}),
              u.jsx(M36MobileRoomActivity,{room:playerLoc,canSee:!0})
            ]});
          }
          `;

          s = s.slice(0, start) + newStatus + s.slice(end);

          const oldRight = 'children:[u.jsx(M36MobileStatusPanel,{}),u.jsx(M36MobileStockStatus,{})';
          if (!s.includes(oldRight)) throw new Error('Right-panel status render not found');
          s = s.replace(oldRight, 'children:[u.jsx(M36MobileStockStatus,{})');

          const oldHouse = 'r==="house"&&u.jsx("div",{className:"h-full",children:u.jsx(s3,{})})';
          const newHouse = 'r==="house"&&u.jsxs("div",{className:"h-full",children:[u.jsx(s3,{}),u.jsx(M36MobileStoreStatus,{})]})';
          if (!s.includes(oldHouse)) throw new Error('House-tab render not found');
          s = s.replace(oldHouse, newHouse);

          const cssAnchor = '<style id="wayward-mobile-stock-v1">';
          if (!s.includes(cssAnchor)) throw new Error('CSS anchor not found');
          const css = `<style id="wayward-mobile-store-status-v1">
          @media(max-width:1023px){
            .m36-mobile-store-status{margin:.25rem 0 .1rem;padding:.2rem .25rem .3rem;border-top:1px solid rgba(68,64,60,.72)}
            .m36-mobile-store-status-line{display:flex;align-items:baseline;gap:.35rem;min-width:0;padding:.1rem 0;line-height:1.1}
            .m36-mobile-store-label{flex:0 0 auto;color:rgb(168 162 158);font-size:.62rem;white-space:nowrap}
            .m36-mobile-store-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgb(231 229 228);font-size:.64rem}
            .m36-mobile-store-meta{margin-left:auto;flex:0 0 auto;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgb(120 113 108);font-size:.56rem}
            .m36-mobile-store-gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.18rem .35rem;margin:.15rem 0 .25rem;padding:.2rem .15rem;border-top:1px solid rgba(68,64,60,.55);border-bottom:1px solid rgba(68,64,60,.55)}
            .m36-mobile-store-gauge{display:flex;align-items:center;gap:.2rem;min-width:0}
            .m36-mobile-store-gauge-label{flex:0 0 auto;width:2.2rem;color:rgb(120 113 108);font-size:.5rem;white-space:nowrap}
            .m36-mobile-store-gauge-track{height:3px;min-width:0;flex:1;overflow:hidden;border-radius:9999px;background:rgb(68 64 60)}
            .m36-mobile-store-gauge-fill{display:block;height:100%;border-radius:9999px}
            .m36-mobile-store-status .m36-mobile-room-activity{margin:.1rem 0 0}
            .m36-mobile-store-status .m36-mobile-room-line{min-width:0;gap:.1rem}
            .m36-mobile-store-status .m36-mobile-room-line > div{min-width:0;flex:1 1 auto}
          }
          </style>
          `;
          s = s.replace(cssAnchor, css + cssAnchor);

          fs.writeFileSync(path, s);

          if (!s.includes('function M36MobileStoreStatus(){')) throw new Error('New status component missing');
          if (s.includes('function M36MobileStatusPanel(){')) throw new Error('Old status component still present');
          if (s.includes('u.jsx(M36MobileStatusPanel,{})')) throw new Error('Old right-panel render still present');
          if (!s.includes('u.jsx(M36MobileStoreStatus,{})')) throw new Error('Store status render missing');
          if (!s.includes('grid-template-columns:repeat(2,minmax(0,1fr))')) throw new Error('Two-column gauge rule missing');
          console.log('targeted mobile status patch applied');
          NODE

      - name: Validate patch
        shell: bash
        run: |
          test -s Wayward_MOD_v3.36.html
          grep -q 'function M36MobileStoreStatus()' Wayward_MOD_v3.36.html
          ! grep -q 'function M36MobileStatusPanel()' Wayward_MOD_v3.36.html
          grep -q 'M36MobileStoreStatus' Wayward_MOD_v3.36.html
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' Wayward_MOD_v3.36.html
          grep -q 'wayward-mobile-store-status-v1' Wayward_MOD_v3.36.html
          git diff --check

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-mobile-status.yml
          git add Wayward_MOD_v3.36.html
          git commit -m "Move mobile status below shop tab and compress wife gauges"
          git push origin HEAD:mobile-migration-v1
