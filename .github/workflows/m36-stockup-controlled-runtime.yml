name: One-shot stock-up controlled runtime repro
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-stockup-controlled-runtime.yml
permissions:
  contents: write
jobs:
  stockup-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run controlled live stock-up purchase tests
        shell: bash
        run: |
          set -euo pipefail
          cat > stockup-runtime-repro.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://static-3-36.onrender.com/Wayward_MOD_v3.36.html';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          const actions=[];
          async function clickIfVisible(text) {
            const loc=page.getByText(text,{exact:true}).first();
            if(await loc.count()&&await loc.isVisible().catch(()=>false)&&await loc.isEnabled().catch(()=>false)) {
              await loc.click({timeout:7000}).catch(()=>{}); await page.waitForTimeout(500); actions.push('clicked:'+text); return true;
            }
            actions.push('not-clicked:'+text); return false;
          }
          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(1000);
          for(const t of ['예','이해하고 동의합니다','새 게임','피파','계속하기 — 피파 →','운명에 맡김','시작 — 피파 →','건너뛰기']) await clickIfVisible(t);
          await page.waitForTimeout(1200);
          async function persisted() {
            return await page.evaluate(()=>{
              const raw=localStorage.getItem('tavern-game');
              if(!raw)return {error:'missing tavern-game'};
              const env=JSON.parse(raw), root=env.state?.state;
              if(!root)return {error:'unexpected storage shape',top:Object.keys(env),stateKeys:Object.keys(env.state||{})};
              return {phase:root.phase,slot:root.slot,day:root.day,gold:root.economy?.gold,supplies:{...root.supplies},targets:{...(root.supplyTargets||{food:12,beer:12,wine:5})},priceMult:root.economy?.marketPriceMult,errand:root.errandSession?{reason:root.errandSession.reason,returnAtSlot:root.errandSession.returnAtSlot,suppliesGained:root.errandSession.suppliesGained}:null,marketTrip:root.characters?.[root.primaryCharacterId]?.marketTrip?{...root.characters[root.primaryCharacterId].marketTrip}:null,lastLog:(root.log||[]).slice(-4).map(x=>({slot:x.slot,text:x.text?.slice(0,220)}))};
            });
          }
          async function patchRuntime({gold,supplies,targets,priceMult}) {
            return await page.evaluate(({gold,supplies,targets,priceMult})=>{
              const key='tavern-game', env=JSON.parse(localStorage.getItem(key));
              const root=env.state?.state;
              if(!root)throw new Error('Unexpected save state shape');
              root.phase='prep';
              root.economy={...root.economy,gold};
              root.supplies={...root.supplies,...supplies};
              root.supplyTargets={...(root.supplyTargets||{food:12,beer:12,wine:5}),...targets};
              if(priceMult)root.economy.marketPriceMult={...root.economy.marketPriceMult,...priceMult};
              root.errandSession=undefined;
              env.state.state=root;
              localStorage.setItem(key,JSON.stringify(env));
              return {keys:Object.keys(env),stateKeys:Object.keys(root),gold:root.economy.gold,supplies:{...root.supplies},targets:{...root.supplyTargets}};
            },{gold,supplies,targets,priceMult});
          }
          async function reloadAndSet({name,gold,supplies,targets}) {
            const patch=await patchRuntime({gold,supplies,targets});
            await page.reload({waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(800);
            const before=await persisted();
            const btn=page.locator('.m36-mobile-prep-compact button').filter({hasText:'물자 채우기'}).first();
            const visible=await btn.isVisible().catch(()=>false);
            const enabled=await btn.isEnabled().catch(()=>false);
            if(!visible||!enabled)throw new Error(name+': stock-up button not usable; '+JSON.stringify({visible,enabled,before}));
            await btn.click({timeout:7000});
            await page.waitForTimeout(2500);
            const after=await persisted();
            return {name,patch,before,after,buttonText:await btn.innerText().catch(()=>''),visible,enabled};
          }
          const initial=await persisted();
          const results=[];
          results.push(await reloadAndSet({
            name:'case-all-items-under-target-high-gold',
            gold:5000,
            supplies:initial.supplies,
            targets:{food:12,beer:12,wine:5}
          }));
          results.push(await reloadAndSet({
            name:'case-food-only-deficit-0-to-12-high-gold',
            gold:5000,
            supplies:{food:0,beer:12,wine:5},
            targets:{food:12,beer:12,wine:5}
          }));
          results.push(await reloadAndSet({
            name:'case-food-deficit-2-to-12-high-gold',
            gold:5000,
            supplies:{food:2,beer:12,wine:5},
            targets:{food:12,beer:12,wine:5}
          }));
          const report={url,initial,results,actions,pageErrors:errors};
          fs.writeFileSync('stockup-runtime-repro.json',JSON.stringify(report,null,2));
          await page.screenshot({path:'stockup-runtime-repro.png',fullPage:false});
          console.log('STOCKUP_RUNTIME_REPRO',JSON.stringify(report));
          await browser.close();
          const failures=[];
          for(const r of results) {
            if(r.after.error)failures.push(r.name+':PERSISTED_STATE_ERROR');
            if(r.after.supplies.food!==r.after.targets.food && !r.after.errand)failures.push(r.name+':FOOD_TARGET_NOT_MET');
          }
          if(errors.length)failures.push('PAGE_ERRORS:'+errors.slice(0,3).join('|'));
          if(failures.length){console.error('STOCKUP_RUNTIME_TEST_ASSERTIONS',JSON.stringify(failures));process.exit(1);}
          EOF
          node stockup-runtime-repro.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stockup-controlled-runtime-repro
          path: |
            stockup-runtime-repro.json
            stockup-runtime-repro.png
          if-no-files-found: ignore
      - name: Remove temporary runtime workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/m36-stockup-controlled-runtime.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary stock-up controlled runtime test"
            git push origin HEAD:mobile-migration-v1
          fi
