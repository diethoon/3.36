name: tmp-mobile-layout-cleanup-v2

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded mobile cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os, subprocess

          SRC=Path("Wayward_MOD_v3.36.html")
          TMP=SRC.with_suffix(".mobileclean.tmp")
          CHUNK=64*1024

          old_status = '''function M36MobilePersistentStatus(){
            const state=re(x=>x.state),dispatch=re(x=>x.dispatch),wife=g(state),playerLoc=be(state),[open,setOpen]=Z.useState(!1);
            const energy=Math.round(state.player?.stats?.energy??0);
            const wifeEnergy=Math.round(wife.stats?.energy??0),wifeMood=Math.round(wife.stats?.mood??0),wifeTrust=Math.round(wife.relationship?.trust??0);
            const wifeTask=jF(wife,state);
            const nav=action=>{dispatch(action);setOpen(!1);};
            return u.jsxs("div",{className:"m36-mobile-status",children:[
              u.jsx("button",{type:"button",onClick:()=>setOpen(v=>!v),className:"m36-mobile-status-row",style:{width:"100%",background:"transparent",border:0,padding:0,textAlign:"left"},children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:"현재 위치"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:M36MobileStatusLabel(playerLoc)}),
                u.jsx("span",{className:"m36-mobile-status-meta",children:open?"▾":"▸"})
              ]}),
              u.jsxs("div",{className:"m36-mobile-status-row",children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:"당신"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:state.phase==="prep"?"준비 중":"진행 중"}),
                u.jsxs("span",{className:"m36-mobile-status-meta",children:["기력 ",energy]})
              ]}),
              u.jsxs("div",{className:"m36-mobile-status-row",children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:wife.name||"피파"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:wifeTask}),
                u.jsxs("span",{className:"m36-mobile-status-meta",children:["기력 ",wifeEnergy," · 기분 ",wifeMood," · 신뢰 ",wifeTrust]})
              ]}),
              open&&u.jsxs("div",{className:"m36-mobile-nav-grid",children:[
                u.jsx("button",{type:"button",className:"m36-mobile-nav-button",onClick:()=>nav({type:"return_to_taproom"}),children:"홀"}),
                u.jsx("button",{type:"button",className:"m36-mobile-nav-button",onClick:()=>nav({type:"go_to_back_room"}),children:"뒷방"}),
                u.jsx("button",{type:"button",className:"m36-mobile-nav-button",onClick:()=>nav({type:"go_to_bedroom"}),children:"침실"}),
                u.jsx("button",{type:"button",className:"m36-mobile-nav-button",onClick:()=>nav({type:"go_upstairs"}),children:"객실 1"}),
                u.jsx("button",{type:"button",className:"m36-mobile-nav-button",onClick:()=>nav({type:"go_upstairs",room:"upstairs_room_2"}),children:"객실 2"}),
                u.jsx("button",{type:"button",className:"m36-mobile-nav-button",onClick:()=>nav({type:"enter_bathhouse"}),children:"목욕탕"})
              ]})
            ]});
          }
          '''

          new_status = '''function M36MobilePersistentStatus(){
            const state=re(x=>x.state),wife=g(state),playerLoc=be(state);
            const energy=Math.round(state.player?.stats?.energy??0);
            const wifeEnergy=Math.round(wife.stats?.energy??0),wifeMood=Math.round(wife.stats?.mood??0),wifeTrust=Math.round(wife.relationship?.trust??0);
            const wifeTask=jF(wife,state);
            return u.jsxs("div",{className:"m36-mobile-status",children:[
              u.jsxs("div",{className:"m36-mobile-status-row",children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:"현재 위치"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:M36MobileStatusLabel(playerLoc)})
              ]}),
              u.jsxs("div",{className:"m36-mobile-status-row",children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:"당신"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:state.phase==="prep"?"준비 중":"진행 중"}),
                u.jsxs("span",{className:"m36-mobile-status-meta",children:["기력 ",energy]})
              ]}),
              u.jsxs("div",{className:"m36-mobile-status-row",children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:wife.name||"피파"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:wifeTask}),
                u.jsxs("span",{className:"m36-mobile-status-meta",children:["기력 ",wifeEnergy," · 기분 ",wifeMood," · 신뢰 ",wifeTrust]})
              ]})
            ]});
          }
          '''

          old_activity = '''function M36MobileCurrentActivity(){
            const state=re(x=>x.state),wife=g(state),playerLoc=be(state),task=jF(wife,state);
            const text=state.phase==="prep"?wife.name+"은(는) 영업 준비를 돕고 있습니다.":wife.name+"은(는) "+task+".";
            const meta="현재 위치: "+M36MobileStatusLabel(playerLoc)+" · "+task;
            return u.jsxs("section",{className:"m36-mobile-current-activity",children:[
              u.jsx("div",{className:"m36-mobile-current-activity-title",children:"현재 활동"}),
              u.jsx("div",{className:"m36-mobile-current-activity-text",children:text}),
              u.jsx("div",{className:"m36-mobile-current-activity-meta",children:meta})
            ]});
          }
          '''

          new_activity = '''function M36MobileCurrentActivity(){
            const state=re(x=>x.state),wife=g(state),task=jF(wife,state);
            const text=state.phase==="prep"?wife.name+"은(는) 영업 준비를 돕고 있습니다.":wife.name+"은(는) "+task+".";
            return u.jsxs("section",{className:"m36-mobile-current-activity",children:[
              u.jsx("div",{className:"m36-mobile-current-activity-title",children:"현재 활동"}),
              u.jsx("div",{className:"m36-mobile-current-activity-text",children:text})
            ]});
          }
          '''

          old_mobile_root = 'className:"mobile-layout lg:hidden flex-1 min-h-0"'
          new_mobile_root = 'className:'+chr(96)+'mobile-layout lg:hidden flex-1 min-h-0 '+chr(36)+'{n?"mobile-action-left":""}'+chr(96)

          old_status_css = '''  .m36-mobile-nav-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.3rem; margin-top:.45rem; }
            .m36-mobile-nav-button { min-height:32px; padding:.25rem .35rem; border:1px solid rgb(68 64 60); border-radius:.3rem; background:rgb(28 25 23); color:rgb(214 211 209); font-size:.68rem; text-align:left; }'''
          new_status_css = '''  .m36-mobile-status-row { min-height:1.15rem; }'''

          anchor = '''  .mobile-main-panel > .shrink-0 {'''
          insert = '''  .mobile-layout.mobile-action-left {
            grid-template-columns:minmax(0,60%) minmax(0,40%) !important;
          }
          .mobile-layout.mobile-action-left .mobile-main-panel {
            grid-column:2 !important;
            border-left:1px solid rgba(120,113,108,.48) !important;
            border-right:0 !important;
          }
          .mobile-layout.mobile-action-left .mobile-action-panel {
            grid-column:1 !important;
          }
          @media (max-width:360px) and (orientation:portrait) {
            .mobile-layout.mobile-action-left {
              grid-template-columns:minmax(0,56%) minmax(0,44%) !important;
            }
          }
          @media (max-width:1023px) {
            .m36-mobile-prep-detail { display:none !important; }
          }

          .mobile-main-panel > .shrink-0 {'''

          old_prep_wrap = 'u.jsx("div",{className:"mb-3",children:u.jsx(x3e,{})})'
          new_prep_wrap = 'u.jsx("div",{className:"mb-3 m36-mobile-prep-detail",children:u.jsx(x3e,{})})'

          def count_stream(needle:str)->int:
            nb=needle.encode(); carry=b""; count=0; keep=max(0,len(nb)-1)
            with SRC.open("rb") as f:
              while True:
                c=f.read(CHUNK)
                if not c: break
                d=carry+c; count+=d.count(nb); carry=d[-keep:] if keep else b""
            return count

          for t in [old_status,old_activity,old_mobile_root,old_status_css,anchor,old_prep_wrap]:
            if count_stream(t)!=1:
              raise SystemExit("TARGET_COUNT_MISMATCH: "+t[:100])
          for t in ["mobile-action-left","m36-mobile-prep-detail"]:
            if count_stream(t)!=0:
              raise SystemExit("MARKER_ALREADY_PRESENT: "+t)

          repls=[
            (old_status,new_status),(old_activity,new_activity),
            (old_mobile_root,new_mobile_root),(old_status_css,new_status_css),
            (old_prep_wrap,new_prep_wrap),(anchor,insert)
          ]
          maxlen=max(len(a.encode()) for a,_ in repls)
          carry=b""
          with SRC.open("rb") as src,TMP.open("wb") as dst:
            while True:
              c=src.read(CHUNK)
              if not c: break
              d=carry+c
              safe=max(0,len(d)-maxlen+1)
              out=d[:safe]; carry=d[safe:]
              for a,b in repls: out=out.replace(a.encode(),b.encode())
              dst.write(out)
            out=carry
            for a,b in repls: out=out.replace(a.encode(),b.encode())
            dst.write(out)
          os.replace(TMP,SRC)

          for t in [
              "function M36MobilePersistentStatus()",
              "function M36MobileCurrentActivity()",
              "mobile-action-left",
              "m36-mobile-prep-detail",
              'u.jsx(M36MobilePersistentStatus,{})',
              'u.jsx(M36MobileCurrentActivity,{})',
              'u.jsx(M36MobileStockStatus,{})']:
            if count_stream(t)!=1:
              raise SystemExit("POST_PATCH_COUNT_FAIL: "+t)

          if count_stream("m36-mobile-nav-grid")!=0 or count_stream("m36-mobile-nav-button")!=0:
            raise SystemExit("NAV_DUPLICATE_REMAINS")
          if count_stream('u.jsx("div",{className:"mb-3 m36-mobile-prep-detail",children:u.jsx(x3e,{})})')!=1:
            raise SystemExit("PREP_WRAPPER_BAD")

          outdir=Path("/tmp/m36-mobile-inline"); outdir.mkdir(exist_ok=True)
          for f in outdir.glob("*.js"): f.unlink()
          files=[]; buf=b""; inside=False; cur=None; idx=0
          with SRC.open("rb") as f:
            while True:
              c=f.read(CHUNK); eof=not c; buf+=c
              while True:
                if not inside:
                  a=buf.find(b"<script")
                  if a<0:
                    if eof: buf=b""
                    else: buf=buf[-8192:]
                    break
                  z=buf.find(b">",a+7)
                  if z<0: buf=buf[a:]; break
                  idx+=1; cur=outdir/f"{idx}.js"; cur.write_bytes(b""); files.append(cur)
                  buf=buf[z+1:]; inside=True
                else:
                  a=buf.find(b"</script>")
                  if a<0:
                    if eof:
                      cur.open("ab").write(buf); buf=b""; inside=False
                    else:
                      keep=len(b"</script>")-1
                      if len(buf)>keep: cur.open("ab").write(buf[:-keep])
                      buf=buf[-keep:]
                    break
                  with cur.open("ab") as cf: cf.write(buf[:a])
                  buf=buf[a+9:]; cur=None; inside=False
              if eof: break
          for f in files:
            subprocess.run(["node","--check",str(f)],check=True)
          print("NODE_CHECK=PASS")
          print("INLINE_SCRIPTS",len(files))
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff --numstat
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): unify panel ownership and side proportions"
          git rm .github/workflows/tmp-mobile-layout-cleanup-v2.yml
          git commit -m "chore: remove temporary mobile layout cleanup tooling"
          git push
