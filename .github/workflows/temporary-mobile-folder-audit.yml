name: Temporary mobile folder picker audit
on:
  push:
    branches:
      - audit/mobile-folder-freeze
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract picker handler and folder scan in small chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("Wayward_Faith_NoSound_v3.0.0.zip")
          h=next(i for i in z.infolist() if i.filename.lower().endswith(".html") and "Wayward_Faith_v3.0.0" in i.filename)
          terms=["image-packs 폴더 선택","wfPackScanFolder(e.target.files)","wfPackScanFolder(","setLoading","읽는 중…","const [loading","wfPackValidate","wfPackLoadCatalogues","async function mx","function mx("]
          with z.open(h) as f:
            data=f.read()
          low=data.lower()
          print("HTML bytes:",len(data))
          for term in terms:
            needle=term.encode().lower()
            positions=[]
            p=0
            while len(positions)<3:
              p=low.find(needle,p)
              if p<0: break
              positions.append(p); p+=len(needle)
            print(f"\\n=== {term} positions={positions} ===")
            for pos in positions:
              print(data[max(0,pos-1800):min(len(data),pos+3000)].decode("utf-8","replace"))
          PY
