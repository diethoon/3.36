name: Temporary mobile folder picker audit
on:
  push:
    branches:
      - audit/mobile-folder-freeze
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WML mod APIs in bounded excerpts
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("Wayward_Faith_NoSound_v3.0.0.zip")
          targets=["Wayward_Faith\\wml\\mods\\faith-mobile\\mod.js","Wayward_Faith\\wml\\mods\\mods.js","Wayward_Faith\\wml\\runtime\\wml-core.js","Wayward_Faith\\wml\\symbols\\faith-3.0.0.json","Wayward_Faith\\wml\\symbols\\faith-3.0.0.js"]
          for name in targets:
            try: data=z.read(name)
            except KeyError: print("MISSING",name); continue
            print("\\n=== FILE",name,"bytes",len(data),"===")
            text=data.decode("utf-8","replace")
            if name.endswith("mod.js"): print(text[:9000])
            else:
              terms=["registerMod","registerAddon","patchFunction","replaceFunction","onReady","waitFor","findFunction","wfPackScanFolder","wfPackFolderButton","class WML","api."]
              low=text.lower()
              for term in terms:
                p=low.find(term.lower())
                if p>=0: print(f"--- {term} @{p} ---\\n"+text[max(0,p-350):p+1100])
          PY
