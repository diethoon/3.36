name: rewrite-mobile-clean
on:
  pull_request:
    branches:
      - mobile-migration-v1
permissions:
  contents: write
jobs:
  rewrite:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: rewrite clean history
        run: |
          git fetch origin 43da5b22e91648f1c57e7e99d57da4a9f551dc73 04575043fc1257a44ce6ae9a97a82eba14551a5e mobile-migration-v1
          git diff 43da5b22e91648f1c57e7e99d57da4a9f551dc73 04575043fc1257a44ce6ae9a97a82eba14551a5e -- Wayward_MOD_v3.36.html > /tmp/fix.patch
          git checkout -B clean-work 43da5b22e91648f1c57e7e99d57da4a9f551dc73
          git apply /tmp/fix.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          script=next((x for x in re.findall(r"<script(?:[^>]*)>(.*?)</script>",s,re.S) if "function AOe(" in x and "function M36MobileStoreStatus(" in x),None)
          if script is None: raise SystemExit("main JS block not found")
          Path("/tmp/wayward-main.js").write_text(script,encoding="utf-8")
          PY
          node --check /tmp/wayward-main.js
          git diff --check -- Wayward_MOD_v3.36.html
          git diff --stat 43da5b22e91648f1c57e7e99d57da4a9f551dc73 -- Wayward_MOD_v3.36.html
          git status --short
          git config user.name "diethoon"
          git config user.email "jhy67439787@gmail.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): keep right status location and customers live"
          git push origin HEAD:mobile-migration-v1 --force
