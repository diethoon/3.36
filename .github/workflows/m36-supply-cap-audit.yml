name: One-shot supply purchase cap forensic
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-supply-cap-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Stream exact purchase helpers and UI dispatch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git show origin/main:Wayward_MOD_v3.36.html > /tmp/main-v336.html
          python3 - <<'PY'
          from pathlib import Path
          terms=[
            'function lCe(', 'lCe=', 'function Rw(', 'Rw=', 'function Ki(', 'Ki=', 'function x8(', 'x8=', 'function l5(', 'l5=', 'set_supply_target','buy_supplies','물자 채우기','물자 채우기',
          ]
          for ref,name in [('mobile','Wayward_MOD_v3.36.html'),('main','/tmp/main-v336.html')]:
            p=Path(name); size=p.stat().st_size
            print('\n===== '+ref+' bytes='+str(size)+' =====')
            offsets={t:[] for t in terms}; carry=b''; baseoffset=0
            maxlen=max(len(t.encode()) for t in terms)
            with p.open('rb') as f:
              while True:
                ch=f.read(65536)
                if not ch: break
                data=carry+ch; base=baseoffset-len(carry)
                for term in terms:
                  pat=term.encode(); pos=0
                  while True:
                    i=data.find(pat,pos)
                    if i<0: break
                    at=base+i
                    if len(offsets[term])<20: offsets[term].append(at)
                    pos=i+1
                baseoffset+=len(ch); carry=data[-maxlen:]
            contexts=[]
            for term,ps in offsets.items():
              print('TERM',term,'OFFSETS',ps[:8])
              # reducer/helper first occurrence, mobile stock UI and dispatch occurrences
              if ps and (term in ['function lCe(','lCe=','function Rw(','Rw=','function Ki(','Ki=','function x8(','x8=','function l5(','l5='] or (term=='set_supply_target') or (term=='buy_supplies') or (term=='물자 채우기' and ref=='mobile')):
                for at in ps[:5 if term in ['function lCe(','lCe=','function Rw(','Rw=','function Ki(','Ki=','function x8(','x8=','function l5(','l5='] else 2]:
                  contexts.append((term,at))
            shown=[]
            for term,at in contexts:
              if any(abs(at-old)<650 for old in shown): continue
              shown.append(at)
              with p.open('rb') as f:
                f.seek(max(0,at-1400)); context=f.read(2800)
              print('\n---',term,'OFFSET',at,'---')
              print(context.decode('utf-8','replace').replace('\n',' ')[:2800])
          PY
      - name: Remove temporary forensic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/m36-supply-cap-audit.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary supply cap audit"
            git push origin HEAD:mobile-migration-v1
          fi
