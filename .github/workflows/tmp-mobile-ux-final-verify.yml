name: tmp-mobile-ux-final-verify
on:
  push:
    branches: [mobile-migration-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Bounded final verification
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess

          src=Path("Wayward_MOD_v3.36.html")
          print("FILE_BYTES",src.stat().st_size)

          checks=[
            ("m36-mobile-status-panel",1),
            ('u.jsx(LF,{inline:!0,hideStats:!1,forceVisibility:!0})',1),
            ('className:"m36-mobile-tabs',1),
            ("wayward-mobile-cleanup-v6",1),
            ('children:"물자 채우기"',1),
            ('children:"상환"',1),
            ('children:"전액"',1),
          ]
          for needle,expected in checks:
              p=subprocess.run(["grep","-ao",needle,str(src)],capture_output=True,text=True)
              got=len(p.stdout.splitlines()) if p.stdout else 0
              print("MARKER",needle,"COUNT",got)
              if got<expected:
                  raise SystemExit(f"MARKER_MISSING {needle!r} got={got}")

          CHUNK=64*1024
          outdir=Path("/tmp/wayward-node-check")
          outdir.mkdir(parents=True,exist_ok=True)
          for old in outdir.glob("script-*.js"):
              old.unlink()

          buf=b""
          in_script=False
          script_index=0
          handle=None
          keep=2048
          with src.open("rb") as f:
              while True:
                  chunk=f.read(CHUNK)
                  if not chunk:
                      break
                  buf += chunk
                  while True:
                      if not in_script:
                          m=re.search(br"<script\b[^>]*>",buf,re.I)
                          if not m:
                              if len(buf)>keep: buf=buf[-keep:]
                              break
                          buf=buf[m.end():]
                          script_index+=1
                          handle=(outdir/f"script-{script_index}.js").open("wb")
                          in_script=True
                      else:
                          m=re.search(br"</script\s*>",buf,re.I)
                          if not m:
                              if len(buf)>keep:
                                  handle.write(buf[:-keep])
                                  buf=buf[-keep:]
                              break
                          handle.write(buf[:m.start()])
                          buf=buf[m.end():]
                          handle.close()
                          handle=None
                          in_script=False

          if in_script and handle:
              handle.write(buf)
              handle.close()

          scripts=sorted(outdir.glob("script-*.js"))
          print("SCRIPT_BLOCKS",len(scripts))
          if not scripts:
              raise SystemExit("NO_SCRIPT_BLOCKS")
          for s in scripts:
              r=subprocess.run(["node","--check",str(s)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f"NODE_CHECK_FAIL {s.name}")
          print("NODE_CHECK=PASS")

          tail=b""
          total=0
          with src.open("rb") as f:
              while True:
                  b=f.read(CHUNK)
                  if not b: break
                  total+=len(b)
                  tail=(tail+b)[-256:]
          if total < 19000000 or not tail.strip():
              raise SystemExit("EOF_STREAM_INVALID")
          print("EOF_STREAM=PASS",total,"TAIL",tail.decode("utf-8","replace"))
          PY
