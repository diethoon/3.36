name: tmp-patch-mobile-prep-wife-v2

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile UI in streamed chunks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          PATH = Path("Wayward_MOD_v3.36.html")
          TMP = PATH.with_suffix(".patch.tmp")
          CHUNK = 65536

          stock_fn = """function M36MobileStockStatus(){
            const state=re(x=>x.state),dispatch=re(x=>x.dispatch),[loanAmount,setLoanAmount]=Z.useState(1);
            if(state.phase!=="prep") return null;
            const needs=x8(state),priceInfo=l5(state),want=priceInfo.want;
            const totalNeed=dr.reduce((sum,key)=>sum+(needs[key]??0),0);
            const gold=state.economy?.gold??0,debt=state.economy?.debt??0,targets=state.supplyTargets??Ew;
            const prices=Ah(state),cost=Ki(want,prices),canBuySome=Rw(state,want,prices,gold),canBuy=Ki(canBuySome,prices);
            const shortOnGold=totalNeed>0&&gold<cost,loanMax=Math.min(gold,debt);
            const safeLoan=loanMax>0?Math.max(1,Math.min(loanAmount,loanMax)):0;
            const hasPrep=totalNeed>0||debt>0;
            if(!hasPrep)return null;
            const setTarget=(item,delta)=>dispatch({type:"set_supply_target",item,value:Math.max(0,(targets[item]??Ew[item])+delta)});
            return u.jsxs("section",{className:"m36-mobile-prep-compact shrink-0 px-1 pb-1",children:[
              u.jsxs("div",{className:"flex items-center justify-between px-1 py-1",children:[
                u.jsx("span",{className:"text-[0.68rem] font-semibold uppercase tracking-widest text-amber-400/90",children:"오후 영업 준비"}),
                u.jsxs("span",{className:"text-[0.6rem] text-stone-600",children:[gold,"골드"]})
              ]}),
              totalNeed>0&&u.jsxs("div",{className:"rounded border border-stone-700 bg-stone-800/45 overflow-hidden",children:[
                qu.map(({key,label})=>{
                  const current=state.supplies?.[key]??0,target=targets[key]??Ew[key],deficit=Math.max(0,target-current);
                  return u.jsxs("div",{className:"grid grid-cols-[1fr_auto] items-center gap-1.5 px-1.5 py-1 border-b last:border-b-0 border-stone-800",children:[
                    u.jsxs("div",{className:"min-w-0 flex items-center gap-1.5",children:[
                      u.jsx("span",{className:"text-[0.68rem] text-stone-300 truncate",children:label}),
                      u.jsxs("span",{className:"text-[0.62rem] tabular-nums text-stone-500 whitespace-nowrap",children:[current,"/",target,deficit>0?" (+"+deficit+")":""]})
                    ]}),
                    u.jsxs("div",{className:"flex items-center gap-0.5",children:[
                      u.jsx("button",{type:"button",onClick:()=>setTarget(key,-1),disabled:target<=0,className:"w-5 h-5 rounded bg-stone-700 hover:bg-stone-600 disabled:opacity-30 text-[0.72rem] leading-none",children:"−"}),
                      u.jsx("span",{className:"w-5 text-center tabular-nums text-[0.65rem] text-stone-300",children:target}),
                      u.jsx("button",{type:"button",onClick:()=>setTarget(key,1),className:"w-5 h-5 rounded bg-stone-700 hover:bg-stone-600 text-[0.72rem] leading-none",children:"+"})
                    ]})
                  ]},key)
                }),
                u.jsx("button",{type:"button",onClick:()=>dispatch({type:"stock_up"}),disabled:totalNeed<=0,className:"w-full text-left px-2 py-1.5 bg-amber-900/75 hover:bg-amber-800 disabled:bg-stone-700 disabled:text-stone-500 text-amber-50",children:u.jsxs("div",{className:"flex items-center justify-between gap-2",children:[
                  u.jsx("span",{className:"text-[0.7rem] font-semibold",children:"물자 채우기"}),
                  u.jsx("span",{className:"text-[0.58rem] text-amber-200/70",children:shortOnGold?"가능 "+canBuy+"G":Math.min(cost,gold)+"G · 약 1시간"})
                ]})})
              ]}),
              debt>0&&u.jsxs("div",{className:"mt-1 rounded border border-rose-800/60 bg-rose-950/20 px-1.5 py-1.5",children:[
                u.jsxs("div",{className:"flex items-center justify-between mb-1",children:[
                  u.jsxs("span",{className:"text-[0.68rem] font-semibold text-rose-300",children:["대출 ",debt,"골드"]}),
                  u.jsxs("span",{className:"text-[0.58rem] text-stone-500",children:["주 5% · 이번 주 약 ",Math.ceil(debt*.05),"골드"]})
                ]}),
                u.jsxs("div",{className:"flex items-center gap-1",children:[
                  u.jsx("input",{type:"number",inputMode:"numeric",min:1,max:loanMax||1,value:safeLoan,onChange:e=>setLoanAmount(Math.max(1,Math.min(loanMax||1,parseInt(e.target.value)||1))),className:"w-12 px-1 py-1 rounded bg-stone-900 border border-stone-700 text-right text-[0.65rem] tabular-nums"}),
                  u.jsx("button",{type:"button",onClick:()=>dispatch({type:"pay_debt",amount:safeLoan}),disabled:loanMax<=0,className:"flex-1 px-1.5 py-1 rounded bg-rose-800 hover:bg-rose-700 disabled:bg-stone-700 disabled:text-stone-500 text-[0.62rem] font-semibold",children:"상환"}),
                  u.jsx("button",{type:"button",onClick:()=>dispatch({type:"pay_debt",amount:loanMax}),disabled:loanMax<=0,className:"px-1.5 py-1 rounded bg-stone-700 hover:bg-stone-600 disabled:bg-stone-800 disabled:text-stone-500 text-[0.62rem]",children:"전액"})
                ]}),
                u.jsxs("div",{className:"mt-1 text-[0.56rem] text-stone-600",children:["상환 후 빚 ",Math.max(0,debt-safeLoan),"골드"]})
              ]})
            ]})
          }"""

          def locate(marker, start=0):
              b = marker.encode("utf-8")
              tail = b""
              pos = 0
              overlap = max(8192, len(b) + 16)
              with PATH.open("rb") as f:
                  while True:
                      c = f.read(CHUNK)
                      if not c:
                          break
                      buf = tail + c
                      base = pos - len(tail)
                      i = 0
                      while True:
                          j = buf.find(b, i)
                          if j < 0:
                              break
                          p = base + j
                          if p >= start:
                              return p
                          i = j + 1
                      tail = buf[-overlap:]
                      pos += len(c)
              return -1

          def count_marker(marker):
              b = marker.encode("utf-8")
              tail = b""
              count = 0
              with PATH.open("rb") as f:
                  while True:
                      c = f.read(CHUNK)
                      if not c:
                          break
                      buf = tail + c
                      i = 0
                      while True:
                          j = buf.find(b, i)
                          if j < 0:
                              break
                          count += 1
                          i = j + 1
                      tail = buf[-max(8192, len(b) + 16):]
              return count

          def replace_between(start_marker, end_marker, replacement):
              s = locate(start_marker)
              e = locate(end_marker, s + len(start_marker.encode("utf-8"))) if s >= 0 else -1
              if s < 0 or e < 0 or e <= s:
                  raise SystemExit("bad function range")
              with PATH.open("rb") as src, TMP.open("wb") as dst:
                  remaining = s
                  while remaining:
                      c = src.read(min(CHUNK, remaining))
                      if not c:
                          raise SystemExit("unexpected EOF")
                      dst.write(c)
                      remaining -= len(c)
                  dst.write(replacement.encode("utf-8"))
                  src.seek(e)
                  while True:
                      c = src.read(CHUNK)
                      if not c:
                          break
                      dst.write(c)
              os.replace(TMP, PATH)

          def replace_exact(old, new):
              if count_marker(old) != 1:
                  raise SystemExit("marker count != 1: " + old)
              old_b = old.encode("utf-8")
              s = locate(old)
              with PATH.open("rb") as src, TMP.open("wb") as dst:
                  remaining = s
                  while remaining:
                      c = src.read(min(CHUNK, remaining))
                      if not c:
                          raise SystemExit("unexpected EOF")
                      dst.write(c)
                      remaining -= len(c)
                  dst.write(new.encode("utf-8"))
                  src.seek(s + len(old_b))
                  while True:
                      c = src.read(CHUNK)
                      if not c:
                          break
                      dst.write(c)
              os.replace(TMP, PATH)

          replace_between("function M36MobileStockStatus(){", "function AOe(){", stock_fn)
          replace_exact("function LF({inline:e=!1}={}){", "function LF({inline:e=!1,hideStats:U=!1,forceVisibility:Q=!1}={}){")
          replace_exact("if(p&&!y)return null;", "if(p&&!y&&!Q)return null;")
          replace_exact(
              'u.jsx(mc,{active:n==="encounters",onClick:()=>s("encounters"),children:"만남 기록"}),u.jsx(mc,{active:n==="statistics",onClick:()=>s("statistics"),children:"통계"})',
              'u.jsx(mc,{active:n==="encounters",onClick:()=>s("encounters"),children:"만남 기록"}),!U&&u.jsx(mc,{active:n==="statistics",onClick:()=>s("statistics"),children:"통계"})'
          )
          replace_exact(
              'n==="encounters"&&u.jsx(A4e,{}),n==="statistics"&&u.jsx(M34Statistics,{})',
              'n==="encounters"&&u.jsx(A4e,{}),!U&&n==="statistics"&&u.jsx(M34Statistics,{})'
          )
          replace_exact('r==="focus"&&k(y?"inline":"external")', 'r==="focus"&&u.jsx(LF,{inline:!0,hideStats:!0,forceVisibility:!0})')
          replace_exact("mobile-action-panel w-[37%] max-w-[13rem]", "mobile-action-panel w-full max-w-[13rem]")
          replace_exact("flex-1 py-3 min-h-[44px] text-[0.6rem] uppercase tracking-widest", "flex-1 py-1 min-h-[32px] text-[0.6rem] uppercase tracking-widest")

          checks = [
              "function M36MobileStockStatus(){",
              "set_supply_target",
              'type:"pay_debt"',
              'r==="focus"&&u.jsx(LF,{inline:!0,hideStats:!0,forceVisibility:!0})',
              "flex-1 py-1 min-h-[32px]",
              "mobile-action-panel w-full max-w-[13rem]",
              "function LF({inline:e=!1,hideStats:U=!1,forceVisibility:Q=!1}={}){",
              '"당신의 뜻에 대한 인식"',
              '"만남 기록"',
          ]
          for marker in checks:
              if locate(marker) < 0:
                  raise SystemExit("postcheck missing: " + marker)
          if locate("flex-1 py-3 min-h-[44px]") >= 0:
              raise SystemExit("old tab height remains")
          if locate("mobile-action-panel w-[37%] max-w-[13rem]") >= 0:
              raise SystemExit("old panel width remains")
          print("PATCH_MARKERS=PASS")
          print("FILE_BYTES", PATH.stat().st_size)
          PY

      - name: Diff check
        run: git diff --check

      - name: Extract inline scripts and node check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("Wayward_MOD_v3.36.html")
          chunk=65536
          carry=b""
          inside=False
          current=None
          index=0
          count=0
          with src.open("rb") as f:
              while True:
                  c=f.read(chunk)
                  if not c:
                      break
                  buf=carry+c
                  pos=0
                  while True:
                      if not inside:
                          i=buf.find(b"<script",pos)
                          if i<0: break
                          gt=buf.find(b">",i+7)
                          if gt<0: break
                          tag=buf[i:gt+1].lower()
                          if b"src=" in tag or b"src =" in tag:
                              pos=gt+1
                              continue
                          current=Path("/tmp/inline_%03d.js" % index)
                          current.touch()
                          index+=1
                          count+=1
                          inside=True
                          pos=gt+1
                      else:
                          i=buf.find(b"</script>",pos)
                          if i<0:
                              with current.open("ab") as out: out.write(buf[pos:])
                              pos=len(buf)
                              break
                          with current.open("ab") as out: out.write(buf[pos:i])
                          pos=i+9
                          current=None
                          inside=False
                  carry=buf[-128:]
          if inside:
              raise SystemExit("inline script EOF without closing tag")
          print("INLINE_SCRIPT_COUNT",count)
          PY
          set -e
          for f in /tmp/inline_*.js; do
            node --check "$f" >/tmp/nodecheck.log 2>&1 || { cat /tmp/nodecheck.log; exit 1; }
          done
          echo "NODE_CHECK=PASS"

      - name: Commit real patch and remove temp workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-patch-mobile-prep-wife.yml .github/workflows/tmp-patch-mobile-prep-wife-v2.yml
          git reset --soft HEAD~2
          git add Wayward_MOD_v3.36.html
          git add -A
          git commit -m "fix(mobile): compact prep controls and wife detail tabs"
          git push origin HEAD:mobile-migration-v1

      - name: Cleanup temp files on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-patch-mobile-prep-wife.yml .github/workflows/tmp-patch-mobile-prep-wife-v2.yml 2>/dev/null || true
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove failed temporary patch workflows"
          git push origin HEAD:mobile-migration-v1
