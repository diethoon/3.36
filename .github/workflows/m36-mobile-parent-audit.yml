name: One-shot mobile parent constraint audit
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-mobile-parent-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect only layout-parent snippets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          pats=[b'mobile-layout',b'mobile-action-panel',b'mobile-main-panel',b'mobile-action-scroll',b'height:100dvh',b'height:100vh',b'min-height:100dvh',b'h-screen',b'min-h-screen',b'overflow-y-auto']
          found={k:[] for k in pats}; counts={k:0 for k in pats}
          carry=b''; offset=0
          with p.open('rb') as f:
            while True:
              ch=f.read(65536)
              if not ch: break
              data=carry+ch; base=offset-len(carry)
              for pat in pats:
                pos=0
                while True:
                  i=data.find(pat,pos)
                  if i<0: break
                  at=base+i; counts[pat]+=1
                  if len(found[pat])<1000: found[pat].append(at)
                  pos=i+1
              offset+=len(ch); carry=data[-128:]
          size=p.stat().st_size
          print("FILE_BYTES",size)
          for pat in pats:
            ps=found[pat]
            print("\nPATTERN",pat.decode(),"COUNT",counts[pat],"OFFSETS",ps[:3]+(ps[-5:] if len(ps)>3 else []))
            # Root markup and late CSS: never print source globally.
            selected=[x for x in ps if (size-1900000 < x < size-400000) or x>size-180000]
            if pat==b'overflow-y-auto': selected=[x for x in ps if size-1500000<x<size-400000][:3]+[x for x in ps if x>size-150000][-2:]
            for at in selected[:8]:
              with p.open('rb') as f:
                f.seek(max(0,at-1100)); sn=f.read(2200)
              print("OFFSET",at,"CONTEXT",sn.decode('utf-8','replace').replace("\n"," ")[:2200])
          PY
      - name: Remove temporary audit workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/m36-mobile-parent-audit.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary mobile parent audit"
            git push origin HEAD:mobile-migration-v1
          fi
