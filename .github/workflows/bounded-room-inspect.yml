name: Apply mobile room summary
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/bounded-room-inspect.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - run: |
          python3 scripts/patch_mobile_status.py
          python3 scripts/patch_mobile_room.py
      - name: Node syntax check
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, shutil
          p=Path("Wayward_MOD_v3.36.html")
          CH=65536; KEEP=2048; buf=b""; active=False; idx=0; h=None
          out=Path("/tmp/node"); shutil.rmtree(out,ignore_errors=True); out.mkdir()
          with p.open("rb") as f:
            while True:
              c=f.read(CH)
              if not c: break
              buf+=c
              while True:
                if not active:
                  m=re.search(br'<script',buf,re.I)
                  if not m:
                    if len(buf)>KEEP: buf=buf[-KEEP:]
                    break
                  gt=buf.find(b'>',m.end())
                  if gt<0:
                    if len(buf)>KEEP: buf=buf[-KEEP:]
                    break
                  buf=buf[gt+1:]; idx+=1; h=(out/f"s{idx}.js").open("wb"); active=True
                else:
                  end=buf.lower().find(b'</script')
                  if end<0:
                    if len(buf)>KEEP: h.write(buf[:-KEEP]); buf=buf[-KEEP:]
                    break
                  gt=buf.find(b'>',end)
                  if gt<0:
                    if len(buf)>KEEP: h.write(buf[:-KEEP]); buf=buf[-KEEP:]
                    break
                  h.write(buf[:end]); buf=buf[gt+1:]; h.close(); h=None; active=False
          if active: raise SystemExit("UNTERMINATED_SCRIPT_BLOCK")
          scripts=sorted(out.glob("*.js"))
          if not scripts: raise SystemExit("NO_SCRIPT_BLOCKS")
          for s in scripts:
            r=subprocess.run(["node","--check",str(s)],capture_output=True,text=True)
            if r.returncode:
              print(r.stderr); raise SystemExit("NODE_CHECK_FAIL")
          print("NODE_CHECK=PASS",len(scripts))
          PY
          git diff --check
      - name: EOF check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          with p.open("rb") as f:
            f.seek(max(0,p.stat().st_size-512))
            tail=f.read(512)
          print("EOF",tail.decode("utf-8","replace"))
          assert tail.endswith(b"END_WAYWARD_MOD_EXTENSION_GUIDE -->\n")
          PY
      - name: Verify target markers
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html"); CH=65536
          needles=[
            b'const playerGauges=[',
            b'function M36MobileRoomCustomer({customer:e}){',
            b'M36MobileRoomCustomer,{customer}',
            b'm36-mobile-room-label",children:gs(room).replace(/^the /," ")}'
          ]
          for n in needles:
            total=0; carry=b''
            with p.open('rb') as f:
              while True:
                c=f.read(CH)
                if not c: break
                d=carry+c; total+=d.count(n); keep=len(n)-1; carry=d[-keep:] if keep else b''
            print(n.decode('utf-8','replace'),total)
            if total!=1: raise SystemExit("MARKER_FAIL")
          PY
      - name: Commit HTML and clean temp files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git rm -f scripts/patch_mobile_status.py scripts/patch_mobile_room.py
          git rm -f .github/workflows/bounded-room-inspect.yml .github/workflows/inspect-room-activity.yml .github/workflows/inspect-mobile-summary.yml .github/workflows/inspect-status-choice-layout.yml .github/workflows/diagnose-elena-choices.yml .github/workflows/diagnose-elena-coe.yml .github/workflows/move-elena-choices-mobile.yml .github/workflows/apply-mobile-summary.yml 2>/dev/null || true
          git commit -m "Refine mobile status and room summaries"
          git push origin HEAD:mobile-migration-v1