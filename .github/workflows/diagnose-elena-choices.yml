name: Diagnose Elena uOe callsite
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/diagnose-elena-choices.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Locate uOe definition and callsites
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html"); CH=65536
          needles=[b"function uOe(",b"u.jsx(uOe,",b"u.jsx(uOe,{"] 
          hits={n:[] for n in needles}; carry=b""; base=0
          with p.open("rb") as f:
            while True:
              c=f.read(CH)
              if not c: break
              d=carry+c; db=base-len(carry)
              for n in needles:
                s=0
                while True:
                  i=d.find(n,s)
                  if i<0: break
                  hits[n].append(db+i); s=i+1
              keep=max(len(n) for n in needles)-1
              carry=d[-keep:] if keep else b""; base+=len(c)
          for n,poses in hits.items():
            print("NEEDLE",n.decode(),"COUNT",len(poses))
            for off in poses[:30]:
              with p.open("rb") as f:
                f.seek(max(0,off-500)); ctx=f.read(len(n)+1200)
              print("OFFSET",off)
              print(ctx.decode("utf-8","replace"))
          print("HTML_BYTES",p.stat().st_size)
          PY
