name: Diagnose Elena choice callsite
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/diagnose-elena-choices.yml"
permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Stream inspect uOe callsites
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html"); CH=65536
          needles=[
            b"function uOe(",
            b"u.jsx(uOe,",
            b"u.jsx(uOe,{",
            b"children:uOe",
            b"uOe({"
          ]
          carry=b""; base=0; hits={n:[] for n in needles}
          with p.open("rb") as f:
            while True:
              c=f.read(CH)
              if not c: break
              d=carry+c; db=base-len(carry)
              for n in needles:
                s=0
                while True:
                  i=d.find(n,s)
                  if i<0: break
                  hits[n].append(db+i); s=i+1
              carry=d[-max(len(n) for n in needles)+1:]; base+=len(c)
          for n,pos in hits.items():
            print("\n###",n.decode("utf-8","replace"),"COUNT",len(pos))
            for off in pos[:20]:
              print("OFFSET",off)
              with p.open("rb") as f:
                f.seek(max(0,off-1800)); print(f.read(5200).decode("utf-8","replace"))
          PY

      - name: Remove diagnostic workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-elena-choices.yml
          git commit -m "Remove Elena choice callsite diagnostic"
          git push origin HEAD:mobile-migration-v1
