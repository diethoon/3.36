name: m36-movement-action-trace

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Trace movement actions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")

          terms=["return_to_taproom","enter_bathhouse","go_to_bedroom","go_upstairs","go_to_back_room"]

          for term in terms:
              ms=list(re.finditer(re.escape(term),s))
              print(f"\n===== {term} COUNT {len(ms)} =====")
              for idx,m in enumerate(ms,1):
                  a=max(0,m.start()-700);b=min(len(s),m.end()+1300)
                  x=s[a:b].replace("\n"," ")
                  print(f"--- #{idx} POS {m.start()} ---")
                  print(x[:2400])

          print("\n===== POTENTIAL HANDLER CASES =====")
          pats=[
            r"case['\"]([^'\"]+)['\"]",
            r"case\\s*['\"]([^'\"]+)['\"]"
          ]
          # Print reducer-like regions around exact action names, with larger context.
          for term in terms:
              for m in re.finditer(re.escape(term),s):
                  a=max(0,m.start()-1800);b=min(len(s),m.end()+2600)
                  x=s[a:b]
                  if "switch" in x or "return" in x or "state" in x:
                      print(f"--- HANDLER CONTEXT {term} POS {m.start()} ---")
                      print(x.replace("\n"," ")[:4300])
          PY
