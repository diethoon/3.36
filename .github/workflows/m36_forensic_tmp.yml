name: TEMP M36 forensic inspect

on:
  pull_request:
    branches: [mobile-migration-v1]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract targeted evidence
        shell: bash
        run: |
          python3 - <<'PY' > m36_forensic_output3.txt
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          text=p.read_text(encoding="utf-8", errors="replace")
          print("BYTES", p.stat().st_size)
          for name in ["M36MobileRoomCustomer","M36MobileRoomActivity","M36MobileStoreStatus","M36MobileCurrentActivity","GF","xOe","wOe"]:
              print(f"\n=== SOURCE {name} ===")
              idx=text.find("function "+name)
              print("INDEX",idx)
              if idx>=0:
                  end=text.find("\nfunction ",idx+10)
                  if end<0: end=min(len(text),idx+120000)
                  print(text[idx:end])
              else:
                  print("NOT FOUND")
          PY
      - name: Upload forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: m36-forensic-output-3
          path: m36_forensic_output3.txt
