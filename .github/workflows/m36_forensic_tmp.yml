name: TEMP M36 forensic inspect

on:
  push:
    branches: [mobile-migration-v1]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect mobile store status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          text=p.read_text(encoding="utf-8", errors="replace")
          print("BYTES", p.stat().st_size)
          lines=text.splitlines()
          print("LINES", len(lines))
          for needle in [
              "function M36MobileStoreStatus",
              "인사하기",
              "주문받기",
              "주문 받기",
              "서빙",
              "Serve",
              "m36-mobile-store",
              "crowdNames"
          ]:
              print("\n=== NEEDLE", needle, "===")
              hits=[i for i,l in enumerate(lines,1) if needle in l]
              print("HITS", hits[:50], "COUNT", len(hits))
              for i in hits[:20]:
                  for j in range(max(1,i-2), min(len(lines),i+2)+1):
                      print(f"{j}:{lines[j-1]}")
          idx=text.find("function M36MobileStoreStatus")
          print("\n=== M36MobileStoreStatus SOURCE ===")
          if idx>=0:
              end=text.find("\nfunction ", idx+10)
              if end<0: end=min(len(text), idx+40000)
              print(text[idx:end])
          else:
              print("NOT FOUND")
          PY
