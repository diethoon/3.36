name: TEMP M36 forensic inspect

on:
  pull_request:
    branches: [mobile-migration-v1]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract customer renderers
        shell: bash
        run: |
          python3 - <<'PY' > m36_customer_renderers.txt
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          text=p.read_text(encoding="utf-8", errors="replace")
          for name in ["e3","GF","M36MobileRoomCustomer","M36MobileRoomActivity"]:
              print(f"\n=== SOURCE {name} ===")
              idx=text.find("function "+name)
              print("INDEX",idx)
              if idx>=0:
                  end=text.find("\nfunction ",idx+10)
                  if end<0: end=min(len(text),idx+120000)
                  print(text[idx:end])
          PY
      - name: Upload renderer evidence
        uses: actions/upload-artifact@v4
        with:
          name: m36-customer-renderers
          path: m36_customer_renderers.txt
