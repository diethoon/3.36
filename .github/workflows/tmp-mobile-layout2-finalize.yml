name: tmp-mobile-layout2-finalize
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          CH=65536

          def replace_once(old: bytes, new: bytes, expected=1):
              tmp=p.with_suffix(".html.tmp")
              keep=max(0,len(old)-1)
              carry=b""; count=0
              with p.open("rb") as src, tmp.open("wb") as dst:
                  while True:
                      c=src.read(CH)
                      if not c: break
                      data=carry+c
                      cursor=0
                      while True:
                          i=data.find(old,cursor)
                          if i<0: break
                          dst.write(data[cursor:i]); dst.write(new)
                          count += 1; cursor=i+len(old)
                      data=data[cursor:]
                      if len(data)>keep:
                          if keep: dst.write(data[:-keep]); carry=data[-keep:]
                          else: dst.write(data); carry=b""
                      else:
                          carry=data
                  dst.write(carry)
              if count!=expected:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f"REPLACE_FAIL expected={expected} got={count}")
              tmp.replace(p)

          old_status=b'''function M36MobileStatusPanel(){
