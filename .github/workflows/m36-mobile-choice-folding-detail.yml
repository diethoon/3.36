name: One-shot mobile choice folding logic detail
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-mobile-choice-folding-detail.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Print only bounded byte ranges around folding function and style
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'), path='Wayward_MOD_v3.36.html', fd=fs.openSync(path,'r');
          const size=fs.fstatSync(fd).size;
          const targets=['function syncCategory(heading, key)', 'function renderCategories()', 'function scan()', 'm36-mobile-next-ui-script', 'style id="m36-mobile-next-ui-v1"', 'm36-mobile-dialogue-fixed-v1'];
          const hit=new Map(targets.map(x=>[x,[]]));
          const max=Math.max(...targets.map(x=>Buffer.byteLength(x)));
          const buf=Buffer.allocUnsafe(65536);let carry=Buffer.alloc(0),offset=0;
          while(true){
            const n=fs.readSync(fd,buf,0,buf.length,offset);if(!n)break;
            const data=Buffer.concat([carry,buf.subarray(0,n)]),base=offset-carry.length;
            for(const t of targets){
              const needle=Buffer.from(t);let from=0;
              while(true){const i=data.indexOf(needle,from);if(i<0)break;const p=base+i,list=hit.get(t);if(list.length<6&&!list.includes(p))list.push(p);from=i+1;}
            }
            offset+=n;carry=Buffer.from(data.subarray(Math.max(0,data.length-max+1)));
          }
          for(const t of targets)console.log('HITS '+t+' '+JSON.stringify(hit.get(t)));
          for(const t of targets){
            const positions=hit.get(t);if(!positions.length)continue;
            const p=positions[positions.length-1];
            const start=Math.max(0,p-500),len=Math.min(t.includes('script')?12000: t.includes('syncCategory')?8500:6500,size-start);
            const out=Buffer.alloc(len);fs.readSync(fd,out,0,len,start);
            console.log('\n=== '+t+' @'+p+' bytes '+start+'..'+(start+len)+' ===\n'+out.toString('utf8').replace(/\n/g,' ').slice(0,len));
          }
          fs.closeSync(fd);
          NODE
      - name: Remove temporary audit workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/m36-mobile-choice-folding-detail.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary mobile choice folding detail audit"
            git push origin HEAD:mobile-migration-v1
          fi
