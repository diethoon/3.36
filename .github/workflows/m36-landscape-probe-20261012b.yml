name: M36 one-shot landscape forensic probe B

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact probe head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Bounded streaming inspection
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/m36-landscape-probe-b.txt 2>&1
          from pathlib import Path
          import mmap

          p = Path("Wayward_MOD_v3.36.html")
          if not p.exists():
              print("SOURCE_NOT_FOUND")
              raise SystemExit(1)
          size = p.stat().st_size
          print("FILE", p.name, "BYTES", size)
          with p.open("rb") as fp:
              newline_count = 0
              while True:
                  block = fp.read(65536)
                  if not block:
                      break
                  newline_count += block.count(b"\\n")
              print("NEWLINES", newline_count)
              with p.open("rb") as mapped_file:
                  mm = mmap.mmap(mapped_file.fileno(), 0, access=mmap.ACCESS_READ)
                  needles = [
                      ("@media", b"@media", 4),
                      ("orientation", b"orientation", 4),
                      ("landscape", b"landscape", 4),
                      ("portrait", b"portrait", 3),
                      ("mobile-layout", b"mobile-layout", 3),
                      ("portrait-panel", b"mobile-portrait-panel", 3),
                      ("main-panel", b"mobile-main-panel", 3),
                      ("action-panel", b"mobile-action-panel", 3),
                      ("choice-scroll", b"mobile-action-scroll", 3),
                      ("m34-header", b"m34-header", 4),
                      ("m36-mobile", b"m36-mobile", 4),
                      ("grid-columns", b"grid-template-columns", 4),
                      ("minmax", b"minmax(", 3),
                      ("stock-label", "재고".encode("utf-8"), 2),
                      ("head-close", b"</head>", 1),
                  ]
                  for label, needle, cap in needles:
                      positions = []
                      pos = 0
                      while True:
                          pos = mm.find(needle, pos)
                          if pos < 0:
                              break
                          positions.append(pos)
                          pos += len(needle)
                      print(f"\\n## {label}: {len(positions)}")
                      picks = positions[:min(2, cap)]
                      if len(positions) > 2:
                          picks += positions[-min(2, cap):]
                      printed = set()
                      for pos in picks:
                          if pos in printed:
                              continue
                          printed.add(pos)
                          a, b = max(0, pos - 220), min(size, pos + 420)
                          fp.seek(a)
                          excerpt = fp.read(b - a).decode("utf-8", "replace")
                          excerpt = " ".join(excerpt.split())
                          print(f"@{pos}: {excerpt[:650]}")
                  print("\\n## EOF slices (each <= 250 bytes)")
                  for i in range(4, 0, -1):
                      a = max(0, size - i * 250)
                      fp.seek(a)
                      chunk = fp.read(min(250, size - a))
                      print(f"EOF-{i} @{a}: {chunk.decode('utf-8', 'replace')}")
                  mm.close()
          print("\\nEND_TARGETED_PROBE")
          PY
          cat /tmp/m36-landscape-probe-b.txt

      - name: Post output and clean temporary runner
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROBE_BRANCH: m36-landscape-probe-20261012b
          WF_PATH: .github/workflows/m36-landscape-probe-20261012b.yml
        run: |
          set +e
          if [ -n "$PR_NUMBER" ]; then
            if [ ! -s /tmp/m36-landscape-probe-b.txt ]; then
              printf 'PROBE_REPORT_MISSING. Inspect workflow job logs.\\n' > /tmp/m36-landscape-probe-b.txt
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/m36-landscape-probe-b.txt)" >/tmp/m36-landscape-comment-b.log 2>&1
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "One-shot source probe completed; no game source was modified." >/tmp/m36-landscape-close-b.log 2>&1
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PROBE_BRANCH" >/tmp/m36-landscape-branch-delete-b.log 2>&1
          WF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WF_PATH?ref=main" --jq .sha 2>/dev/null)"
          if [ -n "$WF_SHA" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WF_PATH" -f message="chore: remove temporary landscape probe workflow" -f sha="$WF_SHA" -f branch=main >/tmp/m36-landscape-workflow-delete-b.log 2>&1
          fi
          echo "Probe cleanup attempted."
