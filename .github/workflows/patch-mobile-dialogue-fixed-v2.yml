name: patch mobile dialogue fixed v2
on:
  push:
    branches:
      - mobile-migration-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          p = Path("Wayward_MOD_v3.36.html")
          s = p.read_text(encoding="utf-8")

          marker = 'u.jsxs("div",{className:"m36-mobile-dialogue-fixed",children:['
          if s.count(marker) != 1:
              raise SystemExit("fixed block count: %s" % s.count(marker))
          i = s.index(marker)
          j = s.index('    ]}),', i) + len('    ]}),')
          s = s[:i] + s[j:]
          if i < len(s) and s[i] == chr(10):
              s = s[:i] + s[i+1:]

          hd = "function HD(){"
          if s.count(hd) != 1:
              raise SystemExit("HD count: %s" % s.count(hd))

          comp = (
              'function M36MobileDialogueFixed({event:e,wifeName:t}){'
              'if(!e||["confrontation","outfit_reaction","back_room_interrupt"].includes(e.type))return null;'
              'const o=e.type==="wife_conversation",n=e.type==="sex_scene",'
              'r=e.type==="patron_interaction"&&e.customerName?e.customerName+" & "+t:o||n?t:"⚠ 돌발 상황";'
              'return u.jsxs("div",{className:"m36-mobile-dialogue-fixed",children:['
              'u.jsx("div",{className:"m36-mobile-dialogue-label",children:o?"[대화] "+t+" <> 당신":"[이벤트] "+r}),'
              'u.jsx("div",{className:"m36-mobile-dialogue-box",children:u.jsx("p",{className:"text-sm text-stone-200 leading-relaxed whitespace-pre-wrap break-words",children:e.text})})]})}\n\n'
          )
          s = s.replace(hd, comp + hd, 1)

          old_panel = 'u.jsx("div",{className:"mobile-action-scroll flex-1 min-h-0 overflow-y-auto py-1 text-[0.72rem]",children:u.jsx(HD,{})})'
          new_panel = (
              'u.jsxs("div",{className:"flex-1 min-h-0 flex flex-col",children:['
              'u.jsx(M36MobileDialogueFixed,{event:e.pendingEvent,wifeName:d.name}),'
              'u.jsx("div",{className:"mobile-action-scroll flex-1 min-h-0 overflow-y-auto py-1 text-[0.72rem]",children:u.jsx(HD,{})})]})'
          )
          if s.count(old_panel) != 1:
              raise SystemExit("scroll panel count: %s" % s.count(old_panel))
          s = s.replace(old_panel, new_panel, 1)

          old_css = (
              '.m36-mobile-dialogue-fixed{\n'
              '    position:sticky;\n'
              '    top:0;\n'
              '    z-index:30;\n'
              '    display:block;'
          )
          new_css = (
              '.m36-mobile-dialogue-fixed{\n'
              '    flex:0 0 auto;\n'
              '    position:relative;\n'
              '    z-index:30;\n'
              '    display:block;'
          )
          if s.count(old_css) != 1:
              raise SystemExit("css count: %s" % s.count(old_css))
          s = s.replace(old_css, new_css, 1)

          old_margin = '    margin:-.25rem -.25rem .45rem;\n    padding:.3rem .35rem .4rem;'
          new_margin = '    margin:0;\n    padding:.3rem .35rem .4rem;'
          if s.count(old_margin) != 1:
              raise SystemExit("margin count: %s" % s.count(old_margin))
          s = s.replace(old_margin, new_margin, 1)

          p.write_text(s, encoding="utf-8")

          css_a = s.index('<style id="wayward-mobile-dialogue-fixed-v1">')
          css_b = s.index('</style>', css_a)
          assert 'position:sticky' not in s[css_a:css_b]
          assert 'u.jsx(M36MobileDialogueFixed,{event:e.pendingEvent,wifeName:d.name})' in s
          assert s.count('className:"m36-mobile-dialogue-fixed"') == 1

          chunks = []
          for m in re.finditer(r'<script[^>]*>([\s\S]*?)</script>', s):
              if m.group(1).strip():
                  chunks.append(m.group(1))
          Path("/tmp/wayward-chunks.js").write_text("\n".join(chunks), encoding="utf-8")
          print("PATCH OK; bytes=%d chunks=%d" % (len(s), len(chunks)))
          PY
      - name: Syntax
        run: node --check /tmp/wayward-chunks.js
      - name: Commit
        run: |
          rm -f .github/workflows/patch-mobile-dialogue-fixed-v2.yml __dialogue_patch_trigger.txt __dialogue_patch_trigger2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html .github/workflows/patch-mobile-dialogue-fixed-v2.yml __dialogue_patch_trigger.txt __dialogue_patch_trigger2.txt
          git diff --cached --stat
          git commit -m "fix(mobile): keep dialogue header outside choice scroll"
          git push
