name: patch-mobile-dialogue-fixed-v2

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Patch structure
        shell: python
        run: |
          from pathlib import Path
          import sys

          p = Path("Wayward_MOD_v3.36.html")
          raw = p.read_text(encoding="utf-8")

          old_fixed = '''u.jsxs("div",{className:"m36-mobile-dialogue-fixed",children:[
      u.jsx("div",{className:"m36-mobile-dialogue-label",children:ee?''' + chr(96) + '''[대화] ${o.name} <> 당신''' + chr(96) + ''':'''+ chr(96) + '''[이벤트] ${wt}''' + chr(96) + '''}),
      u.jsx("div",{className:''' + chr(96) + '''m36-mobile-dialogue-box ${Be}''' + chr(96) + ''',children:u.jsx("p",{className:"text-sm text-stone-200 leading-relaxed whitespace-pre-wrap break-words",children:d.text})})
    ]}),
    '''
          if raw.count(old_fixed) != 1:
              print("old_fixed count", raw.count(old_fixed))
              sys.exit(2)
          raw = raw.replace(old_fixed, "", 1)

          marker = "function HD(){"
          if raw.count(marker) != 1:
              print("HD count", raw.count(marker))
              sys.exit(3)

          comp = '''function M36MobileDialogueFixed({event:e,wifeName:t}){if(!e||["confrontation","outfit_reaction","back_room_interrupt"].includes(e.type))return null;const o=e.type==="wife_conversation",n=e.type==="sex_scene",s=e.type==="patron_interaction",r=o||n?t:s&&e.customerName?e.customerName+" & "+t:"⚠ 돌발 상황";return u.jsxs("div",{className:"m36-mobile-dialogue-fixed",children:[u.jsx("div",{className:"m36-mobile-dialogue-label",children:o?"[대화] "+t+" <> 당신":"[이벤트] "+r}),u.jsx("div",{className:"m36-mobile-dialogue-box",children:u.jsx("p",{className:"text-sm text-stone-200 leading-relaxed whitespace-pre-wrap break-words",children:e.text})})]})}

'''
          raw = raw.replace(marker, comp + marker, 1)

          old_panel = '''u.jsx("div",{className:"mobile-action-scroll flex-1 min-h-0 overflow-y-auto py-1 text-[0.72rem]",children:u.jsx(HD,{})})'''
          new_panel = '''u.jsxs("div",{className:"flex-1 min-h-0 flex flex-col",children:[
    u.jsx(M36MobileDialogueFixed,{event:e.pendingEvent,wifeName:d.name}),
    u.jsx("div",{className:"mobile-action-scroll flex-1 min-h-0 overflow-y-auto py-1 text-[0.72rem]",children:u.jsx(HD,{})})
  ]})'''
          if raw.count(old_panel) != 1:
              print("panel count", raw.count(old_panel))
              sys.exit(4)
          raw = raw.replace(old_panel, new_panel, 1)

          css_old = '''.m36-mobile-dialogue-fixed{
    position:sticky;
    top:0;
    z-index:30;
    display:block;'''
          css_new = '''.m36-mobile-dialogue-fixed{
    flex:0 0 auto;
    position:relative;
    z-index:30;
    display:block;'''
          if raw.count(css_old) != 1:
              print("css count", raw.count(css_old))
              sys.exit(5)
          raw = raw.replace(css_old, css_new, 1)

          margin_old = '''    margin:-.25rem -.25rem .45rem;
    padding:.3rem .35rem .4rem;'''
          margin_new = '''    margin:0;
    padding:.3rem .35rem .4rem;'''
          if raw.count(margin_old) != 1:
              print("margin count", raw.count(margin_old))
              sys.exit(6)
          raw = raw.replace(margin_old, margin_new, 1)

          p.write_text(raw, encoding="utf-8")
          print("patched bytes:", len(raw))

      - name: Validate structure
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          css_start=s.find('<style id="wayward-mobile-dialogue-fixed-v1">')
          css_end=s.find('</style>',css_start)
          css=s[css_start:css_end]
          assert "position:sticky" not in css
          assert 'u.jsx(M36MobileDialogueFixed,{event:e.pendingEvent,wifeName:d.name})' in s
          fixed=s.find('u.jsx(M36MobileDialogueFixed,{event:e.pendingEvent,wifeName:d.name})')
          scroll=s.find('u.jsx("div",{className:"mobile-action-scroll flex-1 min-h-0 overflow-y-auto py-1 text-[0.72rem]",children:u.jsx(HD,{})})')
          assert fixed < scroll
          assert 'm36-mobile-dialogue-fixed' in s
          assert s.count('className:"m36-mobile-dialogue-fixed"') == 1
          chunks=[]
          for m in re.finditer(r'<script[^>]*>([\\s\\S]*?)</script>',s):
              if m.group(1).strip():
                  chunks.append(m.group(1))
          Path("/tmp/wayward-chunks.js").write_text("\n".join(chunks),encoding="utf-8")
          print("PASS structural checks; script chunks:",len(chunks))

      - name: Node syntax check
        run: node --check /tmp/wayward-chunks.js

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/patch-mobile-dialogue-fixed-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html .github/workflows/patch-mobile-dialogue-fixed-v2.yml
          git diff --cached --stat
          git commit -m "fix(mobile): keep dialogue header outside choice scroll"
          git push
