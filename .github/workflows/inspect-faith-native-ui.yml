name: Inspect Faith v3.0.0 native image-pack UI
on:
  push:
    branches: [faith-image-loader-clean-1.0.0-20261030]
    paths: [".github/workflows/inspect-faith-native-ui.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: faith-imagepack-registration-fix
          path: faith-source
      - name: Find native menu toggle labels
        shell: bash
        run: |
          python3 - <<'PY'
          import re, zipfile
          with zipfile.ZipFile("faith-source/Wayward_Faith_NoSound_v3.0.0.zip") as z:
              n=next(n for n in z.namelist() if n.lower().endswith("wayward_faith_v3.0.0.html"))
              t=z.read(n).decode("utf-8",errors="replace")
          pats=[r'aria-label:"[^"]*(?:메뉴|menu)[^"]*"',r'title:"[^"]*(?:메뉴|menu)[^"]*"',r'children:"(?:☰|≡|三|메뉴)"',r'children:"이미지팩 설정"',r'children:"시작 화면으로"']
          for p in pats:
              ms=list(re.finditer(p,t,re.I))
              print(f"\n## {p} ({len(ms)})")
              for m in ms[:20]:
                  print(t[max(0,m.start()-600):min(len(t),m.end()+600)].replace(chr(10)," ").replace(chr(13)," ")[:1200])
          PY
