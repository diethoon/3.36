name: one-shot-right-location-fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 0
          persist-credentials: true
      - name: patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("Wayward_MOD_v3.36.html")
          data=p.read_bytes()

          def once(old,new,label):
              global data
              n=data.count(old)
              print(label,n)
              if n!=1: raise SystemExit(f"{label}: expected 1, got {n}")
              data=data.replace(old,new,1)

          once(
            b'const state=re(d=>d.state),dispatch=re(d=>d.dispatch),wife=g(state),playerLoc=re(d=>vt(d.state)),activePatronInteraction=G9(state),',
            b'const state=re(d=>d.state),dispatch=re(d=>d.dispatch),wife=g(state),playerLoc=re(d=>vt(d.state)),wifeLoc=re(d=>be(d.state)),activePatronInteraction=G9(state),',
            'wife location selector'
          )

          once(
            b'  const feeling=topFeeling?u.koLabel("emotion",topFeeling.emotion):"평온";
',
            b'  const feeling=topFeeling?u.koLabel("emotion",topFeeling.emotion):"평온";
  const wifeRoomCount=1+state.customers.filter(customer=>Zi(customer)&&ht(state,customer.id)===wifeLoc).length+b7(state,wifeLoc).length+m315StaffAt(state,wifeLoc).length;
',
            'wife room count'
          )

          once(
            b'''    u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
      u.jsx("span",{className:"m36-mobile-store-label",children:wife.name||"엘레나"}),''',
            b'''    wifeLoc!==playerLoc&&u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
      u.jsx("span",{className:"m36-mobile-store-label",children:gs(wifeLoc).replace(/^the /,"")}),
      u.jsx("span",{className:"m36-mobile-store-value",children:wifeRoomCount})
    ]}),
    u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
      u.jsx("span",{className:"m36-mobile-store-label",children:wife.name||"엘레나"}),''',
            'wife room line'
          )

          p.write_bytes(data)
          s=data.decode("utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>",s,re.S)
          js=next((x for x in scripts if "function AOe(" in x and "function M36MobileStoreStatus(" in x),None)
          if not js: raise SystemExit("main JS block not found")
          Path("/tmp/wayward-main.js").write_text(js,encoding="utf-8")
          for marker in ["playerLoc=re(d=>vt(d.state))","wifeLoc=re(d=>be(d.state))","wifeLoc!==playerLoc"]:
              if marker not in js: raise SystemExit("missing "+marker)
          PY
          node --check /tmp/wayward-main.js
          git diff --check -- Wayward_MOD_v3.36.html
          git config user.name "diethoon"
          git config user.email "jhy67439787@gmail.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): show player and wife locations in right status"
          git push origin HEAD:mobile-migration-v1
