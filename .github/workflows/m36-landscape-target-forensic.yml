name: M36 landscape target column — consolidate scroll owner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch, never PR source
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 0

      - name: Consolidate duplicate rules around the actual hall/status/guest/narrative column
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'Wayward_MOD_v3.36.html';
          let html = fs.readFileSync(file, 'utf8');
          const originalBytes = Buffer.byteLength(html);

          function removeStyle(id) {
            const startTag = '<style id="' + id + '">';
            const start = html.indexOf(startTag);
            if (start < 0) throw new Error('Expected temporary/duplicate style not found: ' + id);
            const end = html.indexOf('</style>', start);
            if (end < 0) throw new Error('Unclosed style: ' + id);
            html = html.slice(0, start) + html.slice(end + '</style>'.length);
            console.log('REMOVED_STYLE=' + id);
          }

          // These two late rules only re-declared scroll properties already owned by the
          // primary landscape layout block, while one also conflicted on height/flex sizing.
          removeStyle('m36-landscape-third-column-scroll-touch-fix-20261014');
          removeStyle('m36-landscape-explicit-touch-scroll-fallback-20261014-css');

          // Remove the older free-floating absolute-position rule so the layout/scroll
          // geometry is declared in one authoritative selector in the prep-scroll style.
          const absoluteRule = /\.m36-landscape-info-scroll\s*\{[^}]*position:absolute!important;[^}]*width:48%!important;[^}]*\}/g;
          const absoluteMatches = [...html.matchAll(absoluteRule)];
          if (absoluteMatches.length !== 1) {
            throw new Error('Expected one obsolete standalone 48% absolute rule; found ' + absoluteMatches.length);
          }
          html = html.replace(absoluteRule, '');
          console.log('REMOVED_OLD_ABSOLUTE_RULE=1');

          const id = '<style id="m36-landscape-third-column-prep-scroll-20261014">';
          const styleStart = html.indexOf(id);
          if (styleStart < 0) throw new Error('Primary landscape layout style is missing');
          const styleEnd = html.indexOf('</style>', styleStart);
          if (styleEnd < 0) throw new Error('Primary landscape layout style is unclosed');
          let style = html.slice(styleStart, styleEnd + '</style>'.length);
          const selector = /\.mobile-action-panel>\.m36-landscape-info-scroll\s*\{[^}]*\}/;
          if (!selector.test(style)) throw new Error('Cannot locate the authoritative third-column selector');
          const authoritative = `.mobile-action-panel {
            display:block!important;position:relative!important;box-sizing:border-box!important;
            width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;
            overflow:hidden!important;
          }
          .mobile-action-panel>.m36-landscape-info-scroll {
            position:absolute!important;left:0!important;right:auto!important;top:0!important;bottom:0!important;
            z-index:2!important;box-sizing:border-box!important;width:48%!important;max-width:48%!important;
            display:flex!important;flex-direction:column!important;flex:none!important;
            height:auto!important;min-width:0!important;min-height:0!important;max-height:none!important;
            overflow-x:hidden!important;overflow-y:auto!important;
            -webkit-overflow-scrolling:touch!important;overscroll-behavior-y:contain!important;touch-action:pan-y!important;
            scrollbar-width:thin!important;
          }
          .mobile-action-panel>.flex-1.min-h-0.flex.flex-col {
            position:absolute!important;left:48%!important;right:0!important;top:0!important;bottom:0!important;
            display:flex!important;flex-direction:column!important;width:auto!important;height:auto!important;
            min-width:0!important;min-height:0!important;max-height:none!important;overflow:hidden!important;z-index:1!important;
          }
          .mobile-action-panel>.flex-1.min-h-0.flex.flex-col>.mobile-action-scroll {
            position:relative!important;inset:auto!important;display:flex!important;flex-direction:column!important;
            flex:1 1 0%!important;height:100%!important;max-height:100%!important;width:100%!important;
            min-width:0!important;min-height:0!important;overflow-x:hidden!important;overflow-y:auto!important;
          }
          .mobile-action-panel>button {
            position:absolute!important;right:0!important;bottom:0!important;left:auto!important;top:auto!important;
            width:18px!important;height:18px!important;min-width:18px!important;min-height:18px!important;max-height:18px!important;
            padding:0!important;justify-content:center!important;z-index:3!important;
          }`;
          style = style.replace(selector, authoritative);
          const statusOverflow = `.mobile-action-panel>.m36-landscape-info-scroll>.m36-mobile-store-status {
            flex:0 0 auto!important;height:auto!important;max-height:none!important;overflow:visible!important;
          }`;
          if ((style.match(/\.mobile-action-panel>\.m36-landscape-info-scroll>\.m36-mobile-store-status/g)||[]).length) throw new Error('Status overflow normalization already exists; refusing duplicate patch');
          style = style.replace('</style>', statusOverflow + '\n</style>');
          html = html.slice(0, styleStart) + style + html.slice(styleEnd + '</style>'.length);

          if (html.includes('id="m36-landscape-third-column-scroll-touch-fix-20261014"')) throw new Error('Duplicate touch-fix CSS remains');
          if (html.includes('id="m36-landscape-explicit-touch-scroll-fallback-20261014-css"')) throw new Error('Duplicate fallback CSS remains');
          if (!html.includes('id="m36-landscape-explicit-touch-scroll-fallback-20261014"')) throw new Error('Touch gesture fallback script was accidentally removed');
          if ((html.match(/\.mobile-action-panel>\.m36-landscape-info-scroll\s*\{/g) || []).length !== 1) throw new Error('Expected one authoritative landscape selector');
          if (html.toLowerCase().split('</body>').length !== 2) throw new Error('Body boundary count changed');
          fs.writeFileSync(file, html, 'utf8');
          console.log('SOURCE_BYTES_BEFORE=' + originalBytes);
          console.log('SOURCE_BYTES_AFTER=' + Buffer.byteLength(html));
          console.log('AUTHORITATIVE_SCROLL_RULES=1');
          console.log('TOUCH_FALLBACK_SCRIPTS=' + (html.split('id="m36-landscape-explicit-touch-scroll-fallback-20261014"').length - 1));
          NODE
          git diff --check
          git diff --stat

      - name: Browser-check actual target wrapper with real touch input and no test content
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 >/tmp/m36-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({viewport:{width:820,height:360},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            const response = await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:90000});
            if (response?.status() !== 200) throw new Error('Local HTML did not return HTTP 200');
            await page.waitForFunction(()=>document.body&&document.body.innerText.trim().length>10,null,{timeout:60000}).catch(()=>{});
            for (let i=0;i<45;i++) {
              const body = await page.locator('body').innerText().catch(()=> '');
              if (body.includes('물자 채우기') && body.includes('대출')) break;
              const next=page.getByRole('button',{name:/^예$|이해하고 동의합니다|다음|계속|시작|확인|완료|진행|게임 시작|새 게임/});
              let clicked=false;
              for(let j=0;j<await next.count();j++){try{const b=next.nth(j);if(await b.isVisible()&&await b.isEnabled()){await b.evaluate(e=>e.click());await wait(180);clicked=true;break;}}catch{}}
              const body2 = await page.locator('body').innerText().catch(()=> '');
              if(!clicked && body2.includes('그녀는 당신에게 어떤 존재인가요')) {
                const wifeType=page.getByRole('button',{name:/^아내$/});
                if(await wifeType.count()&&await wifeType.first().isVisible()&&await wifeType.first().isEnabled()){await wifeType.first().evaluate(e=>e.click());await wait(220);clicked=true;}
                const woman=page.getByRole('button',{name:/^(엘레나|마라|피파)/});
                if(await woman.count()&&await woman.first().isVisible()&&await woman.first().isEnabled()){await woman.first().evaluate(e=>e.click());await wait(250);clicked=true;}
              }
              if(!clicked) {
                const woman=page.getByRole('button',{name:/^(엘레나|마라|피파)/});
                if(await woman.count()&&await woman.first().isVisible()&&await woman.first().isEnabled()){await woman.first().evaluate(e=>e.click());await wait(250);clicked=true;}
              }
              if(!clicked) await wait(250);
            }
            await wait(500);
            const info=page.locator('.m36-landscape-info-scroll').first();
            if(!await info.count()) throw new Error('Actual landscape info/status wrapper missing');
            const before=await info.evaluate(el=>{
              const r=el.getBoundingClientRect(),s=getComputedStyle(el);
              return {x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height),
                position:s.position,display:s.display,overflowY:s.overflowY,touchAction:s.touchAction,
                clientHeight:el.clientHeight,scrollHeight:el.scrollHeight,scrollTop:el.scrollTop,
                containsStatus:!!el.querySelector('.m36-mobile-store-status'),
                containsRoomActivity:!!el.querySelector('.m36-mobile-room-activity'),
                statusOverflow:el.querySelector('.m36-mobile-store-status')?getComputedStyle(el.querySelector('.m36-mobile-store-status')).overflowY:'missing',
                statusHeight:el.querySelector('.m36-mobile-store-status')?el.querySelector('.m36-mobile-store-status').clientHeight:0,
                statusScrollHeight:el.querySelector('.m36-mobile-store-status')?el.querySelector('.m36-mobile-store-status').scrollHeight:0,
                panel:(()=>{
                  const p=el.parentElement, ps=getComputedStyle(p), pr=p.getBoundingClientRect();
                  const children=[...p.children].map(n=>{
                    const ns=getComputedStyle(n),nr=n.getBoundingClientRect();
                    return {cls:String(n.className||n.tagName).slice(0,80),x:Math.round(nr.x),y:Math.round(nr.y),w:Math.round(nr.width),h:Math.round(nr.height),position:ns.position,zIndex:ns.zIndex,gridColumn:ns.gridColumn,gridRow:ns.gridRow,pointerEvents:ns.pointerEvents,overflowY:ns.overflowY};
                  });
                  return {x:Math.round(pr.x),y:Math.round(pr.y),w:Math.round(pr.width),h:Math.round(pr.height),display:ps.display,gridTemplateColumns:ps.gridTemplateColumns,gridTemplateRows:ps.gridTemplateRows,position:ps.position,overflow:ps.overflow,children};
                })(),
                directChildren:[...el.children].map(n=>String(n.className||n.tagName).slice(0,80)).slice(0,8)};
            });
            console.log('ACTUAL_TARGET_WRAPPER_BEFORE='+JSON.stringify(before));
            if(before.width<40||before.height<100||before.position!=='absolute'||!['auto','scroll'].includes(before.overflowY)) throw new Error('Target wrapper geometry/scroll owner is invalid');
            if(!before.panel || before.panel.children.length<2 || before.panel.children[1].h<100) throw new Error('Sibling choices pane is collapsed instead of occupying its own column');
            if(!before.containsStatus) throw new Error('Location/gauge status is not inside the target wrapper');
            if(before.statusOverflow!=='visible') throw new Error('Nested status box still clips the guest list instead of letting the third-column parent own scrolling');
            if(before.scrollHeight<=before.clientHeight) throw new Error('Target wrapper has no natural overflow to test');
            const box=await info.boundingBox();
            const x=Math.round(box.x+box.width/2), y=Math.round(box.y+Math.min(box.height-4,box.height*.78));
            const hit=await page.evaluate(({x,y})=>{const e=document.elementFromPoint(x,y);return {tag:e?.tagName,cls:String(e?.className||'').slice(0,100),text:(e?.textContent||'').slice(0,80),insideInfo:!!e?.closest('.m36-landscape-info-scroll')};},{x,y});
            console.log('TOUCH_TARGET='+JSON.stringify(hit));
            if(!hit.insideInfo) throw new Error('Touch point is intercepted by the sibling choices scroller instead of the status/guest/narrative column');
            const cdp=await context.newCDPSession(page);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y:y-90}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y:y-180}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await wait(400);
            const after=await info.evaluate(el=>({scrollTop:el.scrollTop,max:el.scrollHeight-el.clientHeight,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight}));
            console.log('ACTUAL_TARGET_WRAPPER_AFTER_TOUCH='+JSON.stringify(after));
            if(after.scrollTop<=before.scrollTop) throw new Error('Touch gesture did not scroll the actual target wrapper');
            if(errors.length) throw new Error('JavaScript errors: '+errors.join(' | '));
            console.log('M36_TARGET_COLUMN_CONSOLIDATED_SCROLL_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit only the HTML change and clean the temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): consolidate landscape status and guest scrolling"
          git push origin HEAD:mobile-migration-v1
          git fetch origin main
          git switch --detach origin/main
          git rm .github/workflows/m36-landscape-target-forensic.yml
          git commit -m "chore: remove temporary landscape target forensic workflow"
          git push origin HEAD:main
