name: Fix landscape menu icons, portrait space, tabs and column widths
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/landscape-visual-regression-v2.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Patch HTML incrementally and append landscape-only overrides
        shell: bash
        run: |
          cp Wayward_MOD_v3.36.html before.html
          python3 - <<'PY'
          from pathlib import Path
          import os, re, tempfile
          p=Path("Wayward_MOD_v3.36.html")
          old=(b'u.jsxs(u.Fragment,{children:[u.jsx(rI,{compact:!0}),'
               b'u.jsx("div",{className:"m36-landscape-last-action-delta",children:d.lastActionDelta?u.jsx(nOe,{delta:d.lastActionDelta,ageSlot:e.slot}):null})]})')
          new=(b'u.jsxs(u.Fragment,{children:[u.jsx(rI,{compact:!0}),'
               b'd.lastActionDelta?.changes?.length>0&&u.jsx("div",{className:"m36-landscape-last-action-delta",'
               b'children:u.jsx(nOe,{delta:d.lastActionDelta,ageSlot:e.slot})})]})')
          fd,tmp_name=tempfile.mkstemp(prefix="wayward-html-patch-",dir=str(p.parent))
          tmp=Path(tmp_name); count=0; carry=b""
          with p.open("rb") as src, os.fdopen(fd,"wb") as out:
              overlap=max(len(old),len(new))-1
              while True:
                  chunk=src.read(64*1024)
                  if not chunk: break
                  data=carry+chunk
                  safe_len=max(0,len(data)-overlap)
                  safe,carry=data[:safe_len],data[safe_len:]
                  count+=safe.count(old)
                  out.write(safe.replace(old,new))
              count+=carry.count(old)
              out.write(carry.replace(old,new))
          if count!=1:
              tmp.unlink(missing_ok=True)
              raise SystemExit(f"expected one existing portrait component wrapper, found {count}; HTML unchanged")
          tmp.replace(p)
          print("PORTRAIT_DELTA_WRAPPER_NOW_CONDITIONAL")
          # The portrait sizing function and existing appended style both fit in this bounded EOF window.
          with p.open("r+b") as f:
              f.seek(0,2); size=f.tell(); start=max(0,size-256*1024)
              f.seek(start); tail=f.read(size-start)
              equation=b'const maxPortraitW = Math.max(0, w - choiceW - 2 * minColW);'
              if tail.count(equation)!=1:
                  raise SystemExit(f"expected one portrait-width sizing formula in bounded EOF, found {tail.count(equation)}")
              tail=tail.replace(equation,b'const maxPortraitW = Math.max(0, w - 2 * choiceW - minColW);',1)
              tail=re.sub(rb'<style id="wayward-landscape-menu-portrait-status-v1">.*?</style>\\s*',b'',tail,count=1,flags=re.S)
              tail=re.sub(rb'<style id="wayward-landscape-visual-fix-v2">.*?</style>\\s*',b'',tail,count=1,flags=re.S)
              at=tail.rfind(b"</body>")
              if at<0: raise SystemExit("bounded EOF does not contain </body>")
              patch=r"""
          <style id="wayward-landscape-visual-fix-v2">
          @media (orientation:landscape) {
            /* High-contrast icons: keep the existing controls, only make their glyphs visible. */
            .m34-header .m33-launchers button,
            .m34-header .m34-system-tools button,
            .m34-header .m34-system-tools .m33-theme-button,
            .m34-header .m34-system-tools .m34-header-control {
              background:#292524!important;
              color:#fff7ed!important;
              opacity:1!important;
              visibility:visible!important;
              filter:none!important;
              border:1px solid #e7e5e4!important;
              border-radius:4px!important;
              box-shadow:0 1px 3px rgba(0,0,0,.9)!important;
            }
            .m34-header .m33-launchers button > *,
            .m34-header .m34-system-tools button > *,
            .m34-header .m34-system-tools .m33-theme-button > * {
              display:inline-flex!important;
              align-items:center!important;
              justify-content:center!important;
              color:#fff7ed!important;
              opacity:1!important;
              visibility:visible!important;
              font-size:16px!important;
              line-height:1!important;
              filter:none!important;
            }
            .m34-header .m33-launchers button svg,
            .m34-header .m34-system-tools button svg,
            .m34-header .m34-system-tools .m33-theme-button svg,
            .m34-header .m34-system-tools .m34-header-control svg {
              display:block!important;
              visibility:visible!important;
              opacity:1!important;
              width:16px!important;height:16px!important;
              min-width:16px!important;min-height:16px!important;
              max-width:16px!important;max-height:16px!important;
              color:#fff7ed!important;
              filter:brightness(0) invert(1)!important;
            }
            .m34-header .m33-launchers button img,
            .m34-header .m34-system-tools button img {
              display:block!important;visibility:visible!important;opacity:1!important;
              width:16px!important;height:16px!important;object-fit:contain!important;
              filter:brightness(0) invert(1)!important;
            }
            .m34-header .m33-launchers button:focus-visible,
            .m34-header .m34-system-tools button:focus-visible {
              outline:2px solid #facc15!important;outline-offset:1px!important;
            }
            /* Keep the portrait panel dominant; the change summary only consumes its text height. */
            .mobile-main-panel>.shrink-0:first-child {
              display:flex!important;flex-direction:column!important;align-items:stretch!important;
              grid-row:1 / span 2!important;
              height:100%!important;min-height:0!important;max-height:none!important;
              overflow:hidden!important;
            }
            .mobile-main-panel>.shrink-0:first-child>.w-full {
              box-sizing:border-box!important;display:flex!important;flex:1 1 0!important;
              flex-direction:column!important;width:100%!important;height:auto!important;
              min-height:0!important;max-height:none!important;overflow:hidden!important;
            }
            .mobile-main-panel>.shrink-0:first-child>.w-full>.relative.overflow-hidden.bg-stone-800.cursor-pointer {
              box-sizing:border-box!important;display:flex!important;position:relative!important;
              flex:1 1 0!important;width:100%!important;height:auto!important;
              min-height:0!important;max-height:none!important;aspect-ratio:auto!important;
              align-items:stretch!important;justify-content:stretch!important;overflow:hidden!important;
            }
            .mobile-main-panel>.shrink-0:first-child .relative.overflow-hidden.bg-stone-800.cursor-pointer>.w-full.flex.items-center.justify-center.h-32 {
              box-sizing:border-box!important;display:flex!important;flex:1 1 0!important;
              width:100%!important;height:100%!important;min-height:0!important;max-height:none!important;
              align-items:stretch!important;justify-content:stretch!important;
            }
            .mobile-main-panel>.shrink-0:first-child .relative.overflow-hidden.bg-stone-800.cursor-pointer img {
              display:block!important;width:100%!important;height:100%!important;
              min-width:0!important;min-height:0!important;max-width:100%!important;max-height:100%!important;
              object-fit:cover!important;object-position:center center!important;
            }
            .mobile-main-panel>.shrink-0:first-child .border-t.border-stone-700[class~="bg-stone-800/80"] {
              display:none!important;
            }
            .mobile-main-panel>.shrink-0:first-child>.m36-landscape-last-action-delta {
              display:block!important;box-sizing:border-box!important;flex:0 0 auto!important;
              width:100%!important;min-width:0!important;height:auto!important;max-height:3.4em!important;
              margin:0!important;padding:1px 3px!important;overflow:hidden!important;
              border-top:1px solid rgba(168,162,158,.55)!important;
              background:rgba(28,25,23,.96)!important;color:#f5f5f4!important;
              font-size:9px!important;line-height:1.12!important;
            }
            .mobile-main-panel>.shrink-0:first-child>.m36-landscape-last-action-delta:empty {display:none!important;}
            .mobile-main-panel>.shrink-0:first-child>.m36-landscape-last-action-delta>div {
              box-sizing:border-box!important;max-height:3.1em!important;overflow:hidden!important;
              margin:0!important;padding:0!important;background:transparent!important;font-size:9px!important;
              line-height:1.12!important;
            }
            .mobile-main-panel>.shrink-0:first-child>.m36-landscape-last-action-delta .font-mono {
              font-size:9px!important;line-height:1.12!important;white-space:normal!important;
            }
            /* Make column 3 the same width as column 4. Column 2 absorbs the saved width. */
            .mobile-layout {
              grid-template-columns:
                var(--m36-landscape-portrait-w,clamp(72px,34vh,280px))
                minmax(var(--m36-landscape-min-col),1fr)
                var(--m36-landscape-choice-w)
                var(--m36-landscape-choice-w)!important;
              grid-template-rows:minmax(0,1fr) auto!important;
              align-items:stretch!important;
            }
            .mobile-main-panel>.flex-1.min-h-0.overflow-y-auto {
              grid-column:2!important;grid-row:1!important;
              min-width:0!important;min-height:0!important;overflow-x:hidden!important;overflow-y:auto!important;
            }
            /* Restore Story / Shop / character tabs beneath narration. */
            .mobile-main-panel>.m36-mobile-tabs {
              display:flex!important;position:relative!important;
              grid-column:2!important;grid-row:2!important;align-self:stretch!important;
              box-sizing:border-box!important;width:100%!important;min-width:0!important;min-height:29px!important;
              height:auto!important;margin:0!important;padding:2px 3px!important;
              gap:3px!important;overflow:hidden!important;
              border-top:1px solid #57534e!important;background:#1c1917!important;
              z-index:5!important;
            }
            .mobile-main-panel>.m36-mobile-tabs button {
              display:flex!important;flex:1 1 0!important;align-items:center!important;justify-content:center!important;
              min-width:0!important;min-height:24px!important;height:auto!important;margin:0!important;padding:3px 4px!important;
              font-size:10px!important;line-height:1.1!important;white-space:nowrap!important;overflow:hidden!important;
              text-overflow:ellipsis!important;
            }
            .mobile-action-panel {grid-column:3!important;grid-row:1 / span 2!important;min-width:0!important;}
            .mobile-action-panel .mobile-action-scroll {
              width:var(--m36-landscape-choice-w)!important;
              min-width:var(--m36-landscape-choice-w)!important;
              max-width:var(--m36-landscape-choice-w)!important;
            }
          }
          </style>
          """
              tail=tail[:at]+patch.encode("utf-8")+tail[at:]
              f.seek(start);f.write(tail);f.truncate(start+len(tail))
          print("VISUAL_LAYOUT_PATCH_APPLIED")
          PY
      - name: Test icons, columns, tabs and portrait fill in real browser
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/wayward-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const failures=[],pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function startGame(page,file){
            await page.goto('http://127.0.0.1:4173/'+file,{waitUntil:'domcontentloaded',timeout:60000});await pause(450);
            for(let i=0;i<28;i++){
              const body=await page.locator('body').innerText().catch(()=> '');
              if(body.includes('물자 채우기')&&body.includes('대출'))return;
              let clicked=false;
              const next=page.getByRole('button',{name:/^예$|이해하고 동의합니다|다음|계속|시작|확인|완료|진행|게임 시작|새 게임/});
              for(let k=0;k<await next.count();k++){try{const b=next.nth(k);if(await b.isVisible()&&await b.isEnabled()){await b.evaluate(e=>e.click());await pause(200);clicked=true;break}}catch{}}
              const elena=page.getByRole('button',{name:/^엘레나/});
              if(!clicked&&await elena.count()){try{await elena.first().evaluate(e=>e.click());await pause(200);clicked=true}catch{}}
              if(!clicked)break;
            }
            const body=await page.locator('body').innerText().catch(()=> '');
            if(!(body.includes('물자 채우기')&&body.includes('대출')))throw new Error('gameplay not reached: '+body.slice(0,180));
          }
          async function main(){
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:900,height:400},deviceScaleFactor:1});
            page.on('pageerror',e=>{console.log('PAGE_ERROR '+e.message);failures.push('pageerror:'+e.message)});
            await startGame(page,'Wayward_MOD_v3.36.html');
            let baselineThird=0,baselineNarration=0;
            for(const vp of [{width:800,height:400},{width:900,height:400},{width:1365,height:768}]){
              await page.setViewportSize(vp);await pause(200);
              const m=await page.evaluate(()=>{
                const q=s=>document.querySelector(s),rect=e=>{if(!e)return null;const b=e.getBoundingClientRect();return{x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),bottom:+b.bottom.toFixed(1),right:+b.right.toFixed(1)}};
                const layout=q('.mobile-layout'),track=getComputedStyle(layout).gridTemplateColumns.trim().split(/\s+/).map(parseFloat);
                const btns=[...document.querySelectorAll('.m34-header .m33-launchers button,.m34-header .m34-system-tools button')];
                const buttons=btns.map(b=>{const cs=getComputedStyle(b),icon=b.querySelector('svg,img,.m34-icon,i,[class*="icon"]'),is=icon?getComputedStyle(icon):null;return{aria:b.getAttribute('aria-label'),title:b.title,r:rect(b),inner:(b.innerHTML||'').slice(0,300),text:(b.textContent||'').trim(),bg:cs.backgroundColor,color:cs.color,icon:icon?{tag:icon.tagName,cls:(icon.className||'').toString(),r:rect(icon),display:is.display,visibility:is.visibility,opacity:is.opacity,color:is.color,fill:is.fill,stroke:is.stroke,filter:is.filter}:null}});
                const frame=q('.mobile-main-panel>.shrink-0:first-child'),image=q('.mobile-main-panel>.shrink-0:first-child>.w-full>.relative.overflow-hidden.bg-stone-800.cursor-pointer'),delta=q('.mobile-main-panel>.shrink-0:first-child>.m36-landscape-last-action-delta'),tabs=q('.mobile-main-panel>.m36-mobile-tabs'),narr=q('.mobile-main-panel>.flex-1.min-h-0.overflow-y-auto'),action=q('.mobile-action-panel'),choices=q('.mobile-action-panel .mobile-action-scroll');
                return{viewport:{w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth},layout:rect(layout),tracks,header:rect(q('.m34-header.m33-header-space')),frame:rect(frame),image:rect(image),delta:delta?{rect:rect(delta),text:(delta.innerText||'').slice(0,150),html:delta.innerHTML.slice(0,180)}:null,tabs:tabs?{rect:rect(tabs),display:getComputedStyle(tabs).display,text:(tabs.innerText||'').trim(),buttons:[...tabs.querySelectorAll('button')].map(b=>({text:(b.innerText||'').trim(),rect:rect(b),display:getComputedStyle(b).display}))}:null,narration:rect(narr),action:rect(action),choices:rect(choices),buttons};
              });
              console.log('LANDSCAPE_V2_RESULT '+vp.width+'x'+vp.height+' '+JSON.stringify(m));
              if(m.viewport.scrollWidth>vp.width)failures.push(vp.width+': horizontal page overflow');
              if(!m.header||m.header.h>21)failures.push(vp.width+': header not compact');
              if(m.tracks.length!==4)failures.push(vp.width+': grid does not have 4 tracks');
              if(m.tracks.length===4&&Math.abs(m.tracks[2]-m.tracks[3])>1.5)failures.push(vp.width+': column 3 and 4 widths differ');
              if(!m.tabs||m.tabs.display==='none'||m.tabs.buttons.length<3||m.tabs.rect.h<20)failures.push(vp.width+': story/shop/wife tabs are not visible');
              if(!m.narration||m.narration.w<=m.tracks[2])failures.push(vp.width+': narration did not expand relative to the narrow third column');
              if(!m.frame||!m.image||m.image.h<m.frame.h*.7)failures.push(vp.width+': portrait area does not fill its panel');
              if(m.delta&&m.delta.text.trim()===''&&m.delta.rect.h>1)failures.push(vp.width+': empty delta wrapper reserves vertical space');
              if(m.buttons.length<9)failures.push(vp.width+': not all 9 controls were found');
              for(const b of m.buttons){
                if(!b.r||b.r.x<0||b.r.right>29)failures.push(vp.width+': control outside left rail: '+b.aria);
                if(!b.bg||b.bg==='rgba(0, 0, 0, 0)'||b.color!=='rgb(255, 247, 237)')failures.push(vp.width+': control background/text lacks contrast: '+b.aria);
                if(b.icon&&(!b.icon.r||b.icon.r.w<5||b.icon.r.h<5||b.icon.display==='none'||b.icon.visibility!=='visible'||b.icon.opacity==='0'))failures.push(vp.width+': icon element is hidden: '+b.aria);
                if(!b.icon&&!b.text)failures.push(vp.width+': no visible glyph element or text: '+b.aria);
              }
              if(vp.width===900){
                const toggle=page.getByTitle(/전체화면|fullscreen/i).first();
                try{if(await toggle.count()){await toggle.click({timeout:1200});await pause(150);const cols=await page.evaluate(()=>getComputedStyle(document.querySelector('.mobile-layout')).gridTemplateColumns.trim().split(/\s+/).length);if(cols!==4)failures.push('fullscreen changes to '+cols+' columns');await page.evaluate(()=>document.fullscreenElement?document.exitFullscreen():Promise.resolve());await pause(150)}}catch(e){failures.push('fullscreen regression: '+e.message)}
              }
            }
            const a=await browser.newPage({viewport:{width:390,height:844}}),b=await browser.newPage({viewport:{width:390,height:844}});
            await startGame(a,'before.html');await startGame(b,'Wayward_MOD_v3.36.html');
            const measure=p=>p.evaluate(()=>{const out={sw:document.documentElement.scrollWidth};for(const s of ['.m34-header','.m34-header-stats','.m34-header-tools','.mobile-layout','.mobile-main-panel','.mobile-main-panel>.shrink-0:first-child','.mobile-action-panel']){const e=document.querySelector(s);if(e){const r=e.getBoundingClientRect();out[s]=[r.x,r.y,r.width,r.height].map(v=>+v.toFixed(2)).join(',')}}return out});
            const before=await measure(a),after=await measure(b);console.log('PORTRAIT_BASELINE '+JSON.stringify({before,after}));
            if(JSON.stringify(before)!==JSON.stringify(after))failures.push('portrait layout changed');
            await browser.close();
            if(failures.length){console.error('LANDSCAPE_V2_FAILURES '+JSON.stringify(failures));process.exit(1)}
            console.log('LANDSCAPE_V2_ALL_TESTS_PASSED');
          }
          main().catch(e=>{console.error('TEST_FAILURES '+JSON.stringify(failures));console.error(e);process.exit(1)});
          JS
      - name: Commit verified HTML only
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): restore visible icons tabs and compact portrait status"
          git push