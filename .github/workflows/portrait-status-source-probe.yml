name: Probe native portrait status output
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/portrait-status-source-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bounded native component references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          terms=("function rI","const rI","rI=({compact","m36-mobile-room-activity","lastAction","last_action","actionEffects","lastActionChanges","moodDelta","changeSummary","recentChanges","lastActionEffects","data-m331-action-status","기분 변화","초상화 아래 표시줄")
          for n,line in enumerate(p.open(encoding="utf-8",errors="replace"),1):
              lower=line.lower()
              for term in terms:
                  pos=lower.find(term.lower())
                  if pos<0:continue
                  snippet=line[max(0,pos-500):pos+1500]
                  print(f"CODE_HIT line={n} term={term} lineLen={len(line)} {snippet!r}")
          for lo,hi in ((2798,2810),(2318,2410)):
              print(f"SOURCE_RANGE {lo}-{hi}")
              lines=p.read_text(encoding="utf-8",errors="replace").splitlines()
              for n in range(lo,min(hi,len(lines))+1):
                  line=lines[n-1]
                  if len(line)>2500:
                      snippets=[]
                      for term in ("rI","m36-mobile-room-activity","M331ActionStatus","lastAction","actionEffects","moodDelta","기분 변화","초상화 아래 표시줄"):
                          pos=line.find(term)
                          if pos>=0:snippets.append(line[max(0,pos-200):pos+600])
                      line=(" | ... | ".join(snippets[:6]))[:3000]
                  print(f"LINE {n}: {line}")
          PY