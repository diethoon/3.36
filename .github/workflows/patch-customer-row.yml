name: Patch customer row
on:
  push:
    branches:
      - mobile-migration-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Patch
        run: python3 scripts/patch_customer_row.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, shutil
          p=Path("Wayward_MOD_v3.36.html")
          out=Path("/tmp/node"); shutil.rmtree(out,ignore_errors=True); out.mkdir()
          CH=65536; KEEP=2048; buf=b""; active=False; idx=0; h=None
          with p.open("rb") as f:
            while True:
              c=f.read(CH)
              if not c: break
              buf += c
              while True:
                if not active:
                  m=re.search(br"<script\\b[^>]*>",buf,re.I)
                  if not m:
                    if len(buf)>KEEP: buf=buf[-KEEP:]
                    break
                  buf=buf[m.end():]; idx += 1; h=(out/f"s{idx}.js").open("wb"); active=True
                else:
                  m=re.search(br"</script\\s*>",buf,re.I)
                  if not m:
                    if len(buf)>KEEP: h.write(buf[:-KEEP]); buf=buf[-KEEP:]
                    break
                  h.write(buf[:m.start()]); buf=buf[m.end():]; h.close(); h=None; active=False
          if active: raise SystemExit("UNTERMINATED")
          scripts=sorted(out.glob("*.js"))
          if not scripts: raise SystemExit("NO_SCRIPTS")
          for s in scripts:
            r=subprocess.run(["node","--check",str(s)],capture_output=True,text=True)
            if r.returncode: print(r.stderr); raise SystemExit(1)
          print("NODE_CHECK=PASS")
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          with p.open("rb") as f:
            f.seek(max(0,p.stat().st_size-512))
            tail=f.read(512)
          assert tail.endswith(b"END_WAYWARD_MOD_EXTENSION_GUIDE -->\n")
          print("EOF=PASS")
          PY
      - name: Commit and clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git rm -f scripts/patch_customer_row.py .github/workflows/patch-customer-row.yml
          git rm -f .patch-customer-row-trigger 2>/dev/null || true
          git commit -m "Fix mobile customer row and response display"
          git push origin HEAD:mobile-migration-v1