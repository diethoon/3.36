name: inspect-location-issue
on:
  pull_request:
    branches:
      - mobile-migration-v1
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>",s,re.S)
          script=next((x for x in scripts if "function AOe(" in x and "function M36MobileStoreStatus(" in x),None)
          if script is None: raise SystemExit("main JS not found")
          for needle in ["M36MobilePersistentStatus","M36MobileStoreStatus","function re(","const re=","let re=","var re=","const Me=","let Me=","var Me=","Me=","playerLoc=be(state)","playerLoc=re(d=>be(d.state))","return Hn(e,Me)","function Bt("]:
              print("\n=== "+needle+" ===")
              hits=[m.start() for m in re.finditer(re.escape(needle),script)]
              print("COUNT",len(hits))
              for k,i in enumerate(hits[:20]):
                  print(f"\n-- {k} @ {i} --\n"+script[max(0,i-1800):i+3200])
          PY
