name: One-off mobile UI fix host
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: mainrepo
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
          path: mobile
      - name: Bounded inspect mobile HTML
        shell: bash
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          out=Path("../mainrepo/mobile_ui_diagnostic.txt")
          needles=[
            b"function M36MobileStoreStatus(){",
            b"function M36MobileStockStatus(){",
            b"function M36MobileRoomCustomer({customer:e,interaction:t,wife:o}){",
            b"function M36MobileRoomActivity({room:targetRoom,canSee:targetCanSee}={}){",
            b"m36-mobile-tabs",
            "전체메뉴".encode(),
            "추문".encode(),
            "재고".encode(),
            "청결".encode(),
            "fullscreen".encode(),
            b"m36-mobile",
          ]
          CH=64*1024
          positions={n:[] for n in needles}
          size=0
          for needle in needles:
              carry=b""; base=0
              with p.open("rb") as f:
                  while True:
                      c=f.read(CH)
                      if not c: break
                      size += len(c) if needle is needles[0] else 0
                      d=carry+c
                      start=base-len(carry); at=0
                      while True:
                          i=d.find(needle,at)
                          if i<0: break
                          positions[needle].append(start+i)
                          at=i+1
                      carry=d[-(len(needle)-1):] if len(needle)>1 else b""
                      base += len(c)
          with out.open("w",encoding="utf-8") as w:
              w.write(f"FILE_BYTES={p.stat().st_size}\n")
              with p.open("rb") as f:
                  for needle, poss in positions.items():
                      w.write(f"\nNEEDLE={needle.decode('utf-8','replace')} HITS={len(poss)}\n")
                      for pos in poss[:5]:
                          lo=max(0,pos-2500); hi=min(p.stat().st_size,pos+7000)
                          f.seek(lo)
                          w.write(f"\n---OFFSET {pos}---\n")
                          w.write(f.read(hi-lo).decode("utf-8","replace"))
                          w.write("\n")
          print("DIAG_CREATED",out)
          PY
      - name: Save diagnostic report
        working-directory: mainrepo
        shell: bash
        run: |
          git add mobile_ui_diagnostic.txt
          git commit -m "temp: save mobile UI diagnostic"
          git push origin main
