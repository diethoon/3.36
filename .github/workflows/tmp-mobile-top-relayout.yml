name: tmp-mobile-top-relayout

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact mobile top relayout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          SRC=Path("Wayward_MOD_v3.36.html")
          TMP=SRC.with_suffix(".toprelayout.tmp")
          CHUNK=65536

          old_label='''function M36MobileStatusLabel(location){
            return ({
              taproom:"홀",
              back_room:"뒷방",
              upstairs_hall:"객실 1",
              upstairs_room_2:"객실 2",
              bedroom:"침실",
              elena_room:"침실",
              bathhouse:"목욕탕",
              bathroom:"욕실",
              kitchen:"주방"
            })[location]??location??"알 수 없음";
          }
          '''

          old_status='''function M36MobilePersistentStatus(){
            const state=re(x=>x.state),wife=g(state),playerLoc=be(state);
            const energy=Math.round(state.player?.stats?.energy??0);
            const wifeEnergy=Math.round(wife.stats?.energy??0),wifeMood=Math.round(wife.stats?.mood??0),wifeTrust=Math.round(wife.relationship?.trust??0);
            const wifeTask=jF(wife,state);
            return u.jsxs("div",{className:"m36-mobile-status",children:[
              u.jsxs("div",{className:"m36-mobile-status-row",children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:"현재 위치"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:M36MobileStatusLabel(playerLoc)})
              ]}),
              u.jsxs("div",{className:"m36-mobile-status-row",children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:"당신"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:state.phase==="prep"?"준비 중":"진행 중"}),
                u.jsxs("span",{className:"m36-mobile-status-meta",children:["기력 ",energy]})
              ]}),
              u.jsxs("div",{className:"m36-mobile-status-row",children:[
                u.jsx("span",{className:"m36-mobile-status-label",children:wife.name||"피파"}),
                u.jsx("span",{className:"m36-mobile-status-value",children:wifeTask}),
                u.jsxs("span",{className:"m36-mobile-status-meta",children:["기력 ",wifeEnergy," · 기분 ",wifeMood," · 신뢰 ",wifeTrust]})
              ]})
            ]});
          }
          '''

          old_left_gf='''r==="story"&&u.jsxs(u.Fragment,{children:[u.jsx(qF,{limit:3}),u.jsx("div",{className:"mb-2 pb-2 border-b border-stone-800",children:u.jsx(GF,{})}),T]})'''
          new_left_gf='''r==="story"&&u.jsxs(u.Fragment,{children:[u.jsx(qF,{limit:3}),T]})'''

          old_right_status='''children:[u.jsx(M36MobilePersistentStatus,{}),u.jsx(M36MobileStockStatus,{})]'''
          new_right_status='''children:[u.jsx(GF,{}),u.jsx(M36MobileStockStatus,{})]'''

          old_narration_root='''return u.jsx(koStoryRootRenderer30(r.logOrder)("div",{ref:a,className:"text-sm",children:['''
          new_narration_root='''return u.jsx(koStoryRootRenderer30(r.logOrder)("div",{ref:a,className:"text-sm mobile-narration",children:['''

          old_cleanup='''<style id="wayward-mobile-cleanup-v4">@media(max-width:1023px) and (orientation:portrait){.mobile-layout:has(>.mobile-action-panel:first-child){grid-template-columns:minmax(0,60%) minmax(0,40%) !important}.mobile-layout:has(>.mobile-action-panel:first-child)>.mobile-action-panel{grid-column:1 !important}.mobile-layout:has(>.mobile-action-panel:first-child)>.mobile-main-panel{grid-column:2 !important;border-left:1px solid rgba(120,113,108,.48) !important;border-right:0 !important}}@media(max-width:360px) and (orientation:portrait){.mobile-layout:has(>.mobile-action-panel:first-child){grid-template-columns:minmax(0,56%) minmax(0,44%) !important}}@media(max-width:1023px){.m36-mobile-nav-grid{display:none !important}.m36-mobile-current-activity-meta{display:none !important}.m36-mobile-prep-detail{display:none !important}}</style>'''
          new_cleanup='''<style id="wayward-mobile-cleanup-v5">
          @media(max-width:1023px) and (orientation:portrait){
            .mobile-layout{grid-template-columns:minmax(0,60%) minmax(0,40%) !important;}
            .mobile-layout>.mobile-main-panel{grid-column:1 !important;border-left:0 !important;border-right:1px solid rgba(120,113,108,.48) !important;}
            .mobile-layout>.mobile-action-panel{grid-column:2 !important;}
            .mobile-layout:has(>.mobile-action-panel:first-child){grid-template-columns:minmax(0,40%) minmax(0,60%) !important;}
            .mobile-layout:has(>.mobile-action-panel:first-child)>.mobile-action-panel{grid-column:1 !important;}
            .mobile-layout:has(>.mobile-action-panel:first-child)>.mobile-main-panel{grid-column:2 !important;border-left:1px solid rgba(120,113,108,.48) !important;border-right:0 !important;}
          }
          @media(max-width:1023px){
            .m36-mobile-prep-detail{display:none !important;}
            .m36-mobile-current-activity-meta{display:none !important;}
            .mobile-narration{margin-left:-.15rem !important;margin-right:-.15rem !important;}
            .mobile-narration .items-start{padding-left:.15rem !important;padding-right:0 !important;}
            .mobile-narration [class*="w-10"][class*="tabular-nums"]{width:2.4rem !important;margin-right:.1rem !important;}
          }
          </style>'''

          old_ui_status_css='''  .m36-mobile-status { flex:0 0 auto; padding:.2rem .25rem; border-bottom:1px solid rgba(68,64,60,.72); }
            .m36-mobile-status-row { display:flex; align-items:baseline; gap:.4rem; min-width:0; line-height:1.15; }
            .m36-mobile-status-label { flex:0 0 auto; color:rgb(168 162 158); font-size:.66rem; white-space:nowrap; }
            .m36-mobile-status-value { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgb(231 229 228); font-size:.66rem; }
            .m36-mobile-status-meta { margin-left:auto; color:rgb(120 113 108); font-size:.58rem; white-space:nowrap; }
            .m36-mobile-nav-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.3rem; margin-top:.45rem; }
            .m36-mobile-nav-button { min-height:32px; padding:.25rem .35rem; border:1px solid rgb(68 64 60); border-radius:.3rem; background:rgb(28 25 23); color:rgb(214 211 209); font-size:.68rem; text-align:left; }'''

          repl=[
            (old_label,""),
            (old_status,""),
            (old_left_gf,new_left_gf),
            (old_right_status,new_right_status),
            (old_narration_root,new_narration_root),
            (old_cleanup,new_cleanup),
            (old_ui_status_css,""),
          ]

          def count_stream(needle):
              nb=needle.encode(); carry=b""; count=0; k=max(0,len(nb)-1)
              with SRC.open("rb") as f:
                  while True:
                      b=f.read(CHUNK)
                      if not b: break
                      q=carry+b; count+=q.count(nb); carry=q[-k:] if k else b""
              return count

          for a,b in repl:
              if count_stream(a)!=1:
                  raise SystemExit("TARGET_COUNT_MISMATCH "+a[:90])

          if count_stream("wayward-mobile-cleanup-v5")!=0:
              raise SystemExit("NEW_CSS_ALREADY_PRESENT")

          maxlen=max(len(a.encode()) for a,b in repl)
          carry=b""
          with SRC.open("rb") as s,TMP.open("wb") as d:
              while True:
                  b=s.read(CHUNK)
                  if not b: break
                  q=carry+b
                  safe=max(0,len(q)-maxlen+1)
                  out=q[:safe];carry=q[safe:]
                  for a,z in repl:out=out.replace(a.encode(),z.encode())
                  d.write(out)
              out=carry
              for a,z in repl:out=out.replace(a.encode(),z.encode())
              d.write(out)
          TMP.replace(SRC)

          for n,want in [
              ("function M36MobileStatusLabel(",0),
              ("function M36MobilePersistentStatus(",0),
              ("u.jsx(M36MobilePersistentStatus,{})",0),
              ('children:[u.jsx(GF,{}),u.jsx(M36MobileStockStatus,{})]',1),
              ('r==="story"&&u.jsxs(u.Fragment,{children:[u.jsx(qF,{limit:3}),T]})',1),
              ("wayward-mobile-cleanup-v5",1),
              ("mobile-narration",1)
          ]:
              got=count_stream(n)
              if got!=want: raise SystemExit(f"POST {n} {got} != {want}")

          outdir=Path("/tmp/m36-inline");outdir.mkdir(exist_ok=True)
          for f in outdir.glob("*.js"):f.unlink()
          files=[];buf=b"";inside=False;cur=None;idx=0
          with SRC.open("rb") as f:
              while True:
                  b=f.read(CHUNK);eof=not b;buf+=b
                  while True:
                      if not inside:
                          a=buf.find(b"<script")
                          if a<0:
                              if eof:buf=b""
                              else:buf=buf[-8192:]
                              break
                          z=buf.find(b">",a+7)
                          if z<0:buf=buf[a:];break
                          idx+=1;cur=outdir/f"{idx}.js";cur.write_bytes(b"");files.append(cur);buf=buf[z+1:];inside=True
                      else:
                          a=buf.find(b"</script>")
                          if a<0:
                              if eof:cur.open("ab").write(buf);buf=b"";inside=False
                              else:
                                  k=len(b"</script>")-1
                                  if len(buf)>k:cur.open("ab").write(buf[:-k])
                                  buf=buf[-k:]
                              break
                          cur.open("ab").write(buf[:a]);buf=buf[a+9:];cur=None;inside=False
                  if eof:break
          for f in files:subprocess.run(["node","--check",str(f)],check=True)
          print("NODE_CHECK=PASS",len(files))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff --numstat
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): move full status block to top of action panel"
          git rm .github/workflows/tmp-mobile-top-relayout.yml
          git commit -m "chore: remove temporary mobile top relayout tooling"
          git push
