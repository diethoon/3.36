name: tmp-audit-mobile-current

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stream audit
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("Wayward_MOD_v3.36.html")
          needles = [
              "M36MobileStockStatus",
              "물자채우기",
              "오후 영업 준비",
              "대출",
              "이야기",
              "가게",
              "엘레나",
              "rI({compact:true",
              "M36MobileRoomActivity",
              "M36MobileStatusPanel",
          ]
          data = bytearray()
          chunk_size = 65536
          tail = b""
          hits = {n: [] for n in needles}

          with path.open("rb") as f:
              offset = 0
              while True:
                  chunk = f.read(chunk_size)
                  if not chunk:
                      break
                  buf = tail + chunk
                  base = offset - len(tail)
                  for n in needles:
                      b = n.encode("utf-8")
                      pos = 0
                      while True:
                          i = buf.find(b, pos)
                          if i < 0:
                              break
                          hits[n].append(base + i)
                          pos = i + max(1, len(b))
                  tail = buf[-4096:]
                  offset += len(chunk)

          print("FILE_BYTES", path.stat().st_size)
          for n in needles:
              print("\nNEEDLE", n, "COUNT", len(hits[n]))
              for off in hits[n][:8]:
                  print("OFFSET", off)
                  with path.open("rb") as f:
                      f.seek(max(0, off-1600))
                      c = f.read(3600)
                  print(c.decode("utf-8", "replace"))
                  print("\n---END CONTEXT---\n")

          # Locate likely component boundaries by ASCII function identifiers.
          for n in ["function M36MobileStockStatus", "function M36MobileCurrentActivity", "function M36MobileRoomActivity", "function M36MobileStatusPanel"]:
              b=n.encode()
              with path.open("rb") as f:
                  pos=0
                  found=[]
                  while True:
                      c=f.read(chunk_size)
                      if not c: break
                      buf=tail+c
                      base=pos-len(tail)
                      i=0
                      while True:
                          j=buf.find(b,i)
                          if j<0: break
                          found.append(base+j)
                          i=j+1
                      tail=buf[-4096:]
                      pos+=len(c)
                  print("FUNC", n, found[:20])

          PY

      - name: Self cleanup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-audit-mobile-current.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove temporary mobile audit workflow"
          git push origin HEAD:mobile-migration-v1
