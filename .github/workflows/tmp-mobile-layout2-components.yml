name: tmp-mobile-layout2-components
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Extract status components
        run: |
          python3 <<'PY'
          from pathlib import Path
          src=Path("Wayward_MOD_v3.36.html")
          out=Path(".github/tmp-mobile-layout2-components.txt")
          CHUNK=64*1024
          terms=["function lb(","function IF(","function M36MobileStatusPanel","function M36MobileRoomActivity"]
          def pos(term):
              b=term.encode();pos=0;carry=b""
              with src.open("rb") as f:
                  while True:
                      c=f.read(CHUNK)
                      if not c:return None
                      data=carry+c;base=pos-len(carry);i=data.find(b)
                      if i>=0:return base+i
                      pos+=len(c);carry=data[-32768:]
          def func(term):
              p=pos(term)
              with src.open("rb") as f:
                  f.seek(p);data=f.read(300000)
              s=data.find(b"{",data.find(b")"))
              depth=0;q=None;esc=False;line=False;block=False
              for i in range(s,len(data)):
                  x=data[i];y=data[i+1] if i+1<len(data) else None
                  if line:
                      if x==10:line=False
                      continue
                  if block:
                      if x==42 and y==47:block=False
                      continue
                  if q:
                      if esc:esc=False
                      elif x==92:esc=True
                      elif x==q:q=None
                      continue
                  if x in (39,34,96):q=x;continue
                  if x==47 and y==47:line=True;continue
                  if x==47 and y==42:block=True;continue
                  if x==123:depth+=1
                  elif x==125:
                      depth-=1
                      if depth==0:return data[:i+1].decode("utf-8","replace")
              return data.decode("utf-8","replace")
          parts=[f"FILE_BYTES={src.stat().st_size}"]
          for t in terms:parts += [f"\n## {t}\n",func(t),"\n---END---"]
          out.write_text("\n".join(parts),encoding="utf-8")
          PY
          git add .github/tmp-mobile-layout2-components.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: add temporary mobile status component context"
          git push origin mobile-migration-v1
