name: inspect-header-v2
on:
  push:
    branches: [fullscreen-v2]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stream scan only
        shell: python
        run: |
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          needles=[
            "function NPe", "const NPe", "NPe=(", "M33Launchers", "m34-header-control",
            "requestFullscreen", "fullscreenElement", "orientation", "landscape", "portrait", "children:\"☰\""
          ]
          carry=b""
          offset=0
          found=set()
          with p.open("rb") as f:
            while True:
              chunk=f.read(64*1024)
              if not chunk: break
              data=carry+chunk
              base=offset-len(carry)
              for n in needles:
                nb=n.encode()
                start=0
                while True:
                  i=data.find(nb,start)
                  if i<0: break
                  absolute=base+i
                  key=(n,absolute)
                  if key not in found:
                    found.add(key)
                    lo=max(0,i-700); hi=min(len(data),i+1500)
                    print(f"=== {n} OFFSET {absolute} ===")
                    print(data[lo:hi].decode("utf-8","replace"))
                  start=i+max(1,len(nb))
              carry=data[-2048:]
              offset += len(chunk)
          print("MATCHES",len(found))
