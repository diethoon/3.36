name: tmp-mobile-top-relayout-v2

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded mobile top relayout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          SRC=Path("Wayward_MOD_v3.36.html")
          TMP=SRC.with_suffix(".toprelayout2.tmp")

          old_left_gf='r==="story"&&u.jsxs(u.Fragment,{children:[u.jsx(qF,{limit:3}),u.jsx("div",{className:"mb-2 pb-2 border-b border-stone-800",children:u.jsx(GF,{})}),T]})'
          new_left_gf='r==="story"&&u.jsxs(u.Fragment,{children:[u.jsx(qF,{limit:3}),T]})'
          old_right='children:[u.jsx(M36MobilePersistentStatus,{}),u.jsx(M36MobileStockStatus,{})]'
          new_right='children:[u.jsx(GF,{}),u.jsx(M36MobileStockStatus,{})]'
          old_narr='return u.jsx(koStoryRootRenderer30(r.logOrder)("div",{ref:a,className:"text-sm",children:['
          new_narr='return u.jsx(koStoryRootRenderer30(r.logOrder)("div",{ref:a,className:"text-sm mobile-narration",children:['

          cleanup_marker='<style id="wayward-mobile-cleanup-v4">'
          new_cleanup='''<style id="wayward-mobile-cleanup-v5">
          @media(max-width:1023px) and (orientation:portrait){
            .mobile-layout{grid-template-columns:minmax(0,60%) minmax(0,40%) !important;}
            .mobile-layout>.mobile-main-panel{grid-column:1 !important;border-left:0 !important;border-right:1px solid rgba(120,113,108,.48) !important;}
            .mobile-layout>.mobile-action-panel{grid-column:2 !important;}
            .mobile-layout:has(>.mobile-action-panel:first-child){grid-template-columns:minmax(0,40%) minmax(0,60%) !important;}
            .mobile-layout:has(>.mobile-action-panel:first-child)>.mobile-action-panel{grid-column:1 !important;}
            .mobile-layout:has(>.mobile-action-panel:first-child)>.mobile-main-panel{grid-column:2 !important;border-left:1px solid rgba(120,113,108,.48) !important;border-right:0 !important;}
          }
          @media(max-width:1023px){
            .m36-mobile-prep-detail{display:none !important;}
            .m36-mobile-current-activity-meta{display:none !important;}
            .mobile-narration{margin-left:-.15rem !important;margin-right:-.15rem !important;}
            .mobile-narration .items-start{padding-left:.15rem !important;padding-right:0 !important;}
            .mobile-narration [class*="w-10"][class*="tabular-nums"]{width:2.4rem !important;margin-right:.1rem !important;}
          }
          </style>'''

          counts={"left_gf":0,"right":0,"narr":0,"cleanup":0,"status_fn":0,"label_fn":0,"status_call":0,"status_css":0}
          mode_label=False
          mode_status=False
          mode_css=False

          with SRC.open("r",encoding="utf-8",newline="") as src,TMP.open("w",encoding="utf-8",newline="") as dst:
              for line in src:
                  if mode_label:
                      if line.startswith("function M36MobilePersistentStatus("):
                          mode_label=False
                          mode_status=True
                      continue

                  if mode_status:
                      if line.startswith("function M36MobileCurrentActivity("):
                          mode_status=False
                          dst.write(line)
                      continue

                  if mode_css:
                      if ".m36-mobile-nav-button {" in line:
                          mode_css=False
                      continue

                  if "function M36MobileStatusLabel(" in line:
                      counts["label_fn"]+=1
                      mode_label=True
                      continue

                  if "function M36MobilePersistentStatus(" in line:
                      counts["status_fn"]+=1
                      mode_status=True
                      continue

                  if ".m36-mobile-status {" in line:
                      counts["status_css"]+=1
                      mode_css=True
                      continue

                  if old_left_gf in line:
                      counts["left_gf"]+=line.count(old_left_gf)
                      line=line.replace(old_left_gf,new_left_gf)

                  if old_right in line:
                      counts["right"]+=line.count(old_right)
                      line=line.replace(old_right,new_right)

                  if old_narr in line:
                      counts["narr"]+=line.count(old_narr)
                      line=line.replace(old_narr,new_narr)

                  if cleanup_marker in line:
                      counts["cleanup"]+=line.count(cleanup_marker)
                      line=new_cleanup.rstrip("\n")+"\n"

                  dst.write(line)

          TMP.replace(SRC)

          if counts["left_gf"]!=1: raise SystemExit(f"LEFT_GF={counts['left_gf']}")
          if counts["right"]!=1: raise SystemExit(f"RIGHT={counts['right']}")
          if counts["narr"]!=1: raise SystemExit(f"NARR={counts['narr']}")
          if counts["cleanup"]!=1: raise SystemExit(f"CLEANUP={counts['cleanup']}")
          if counts["status_fn"]!=1 or counts["label_fn"]!=1: raise SystemExit(f"STATUS_FUNCTION_COUNTS={counts}")
          if counts["status_css"]!=1: raise SystemExit(f"STATUS_CSS={counts['status_css']}")
          if mode_label or mode_status or mode_css: raise SystemExit(f"UNTERMINATED_REMOVE={counts}")

          # Bounded verification pass.
          text=SRC.read_text(encoding="utf-8")
          checks={
              "status_fn":text.count("function M36MobilePersistentStatus("),
              "label_fn":text.count("function M36MobileStatusLabel("),
              "status_call":text.count("u.jsx(M36MobilePersistentStatus,{})"),
              "gf":text.count("u.jsx(GF,{})"),
              "cleanup_v5":text.count("wayward-mobile-cleanup-v5"),
              "nav_dup_css":text.count(".m36-mobile-nav-grid"),
              "status_css":text.count(".m36-mobile-status")
          }
          print(checks)
          if checks["status_fn"]!=0 or checks["label_fn"]!=0 or checks["status_call"]!=0: raise SystemExit("OLD_STATUS_REMAINS")
          if checks["gf"]!=1 or checks["cleanup_v5"]!=1: raise SystemExit("GF_MOVE_OR_CSS_FAIL")
          if checks["nav_dup_css"]!=0 or checks["status_css"]!=0: raise SystemExit("DEAD_STATUS_CSS_REMAINS")

          # Inline JS syntax/EOF check in bounded 64KB chunks.
          out=Path("/tmp/m36js");out.mkdir(exist_ok=True)
          for f in out.glob("*.js"):f.unlink()
          files=[];buf=b"";inside=False;cur=None;idx=0
          with SRC.open("rb") as f:
              while True:
                  b=f.read(65536);eof=not b;buf+=b
                  while True:
                      if not inside:
                          a=buf.find(b"<script")
                          if a<0:
                              if eof:buf=b""
                              else:buf=buf[-8192:]
                              break
                          z=buf.find(b">",a+7)
                          if z<0:buf=buf[a:];break
                          idx+=1;cur=out/f"{idx}.js";cur.write_bytes(b"");files.append(cur);buf=buf[z+1:];inside=True
                      else:
                          a=buf.find(b"</script>")
                          if a<0:
                              if eof:cur.open("ab").write(buf);buf=b"";inside=False
                              else:
                                  k=len(b"</script>")-1
                                  if len(buf)>k:cur.open("ab").write(buf[:-k])
                                  buf=buf[-k:]
                              break
                          cur.open("ab").write(buf[:a]);buf=buf[a+9:];cur=None;inside=False
                  if eof:break
          for f in files:subprocess.run(["node","--check",str(f)],check=True)
          print("NODE_CHECK=PASS",len(files))
          PY

      - name: Validate commit cleanup
        shell: bash
        run: |
          git diff --check
          git diff --numstat
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): move full status block to top of action panel"
          git rm .github/workflows/tmp-mobile-top-relayout-v2.yml
          git rm .github/workflows/tmp-mobile-top-relayout.yml || true
          git commit -m "chore: remove temporary mobile relayout tooling"
          git push
