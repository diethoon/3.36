name: m36-mobile-tab-class-trace
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8",errors="ignore")
          for p in [r'className:"[^"]*m36-mobile[^"]*tab[^"]*"',r'className:`[^`]*m36-mobile[^`]*tab[^`]*`',r'm36-mobile-[A-Za-z0-9_-]*tab[A-Za-z0-9_-]*']:
            ms=list(re.finditer(p,s,re.I))
            print("\n###",p,"COUNT",len(ms))
            for m in ms[-30:]:
              i=m.start();print("@",i,"\n",s[max(0,i-1200):min(len(s),i+2600)])
          PY