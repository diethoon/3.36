name: apply-mobile-migration-v1

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply portrait layout migration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("Wayward_MOD_v3.36.html")
          data = path.read_bytes()

          replacements = [
              (
                  b'className:"lg:hidden flex-1 flex min-h-0"',
                  b'className:"mobile-layout lg:hidden flex-1 min-h-0"'
              ),
              (
                  b'className:`w-[37%] max-w-[13rem] desk:w-[16rem] desk:max-w-none shrink-0 flex flex-col min-h-0 ${n?"pl-[env(safe-area-inset-left)]":"pr-[env(safe-area-inset-right)]"}`',
                  b'className:`mobile-action-panel w-[37%] max-w-[13rem] desk:w-[16rem] desk:max-w-none shrink-0 flex flex-col min-h-0 ${n?"pl-[env(safe-area-inset-left)]":"pr-[env(safe-area-inset-right)]"}`'
              ),
              (
                  b'className:"flex-1 min-h-0 overflow-y-auto py-1 text-[0.72rem]"',
                  b'className:"mobile-action-scroll flex-1 min-h-0 overflow-y-auto py-1 text-[0.72rem]"'
              ),
              (
                  b'className:`flex-1 min-w-0 flex flex-col min-h-0 ${n?"border-l border-stone-700":"border-r border-stone-700"}`',
                  b'className:`mobile-main-panel flex-1 min-w-0 flex flex-col min-h-0 ${n?"border-l border-stone-700":"border-r border-stone-700"}`'
              ),
              (
                  b'<meta name="viewport" content="width=device-width, initial-scale=0.8, maximum-scale=5.0, viewport-fit=cover" />',
                  b'<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />'
              )
          ]

          for old, new in replacements:
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_GUARD_FAILED target count={count}: {old[:120]!r}")
              data = data.replace(old, new, 1)

          css_marker = b'wayward-mobile-migration-v1'
          if css_marker in data:
              raise SystemExit("PATCH_GUARD_FAILED marker already present")

          css = b"""<style id="wayward-mobile-migration-v1">
/* Studio mobile portrait layout migrated onto the v3.36 UI owners. */
@media (max-width:1023px) and (orientation:portrait) {
  .mobile-layout {
    display:grid !important;
    grid-template-columns:minmax(0,40%) minmax(0,60%) !important;
    grid-template-rows:minmax(0,1fr);
    flex-direction:initial !important;
  }
  .mobile-main-panel {
    grid-column:1 !important;
    grid-row:1 !important;
    width:100% !important;
    min-width:0 !important;
    min-height:0 !important;
    border-left:0 !important;
    border-right:1px solid rgba(120,113,108,.48) !important;
    overflow:hidden !important;
  }
  .mobile-action-panel {
    grid-column:2 !important;
    grid-row:1 !important;
    width:100% !important;
    max-width:none !important;
    min-width:0 !important;
    min-height:0 !important;
    flex:initial !important;
    overflow:hidden !important;
    border-top:0 !important;
    border-left:0 !important;
    border-right:0 !important;
    padding-left:max(.35rem,env(safe-area-inset-left)) !important;
    padding-right:max(.35rem,env(safe-area-inset-right)) !important;
    padding-bottom:max(.3rem,env(safe-area-inset-bottom)) !important;
  }
  .mobile-main-panel > .shrink-0 {
    flex:0 0 auto;
    min-height:0;
  }
  .mobile-main-panel > .flex-1 {
    min-height:0;
    overflow-y:auto;
  }
  .mobile-action-scroll {
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
  }
}
@media (max-width:360px) and (orientation:portrait) {
  .mobile-layout {
    grid-template-columns:minmax(0,44%) minmax(0,56%) !important;
  }
}
@media (min-width:361px) and (max-width:1023px) and (orientation:portrait) {
  .mobile-layout {
    grid-template-columns:minmax(0,40%) minmax(0,60%) !important;
  }
}
@media (max-width:1023px) and (orientation:landscape) {
  .mobile-layout {
    display:flex !important;
    flex-direction:row !important;
  }
  .mobile-main-panel {
    flex:1 1 auto !important;
    min-width:0 !important;
    min-height:0 !important;
  }
  .mobile-action-panel {
    flex:0 0 min(37%,17rem) !important;
    width:min(37%,17rem) !important;
    max-width:17rem !important;
    min-width:min(12rem,37vw) !important;
    min-height:0 !important;
    overflow:hidden !important;
  }
  .mobile-action-scroll {
    overflow-y:auto !important;
    overflow-x:hidden !important;
  }
}
@media (max-width:1023px) {
  .mobile-main-panel > .shrink-0 {
    padding:.15rem .2rem 0 !important;
  }
  .mobile-main-panel > .flex-1 {
    padding:.05rem .2rem .2rem !important;
  }
  .mobile-action-scroll {
    padding-top:0 !important;
    padding-bottom:0 !important;
  }
}
</style>
"""
          end_head = b"</head>"
          if data.count(end_head) != 1:
              raise SystemExit("PATCH_GUARD_FAILED </head> count mismatch")
          data = data.replace(end_head, css + end_head, 1)

          path.write_bytes(data)
          print(f"PATCHED_BYTES={path.stat().st_size}")
          print(f"DELTA_BYTES={len(data)-len(Path('Wayward_MOD_v3.36.html').read_bytes())}")
      - name: Syntax and diff validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("Wayward_MOD_v3.36.html")
          data=p.read_bytes()
          print("MOBILE_MARKER_COUNT", data.count(b"wayward-mobile-migration-v1"))
          print("VIEWPORT_INITIAL_SCALE_1", data.count(b'initial-scale=1.0'))
          print("MOBILE_LAYOUT_CLASS_COUNT", data.count(b'className:"mobile-layout'))
          print("MOBILE_MAIN_CLASS_COUNT", data.count(b'className:`mobile-main-panel'))
          print("MOBILE_ACTION_CLASS_COUNT", data.count(b'className:`mobile-action-panel'))
          print("MOBILE_SCROLL_CLASS_COUNT", data.count(b'className:"mobile-action-scroll'))
          scripts=re.findall(br"<script[^>]*>(.*?)</script>",data,re.S)
          print("INLINE_SCRIPTS",len(scripts))
          out=Path("/tmp/wayward-inline")
          out.mkdir(exist_ok=True)
          for i,s in enumerate(scripts,1):
              f=out/f"{i}.js"
              f.write_bytes(s)
          PY
          count=$(find /tmp/wayward-inline -name '*.js' | wc -l)
          test "$count" -ge 1
          for f in /tmp/wayward-inline/*.js; do node --check "$f"; done
          git diff --check
          git diff --numstat
      - name: Commit migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Wayward_MOD_v3.36.html
          git commit -m "feat(mobile): migrate studio portrait layout to v3.36"
          git push
