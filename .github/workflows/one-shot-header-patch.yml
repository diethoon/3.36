name: one-shot header patch
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run header patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Streaming patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("Wayward_MOD_v3.36.html"); tmp=p.with_suffix(".html.tmp")
          start=b"/* responsive theme vs rem native toolbar overlap. */"
          end=b"/* Accessible native file input overlays a consistently sized label. */"
          css=b'''/* Header controls: responsive to available width and independent of app fontScale. */
.m34-header.m33-header-space{display:flex;align-items:center;flex-wrap:nowrap;padding-right:max(8px,env(safe-area-inset-right))!important;gap:6px}
.m34-header-stats{flex:1 1 auto;min-width:0;overflow-x:auto}
.m34-header-tools{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;padding:6px 0;max-width:100%;flex-wrap:nowrap}
.m34-header-tools>.text-xs{font-size:12px;line-height:16px;gap:6px}
.m34-header-tools>.text-xs>button{padding:4px 8px;font-size:12px;line-height:16px;gap:6px}
.m34-system-tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.m34-header .m33-launchers{width:auto;order:0;padding:0;gap:6px;flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:flex-end;flex-wrap:nowrap;overflow:hidden}
.m34-header .m33-launchers button{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:0 1 auto;min-width:0;height:36px;padding:5px 9px;font-size:clamp(10px,2.7vw,12px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m34-header .m33-launchers small{margin-left:0;font-size:10px;line-height:1}
.m34-header .m33-theme-holder{position:static;display:block;align-self:auto;margin:0;flex:none}
.m34-header .m33-theme-button,.m34-header-control{width:36px;height:36px;flex:0 0 36px;border:1px solid var(--wm-bg600);border-radius:7px;background:var(--wm-bg800);color:var(--wm-text200);display:grid;place-items:center}
.m34-header-control{font-size:20px;line-height:1}
.m34-header-control:hover{border-color:var(--wm-accent);color:var(--wm-accent)}
.m34-header-control:disabled{opacity:.3;cursor:default}
.m34-icon{flex:none;display:block}
.m34-header :is(button):focus-visible{outline:2px solid var(--wm-accent);outline-offset:2px}
@media(max-width:1150px){.m34-header.m33-header-space{flex-wrap:wrap;gap:0 6px}.m34-header-stats{flex-basis:100%}.m34-header-tools{margin-left:auto;flex:1 1 100%;padding:4px 0}}
@media(max-width:560px){.m34-header-tools{gap:4px}.m34-header-tools>.text-xs{font-size:11px;line-height:14px;gap:4px}.m34-header-tools>.text-xs>button{padding:3px 6px;font-size:11px;line-height:14px;gap:4px}.m34-header .m33-launchers{gap:4px}.m34-header .m33-launchers button{height:32px;padding:4px 6px;font-size:clamp(10px,2.8vw,11px);gap:3px}.m34-header .m33-theme-button,.m34-header-control{width:32px;height:32px;flex-basis:32px}}
@media(max-width:400px){.m34-header-tools{gap:3px}.m34-system-tools{gap:3px}.m34-header .m33-launchers{gap:3px}.m34-header .m33-launchers button{font-size:0;padding:4px;gap:0}.m34-header .m33-launchers button .m34-icon{width:14px!important;height:14px!important}.m34-header .m33-launchers button small{font-size:9px}}
'''
          carry=b"";done=False
          with p.open("rb") as f,tmp.open("wb") as o:
              while 1:
                  c=f.read(1024*1024)
                  if not c: break
                  carry+=c
                  if not done:
                      i=carry.find(start)
                      if i<0:
                          k=len(start)-1
                          if len(carry)>k:o.write(carry[:-k]);carry=carry[-k:]
                          continue
                      j=carry.find(end,i)
                      while j<0:
                          m=f.read(1024*1024)
                          if not m: raise SystemExit("end marker missing")
                          carry+=m;j=carry.find(end,i)
                      o.write(carry[:i]);o.write(css);o.write(end);carry=carry[j+len(end):];done=True
                  else:o.write(carry);carry=b""
              o.write(carry)
          if not done: raise SystemExit("start marker missing")
          os.replace(tmp,p)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git rm .github/workflows/one-shot-header-patch.yml
          git commit -m "fix(mobile): clean responsive header sizing [skip ci]"
          git push origin HEAD:mobile-migration-v1