name: execute m36 guest patch

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Execute targeted guest patch
        run: |
          if [ ! -f .m36_guest_patch.py ]; then
            echo "PATCH_SCRIPT_NOT_PRESENT"
            exit 0
          fi
          python3 .m36_guest_patch.py
      - name: Remove temporary workflow
        run: |
          git fetch origin mobile-migration-v1
          git reset --hard origin/mobile-migration-v1
          if [ -f .github/workflows/execute_m36_guest_patch.yml ]; then
            git rm .github/workflows/execute_m36_guest_patch.yml
            git config user.name "vercel-build"
            git config user.email "vercel-build@users.noreply.github.com"
            git commit -m "cleanup: remove temporary guest patch workflow"
            git push origin HEAD:mobile-migration-v1
          else
            echo "WORKFLOW_ALREADY_REMOVED"
          fi
