name: One-off move original shop overview to right top
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/final-move-original-shop-overview.yml"
permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Move original shop overview in bounded chunks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil

          p = Path("Wayward_MOD_v3.36.html")
          CH = 65536

          def count_stream(needle: bytes) -> int:
              total = 0
              carry = b""
              with p.open("rb") as f:
                  while True:
                      c = f.read(CH)
                      if not c:
                          break
                      d = carry + c
                      total += d.count(needle)
                      carry = d[-(len(needle)-1):] if len(needle) > 1 else b""
              return total

          def replace_once(old: bytes, new: bytes, label: str):
              before = count_stream(old)
              print(label, "MATCHES_BEFORE", before)
              if before != 1:
                  raise SystemExit(f"EXPECTED_ONE_MATCH_FAIL {label}: {before}")

              tmp = p.with_suffix(".patch.tmp")
              carry = b""
              replaced = 0
              with p.open("rb") as src, tmp.open("wb") as dst:
                  while True:
                      c = src.read(CH)
                      if not c:
                          break
                      d = carry + c
                      safe = max(0, len(d) - (len(old) - 1))
                      part, carry = d[:safe], d[safe:]
                      n = part.count(old)
                      if n:
                          replaced += n
                          part = part.replace(old, new)
                      dst.write(part)

                  n = carry.count(old)
                  if n:
                      replaced += n
                      carry = carry.replace(old, new)
                  dst.write(carry)

              if replaced != 1:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f"REPLACEMENT_COUNT_FAIL {label}: {replaced}")
              shutil.move(tmp, p)
              print(label, "REPLACED", replaced)

          def remove_span(start_marker: bytes, end_marker: bytes, label: str, preserve_end: bool = False):
              before = count_stream(start_marker)
              print(label, "START_MATCHES_BEFORE", before)
              if before != 1:
                  raise SystemExit(f"EXPECTED_ONE_START_FAIL {label}: {before}")

              tmp = p.with_suffix(".patch.tmp")
              prefix = b""
              skipping = False
              found_end = 0

              with p.open("rb") as src, tmp.open("wb") as dst:
                  while True:
                      c = src.read(CH)
                      if not c:
                          break
                      buf = prefix + c

                      if not skipping:
                          i = buf.find(start_marker)
                          if i < 0:
                              keep = len(start_marker) - 1
                              if len(buf) > keep:
                                  dst.write(buf[:-keep])
                                  prefix = buf[-keep:]
                              else:
                                  prefix = buf
                              continue

                          dst.write(buf[:i])
                          buf = buf[i + len(start_marker):]
                          skipping = True

                      j = buf.find(end_marker)
                      if j < 0:
                          keep = len(end_marker) - 1
                          prefix = buf[-keep:] if len(buf) > keep else buf
                          continue

                      if preserve_end:
                          dst.write(end_marker)
                      buf = buf[j + len(end_marker):]
                      dst.write(buf)
                      prefix = b""
                      found_end += 1
                      skipping = False
                      if found_end == 1:
                          break

                  if found_end == 1:
                      while True:
                          c = src.read(CH)
                          if not c:
                              break
                          dst.write(c)
                  else:
                      tmp.unlink(missing_ok=True)
                      raise SystemExit(f"END_MARKER_MISSING {label}")

              shutil.move(tmp, p)
              print(label, "REMOVED", found_end)

          # Remove original xOe from the left-side '가게 안' panel.
          replace_once(
              b'u.jsx("div",{className:"shrink-0",children:u.jsx(xOe,{})}),',
              b"",
              "REMOVE_LEFT_SHOP_OVERVIEW",
          )

          # Put the original xOe panel at the top of the right action panel.
          replace_once(
              b'children:[u.jsx(M36MobileStoreStatus,{}),u.jsx(M36MobileStockStatus,{})',
              b'children:[u.jsx(xOe,{}),u.jsx(M36MobileStockStatus,{})',
              "RIGHT_TOP_USE_ORIGINAL_SHOP_OVERVIEW",
          )

          # Remove the temporary replacement component and its CSS.
          remove_span(
              b"function M36MobileStoreStatus(){",
              b"function M36MobileRoomActivity(",
              "REMOVE_TEMP_STORE_STATUS_FUNCTION",
              preserve_end=True,
          )

          remove_span(
              b'<style id="wayward-mobile-store-status-v1">',
              b"</style>",
              "REMOVE_TEMP_STORE_STATUS_CSS",
              preserve_end=False,
          )

          checks = {
              b'u.jsx(xOe,{})': 1,
              b'children:[u.jsx(xOe,{}),u.jsx(M36MobileStockStatus,{})': 1,
              b'M36MobileStoreStatus': 0,
              b'wayward-mobile-store-status-v1': 0,
              b'u.jsx("div",{className:"shrink-0",children:u.jsx(xOe,{})}),': 0,
              b'function M36MobileRoomActivity(': 1,
          }
          for needle, expected in checks.items():
              got = count_stream(needle)
              print("CHECK", needle, "GOT", got, "EXPECTED", expected)
              if got != expected:
                  raise SystemExit("CHECK_FAIL")

          size = 0
          tail = b""
          with p.open("rb") as f:
              while True:
                  c = f.read(CH)
                  if not c:
                      break
                  size += len(c)
                  tail = (tail + c)[-256:]
          print("HTML_BYTES", size)
          print("EOF_TAIL", repr(tail))
          if size < 19000000:
              raise SystemExit("SIZE_CHECK_FAIL")
          PY

      - name: Extract script blocks and node-check
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path("Wayward_MOD_v3.36.html")
          out = Path("/tmp/nodecheck")
          out.mkdir(exist_ok=True)
          CH = 65536
          KEEP = 2048
          buf = b""
          active = False
          idx = 0
          h = None

          with p.open("rb") as f:
              while True:
                  c = f.read(CH)
                  if not c:
                      break
                  buf += c
                  while True:
                      if not active:
                          m = re.search(br'<script\b[^>]*>', buf, re.I)
                          if not m:
                              if len(buf) > KEEP:
                                  buf = buf[-KEEP:]
                              break
                          buf = buf[m.end():]
                          idx += 1
                          h = (out / f"s{idx}.js").open("wb")
                          active = True
                      else:
                          m = re.search(br'</script\s*>', buf, re.I)
                          if not m:
                              if len(buf) > KEEP:
                                  h.write(buf[:-KEEP])
                                  buf = buf[-KEEP:]
                              break
                          h.write(buf[:m.start()])
                          buf = buf[m.end():]
                          h.close()
                          h = None
                          active = False

          if active:
              raise SystemExit("UNTERMINATED_SCRIPT_BLOCK")

          scripts = sorted(out.glob("*.js"))
          if not scripts:
              raise SystemExit("NO_SCRIPT_BLOCKS")

          for s in scripts:
              r = subprocess.run(["node", "--check", str(s)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit("NODE_CHECK_FAIL " + s.name)

          print("NODE_CHECK=PASS", len(scripts))
          PY
          git diff --check

      - name: Remove diagnostic workflows and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm             .github/workflows/final-move-original-shop-overview.yml             .github/workflows/one-off-remove-duplicate-left.yml             .github/workflows/diagnose-status-render.yml             .github/workflows/diagnose-persistent-status.yml             .github/workflows/locate-original-shop-status.yml             .github/workflows/locate-room-overview-call.yml
          git add Wayward_MOD_v3.36.html
          git commit -m "Move original shop overview to right panel top"
          git push origin HEAD:mobile-migration-v1
