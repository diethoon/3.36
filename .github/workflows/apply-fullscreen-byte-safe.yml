name: apply-fullscreen-byte-safe
on:
  push:
    branches: [fullscreen-button-clean]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Byte-safe fullscreen patch
        shell: python
        run: |
          from pathlib import Path
          p = Path("Wayward_MOD_v3.36.html")
          b = p.read_bytes()
          old = 'u.jsx("button",{onClick:()=>t(!0),title:"메뉴 (Esc)","aria-label":"메뉴 열기",className:"m34-header-control",children:"☰"})'.encode()
          new = 'u.jsx("button",{onClick:()=>{const e=document.documentElement,t=document.fullscreenElement||document.webkitFullscreenElement;if(t){const o=document.exitFullscreen||document.webkitExitFullscreen;o&&o.call(document)}else{const o=e.requestFullscreen||e.webkitRequestFullscreen;o&&o.call(e)}},title:"전체 화면","aria-label":"전체 화면",className:"m34-header-control",children:"⛶"}),u.jsx("button",{onClick:()=>t(!0),title:"메뉴 (Esc)","aria-label":"메뉴 열기",className:"m34-header-control",children:"☰"})'.encode()
          if b.count(old) != 1:
              raise SystemExit(f"ABORT: target count={b.count(old)}")
          out = b.replace(old, new, 1)
          p.write_bytes(out)
          print("ORIGINAL_BYTES", len(b))
          print("FINAL_BYTES", len(out))
          print("BYTE_DELTA", len(out)-len(b))
          print("OLD_COUNT_AFTER", out.count(old))
          print("NEW_COUNT_AFTER", out.count(new))
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path("Wayward_MOD_v3.36.html")
          b=p.read_bytes()
          new='u.jsx("button",{onClick:()=>{const e=document.documentElement,t=document.fullscreenElement||document.webkitFullscreenElement;if(t){const o=document.exitFullscreen||document.webkitExitFullscreen;o&&o.call(document)}else{const o=e.requestFullscreen||e.webkitRequestFullscreen;o&&o.call(e)}},title:"전체 화면","aria-label":"전체 화면",className:"m34-header-control",children:"⛶"}),u.jsx("button",{onClick:()=>t(!0),title:"메뉴 (Esc)","aria-label":"메뉴 열기",className:"m34-header-control",children:"☰"})'.encode()
          if b.count(new) != 1: raise SystemExit("FAIL: new fragment count")
          s=b.decode("utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",s,re.I|re.S)
          checked=0
          for idx,js in enumerate(scripts):
              if not js.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8",delete=False) as f:
                  f.write(js); name=f.name
              r=subprocess.run(["node","--check",name],capture_output=True,text=True)
              Path(name).unlink(missing_ok=True)
              checked+=1
              if r.returncode:
                  print(r.stderr[-4000:]); raise SystemExit(f"FAIL script {idx}")
          print("SCRIPT_BLOCKS_FOUND",len(scripts))
          print("SCRIPT_BLOCKS_CHECKED",checked)
          print("VALID",True)
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-fullscreen-byte-safe.yml
          git add Wayward_MOD_v3.36.html .github/workflows
          git commit -m "feat: add fullscreen button before menu"
          git push origin HEAD:fullscreen-button-clean
# trigger
