name: m36-movement-handler-definitions
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Extract handler definitions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          for name in ["Wce","Bce","Hce","ZL","kxe","Bt","j"]:
              ms=[m.start() for m in re.finditer(rf"function {name}\b",s)]
              print(f"\n===== FUNCTION {name} COUNT {len(ms)} =====")
              for p in ms[-5:]:
                  a=max(0,p-300);b=min(len(s),p+5000)
                  print(f"--- POS {p} ---")
                  print(s[a:b].replace("\n"," ")[:5200])
          PY