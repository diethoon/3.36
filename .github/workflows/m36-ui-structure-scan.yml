name: One-shot mobile UI structure scan
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-ui-structure-scan.yml
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect precise byte windows only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/m36-ui-structure-report.txt
          from pathlib import Path
          import subprocess

          p=Path("Wayward_MOD_v3.36.html")
          needles=[
            b"mobile-action-scroll",
            b"m36-mobile-choice-fixed",
            b"m36-mobile-dialogue-fixed",
            b"function bindCategories()",
            b"m36-mobile-next-ui-v1",
            b"font-size:.74rem!importa",
            b"</style><script",
          ]
          offsets={n:[] for n in needles}
          size=p.stat().st_size
          print("FILE_BYTES",size)
          print("SOURCE_HEAD",subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip())
          overlap=max(map(len,needles))-1
          carry=b""
          base=0
          with p.open("rb") as f:
            while True:
              chunk=f.read(65536)
              if not chunk: break
              data=carry+chunk
              data_base=base-len(carry)
              for n in needles:
                pos=0
                while True:
                  i=data.find(n,pos)
                  if i<0: break
                  off=data_base+i
                  if off>=0 and off not in offsets[n] and (not offsets[n] or off>offsets[n][-1]):
                    offsets[n].append(off)
                  pos=i+1
              carry=data[-overlap:]
              base+=len(chunk)
          for n,ofs in offsets.items():
            print("\\nNEEDLE",n.decode("ascii"),"COUNT",len(ofs),"OFFSETS",ofs[:20])
            chosen=ofs if len(ofs)<=6 else ofs[:3]+ofs[-3:]
            for off in chosen:
              with p.open("rb") as f:
                f.seek(max(0,off-400))
                raw=f.read(1100)
              print("WINDOW",off,raw.decode("utf-8","replace").replace("\\n"," ")[:1100])
          # Inspect only a narrow tail window where the malformed block appears.
          with p.open("rb") as f:
            f.seek(19582000)
            tail=f.read(6000)
          print("\\nTAIL_WINDOW_START",19582000,"SIZE",len(tail))
          text=tail.decode("utf-8","replace")
          for key in ["m36-mobile-next-ui-v1","!importa","</style>","<script","</script>","m36-category-arrow","WAYWARD_MOD_PARENT_3_26_MAP"]:
            i=text.find(key)
            print("TAIL_TOKEN",key,"INDEX",i, "NEAR",text[max(0,i-180):i+420] if i>=0 else "NOT_FOUND")
          print("STRUCTURE_SCAN=PASS")
          PY
      - name: Remove temporary UI structure scanner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m36-ui-structure-scan.yml
          git add -u .github/workflows/m36-ui-structure-scan.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove temporary UI structure scanner"
            git push origin HEAD:mobile-migration-v1
          fi
