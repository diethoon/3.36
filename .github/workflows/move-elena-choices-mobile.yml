name: Move original Elena choices under mobile status
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/move-elena-choices-mobile.yml"
permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Insert original choice renderer under mobile status
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil

          p = Path("Wayward_MOD_v3.36.html")
          CH = 65536

          old = b'children:[u.jsx(M36MobileStoreStatus,{}),u.jsx(M36MobileStockStatus,{})'
          new = b'children:[u.jsx(M36MobileStoreStatus,{}),b&&!b.playerEngaged&&et(e)===vt(e)&&u.jsx(uOe,{customerName:b.customerName,crowdNames:w,wifeName:d.name,stage:b.stage,primarySlot:b.primarySlot,goldEarned:b.goldEarned??0,dispatch:t}),u.jsx(M36MobileStockStatus,{})'

          def count_stream(needle):
              total = 0
              carry = b""
              with p.open("rb") as f:
                  while True:
                      c = f.read(CH)
                      if not c:
                          break
                      d = carry + c
                      total += d.count(needle)
                      keep = len(needle) - 1
                      carry = d[-keep:] if keep else b""
              return total

          before = count_stream(old)
          print("RIGHT_PANEL_ANCHOR_BEFORE", before)
          if before != 1:
              raise SystemExit("RIGHT_PANEL_ANCHOR_EXPECTED_ONCE")

          needle = b'b&&!b.playerEngaged&&et(e)===vt(e)&&u.jsx(uOe,{customerName:b.customerName,crowdNames:w,wifeName:d.name,stage:b.stage,primarySlot:b.primarySlot,goldEarned:b.goldEarned??0,dispatch:t}),'
          if count_stream(needle):
              raise SystemExit("CHOICE_ALREADY_PRESENT")

          tmp = p.with_suffix(".patch.tmp")
          carry = b""
          replaced = 0

          with p.open("rb") as src, tmp.open("wb") as dst:
              while True:
                  c = src.read(CH)
                  if not c:
                      break
                  data = carry + c
                  safe = len(data) - (len(old) - 1)
                  if safe < 0:
                      safe = 0
                  part, carry = data[:safe], data[safe:]
                  n = part.count(old)
                  if n:
                      replaced += n
                      part = part.replace(old, new)
                  dst.write(part)

              n = carry.count(old)
              if n:
                  replaced += n
                  carry = carry.replace(old, new)
              dst.write(carry)

          if replaced != 1:
              tmp.unlink(missing_ok=True)
              raise SystemExit(f"REPLACEMENT_COUNT_FAIL:{replaced}")

          shutil.move(tmp, p)

          checks = {
              old: 0,
              new: 1,
              needle: 1,
              b'function M36MobileStoreStatus(){': 1,
              b'function uOe({customerName:e,crowdNames:t,wifeName:o,stage:n,primarySlot:s,goldEarned:r,dispatch:a})': 1,
          }

          for n, expected in checks.items():
              got = count_stream(n)
              print("CHECK", n, got, "EXPECTED", expected)
              if got != expected:
                  raise SystemExit("MARKER_CHECK_FAIL")

          size = 0
          tail = b""
          with p.open("rb") as f:
              while True:
                  c = f.read(CH)
                  if not c:
                      break
                  size += len(c)
                  tail = (tail + c)[-512:]

          print("HTML_BYTES", size)
          print("EOF_TAIL", repr(tail))
          if size < 19000000:
              raise SystemExit("SIZE_CHECK_FAIL")
          PY

      - name: Extract script blocks and node-check
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path("Wayward_MOD_v3.36.html")
          out = Path("/tmp/nodecheck")
          out.mkdir(exist_ok=True)
          CH = 65536
          KEEP = 2048
          buf = b""
          active = False
          idx = 0
          h = None

          with p.open("rb") as f:
              while True:
                  c = f.read(CH)
                  if not c:
                      break
                  buf += c
                  while True:
                      if not active:
                          m = re.search(br'<script\b[^>]*>', buf, re.I)
                          if not m:
                              if len(buf) > KEEP:
                                  buf = buf[-KEEP:]
                              break
                          buf = buf[m.end():]
                          idx += 1
                          h = (out / f"s{idx}.js").open("wb")
                          active = True
                      else:
                          m = re.search(br'</script\s*>', buf, re.I)
                          if not m:
                              if len(buf) > KEEP:
                                  h.write(buf[:-KEEP])
                                  buf = buf[-KEEP:]
                              break
                          h.write(buf[:m.start()])
                          buf = buf[m.end():]
                          h.close()
                          h = None
                          active = False

          if active:
              raise SystemExit("UNTERMINATED_SCRIPT_BLOCK")

          scripts = sorted(out.glob("*.js"))
          if not scripts:
              raise SystemExit("NO_SCRIPT_BLOCKS")

          for s in scripts:
              r = subprocess.run(["node", "--check", str(s)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit("NODE_CHECK_FAIL " + s.name)

          print("NODE_CHECK=PASS", len(scripts))
          PY
          git diff --check

      - name: Clean diagnostics and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f             .github/workflows/diagnose-elena-choices.yml             .github/workflows/diagnose-elena-coe.yml             .github/workflows/move-elena-choices-mobile.yml
          git add Wayward_MOD_v3.36.html
          git commit -m "Move original Elena choices under mobile status"
          git push origin HEAD:mobile-migration-v1
