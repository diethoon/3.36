name: Publish GitHub Pages CloudSave Auth Helper

on:
  push:
    branches:
      - main
    paths:
      - 'cloud-save-auth-static/**'
      - '.github/workflows/deploy-cloud-save-auth-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble helper at expected project URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/cloud-save-auth-static
          cp -R cloud-save-auth-static/. public/cloud-save-auth-static/
          touch public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
