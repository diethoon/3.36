name: Deploy CloudSave GitHub Pages Auth Helper

on:
  push:
    branches:
      - main
    paths:
      - 'cloud-save-auth-static/**'
      - '.github/workflows/deploy-cloud-save-auth-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/cloud-save-auth-static
          cp -R cloud-save-auth-static/. public/cloud-save-auth-static/
          touch public/.nojekyll
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Wayward CloudSave Auth</title>
          <body>
            <p>Wayward 클라우드세이브 인증 페이지: <a href="./cloud-save-auth-static/">인증 페이지 열기</a></p>
          </body>
          </html>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
