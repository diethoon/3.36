name: M36 landscape icon rail runtime check
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/m36-landscape-icon-rail-verify-20261016.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Check live landscape icon rail
        id: browser_check
        continue-on-error: true
        run: |
          cat > /tmp/icon-check.cjs <<'NODE'
          const fs=require('fs');
          const http=require('http');
          const cp=require('child_process');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const file='Wayward_MOD_v3.36.html';
          const report={head:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),boot:[],views:[],errors:[],verdict:'FAIL'};
          const server=http.createServer((req,res)=>{
            if(String(req.url||'').split('?')[0]!=='/Wayward_MOD_v3.36.html'){res.writeHead(404);res.end();return;}
            res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-store'});
            fs.createReadStream(file).pipe(res);
          });
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function click(page,re){
            const b=page.getByRole('button',{name:re}).first();
            if(!await b.count().catch(()=>0)||!await b.isVisible().catch(()=>false))return false;
            await b.evaluate(e=>e.click());await pause(400);return true;
          }
          async function boot(page){
            const actions=[];
            for(let n=0;n<70;n++){
              const ready=await page.evaluate(()=>!!(document.querySelector('.mobile-layout')&&document.querySelector('.mobile-action-panel')&&document.querySelector('.mobile-action-scroll'))).catch(()=>false);
              if(ready){report.boot.push({ok:true,actions});return;}
              if(await click(page,/^예$/)){actions.push('age');continue;}
              if(await click(page,/이해하고 동의합니다/)){actions.push('consent');continue;}
              if(await click(page,/계속하기/)){actions.push('continue');continue;}
              if(actions.includes('wife')&&await click(page,/엘레나/)){actions.push('Elena');continue;}
              if(!actions.includes('wife')&&await click(page,/아내/)){actions.push('wife');continue;}
              if(await click(page,/엘레나/)){actions.push('Elena');continue;}
              if(await click(page,/^새 게임$/)){actions.push('new game');continue;}
              if(await click(page,/건너뛰기/)){actions.push('skip prologue');continue;}
              if(await click(page,/^다음$/)){actions.push('next prologue');continue;}
              await pause(200);
            }
            throw new Error('Game did not boot; actions='+JSON.stringify(actions)+'; tail='+(await page.locator('body').innerText().catch(()=>'' )).slice(-900));
          }
          async function inspect(page,label){
            const m=await page.evaluate(label=>{
              const rect=e=>{if(!e)return null;const b=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:+b.x.toFixed(2),y:+b.y.toFixed(2),right:+b.right.toFixed(2),bottom:+b.bottom.toFixed(2),width:+b.width.toFixed(2),height:+b.height.toFixed(2),display:s.display,opacity:s.opacity,direction:s.flexDirection,color:s.color,background:s.backgroundColor};};
              const controls=root=>root?[...root.querySelectorAll('button,[role="button"]')].filter(e=>{const b=e.getBoundingClientRect();return b.width>0&&b.height>0;}).map(e=>{
                const s=getComputedStyle(e),v=e.querySelector('svg'),fg=v?getComputedStyle(v).color:s.color,bg=s.backgroundColor;
                function lum(c){const a=c.match(/rgba?\(([^)]+)\)/);if(!a)return null;const q=a[1].split(',').slice(0,3).map(Number).map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*q[0]+.7152*q[1]+.0722*q[2];}
                const a=lum(fg),b=lum(bg),contrast=a==null||b==null?null:+((Math.max(a,b)+.05)/(Math.min(a,b)+.05)).toFixed(2),r=e.getBoundingClientRect();
                return {label:(e.getAttribute('aria-label')||e.title||e.innerText||e.textContent||'').trim().slice(0,65),
                  rect:{x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2),opacity:s.opacity},
                  color:fg,background:bg,contrast};
              }):[];
              const launch=document.querySelector('.m34-header .m33-launchers'),tools=document.querySelector('.m34-header .m34-system-tools');
              const lb=controls(launch),tb=controls(tools),all=[...lb,...tb],overlaps=[];
              for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i].rect,b=all[j].rect;if(a.x<b.right&&a.right>b.x&&a.y<b.bottom&&a.bottom>b.y)overlaps.push([all[i].label,all[j].label]);}
              return {label,viewport:{width:innerWidth,height:innerHeight,clientWidth:document.documentElement.clientWidth,docWidth:document.documentElement.scrollWidth,fullscreen:!!document.fullscreenElement},
                launchers:rect(launch),launcherCount:lb.length,launcherItems:lb,systemTools:rect(tools),systemCount:tb.length,systemItems:tb,overlaps};
            },label);
            report.views.push(m);return m;
          }
          async function main(){
            let browser;
            try{
              await new Promise((ok,no)=>server.listen(4173,'127.0.0.1',ok).once('error',no));
              browser=await chromium.launch({headless:true,args:['--no-sandbox']});
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
              page.on('pageerror',e=>report.errors.push(String(e)));
              await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});
              await boot(page);
              for(const v of [{w:1280,h:720},{w:915,h:412},{w:720,h:360}]){
                await page.setViewportSize({width:v.w,height:v.h});await pause(500);
                const m=await inspect(page,v.w+'x'+v.h);
                if(!m.launchers||m.launchers.direction!=='column'||m.launcherCount<3)throw new Error(m.label+': launcher rail not vertical or missing');
                if(!m.systemTools||m.systemTools.direction!=='column'||m.systemCount<4)throw new Error(m.label+': system tool rail not vertical or missing');
                for(const it of [...m.launcherItems,...m.systemItems]){
                  if(it.rect.x < -1 || it.rect.right>29.5)throw new Error(m.label+': control outside left rail '+JSON.stringify(it));
                  if(it.rect.width<16||it.rect.height<16)throw new Error(m.label+': icon too small '+JSON.stringify(it));
                  if(Number(it.rect.opacity)<.95)throw new Error(m.label+': low opacity '+JSON.stringify(it));
                  if(it.contrast!==null&&it.contrast<3)throw new Error(m.label+': contrast below 3 '+JSON.stringify(it));
                }
                if(m.overlaps.length)throw new Error(m.label+': overlapping controls '+JSON.stringify(m.overlaps));
                if(m.viewport.docWidth>m.viewport.clientWidth+1)throw new Error(m.label+': horizontal overflow');
              }
              const full=page.getByRole('button',{name:/전체화면/}).first();
              if(await full.count().catch(()=>0)&&await full.isVisible().catch(()=>false)){
                await full.click({timeout:2000}).catch(()=>{});await pause(500);
                if(await page.evaluate(()=>!!document.fullscreenElement)){
                  const m=await inspect(page,'fullscreen');
                  if(!m.launchers||m.launchers.direction!=='column'||m.launcherCount<3||!m.systemTools||m.systemTools.direction!=='column'||m.systemCount<4)throw new Error('fullscreen icon rail layout failed');
                  for(const it of [...m.launcherItems,...m.systemItems])if(it.rect.x < -1||it.rect.right>29.5||Number(it.rect.opacity)<.95||(it.contrast!==null&&it.contrast<3))throw new Error('fullscreen rail visibility failed '+JSON.stringify(it));
                  if(m.overlaps.length)throw new Error('fullscreen controls overlap');
                  report.fullscreen=true;
                }else report.fullscreen=false;
              }else report.fullscreen=false;
              if(report.errors.length)throw new Error('browser errors: '+report.errors.join(' | '));
              report.verdict='PASS';
            }catch(e){report.failures=[String(e&&e.stack||e).slice(0,4000)];}
            finally{if(browser)await browser.close().catch(()=>{});await new Promise(r=>server.close(r)).catch(()=>{});}
            fs.writeFileSync('/tmp/m36-icon-report.json',JSON.stringify(report,null,2));
            fs.writeFileSync('/tmp/m36-icon-report.md','# M36 Landscape Icon Rail Verification — 2026-10-16\n\nResult: **'+report.verdict+'**\n\nJSON evidence:\n'+JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report));
            if(report.verdict!=='PASS')process.exitCode=1;
          }
          main().catch(e=>{console.error(e&&e.stack||e);process.exitCode=1;});
          NODE
          node /tmp/icon-check.cjs
      - name: Commit report and remove one-shot workflow
        if: always()
        run: |
          set -euo pipefail
          mkdir -p idea
          if [ -f /tmp/m36-icon-report.md ]; then cp /tmp/m36-icon-report.md idea/M36_LANDSCAPE_ICON_RAIL_VERIFY_20261016.md
          else printf '%s\n' '# M36 Landscape Icon Rail Verification — 2026-10-16' '' 'Result: **FAIL**' 'No report generated.' > idea/M36_LANDSCAPE_ICON_RAIL_VERIFY_20261016.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/m36-landscape-icon-rail-verify-20261016.yml
          git add idea/M36_LANDSCAPE_ICON_RAIL_VERIFY_20261016.md
          if [ -f /tmp/m36-icon-report.json ] && grep -q '"verdict": "PASS"' /tmp/m36-icon-report.json; then
            git commit -m "test(mobile): pass landscape icon rail contrast verification"
          else
            git commit -m "test(mobile): record landscape icon rail verification"
          fi
          git push origin HEAD:mobile-migration-v1
      - name: Require icon rail runtime pass
        if: always()
        run: test -f /tmp/m36-icon-report.json && grep -q '"verdict": "PASS"' /tmp/m36-icon-report.json
