name: One-shot HTML boundary audit
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-html-boundary-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Scan tag boundaries by offsets without whole-file reads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/m36-html-boundary-report.txt
          from pathlib import Path
          import re, subprocess
          p=Path("Wayward_MOD_v3.36.html")
          pats={
            "STYLE_OPEN":re.compile(rb"<style(?:\\s|>)",re.I),
            "STYLE_CLOSE":re.compile(rb"</style\\s*>",re.I),
            "SCRIPT_OPEN":re.compile(rb"<script(?:\\s|>)",re.I),
            "SCRIPT_CLOSE":re.compile(rb"</script\\s*>",re.I),
            "CHOICE_STYLE_OPEN":re.compile(rb"<style id=[\"']wayward-mobile-choice-fixed-v1[\"']>",re.I),
            "NEXT_STYLE_OPEN":re.compile(rb"<style id=[\"']m36-mobile-next-ui-v1[\"']>",re.I),
          }
          found={k:[] for k in pats}
          buf=b""; base=0; carry=bytearray()
          with p.open("rb") as f:
            while True:
              c=f.read(65536)
              if not c: break
              data=bytes(carry)+c
              db=base-len(carry)
              for k,pat in pats.items():
                for m in pat.finditer(data):
                  off=db+m.start()
                  if off>=0 and (not found[k] or off>found[k][-1]):
                    found[k].append(off)
              keep=max(len(x.pattern) for x in pats.values())+4
              carry=bytearray(data[-keep:])
              base+=len(c)
          print("FILE_BYTES",p.stat().st_size)
          print("HEAD",subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip())
          for k,ofs in found.items():
            print("BOUNDARY",k,"COUNT",len(ofs),"LAST",ofs[-18:])
          # Inspect only small windows around the last relevant boundary occurrences.
          relevant=sorted(set(found["NEXT_STYLE_OPEN"][-1:]+found["STYLE_CLOSE"][-4:]+found["SCRIPT_OPEN"][-4:]+found["SCRIPT_CLOSE"][-4:]+found["CHOICE_STYLE_OPEN"][-1:]))
          for off in relevant:
            with p.open("rb") as f:
              f.seek(max(0,off-180))
              raw=f.read(520)
            print("CTX",off,raw.decode("utf-8","replace").replace("\\n"," ")[:520])
          print("BOUNDARY_AUDIT=PASS")
          PY
      - name: Remove temporary boundary audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m36-html-boundary-audit.yml
          git add -u .github/workflows/m36-html-boundary-audit.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove temporary HTML boundary audit"
            git push origin HEAD:mobile-migration-v1
          fi
