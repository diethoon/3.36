name: M36 landscape action pane and sidebar diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/temporary-m36-gauge-runner.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Browser diagnostic of red action column and blue icon rail
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 >/tmp/m36-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:900,height:400},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html?m36-diag=action-pane',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const diag=await page.evaluate(()=>{
              const summary=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {
                tag:e.tagName,cls:String(e.className||'').slice(0,140),text:(e.innerText||e.textContent||'').trim().slice(0,110),
                x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),
                position:s.position,display:s.display,overflowX:s.overflowX,overflowY:s.overflowY,
                touchAction:s.touchAction,pointerEvents:s.pointerEvents,zIndex:s.zIndex,opacity:s.opacity,color:s.color,
                background:s.backgroundColor,clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,scrollTop:e.scrollTop
              }};
              const panel=document.querySelector('.mobile-action-panel');
              const info=document.querySelector('.m36-landscape-info-scroll');
              const choices=panel?.querySelector(':scope > div.flex-1.min-h-0.flex.flex-col');
              const scroller=choices?.querySelector(':scope > .mobile-action-scroll') || panel?.querySelector('.mobile-action-scroll');
              const touch=(e)=>{if(!e)return null;const r=e.getBoundingClientRect();const x=Math.min(innerWidth-2,Math.max(1,Math.round(r.left+Math.min(r.width*.5,25))));const y=Math.min(innerHeight-2,Math.max(1,Math.round(r.top+Math.min(r.height*.6,r.height-12))));const hit=document.elementFromPoint(x,y);return {x,y,hitTag:hit?.tagName,hitClass:String(hit?.className||'').slice(0,100),insideScroller:!!hit?.closest('.mobile-action-scroll'),insideInfo:!!hit?.closest('.m36-landscape-info-scroll')};};
              const leftElements=[...document.querySelectorAll('button,[role="button"],a,svg')].map(e=>{
                const r=e.getBoundingClientRect(),s=getComputedStyle(e);
                if(r.width<=0||r.height<=0||r.left>70||r.top<20||r.top>innerHeight) return null;
                const p=e.parentElement, ps=p?getComputedStyle(p):null,pr=p?.getBoundingClientRect();
                return {el:summary(e),parent:p?{tag:p.tagName,cls:String(p.className||'').slice(0,100),x:Math.round(pr.x),y:Math.round(pr.y),w:Math.round(pr.width),h:Math.round(pr.height),color:ps.color,background:ps.backgroundColor,opacity:ps.opacity}:null,html:e.outerHTML.slice(0,240)};
              }).filter(Boolean).slice(0,50);
              return {viewport:{w:innerWidth,h:innerHeight},panel:summary(panel),info:summary(info),choices:summary(choices),scroller:summary(scroller),hit:touch(scroller),leftElements};
            });
            console.log('M36_RED_ACTION_PANE_DIAG='+JSON.stringify(diag));
            console.log('M36_BROWSER_ERRORS='+JSON.stringify(errors));
            if(!diag.scroller) throw new Error('Could not locate .mobile-action-scroll in the actual running page');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE