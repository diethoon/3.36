name: M36 landscape action pane scroll and sidebar forensic
on:
  push:
    branches: [main]
    paths: [".github/workflows/temporary-m36-gauge-runner.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Test real touch scroll in red pane and inspect sidebar ancestors
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 >/tmp/m36-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright'),wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:820,height:360},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const response=await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html?m36-diag=touch',{waitUntil:'domcontentloaded',timeout:90000});
            if(response?.status()!==200)throw new Error('HTML did not return 200');
            await page.waitForFunction(()=>document.body&&document.body.innerText.trim().length>10,null,{timeout:60000}).catch(()=>{});
            for(let i=0;i<45;i++){
              const body=await page.locator('body').innerText().catch(()=> '');
              if(body.includes('물자 채우기')&&body.includes('대출'))break;
              const next=page.getByRole('button',{name:/^예$|이해하고 동의합니다|다음|계속|시작|확인|완료|진행|게임 시작|새 게임/});
              let clicked=false;
              for(let j=0;j<await next.count();j++){try{const b=next.nth(j);if(await b.isVisible()&&await b.isEnabled()){await b.evaluate(e=>e.click());await wait(180);clicked=true;break;}}catch{}}
              const body2=await page.locator('body').innerText().catch(()=> '');
              if(!clicked&&body2.includes('그녀는 당신에게 어떤 존재인가요')){
                const w=page.getByRole('button',{name:/^아내$/});if(await w.count()&&await w.first().isVisible()){await w.first().evaluate(e=>e.click());await wait(220);clicked=true;}
                const woman=page.getByRole('button',{name:/^(엘레나|마라|피파)/});if(await woman.count()&&await woman.first().isVisible()){await woman.first().evaluate(e=>e.click());await wait(250);clicked=true;}
              }
              if(!clicked){const woman=page.getByRole('button',{name:/^(엘레나|마라|피파)/});if(await woman.count()&&await woman.first().isVisible()&&await woman.first().isEnabled()){await woman.first().evaluate(e=>e.click());await wait(250);clicked=true;}}
              if(!clicked)await wait(250);
            }
            await wait(500);
            const target=page.locator('.mobile-action-panel .mobile-action-scroll').first();
            if(!await target.count())throw new Error('Actual choices scroller missing');
            const before=await target.evaluate(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,scrollTop:e.scrollTop,overflowY:s.overflowY,touchAction:s.touchAction,position:s.position,pointerEvents:s.pointerEvents};});
            const box=await target.boundingBox(),x=Math.round(box.x+Math.min(box.width/2,35)),y=Math.round(box.y+Math.min(box.height*.70,box.height-15));
            const hit=await page.evaluate(({x,y})=>{const e=document.elementFromPoint(x,y);return {x,y,tag:e?.tagName,cls:String(e?.className||'').slice(0,120),inside:!!e?.closest('.mobile-action-scroll'),text:(e?.textContent||'').trim().slice(0,60)}},{x,y});
            const cdp=await context.newCDPSession(page);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y:y-80}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y:y-170}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await wait(450);
            const afterTouch=await target.evaluate(e=>({scrollTop:e.scrollTop,scrollHeight:e.scrollHeight,clientHeight:e.clientHeight}));
            await page.mouse.move(x,y);await page.mouse.wheel(0,260);await wait(250);
            const afterWheel=await target.evaluate(e=>({scrollTop:e.scrollTop,scrollHeight:e.scrollHeight,clientHeight:e.clientHeight}));
            const sidebar=await page.evaluate(()=>{
              const out=[];const nodes=[...document.querySelectorAll('.m33-launchers button,.m34-system-tools button,.m33-theme-button')];
              for(const e of nodes){const r=e.getBoundingClientRect();if(r.width<=0||r.left>70)continue;const chain=[];let p=e;
                while(p&&chain.length<7){const s=getComputedStyle(p),rr=p.getBoundingClientRect();chain.push({tag:p.tagName,cls:String(p.className||'').slice(0,90),x:Math.round(rr.x),y:Math.round(rr.y),opacity:s.opacity,filter:s.filter,brightness:s.filter,visibility:s.visibility,color:s.color,background:s.backgroundColor,transform:s.transform,mixBlendMode:s.mixBlendMode,position:s.position});p=p.parentElement;}
                const svg=e.querySelector('svg');const ss=svg?getComputedStyle(svg):null;
                out.push({aria:e.getAttribute('aria-label'),title:e.title,text:(e.innerText||'').trim(),chain,svg:svg?{color:ss.color,stroke:ss.stroke,fill:ss.fill,opacity:ss.opacity,filter:ss.filter,html:svg.outerHTML.slice(0,140)}:null});
              }return out;
            });
            console.log('M36_ACTION_TOUCH_TEST='+JSON.stringify({viewport:await page.evaluate(()=>({w:innerWidth,h:innerHeight})),before,hit,afterTouch,afterWheel,sidebar,errors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE