name: forensic gauge check
on:
  push:
    branches:
      - mobile-migration-v1
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          needles=["M331ActionStatus","playerPleasure","elenaMoaning","m36-mobile-dialogue-fixed","mobile-action-scroll"]
          out=[]
          for n in needles:
              poss=[m.start() for m in re.finditer(re.escape(n),s)]
              out.append(f"### {n} count={len(poss)}")
              for p in poss[:8]:
                  out.append(f"OFFSET {p}\n{s[max(0,p-1600):p+2200]}")
          Path("__gauge_report.txt").write_text("\n\n".join(out),encoding="utf-8")
          print("REPORT READY")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __gauge_report.txt
          git commit -m "chore: temporary gauge forensic report"
          git push
