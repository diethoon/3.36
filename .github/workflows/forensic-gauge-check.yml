name: forensic gauge check
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          needle="".join(map(chr,[112,108,97,121,101,114,80,108,101,97,115,117,114,101]))
          p=s.find(needle)
          out=s[max(0,p-7000):p+3000]
          Path("__gauge_source.txt").write_text("offset="+str(p)+"\n"+out,encoding="utf-8")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __gauge_source.txt
          git commit -m "chore: temporary gauge source report"
          git push
