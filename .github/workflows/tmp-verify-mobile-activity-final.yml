name: tmp-verify-mobile-activity-final

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mobile activity and syntax
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          SRC=Path("Wayward_MOD_v3.36.html")
          CHUNK=65536
          needles=[
            ("status_panel",b"function M36MobileStatusPanel(){"),
            ("room_activity",b"function M36MobileRoomActivity(){"),
            ("activity_call",b"u.jsx(M36MobileRoomActivity,{})"),
            ("old_activity_call",b"u.jsx(M36MobileCurrentActivity,{})"),
            ("right_new",b"u.jsx(M36MobileStatusPanel,{}),u.jsx(M36MobileStockStatus,{})"),
            ("gf_mobile",b"u.jsx(GF,{})"),
            ("portrait_surface",b'surface:"portrait"'),
          ]
          hits={k:[] for k,_ in needles}
          carry=b"";offset=0
          mx=max(len(n) for _,n in needles)
          with SRC.open("rb") as f:
            while True:
              b=f.read(CHUNK)
              if not b:break
              q=carry+b;base=offset-len(carry)
              for k,n in needles:
                p=0
                while True:
                  i=q.find(n,p)
                  if i<0:break
                  hits[k].append(base+i);p=i+1
              carry=q[-(mx-1):];offset+=len(b)

          print("FILE_BYTES",SRC.stat().st_size)
          for k,_ in needles:
            print(k,"COUNT",len(hits[k]),"LOC",hits[k][:12])

          def ctx(pos,r=2500):
            with SRC.open("rb") as f:
              f.seek(max(0,pos-r))
              return f.read(r*2).decode("utf-8","replace")
          for k in ["status_panel","room_activity","activity_call","right_new"]:
            for pos in hits[k][:1]:
              print(f"--- {k} CONTEXT {pos} ---")
              print(ctx(pos))
              print(f"--- END {k} ---")

          # Extract inline JS scripts in bounded 64KiB streaming mode.
          out=Path("/tmp/m36-inline");out.mkdir(exist_ok=True)
          for f in out.glob("*.js"):f.unlink()
          files=[];buf=b"";inside=False;cur=None;idx=0
          with SRC.open("rb") as f:
            while True:
              b=f.read(CHUNK);eof=not b;buf+=b
              while True:
                if not inside:
                  a=buf.find(b"<script")
                  if a<0:
                    if eof:buf=b""
                    else:buf=buf[-8192:]
                    break
                  z=buf.find(b">",a+7)
                  if z<0:buf=buf[a:];break
                  idx+=1;cur=out/f"{idx}.js";cur.write_bytes(b"");files.append(cur);buf=buf[z+1:];inside=True
                else:
                  a=buf.find(b"</script>")
                  if a<0:
                    if eof:
                      cur.open("ab").write(buf);buf=b"";inside=False
                    else:
                      k=len(b"</script>")-1
                      if len(buf)>k:cur.open("ab").write(buf[:-k])
                      buf=buf[-k:]
                    break
                  cur.open("ab").write(buf[:a]);buf=buf[a+9:];cur=None;inside=False
              if eof:break
          if inside or buf:raise SystemExit("SCRIPT_EOF_FAIL")
          for f in files:
            subprocess.run(["node","--check",str(f)],check=True)
          print("NODE_CHECK=PASS",len(files))
          PY
      - name: Remove temporary verification workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-verify-mobile-activity-final.yml
          git commit -m "chore: remove temporary mobile activity final verification"
          git push
