name: apply-fullscreen-v2
on:
  push:
    branches: [fullscreen-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stream locate and patch
        shell: python
        run: |
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          b=p.read_bytes()
          old='u.jsx("button",{onClick:()=>t(!0),title:"메뉴 (Esc)","aria-label":"메뉴 열기",className:"m34-header-control",children:"☰"})'.encode()
          new='u.jsx("button",{onClick:async()=>{const e=document.documentElement,t=document.fullscreenElement||document.webkitFullscreenElement;if(t){const o=document.exitFullscreen||document.webkitExitFullscreen;o&&await o.call(document);try{screen.orientation?.unlock?.()}catch{}}else{const o=e.requestFullscreen||e.webkitRequestFullscreen;if(o)try{await o.call(e);const t=screen.orientation?.type,n=t&&t.startsWith("portrait")?"portrait":"landscape";await screen.orientation?.lock?.(n)}catch{}}},title:"전체 화면","aria-label":"전체 화면",className:"m34-header-control",children:"⛶"}),u.jsx("button",{onClick:()=>t(!0),title:"메뉴 (Esc)","aria-label":"메뉴 열기",className:"m34-header-control",children:"☰"})'.encode()
          if b.count(old)!=1:
              raise SystemExit(f"ABORT_MENU_TARGET_COUNT={b.count(old)}")
          for marker in [b'requestFullscreen',b'webkitRequestFullscreen',b'screen.orientation.lock',b'children:"⛶"']:
              if b.count(marker):
                  raise SystemExit(f"ABORT_EXISTING_FULLSCREEN_CODE={marker!r}:{b.count(marker)}")
          out=b.replace(old,new,1)
          p.write_bytes(out)
          print("ORIGINAL_BYTES",len(b))
          print("FINAL_BYTES",len(out))
          print("BYTE_DELTA",len(out)-len(b))
          print("MENU_TARGET_AFTER",out.count(old))
          print("FULLSCREEN_BUTTON_AFTER",out.count(new))
      - name: Stream validation and syntax check
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path("Wayward_MOD_v3.36.html")
          b=p.read_bytes()
          s=b.decode("utf-8")
          new='u.jsx("button",{onClick:async()=>{const e=document.documentElement,t=document.fullscreenElement||document.webkitFullscreenElement;if(t){const o=document.exitFullscreen||document.webkitExitFullscreen;o&&await o.call(document);try{screen.orientation?.unlock?.()}catch{}}else{const o=e.requestFullscreen||e.webkitRequestFullscreen;if(o)try{await o.call(e);const t=screen.orientation?.type,n=t&&t.startsWith("portrait")?"portrait":"landscape";await screen.orientation?.lock?.(n)}catch{}}},title:"전체 화면","aria-label":"전체 화면",className:"m34-header-control",children:"⛶"}),u.jsx("button",{onClick:()=>t(!0),title:"메뉴 (Esc)","aria-label":"메뉴 열기",className:"m34-header-control",children:"☰"})'.encode()
          if b.count(new)!=1: raise SystemExit(f"FAIL_FULLSCREEN_FRAGMENT_COUNT={b.count(new)}")
          if b.count(b'children:"⛶"')!=1: raise SystemExit(f"FAIL_FULLSCREEN_ICON_COUNT={b.count(b'children:"⛶"')}")
          if b.count(b'aria-label:"전체 화면"')!=1: raise SystemExit(f"FAIL_FULLSCREEN_ARIA_COUNT={b.count(b'aria-label:"전체 화면"')}")
          if b.count(b'screen.orientation.lock')!=0: raise SystemExit("FAIL_LITERAL_LOCK_REFERENCE")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",s,re.I|re.S)
          checked=0
          for idx,js in enumerate(scripts):
              if not js.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8",delete=False) as f:
                  f.write(js); name=f.name
              r=subprocess.run(["node","--check",name],capture_output=True,text=True)
              Path(name).unlink(missing_ok=True)
              checked+=1
              if r.returncode:
                  print(r.stderr[-5000:]); raise SystemExit(f"FAIL_SCRIPT_BLOCK={idx}")
          print("SCRIPT_BLOCKS_FOUND",len(scripts))
          print("SCRIPT_BLOCKS_CHECKED",checked)
          print("NO_ORIENTATION_FORCED_TO_SINGLE_MODE",True)
          print("VALID",True)
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/inspect-header-v2.yml .github/workflows/apply-fullscreen-v2.yml
          git add Wayward_MOD_v3.36.html .github/workflows
          git commit -m "feat: add single orientation-preserving fullscreen button"
          git push origin HEAD:fullscreen-v2

# trigger
