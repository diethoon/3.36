name: Temporary dialogue forensic
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/dialogue-forensic.yml"
      - "m36-forensic-trigger"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Focused dialogue choice forensic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Wayward_MOD_v3.36.html').read_text(encoding='utf-8')
          terms=['pendingEvent','m313Acknowledgement','resolve_event','patron_interaction_choice','choiceId','choice','choices','M36Mobile']
          for term in terms:
            hits=[m.start() for m in re.finditer(re.escape(term),s)]
            print(f'=== {term} COUNT {len(hits)} ===')
            for i,pos in enumerate(hits[:8]):
              a=max(0,pos-1800); b=min(len(s),pos+3200)
              print(f'--- {i+1} pos={pos} ---')
              print(s[a:b].replace('\n',' '))
          print('=== FUNCTION DECLARATIONS NEAR CHOICE TERMS ===')
          for m in re.finditer(r'function\s+[A-Za-z_$][\w$]*\([^)]*\)',s):
            name=m.group(0)
            if any(x.lower() in name.lower() for x in ['choice','dialog','event','acknow','conversation']):
              print(name, 'pos=', m.start())
          PY
