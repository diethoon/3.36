name: Temporary mobile dialogue patch

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/dialogue-forensic.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Apply exact dialogue UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_dialogue.py

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          required=[
            "m36-mobile-dialogue-fixed",
            "m36-mobile-dialogue-source-title",
            "m36-mobile-dialogue-source-body",
            'id="wayward-mobile-dialogue-fixed-v1"',
            "[대화]",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("missing anchors: "+repr(missing))
          blocks=re.findall(r"<script\b[^>]*>(.*?)</script>",s,flags=re.S|re.I)
          target=next((x for x in blocks if "function HD()" in x and "m36-mobile-dialogue-fixed" in x),None)
          if target is None:
              raise SystemExit("patched HD block not found")
          Path("/tmp/wayward-patched.js").write_text(target,encoding="utf-8")
          print("HTML bytes:",len(s.encode("utf-8")))
          print("patched HD block found")
          PY
          node --check /tmp/wayward-patched.js
          git diff --check
          git diff --stat

      - name: Commit code and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dialogue-forensic.yml .github/scripts/patch_dialogue.py m36-forensic-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git add -u .github/workflows .github/scripts m36-forensic-trigger
          git diff --cached --check
          git status --short
          git commit -m "fix(mobile): pin dialogue text above choice list"
          git push origin HEAD:mobile-migration-v1
