name: Temporary dialogue forensic
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/dialogue-forensic.yml"
      - "m36-forensic-trigger"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect choice renderers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Wayward_MOD_v3.36.html').read_text(encoding='utf-8')
          for pos in [11356951,11359622,11703513,11144701,11147357]:
            print(f'=== POS {pos} ===')
            print(s[max(0,pos-6500):min(len(s),pos+9000)].replace('\n',' '))
          PY
