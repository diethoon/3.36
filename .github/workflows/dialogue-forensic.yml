name: Temporary dialogue patch and cleanup

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/dialogue-forensic.yml"
      - "m36-forensic-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile-migration-v1
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Patch mobile dialogue presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Wayward_MOD_v3.36.html")
          text = path.read_text(encoding="utf-8")

          old_title = '''u.jsxs("h3",{className:"text-sm font-bold text-amber-400 uppercase tracking-wider mb-1",children:[wt,It&&u.jsxs("span",{className:"text-stone-500 normal-case font-normal ml-2",children:["› ",u.jsx("span",{className:"text-pink-300",children:nt[It]??ko14Conversation(It)})]})]}),'''
          new_title = '''u.jsxs("h3",{className:"text-sm font-bold text-amber-400 uppercase tracking-wider mb-1 m36-mobile-dialogue-source-title",children:[wt,It&&u.jsxs("span",{className:"text-stone-500 normal-case font-normal ml-2",children:["› ",u.jsx("span",{className:"text-pink-300",children:nt[It]??ko14Conversation(It)})]})]}),'''
          old_body = '''u.jsx("div",{className:`p-3 rounded-lg border-2 ${Be} bg-stone-800 mb-3`,children:u.jsx("p",{className:"text-sm text-stone-200 leading-relaxed",children:d.text})}),'''
          new_body = '''u.jsx("div",{className:`p-3 rounded-lg border-2 ${Be} bg-stone-800 mb-3 m36-mobile-dialogue-source-body`,children:u.jsx("p",{className:"text-sm text-stone-200 leading-relaxed",children:d.text})}),'''
          old_choices = '''u.jsxs("div",{className:"grid grid-cols-1 gap-2",children:[m326CompletionChoices'''
          new_choices = '''u.jsxs("div",{className:"m36-mobile-dialogue-fixed",children:[
      u.jsx("div",{className:"m36-mobile-dialogue-label",children:ee?`[대화] ${o.name} <> 당신`:`[이벤트] ${wt}`}),
      u.jsx("div",{className:`m36-mobile-dialogue-box ${Be}`,children:u.jsx("p",{className:"text-sm text-stone-200 leading-relaxed whitespace-pre-wrap break-words",children:d.text})})
    ]}),
    u.jsxs("div",{className:"grid grid-cols-1 gap-2",children:[m326CompletionChoices'''

          counts = {"title":text.count(old_title),"body":text.count(old_body),"choices":text.count(old_choices)}
          if counts != {"title":1,"body":1,"choices":1}:
              raise SystemExit(f"target count mismatch: {counts}")

          text=text.replace(old_title,new_title,1)
          text=text.replace(old_body,new_body,1)
          text=text.replace(old_choices,new_choices,1)

          css = '''<style id="wayward-mobile-dialogue-fixed-v1">
@media(max-width:1023px){
  .m36-mobile-dialogue-source-title,
  .m36-mobile-dialogue-source-body{display:none !important;}
  .m36-mobile-dialogue-fixed{
    position:sticky;
    top:0;
    z-index:30;
    display:block;
    margin:-.25rem -.25rem .45rem;
    padding:.3rem .35rem .4rem;
    background:rgb(28 25 23);
    border-bottom:1px solid rgba(68,64,60,.78);
  }
  .m36-mobile-dialogue-label{
    margin-bottom:.25rem;
    color:rgb(245 158 11);
    font-size:.66rem;
    font-weight:700;
    line-height:1.15;
    letter-spacing:.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .m36-mobile-dialogue-box{
    padding:.55rem .65rem;
    border-width:1px;
    border-radius:.45rem;
    background:rgba(41,37,36,.96);
  }
}
@media(min-width:1024px){
  .m36-mobile-dialogue-fixed{display:none !important;}
}
</style>'''
          if text.count("wayward-mobile-dialogue-fixed-v1"):
              raise SystemExit("dialogue fixed CSS already exists")
          if text.count("</head>") != 1:
              raise SystemExit("head anchor count mismatch")
          text=text.replace("</head>",css+"\n</head>",1)

          path.write_text(text,encoding="utf-8")
          print("patched:", text.count("m36-mobile-dialogue-fixed"),
                text.count("m36-mobile-dialogue-source-title"),
                text.count("m36-mobile-dialogue-source-body"))
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          required=[
            "m36-mobile-dialogue-fixed",
            "m36-mobile-dialogue-source-title",
            "m36-mobile-dialogue-source-body",
            'id="wayward-mobile-dialogue-fixed-v1"',
            "[대화]",
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit("missing: "+repr(missing))
          scripts=re.findall(r"<script\b[^>]*>(.*?)</script>",text,flags=re.S|re.I)
          target=next((s for s in scripts if "function HD()" in s and "m36-mobile-dialogue-fixed" in s),None)
          if target is None: raise SystemExit("patched HD not found")
          Path("/tmp/wayward-hd.js").write_text(target,encoding="utf-8")
          PY
          node --check /tmp/wayward-hd.js
          git diff --check

      - name: Remove temporary workflows and commit final patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dialogue-forensic.yml .github/workflows/mobile-dialogue-patch.yml m36-forensic-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git add -u .github/workflows m36-forensic-trigger
          git diff --cached --check
          files="$(git diff --cached --name-only)"
          test "$files" = "Wayward_MOD_v3.36.html"
          git commit -m "fix(mobile): pin dialogue text above choice list"
          git push origin HEAD:mobile-migration-v1
