name: Temporary dialogue forensic
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/dialogue-forensic.yml"
      - "m36-forensic-trigger"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Locate HD action renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Wayward_MOD_v3.36.html').read_text(encoding='utf-8')
          for pat in [r'function HD\b',r'HD=\(',r'HD=\w+',r'const HD',r'let HD',r'var HD']:
            ms=list(re.finditer(pat,s))
            print('PAT',pat,'COUNT',len(ms),[m.start() for m in ms[:20]])
            for m in ms[:6]:
              p=m.start();print('--- POS',p,'---');print(s[max(0,p-5000):min(len(s),p+12000)].replace('\n',' '))
          PY
