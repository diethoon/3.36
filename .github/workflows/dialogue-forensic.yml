name: Temporary dialogue forensic
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/dialogue-forensic.yml"
      - "m36-forensic-trigger"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Locate mobile action scroll container
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Wayward_MOD_v3.36.html').read_text(encoding='utf-8')
          for term in ['mobile-action-scroll','m36-mobile-tabs']:
            ps=[m.start() for m in re.finditer(re.escape(term),s)]
            print('TERM',term,ps)
            for pos in ps:
              print('--- POS',pos,'---')
              print(s[max(0,pos-7500):min(len(s),pos+10000)].replace('\n',' '))
          PY
