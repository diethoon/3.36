name: m36-movement-forensics

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Scan movement and mobile runtime targets
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path("Wayward_MOD_v3.36.html")
          s=p.read_text(encoding="utf-8")

          terms=[
            "침실","욕탕","홀","bath","bedroom","location","currentLocation",
            "currentRoom","move","navigate","navigation","이동","document.querySelector",
            "m36-mobile-next-ui-script","MutationObserver"
          ]

          hits=[]
          for term in terms:
            for m in re.finditer(re.escape(term),s,re.I):
              a=max(0,m.start()-500); b=min(len(s),m.end()+900)
              excerpt=s[a:b]
              if excerpt not in [x[2] for x in hits]:
                hits.append((m.start(),term,excerpt))
              if sum(1 for x in hits if x[1]==term)>=3:
                break

          hits.sort()
          for i,(pos,term,excerpt) in enumerate(hits[:45],1):
            print(f"--- HIT {i} term={term} pos={pos} ---")
            print(excerpt.replace("\n"," ")[:1450])
            print()

          print("TOTAL_SELECTED",len(hits))

          # Structural checks for the mobile observer patch.
          marker="m36-mobile-next-ui-script"
          ms=s.find(marker)
          print("MOBILE_SCRIPT_POS",ms)
          if ms>=0:
            bs=s.rfind("<script",0,ms)
            be=s.find("</script>",ms)
            js=s[bs+7:be]
            print("MOBILE_SCRIPT_JS_BYTES",len(js.encode()))
            print("HAS_OBSERVER", "MutationObserver" in js)
            print("HAS_QUEUE_MICROTASK", "queueMicrotask" in js)
            print("HAS_REMOVE_DISABLED_ROWS", ".m36-mobile-disabled-choice" in js and "replaceWith" in js)

          # Show exact static room-button/name occurrences with compact nearby text.
          for term in ["침실","욕탕","홀"]:
            ms=list(re.finditer(re.escape(term),s))
            print(f"{term}_COUNT",len(ms))
          PY
