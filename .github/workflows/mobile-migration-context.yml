name: mobile-migration-context

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stream targeted mobile context
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("Wayward_MOD_v3.36.html")
          needles = [
              "function vle",
              "function Pie",
              "WaywardPersistentStatus",
              "WaywardCurrentActivity",
              "mobile-layout",
              "mobile-main-panel",
              "mobile-action-panel",
              "mobile-status",
              "mobile-current-activity",
              "map-pinned",
              "initial-scale",
              "safe-area",
              "orientation:portrait",
              "orientation:landscape",
              "1023px",
              "m34-header-control",
              "requestFullscreen",
          ]

          out = Path("migration_context")
          out.mkdir(exist_ok=True)
          report = out / "TARGET_CONTEXTS.txt"
          chunk_size = 64 * 1024
          context_chars = 1200
          carry = b""
          hits = []

          with path.open("rb") as f:
              offset = 0
              while True:
                  chunk = f.read(chunk_size)
                  if not chunk:
                      break
                  data = carry + chunk
                  base = offset - len(carry)
                  text = data.decode("utf-8", errors="replace")
                  for needle in needles:
                      start = 0
                      while True:
                          i = text.find(needle, start)
                          if i < 0:
                              break
                          abs_pos = base + len(text[:i].encode("utf-8"))
                          left = max(0, i - context_chars)
                          right = min(len(text), i + len(needle) + context_chars)
                          snippet = text[left:right]
                          hits.append((abs_pos, needle, snippet))
                          start = i + len(needle)
                  carry = data[-max(context_chars * 4, 16000):]
                  offset += len(chunk)

          dedup = {}
          for pos, needle, snippet in hits:
              dedup[(pos, needle)] = snippet

          lines = [
              f"FILE_BYTES={path.stat().st_size}",
              f"HITS={len(dedup)}",
              ""
          ]
          for (pos, needle), snippet in sorted(dedup.items()):
              lines.append(f"===== {needle} @ byte {pos} =====")
              lines.append(snippet)
              lines.append("")
          report.write_text("\n".join(lines), encoding="utf-8")
          print(f"WROTE {report} ({report.stat().st_size} bytes)")
      - name: Commit compact context
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add migration_context/TARGET_CONTEXTS.txt
          git commit -m "chore: extract mobile migration context" || exit 0
          git push
