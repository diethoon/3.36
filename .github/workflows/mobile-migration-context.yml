name: mobile-migration-context

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stream targeted UI owners
        shell: python
        run: |
          from pathlib import Path

          path = Path("Wayward_MOD_v3.36.html")
          needles = [
              "function RPe(){",
              "function AOe(){",
              "function eOe(",
              "function HD(",
              "function rI(",
              "function ple(",
              "mobile-status",
              "mobile-current-activity",
              "mobile-layout",
              "mobile-main-panel",
              "mobile-action-panel",
              "map-pinned",
              "100dvh",
              "@media(max-width:1023px)",
              "@media(max-width:560px)",
              "initial-scale",
          ]
          chunk_size = 64 * 1024
          context_bytes = 7000
          carry = b""
          found = {}

          with path.open("rb") as f:
              offset = 0
              while True:
                  chunk = f.read(chunk_size)
                  if not chunk:
                      break
                  data = carry + chunk
                  base = offset - len(carry)
                  for needle in needles:
                      nb = needle.encode("utf-8")
                      pos = 0
                      while True:
                          i = data.find(nb, pos)
                          if i < 0:
                              break
                          absolute = base + i
                          if needle not in found:
                              left = max(0, i - context_bytes)
                              right = min(len(data), i + len(nb) + context_bytes)
                              found[needle] = (absolute, data[left:right].decode("utf-8", errors="replace"))
                          pos = i + len(nb)
                  keep = max(context_bytes, 12000)
                  carry = data[-keep:]
                  offset += len(chunk)

          out = Path("migration_context")
          out.mkdir(exist_ok=True)
          lines = [f"FILE_BYTES={path.stat().st_size}", f"UNIQUE_TARGETS={len(found)}", ""]
          for needle, (pos, snippet) in found.items():
              lines += [f"===== {needle} @ byte {pos} =====", snippet, ""]
          (out / "UI_OWNER_TARGETS.txt").write_text("\n".join(lines), encoding="utf-8")
          print(f"WROTE {out / 'UI_OWNER_TARGETS.txt'}")

      - name: Commit compact targets
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add migration_context/UI_OWNER_TARGETS.txt
          git commit -m "chore: extract mobile ui owner targets" || exit 0
          git push
