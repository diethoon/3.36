name: One-time Wayward save-share source inspection

on:
  push:
    branches:
      - forensic-save-share-followup
    paths:
      - .github/workflows/inspect-save-share.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact inspection branch
        uses: actions/checkout@v4
      - name: Locate exact tokens and read only tiny byte windows
        shell: bash
        run: |
          set -euo pipefail
          file="Wayward_MOD_v3.36.html"
          echo "FILE_SIZE_BYTES=$(stat -c %s "$file")"
          echo "HEAD=$(git rev-parse --short HEAD)"
          for token in "M36_SAVE_SHARE_API" "shareSlot=async" "onShare" "onRename" "function M36CloudImportControl" "M36CloudImportControl"; do
            echo
            echo "===== OFFSETS FOR: $token ====="
            offsets=$(LC_ALL=C grep -aboF "$token" "$file" | cut -d: -f1 | head -n 4 || true)
            if [ -z "$offsets" ]; then
              echo "NOT_FOUND"
              continue
            fi
            printf '%s\n' "$offsets"
            while IFS= read -r offset; do
              [ -n "$offset" ] || continue
              start=$(( offset > 500 ? offset - 500 : 0 ))
              echo "----- $token offset=$offset; bytes=$start..$((start+1600)) -----"
              dd if="$file" iflag=skip_bytes,count_bytes skip="$start" count=1600 status=none | iconv -f UTF-8 -t UTF-8 -c
              echo
            done <<< "$offsets"
          done
