name: One-time Wayward save-share source inspection

on:
  push:
    branches:
      - forensic-save-share-followup
    paths:
      - .github/workflows/inspect-save-share.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact inspection branch
        uses: actions/checkout@v4
      - name: Read predetermined byte windows only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path("Wayward_MOD_v3.36.html")
          size = p.stat().st_size
          head = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"], text=True).strip()
          print(f"FILE_SIZE_BYTES={size} GIT_HEAD={head}")
          windows = [
              ("SAVE_SLOT_COMPONENT_EARLY", 11344000, 1800),
              ("SAVE_SLOT_CARD_AND_BUTTONS", 11347000, 2200),
              ("SAVE_SLOT_HANDLER_AND_RENDER", 11351000, 2200),
              ("SETTINGS_IMPORT_CONTROL", 11539800, 1800),
          ]
          with p.open("rb") as f:
              for label, offset, length in windows:
                  f.seek(offset)
                  chunk = f.read(min(length, max(0, size-offset)))
                  print(f"\n===== {label} offset={offset} bytes_read={len(chunk)} =====")
                  print(chunk.decode("utf-8", errors="replace"))
          PY
