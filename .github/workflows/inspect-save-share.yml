name: One-time Wayward save-share source inspection

on:
  push:
    branches:
      - forensic-save-share-followup
    paths:
      - .github/workflows/inspect-save-share.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact inspection branch
        uses: actions/checkout@v4
      - name: Inspect only exact save UI symbols
        shell: bash
        run: |
          set -eu
          file="Wayward_MOD_v3.36.html"
          echo "FILE_SIZE_BYTES=$(stat -c %s "$file")"
          echo "HEAD=$(git rev-parse --short HEAD)"

          for token in "M36_SAVE_SHARE_API" "shareSlot=async" "function EOe" "function M36CloudImportControl" "u.jsx(M36CloudImportControl"; do
            echo
            echo "===== OFFSETS: $token ====="
            LC_ALL=C grep -aboF "$token" "$file" | cut -d: -f1 | head -n 4 || true
          done

          inspect_first() {
            token="$1"
            length="$2"
            offset=$(LC_ALL=C grep -aboF "$token" "$file" | head -n 1 | cut -d: -f1 || true)
            if [ -z "$offset" ]; then echo "NOT_FOUND: $token"; return; fi
            start=$(( offset > 350 ? offset - 350 : 0 ))
            echo
            echo "===== WINDOW: $token offset=$offset start=$start count=$length ====="
            dd if="$file" iflag=skip_bytes,count_bytes skip="$start" count="$length" status=none | python -c 'import sys; print(sys.stdin.buffer.read().decode("utf-8", "replace"))'
          }

          inspect_first "function EOe" 2100
          inspect_first "function M36CloudImportControl" 1900
          inspect_first "u.jsx(M36CloudImportControl" 1100
