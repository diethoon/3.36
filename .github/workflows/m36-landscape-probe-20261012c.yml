name: M36 one-shot landscape source and DOM probe C

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact probe branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Read target regions in small chunks
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/m36-landscape-probe-c.txt 2>&1
          from pathlib import Path
          import mmap

          p = Path("Wayward_MOD_v3.36.html")
          size = p.stat().st_size
          print("FILE", p.name, "BYTES", size)
          with p.open("rb") as f:
              count = 0
              while True:
                  chunk = f.read(65536)
                  if not chunk: break
                  count += chunk.count(b"\\n")
              print("NEWLINES", count)
          markers = [
              ("portrait migration style", b"wayward-mobile-migration-v1", 3000),
              ("unified landscape header style", b"wayward-landscape-header-unified-v12", 1500),
              ("landscape cleanup style", b"wayward-mobile-landscape-clean-v11", 7200),
              ("mobile layout component", b'className:"mobile-layout lg:hidden flex-1 min-h-0"', 2400),
          ]
          with p.open("rb") as source, p.open("rb") as mapped:
              mm = mmap.mmap(mapped.fileno(), 0, access=mmap.ACCESS_READ)
              for label, marker, limit in markers:
                  pos = mm.find(marker)
                  print(f"\\n=== {label}: offset={pos} ===")
                  if pos < 0: continue
                  if b"style" in marker:
                      start = mm.rfind(b"<style", 0, pos)
                      end = mm.find(b"</style>", pos)
                      end = size if end < 0 else end + len(b"</style>")
                      start = max(0, start)
                  else:
                      start = max(0, pos - 420)
                      end = min(size, pos + limit)
                  total = min(end, start + limit)
                  print("RANGE", start, total, "BYTES", total-start)
                  i, n = 0, 0
                  while start + i < total:
                      a = start + i
                      take = min(360, total - a)
                      source.seek(a)
                      chunk = source.read(take)
                      print(f"CHUNK {n+1} @{a}: {chunk.decode('utf-8','replace')}")
                      i += take
                      n += 1
              mm.close()
          print("\\nEND_SMALL_CHUNK_SOURCE_PROBE")
          PY
          cat /tmp/m36-landscape-probe-c.txt

      - name: Run browser layout measurement
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-static-c.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS' >> /tmp/m36-landscape-probe-c.txt 2>&1
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          const cases=[{name:'landscape-900x400',width:900,height:400},{name:'landscape-1280x720',width:1280,height:720},{name:'landscape-1920x1080',width:1920,height:1080}];
          for(const c of cases){
            const p=await b.newPage({viewport:{width:c.width,height:c.height}});
            const errs=[];
            p.on('pageerror',e=>errs.push(String(e).slice(0,180)));
            p.on('console',m=>{if(m.type()==='error')errs.push(m.text().slice(0,180));});
            try{
              await p.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
              let relationDone=false,wifeDone=false;
              for(let step=0;step<16;step++){
                await p.waitForTimeout(220);
                const labels=(await p.locator('button').allTextContents()).map(t=>t.trim());
                const body=await p.locator('body').innerText();
                let label=null;
                if(labels.includes('예'))label='예';
                else if(labels.includes('이해하고 동의합니다'))label='이해하고 동의합니다';
                else if(labels.includes('새 게임'))label='새 게임';
                else if(!relationDone&&body.includes('그녀는 당신에게 어떤 존재인가요?')&&labels.includes('아내')){label='아내';relationDone=true;}
                else if(relationDone&&!wifeDone&&labels.some(t=>t.startsWith('엘레나'))){label=labels.find(t=>t.startsWith('엘레나'));wifeDone=true;}
                else if(wifeDone&&labels.some(t=>t.includes('계속하기 — 엘레나'))){label=labels.find(t=>t.includes('계속하기 — 엘레나'));}
                else if(labels.some(t=>t.includes('시작 — 엘레나'))){label=labels.find(t=>t.includes('시작 — 엘레나'));}
                else if(labels.includes('건너뛰기'))label='건너뛰기';
                else if(labels.includes('다음'))label='다음';
                else break;
                await p.locator('button').nth(labels.indexOf(label)).click({timeout:2500}).catch(()=>{});
              }
              await p.waitForTimeout(1000);
              const out=await p.evaluate(()=>{
                const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),scrollW:e.scrollWidth,clientW:e.clientWidth,scrollH:e.scrollHeight,clientH:e.clientHeight,display:s.display,gridColumn:s.gridColumn,gridTemplateColumns:s.gridTemplateColumns,position:s.position,overflow:s.overflow};};
                const pick=s=>rect(document.querySelector(s));
                const kids=(e,d=0)=>!e||d>3?[]:[...e.children].slice(0,12).map(c=>({tag:c.tagName,cls:typeof c.className==='string'?c.className.slice(0,120):'',text:(c.innerText||'').replace(/\\s+/g,' ').slice(0,65),rect:rect(c),children:kids(c,d+1)}));
                return {viewport:{w:innerWidth,h:innerHeight,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight},header:pick('.m34-header'),stats:pick('.m34-header-stats'),tools:pick('.m34-header-tools'),layout:pick('.mobile-layout'),portrait:pick('.mobile-portrait-panel'),main:pick('.mobile-main-panel'),action:pick('.mobile-action-panel'),scroll:pick('.mobile-action-scroll'),styles:[...document.querySelectorAll('style[id]')].map(e=>e.id).filter(x=>/landscape|migration/i.test(x)),tree:kids(document.querySelector('.mobile-layout'))};
              });
              console.log('DOM '+c.name+' '+JSON.stringify({out,errs:errs.slice(0,8)}));
            }catch(e){console.log('BROWSER_FAIL '+c.name+' '+String(e)+' '+JSON.stringify(errs.slice(0,8)));}
            await p.close();
          }
          await b.close();
          JS
          cat /tmp/m36-landscape-probe-c.txt

      - name: Post probe report and remove temporary runner
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROBE_BRANCH: m36-landscape-probe-20261012c
          WF_PATH: .github/workflows/m36-landscape-probe-20261012c.yml
        run: |
          set +e
          [ -s /tmp/m36-landscape-probe-c.txt ] || echo "PROBE_REPORT_MISSING; see workflow run logs." > /tmp/m36-landscape-probe-c.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/m36-landscape-probe-c.txt)" >/tmp/m36-landscape-comment-c.log 2>&1
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "One-shot source/runtime probe completed; no game source was changed." >/tmp/m36-landscape-close-c.log 2>&1
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PROBE_BRANCH" >/tmp/m36-landscape-branch-delete-c.log 2>&1
          WF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WF_PATH?ref=main" --jq .sha 2>/dev/null)"
          if [ -n "$WF_SHA" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WF_PATH" -f message="chore: remove temporary landscape probe workflow" -f sha="$WF_SHA" -f branch=main >/tmp/m36-landscape-workflow-delete-c.log 2>&1
          fi
          echo "Probe cleanup attempted."
