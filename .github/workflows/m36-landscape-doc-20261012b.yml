name: M36 one-shot append landscape runtime procedure B

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary trigger
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Append evidence using EOF-only file access
        shell: bash
        run: |
          set -e
          {
            git fetch --depth=1 origin refs/heads/mobile-migration-v1:refs/remotes/origin/mobile-migration-v1
            git checkout -B mobile-migration-v1 refs/remotes/origin/mobile-migration-v1
            test -f idea/GPT_RUNTIME_FORENSIC_FALLBACK.md
            python3 - <<'PY'
          from pathlib import Path

          p = Path("idea/GPT_RUNTIME_FORENSIC_FALLBACK.md")
          marker = "### 31. 2026-10-12 mobile landscape four-column UI patch"
          with p.open("rb") as f:
              f.seek(max(0, p.stat().st_size - 1800))
              tail = f.read().decode("utf-8", "replace")
          if marker in tail:
              raise SystemExit("LANDSCAPE_PROCEDURE_ALREADY_DOCUMENTED")
          section = r"""
          ### 31. 2026-10-12 mobile landscape four-column UI patch

          대상:
              repository: diethoon/3.36
              branch: mobile-migration-v1
              source: Wayward_MOD_v3.36.html (19.6 MB)

          대형 HTML은 전체 파일을 tool/context로 출력하지 않는다. 해당 작업에서는 mmap으로 style ID / 고유 앵커의 byte offset만 찾고, 파일 변경은 최대 64 KiB 스트리밍 복사로 수행했다.

          실제 변경:
              - 기존 wayward-landscape-header-unified-v12 / wayward-mobile-landscape-clean-v11 스타일 블록을 제거
              - 단일 CSS 블록 wayward-mobile-landscape-four-column-v15로 대체
              - landscape mobile header의 크기·줄바꿈을 세로형 UI 기준으로 맞추고 중복 desktop summary 숨김
              - viewport 아래 빈 영역을 제거하고 높이 제한된 landscape에서 4열 grid 사용
              - 1열 초상화가 사용 가능한 높이/너비를 채우고 대기 공간 숨김
              - 2열은 나레이션, 3열은 대화/게이지, 4열은 스크롤 선택지
              - 3/4열 너비는 동일하게 분할
              - 준비 화면의 고정 백분율 row 크기를 fr 단위로 바꾸어 좁은 가로화면에서도 선택지 스크롤 높이를 확보
              - 변경 범위는 HTML 내 CSS만이며 게임 상태/dispatch/저장 데이터 로직은 수정하지 않음

          검증 흐름:
              1. temporary pull_request_target runner는 temporary trigger PR head에서 시작한다.
              2. runner가 origin/mobile-migration-v1을 명시적으로 fetch/checkout하고 실제 target HEAD를 로그로 남긴다.
              3. mmap으로 고유 style marker / 바이트 offset을 확인한다. 전체 HTML을 stdout으로 출력하지 않는다.
              4. 필요한 구간만 offset 기반으로 교체하고, 나머지 원본은 64 KiB씩 streaming copy한다.
              5. git diff --check를 실행한다.
              6. Playwright Chromium에서 900x400, 1280x720, 1920x1080 viewport를 확인한다.
              7. 런타임 측정값(doc width/height, header height, grid tracks, column heights, hidden waiting area, choice scroller)을 보고하고 success 때만 HTML patch를 commit/push한다.
              8. one-shot workflow, trigger branch/PR을 정리하고 작업 브랜치 HEAD를 다시 조회한다.

          최종 확인된 landscape geometry (2026-10-12):
              commit: d3da655a1f15112fcaeba4220cf7a94acc958e71
              900x400: header 59px; four tracks 180/276/216/216px; viewport overflow 없음
              1280x720: header 59px; four tracks 256/468/272/272px; viewport overflow 없음
              portrait panel / narration panel / action area 모두 layout 높이에 맞게 채움
              3/4열 내부 폭이 동일하며 waiting-space element는 display:none
              선택지 scroller: 900x400에서 106px, 1280x720에서 230px
              Playwright layout assertion: RUNTIME_LAYOUT_VALIDATION_PASS
              temporary runner job: success
              검증 뒤 temporary workflow와 PR은 자동 정리됨

          주의/한계:
              - Playwright runtime에서 layout geometry는 PASS였지만, runner 로그에는 선택적 script/image resource 404/connection-refused 메시지도 있었다. 이를 모든 외부 asset의 정상 로딩 증거로 간주하지 않는다.
              - 1920x1080은 desktop breakpoint에 있어 mobile 4-column grid가 숨겨지는 것이 정상이며 viewport overflow는 없었다.
              - 다음 변경에서도 원본 전체를 읽지 말고 고유 marker 및 byte ranges를 먼저 검사하고, 변경 후 EOF/marker/diff/test evidence를 기록한다.

          """
          clean_section = section.lstrip().rstrip() + "\\n"
          # Normalize only trailing EOF newlines in-place; never materialize the document.
          with p.open("r+b") as f:
              f.seek(0, 2)
              end = f.tell()
              while end > 0:
                  f.seek(end - 1)
                  if f.read(1) in (b"\\n", b"\\r"):
                      end -= 1
                  else:
                      break
              f.truncate(end)
              f.seek(end)
              f.write(b"\\n\\n")
              f.write(clean_section.encode("utf-8"))
          print("APPENDED_BYTES", len(clean_section.encode("utf-8")))
          print("DOC_BYTES", p.stat().st_size)
          with p.open("rb") as f:
              f.seek(max(0, p.stat().st_size - 1600))
              print("EOF_CHUNK_BEGIN")
              print(f.read().decode("utf-8", "replace"))
              print("EOF_CHUNK_END")
          PY
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add idea/GPT_RUNTIME_FORENSIC_FALLBACK.md
            git commit -m "docs: record four-column landscape runtime patch"
            git push origin HEAD:mobile-migration-v1
            git rev-parse HEAD > /tmp/m36-landscape-doc-commit.txt
            echo "DOC_APPEND_AND_PUSH_PASS"
          } 2>&1 | tee /tmp/m36-landscape-doc-report.txt
      - name: Report and remove temporary runner
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROBE_BRANCH: m36-landscape-doc-20261012b
          WF_PATH: .github/workflows/m36-landscape-doc-20261012b.yml
        run: |
          set +e
          {
            [ -f /tmp/m36-landscape-doc-report.txt ] && cat /tmp/m36-landscape-doc-report.txt
            [ -f /tmp/m36-landscape-doc-commit.txt ] && echo "COMMIT $(cat /tmp/m36-landscape-doc-commit.txt)"
            echo "JOB_STATUS: ${{ job.status }}"
          } > /tmp/m36-landscape-doc-final.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/m36-landscape-doc-final.txt)" >/tmp/m36-landscape-doc-comment.log 2>&1
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Temporary documentation runner completed; no merge performed." >/tmp/m36-landscape-doc-close.log 2>&1
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PROBE_BRANCH" >/tmp/m36-landscape-doc-branch-delete.log 2>&1
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WF_PATH?ref=main" --jq .sha 2>/dev/null)"
          if [ -n "$SHA" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WF_PATH" -f message="chore: remove temporary landscape documentation runner" -f sha="$SHA" -f branch=main >/tmp/m36-landscape-doc-wf-delete.log 2>&1; fi