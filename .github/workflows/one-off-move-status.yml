name: One-off move mobile status to right top
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/one-off-move-status.yml"
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Patch in bounded chunks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil

          path = Path("Wayward_MOD_v3.36.html")
          CH = 65536

          replacements = [
              (
                  b'r==="house"&&u.jsxs("div",{className:"h-full",children:[u.jsx(s3,{}),u.jsx(M36MobileStoreStatus,{})]})',
                  b'r==="house"&&u.jsx("div",{className:"h-full",children:u.jsx(s3,{})})',
                  "remove store status from house tab",
              ),
              (
                  b'children:[u.jsx(M36MobileStockStatus,{})',
                  b'children:[u.jsx(M36MobileStoreStatus,{}),u.jsx(M36MobileStockStatus,{})',
                  "insert store status into right layout",
              ),
          ]

          def count_stream(needle):
              total = 0
              carry = b""
              with path.open("rb") as f:
                  while True:
                      chunk = f.read(CH)
                      if not chunk:
                          break
                      data = carry + chunk
                      total += data.count(needle)
                      carry = data[-(len(needle)-1):] if len(needle) > 1 else b""
              return total

          for old, new, label in replacements:
              c = count_stream(old)
              print(label, "MATCHES_BEFORE", c)
              if c != 1:
                  raise SystemExit(f"EXPECTED_ONE_MATCH_FAIL: {label}: {c}")

          tmp = path.with_suffix(".patch.tmp")
          max_old = max(len(old) for old, _, _ in replacements)
          carry = b""
          replaced = {label: 0 for _, _, label in replacements}

          with path.open("rb") as src, tmp.open("wb") as dst:
              while True:
                  chunk = src.read(CH)
                  if not chunk:
                      break
                  buf = carry + chunk
                  safe = len(buf) - (max_old - 1)
                  if safe < 0:
                      safe = 0
                  part, carry = buf[:safe], buf[safe:]

                  for old, new, label in replacements:
                      n = part.count(old)
                      if n:
                          replaced[label] += n
                          part = part.replace(old, new)
                  dst.write(part)

              for old, new, label in replacements:
                  n = carry.count(old)
                  if n:
                      replaced[label] += n
                      carry = carry.replace(old, new)
              dst.write(carry)

          for label, n in replaced.items():
              print(label, "REPLACED", n)
              if n != 1:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f"EXPECTED_ONE_REPLACEMENT_FAIL: {label}: {n}")

          shutil.move(tmp, path)
          print("PATCH_COMPLETE")

          # Bounded marker checks; no full-file load.
          required = [
              b'function M36MobileStoreStatus(){',
              b'u.jsx(M36MobileStoreStatus,{}),u.jsx(M36MobileStockStatus,{})',
          ]
          forbidden = [
              b'r==="house"&&u.jsxs("div",{className:"h-full",children:[u.jsx(s3,{}),u.jsx(M36MobileStoreStatus,{})]})',
          ]

          for needle in required:
              c = count_stream(needle)
              print("REQUIRED", needle, c)
              if c < 1:
                  raise SystemExit("REQUIRED_MARKER_MISSING")

          for needle in forbidden:
              c = count_stream(needle)
              print("FORBIDDEN", needle, c)
              if c != 0:
                  raise SystemExit("OLD_HOUSE_RENDER_REMAINS")

          # Verify EOF without loading the file.
          size = 0
          tail = b""
          with path.open("rb") as f:
              while True:
                  chunk = f.read(CH)
                  if not chunk:
                      break
                  size += len(chunk)
                  tail = (tail + chunk)[-256:]
          print("HTML_BYTES", size)
          print("EOF_TAIL", repr(tail))
          if size < 19000000:
              raise SystemExit("SIZE_CHECK_FAIL")
          PY

      - name: Extract script blocks and node-check
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path("Wayward_MOD_v3.36.html")
          out = Path("/tmp/nodecheck")
          out.mkdir(exist_ok=True)
          CH = 65536
          KEEP = 2048
          buf = b""
          carry = b""
          active = False
          idx = 0
          h = None

          with p.open("rb") as f:
              while True:
                  c = f.read(CH)
                  if not c:
                      break
                  buf += c
                  while True:
                      if not active:
                          m = re.search(br'<script\b[^>]*>', buf, re.I)
                          if not m:
                              if len(buf) > KEEP:
                                  buf = buf[-KEEP:]
                              break
                          buf = buf[m.end():]
                          idx += 1
                          h = (out / f"s{idx}.js").open("wb")
                          active = True
                      else:
                          m = re.search(br'</script\s*>', buf, re.I)
                          if not m:
                              if len(buf) > KEEP:
                                  h.write(buf[:-KEEP])
                                  buf = buf[-KEEP:]
                              break
                          h.write(buf[:m.start()])
                          buf = buf[m.end():]
                          h.close()
                          h = None
                          active = False

          if active:
              raise SystemExit("UNTERMINATED_SCRIPT_BLOCK")

          scripts = sorted(out.glob("*.js"))
          if not scripts:
              raise SystemExit("NO_SCRIPT_BLOCKS")

          for s in scripts:
              r = subprocess.run(["node", "--check", str(s)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit("NODE_CHECK_FAIL " + s.name)

          print("NODE_CHECK=PASS", len(scripts))
          PY
          git diff --check

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-move-status.yml
          git add Wayward_MOD_v3.36.html
          git commit -m "Move mobile status back to right layout top"
          git push origin HEAD:mobile-migration-v1
