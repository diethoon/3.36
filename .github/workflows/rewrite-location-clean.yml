name: rewrite-location-clean
on:
  pull_request:
    branches:
      - mobile-migration-v1
permissions:
  contents: write
jobs:
  rewrite:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: rewrite clean history
        run: |
          git fetch origin 3fc9aad51ed890d730913c6de37b888806888b65 40d9c4b9c81ac18024bea062efb4bd267e150d33
          git diff 3fc9aad51ed890d730913c6de37b888806888b65 40d9c4b9c81ac18024bea062efb4bd267e150d33 -- Wayward_MOD_v3.36.html > /tmp/fix.patch
          git checkout -B clean-work 3fc9aad51ed890d730913c6de37b888806888b65
          git apply /tmp/fix.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          script=next((x for x in re.findall(r"<script(?:[^>]*)>(.*?)</script>",s,re.S) if "function AOe(" in x and "function M36MobileStoreStatus(" in x),None)
          if script is None: raise SystemExit("main JS block not found")
          Path("/tmp/wayward-main.js").write_text(script,encoding="utf-8")
          if 'playerLoc=re(d=>vt(d.state))' not in script:
              raise SystemExit("vt player-location selector missing")
          if 'playerLoc=re(d=>be(d.state))' in script:
              raise SystemExit("stale be selector remains")
          PY
          node --check /tmp/wayward-main.js
          git diff --check -- Wayward_MOD_v3.36.html
          git diff --stat 3fc9aad51ed890d730913c6de37b888806888b65 -- Wayward_MOD_v3.36.html
          git config user.name "diethoon"
          git config user.email "jhy67439787@gmail.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): show player location in right status"
          git push origin HEAD:mobile-migration-v1 --force
