name: M36 column-three overflow and native icon repair
"on":
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/m36-landscape-column3-icons-repair-20261016.yml"
permissions:
  contents: write
jobs:
  repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Remove false contrast patch and bound column three
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import mmap, json, os
          p=Path("Wayward_MOD_v3.36.html")
          marker=b'm36-landscape-icon-visibility-20261016'
          style_start=b'<style id="m36-landscape-icon-visibility-20261016">'
          style_end=b'</style>'
          body=b'</body>'
          terms=[
            b'wayward-save-share', b'm36-mobile-disabled-choice', b'm36-mobile-pleasure-fixed',
            b'M36MobileStoreStatus', '물자 채우기'.encode(), '시설 업그레이드'.encode(), '인사하기'.encode()
          ]
          with p.open('r+b') as f:
            mm=mmap.mmap(f.fileno(),0)
            start=mm.find(style_start)
            if start < 0: raise SystemExit('Expected incorrect contrast style not found; no changes made')
            if mm.find(style_start,start+1) >= 0: raise SystemExit('Duplicate contrast style marker; no changes made')
            endtag=mm.find(style_end,start)
            if endtag < 0: raise SystemExit('Contrast style closing tag not found')
            end=endtag+len(style_end)
            bodypos=mm.rfind(body)
            if bodypos < end: raise SystemExit('Closing body not found after contrast style')
            before={t.decode():len([None for _ in []]) for t in terms}
            for t in terms:
              n=0; pos=0
              while True:
                pos=mm.find(t,pos)
                if pos<0: break
                n+=1; pos+=len(t)
              before[t.decode()]=n
            original_size=len(mm)
            mm.close()
            repair = b'''\n<style id="m36-landscape-column3-original-icons-20261016">
          /* Use the original header controls and their original icon artwork.
             No recoloring, brightness filter, or replacement icon is introduced. */
          @media (orientation:landscape) and (min-width:600px) {
            .m34-header .m33-launchers button small,
            .m34-header .m34-system-tools button small { display:none!important; }
            .mobile-layout {
              box-sizing:border-box!important; left:28px!important;
              margin-left:0!important; width:calc(100% - 28px)!important;
              max-width:calc(100% - 28px)!important; min-width:0!important;
            }
            .mobile-action-panel {
              box-sizing:border-box!important; position:relative!important;
              min-width:0!important; max-width:none!important; overflow-x:hidden!important;
            }
            /* The panel spans grid tracks 3-4; its status/dialogue content stays
               in track 3 while the original choice scroller owns track 4. */
            .mobile-action-panel > :not(button:last-child) {
              box-sizing:border-box!important; min-width:0!important;
              width:calc(100% - var(--m36-landscape-choice-w,clamp(110px,19vw,270px)))!important;
              max-width:calc(100% - var(--m36-landscape-choice-w,clamp(110px,19vw,270px)))!important;
            }
            .mobile-action-panel > .flex-1.min-h-0.flex.flex-col {
              min-width:0!important; max-width:calc(100% - var(--m36-landscape-choice-w,clamp(110px,19vw,270px)))!important;
              overflow:hidden!important;
            }
            .mobile-action-panel .mobile-action-scroll {
              box-sizing:border-box!important; right:0!important; left:auto!important;
              width:var(--m36-landscape-choice-w,clamp(110px,19vw,270px))!important;
              min-width:0!important; max-width:var(--m36-landscape-choice-w,clamp(110px,19vw,270px))!important;
            }
          }
          </style>
          '''
            tmp=p.with_suffix('.html.m36tmp')
            with p.open('rb') as src,tmp.open('wb') as dst:
              remaining=0
              while remaining<start:
                b=src.read(min(256*1024,start-remaining))
                if not b: raise SystemExit('EOF before contrast style')
                dst.write(b); remaining+=len(b)
              src.seek(end)
              until=bodypos-end
              while until>0:
                b=src.read(min(256*1024,until))
                if not b: raise SystemExit('EOF before body insert')
                dst.write(b); until-=len(b)
              dst.write(repair)
              src.seek(bodypos)
              while True:
                b=src.read(256*1024)
                if not b: break
                dst.write(b)
            os.replace(tmp,p)
          # Re-count key feature signatures via mmap only; don't print game source.
          with p.open('rb') as f:
            mm=mmap.mmap(f.fileno(),0)
            after={}
            for t in terms:
              n=0; pos=0
              while True:
                pos=mm.find(t,pos)
                if pos<0: break
                n+=1; pos+=len(t)
              after[t.decode()]=n
            has_old=mm.find(marker)>=0
            has_new=mm.find(b'm36-landscape-column3-original-icons-20261016')>=0
            mm.close()
          evidence={'bytesBefore':original_size,'bytesAfter':p.stat().st_size,
            'removedBytes':original_size-p.stat().st_size+len(repair),
            'contrastOverrideRemoved':not has_old,'singleCleanRepairBlock':has_new,
            'featureMarkerCountsBefore':before,'featureMarkerCountsAfter':after,
            'featureMarkersUnchanged':before==after}
          Path('/tmp/m36-column3-patch.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2))
          print(json.dumps(evidence,ensure_ascii=False))
          if not has_new or has_old or before!=after: raise SystemExit('Patch integrity check failed')
          PY
          git diff --check
      - name: Run actual game in Chromium and verify columns and native icons
        run: |
          cat > /tmp/m36-column3-repair.cjs <<'NODE'
          const fs=require('fs'),http=require('http'),cp=require('child_process');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const file='Wayward_MOD_v3.36.html';
          const report={head:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),boot:[],views:[],errors:[],verdict:'FAIL'};
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const server=http.createServer((req,res)=>{
            if(String(req.url||'').split('?')[0]!=='/Wayward_MOD_v3.36.html'){res.writeHead(404);res.end();return;}
            res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-store'});
            fs.createReadStream(file).pipe(res);
          });
          async function click(page,re){
            const b=page.getByRole('button',{name:re}).first();
            if(!await b.count().catch(()=>0)||!await b.isVisible().catch(()=>false))return false;
            await b.evaluate(e=>e.click()); await wait(350); return true;
          }
          async function boot(page){
            const actions=[];
            for(let i=0;i<75;i++){
              const ready=await page.evaluate(()=>!!(document.querySelector('.mobile-layout')&&document.querySelector('.mobile-action-panel')&&document.querySelector('.mobile-action-scroll'))).catch(()=>false);
              if(ready){report.boot.push({ok:true,actions});return;}
              if(await click(page,/^예$/)){actions.push('age');continue;}
              if(await click(page,/이해하고 동의합니다/)){actions.push('consent');continue;}
              if(await click(page,/계속하기/)){actions.push('continue');continue;}
              if(actions.includes('wife')&&await click(page,/엘레나/)){actions.push('Elena');continue;}
              if(!actions.includes('wife')&&await click(page,/아내/)){actions.push('wife');continue;}
              if(await click(page,/엘레나/)){actions.push('Elena');continue;}
              if(await click(page,/^새 게임$/)){actions.push('new game');continue;}
              if(await click(page,/건너뛰기/)){actions.push('skip prologue');continue;}
              if(await click(page,/^다음$/)){actions.push('next prologue');continue;}
              await wait(200);
            }
            throw new Error('Game boot failed: '+JSON.stringify(actions)+'; '+(await page.locator('body').innerText().catch(()=>'' )).slice(-600));
          }
          async function inspect(page,label){
            const m=await page.evaluate(label=>{
              const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),right:+r.right.toFixed(2),width:+r.width.toFixed(2),y:+r.y.toFixed(2),bottom:+r.bottom.toFixed(2),height:+r.height.toFixed(2)}};
              const layout=document.querySelector('.mobile-layout'),panel=document.querySelector('.mobile-action-panel'),choices=document.querySelector('.mobile-action-panel .mobile-action-scroll');
              const launch=document.querySelector('.m34-header .m33-launchers'),sys=document.querySelector('.m34-header .m34-system-tools');
              const cw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--m36-landscape-choice-w'))||parseFloat(getComputedStyle(panel).getPropertyValue('--m36-landscape-choice-w'))||null;
              const choiceX=choices?.getBoundingClientRect().x;
              const children=panel?[...panel.children].filter(e=>!e.matches('button:last-child')).map(e=>({tag:e.tagName,cls:String(e.className||'').slice(0,75),rect:rect(e),scroll:e.matches('.mobile-action-scroll')})):[];
              const buttons=root=>root?[...root.querySelectorAll('button')].map(e=>({label:e.getAttribute('aria-label')||e.title||'',smallCount:e.querySelectorAll('small').length,hiddenSmall:[...e.querySelectorAll('small')].every(n=>getComputedStyle(n).display==='none'),svgCount:e.querySelectorAll('svg').length,iconClass:[...e.querySelectorAll('.m34-icon')].map(n=>n.className.baseVal||n.className).slice(0,2),innerHTML:e.innerHTML.slice(0,180),text:e.innerText})): [];
              return {label,viewport:{width:innerWidth,height:innerHeight,clientWidth:document.documentElement.clientWidth,docWidth:document.documentElement.scrollWidth},
                layout:rect(layout),panel:rect(panel),panelGrid:panel?getComputedStyle(panel).gridColumn:null,choices:rect(choices),choiceVar:cw,choiceX,
                contentChildren:children,launchers:rect(launch),launcherButtons:buttons(launch),systemTools:rect(sys),systemButtons:buttons(sys),
                contrastStylePresent:!!document.getElementById('m36-landscape-icon-visibility-20261016'),
                repairStylePresent:!!document.getElementById('m36-landscape-column3-original-icons-20261016')};
            },label);
            const failures=[];
            if(m.viewport.docWidth>m.viewport.clientWidth+1)failures.push('document horizontal overflow');
            if(m.layout && (m.layout.x<27||m.layout.x>29||m.layout.right>m.viewport.clientWidth+1))failures.push('layout escapes reserved 28px rail/viewport');
            if(m.panel&&m.choices){
              for(const ch of m.contentChildren){
                if(ch.rect && ch.rect.right>m.choices.x+2)failures.push('column-three child protrudes into choices: '+ch.cls+' right='+ch.rect.right+' choiceX='+m.choices.x);
              }
              if(m.choices.right>m.viewport.clientWidth+1)failures.push('choice column outside viewport');
            }
            if(m.launcherButtons.length!==3)failures.push('original launcher count changed');
            if(m.systemButtons.length!==6)failures.push('original system tool count changed');
            if(m.launcherButtons.some(x=>x.smallCount&&!x.hiddenSmall)||m.systemButtons.some(x=>x.smallCount&&!x.hiddenSmall))failures.push('visible text labels remain in small elements');
            if(m.contrastStylePresent||!m.repairStylePresent)failures.push('wrong styles remain');
            return {...m,checks:{pass:!failures.length,failures}};
          }
          (async()=>{
            await new Promise((resolve,reject)=>server.listen(4173,'127.0.0.1',e=>e?reject(e):resolve()));
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            page.on('pageerror',e=>report.errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:60000});
            await wait(600); await boot(page);
            const portraitBefore=await page.evaluate(()=>{const r=e=>{const b=e?.getBoundingClientRect();return b?{x:+b.x.toFixed(2),y:+b.y.toFixed(2),right:+b.right.toFixed(2),bottom:+b.bottom.toFixed(2),width:+b.width.toFixed(2),height:+b.height.toFixed(2)}:null};return {layout:r(document.querySelector('.mobile-layout')),panel:r(document.querySelector('.mobile-action-panel')),choices:r(document.querySelector('.mobile-action-scroll')),width:document.documentElement.scrollWidth};});
            for(const v of [{label:'1280x720',width:1280,height:720},{label:'915x412',width:915,height:412},{label:'720x360',width:720,height:360},{label:'620x340',width:620,height:340}]){
              await page.setViewportSize({width:v.width,height:v.height}); await wait(300); report.views.push(await inspect(page,v.label));
            }
            await page.setViewportSize({width:390,height:844});await wait(300);
            const portraitAfter=await page.evaluate(()=>{const r=e=>{const b=e?.getBoundingClientRect();return b?{x:+b.x.toFixed(2),y:+b.y.toFixed(2),right:+b.right.toFixed(2),bottom:+b.bottom.toFixed(2),width:+b.width.toFixed(2),height:+b.height.toFixed(2)}:null};return {layout:r(document.querySelector('.mobile-layout')),panel:r(document.querySelector('.mobile-action-panel')),choices:r(document.querySelector('.mobile-action-scroll')),width:document.documentElement.scrollWidth};});
            report.portraitBefore=portraitBefore;report.portraitAfter=portraitAfter;
            report.portraitUnchanged=JSON.stringify(portraitBefore)===JSON.stringify(portraitAfter);
            report.verdict=report.boot.every(x=>x.ok)&&report.views.every(x=>x.checks.pass)&&report.errors.length===0&&report.portraitUnchanged?'PASS':'FAIL';
            await browser.close();server.close();
            const patch=JSON.parse(fs.readFileSync('/tmp/m36-column3-patch.json','utf8'));
            report.patch=patch;
            fs.writeFileSync('idea/M36_LANDSCAPE_COLUMN3_ORIGINAL_ICONS_20261016.json',JSON.stringify(report,null,2));
            fs.writeFileSync('/tmp/m36-column3-runtime.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify({verdict:report.verdict,head:report.head,boot:report.boot,views:report.views.map(v=>({label:v.label,viewport:v.viewport,layout:v.layout,panel:v.panel,choices:v.choices,contentChildren:v.contentChildren,counts:{launchers:v.launcherButtons.length,systemTools:v.systemButtons.length},checks:v.checks})),errors:report.errors,portraitUnchanged:report.portraitUnchanged,patch:report.patch},null,2));
            if(report.verdict!=='PASS')process.exitCode=2;
          })().catch(e=>{report.errors.push(String(e.stack||e));report.verdict='FAIL';fs.writeFileSync('/tmp/m36-column3-runtime.json',JSON.stringify(report,null,2));console.error(e);process.exitCode=2;});
          NODE
          set +e
          node /tmp/m36-column3-repair.cjs
          rc=$?
          set -e
          if [ -f /tmp/m36-column3-runtime.json ]; then cp /tmp/m36-column3-runtime.json /tmp/m36-column3-runtime-report.json; fi
          echo "RUNTIME_EXIT=$rc"
      - name: Commit bounded repair and remove temporary workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f /tmp/m36-column3-runtime-report.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('/tmp/m36-column3-runtime-report.json').read_text())
          v=r.get('verdict','FAIL')
          Path('idea/M36_LANDSCAPE_COLUMN3_ORIGINAL_ICONS_20261016.md').write_text(
            '# Landscape column-three and original-icon verification — 2026-10-16\n\n'
            f'**Result: {v}**\n\n'
            f'- Runtime HEAD before patch commit: `{r.get("head","unknown")}`\n'
            f'- Chromium boot: {all(x.get("ok") for x in r.get("boot",[]))}\n'
            f'- Tested viewports: {", ".join(x.get("label","") for x in r.get("views",[]))}\n'
            f'- Portrait geometry unchanged after landscape round-trip: {r.get("portraitUnchanged")}\n'
            f'- Browser errors: {len(r.get("errors",[]))}\n'
            f'- Icon sources: existing launcher/system control DOM retained; no replacement SVG/assets; artificial contrast CSS removed.\n\n'
            'Full measured rectangles and button icon DOM signatures are in the adjacent JSON report.\n')
          PY
            git add Wayward_MOD_v3.36.html idea/M36_LANDSCAPE_COLUMN3_ORIGINAL_ICONS_20261016.json idea/M36_LANDSCAPE_COLUMN3_ORIGINAL_ICONS_20261016.md
          fi
          git rm -f .github/workflows/m36-landscape-column3-icons-repair-20261016.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "fix(mobile): constrain landscape column three and restore native icons"
            git push origin HEAD:mobile-migration-v1
          fi
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
