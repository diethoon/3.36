name: M36 landscape column-three and original-icon repair
"on":
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/m36-landscape-column3-icons-repair-20261016.yml"
permissions:
  contents: write
jobs:
  repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Replace contrast hack with original-icon layout and column bounds
        id: patch
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import mmap, json, os
          p=Path("Wayward_MOD_v3.36.html")
          old_start=b'<style id="m36-landscape-icon-visibility-20261016">'
          end_tag=b'</style>'
          marker=b'm36-landscape-column3-original-icons-20261016'
          terms=[
            b'wayward-save-share', b'm36-mobile-disabled-choice',
            b'm36-mobile-pleasure-fixed', b'M36MobileStoreStatus',
            '물자 채우기'.encode('utf-8'), '시설 업그레이드'.encode('utf-8'),
            '인사하기'.encode('utf-8')
          ]
          with p.open('rb') as f:
            mm=mmap.mmap(f.fileno(),0,access=mmap.ACCESS_READ)
            start=mm.find(old_start)
            if start < 0: raise SystemExit('Expected contrast override not found; HTML left untouched')
            if mm.find(old_start,start+1) >= 0: raise SystemExit('Duplicate override found; HTML left untouched')
            et=mm.find(end_tag,start)
            if et < 0: raise SystemExit('Override terminator missing; HTML left untouched')
            end=et+len(end_tag)
            if mm.find(marker) >= 0: raise SystemExit('Repair marker already exists; refusing duplicate patch')
            before={}
            for t in terms:
              n=0; pos=0
              while True:
                pos=mm.find(t,pos)
                if pos < 0: break
                n+=1; pos+=len(t)
              before[t.decode('utf-8')]=n
            size_before=len(mm)
            mm.close()
          repair='''<style id="m36-landscape-column3-original-icons-20261016">
          /* Keep the original toolbar controls and icon artwork. No recolor, filter or replacement glyphs. */
          @media (orientation:landscape) and (min-width:600px) {
            .m34-header .m33-launchers,
            .m34-header .m34-system-tools {
              display:flex!important; flex-direction:column!important;
              align-items:center!important; justify-content:flex-start!important;
              flex:0 0 28px!important; width:28px!important;
              min-width:28px!important; max-width:28px!important; gap:4px!important;
            }
            .m34-header .m33-launchers button,
            .m34-header .m34-system-tools button {
              box-sizing:border-box!important; width:22px!important; min-width:22px!important;
              max-width:22px!important; height:22px!important; min-height:22px!important;
              max-height:22px!important; padding:2px!important; filter:none!important;
            }
            .m34-header .m33-launchers button small,
            .m34-header .m34-system-tools button small { display:none!important; }
            .mobile-layout {
              box-sizing:border-box!important; left:28px!important; margin-left:0!important;
              width:calc(100% - 28px)!important; max-width:calc(100% - 28px)!important;
              min-width:0!important;
            }
            .mobile-action-panel {
              box-sizing:border-box!important; width:100%!important; max-width:100%!important;
              min-width:0!important; overflow:hidden!important;
            }
            .mobile-action-panel > :not(button:last-child) {
              box-sizing:border-box!important; min-width:0!important;
              width:calc(100% - var(--m36-landscape-choice-w,clamp(110px,19vw,270px)))!important;
              max-width:calc(100% - var(--m36-landscape-choice-w,clamp(110px,19vw,270px)))!important;
            }
            .mobile-action-panel > .flex-1.min-h-0.flex.flex-col {
              box-sizing:border-box!important; min-width:0!important;
              width:calc(100% - var(--m36-landscape-choice-w,clamp(110px,19vw,270px)))!important;
              max-width:calc(100% - var(--m36-landscape-choice-w,clamp(110px,19vw,270px)))!important;
              overflow-x:hidden!important;
            }
            .mobile-action-panel .mobile-action-scroll {
              box-sizing:border-box!important; left:auto!important; right:0!important;
              width:var(--m36-landscape-choice-w,clamp(110px,19vw,270px))!important;
              min-width:0!important; max-width:var(--m36-landscape-choice-w,clamp(110px,19vw,270px))!important;
              overflow-x:hidden!important;
            }
          }
          </style>'''.encode('utf-8')
          tmp=p.with_suffix('.html.m36tmp')
          with p.open('rb') as src, tmp.open('wb') as dst:
            remaining=start
            while remaining:
              b=src.read(min(256*1024,remaining))
              if not b: raise SystemExit('Unexpected EOF before style; temp patch discarded')
              dst.write(b); remaining-=len(b)
            dst.write(repair)
            src.seek(end)
            while True:
              b=src.read(256*1024)
              if not b: break
              dst.write(b)
          os.replace(tmp,p)
          with p.open('rb') as f:
            mm=mmap.mmap(f.fileno(),0,access=mmap.ACCESS_READ)
            after={}
            for t in terms:
              n=0; pos=0
              while True:
                pos=mm.find(t,pos)
                if pos < 0: break
                n+=1; pos+=len(t)
              after[t.decode('utf-8')]=n
            old_present=mm.find(b'm36-landscape-icon-visibility-20261016') >= 0
            new_present=mm.find(marker) >= 0
            mm.close()
          evidence={'bytesBefore':size_before,'bytesAfter':p.stat().st_size,
            'oldContrastOverrideRemoved':not old_present,'singleNewBlock':new_present,
            'featureMarkersUnchanged':before==after,'featureCountsBefore':before,'featureCountsAfter':after}
          Path('/tmp/m36-patch.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2))
          print(json.dumps(evidence,ensure_ascii=False))
          if old_present or not new_present or before!=after: raise SystemExit('Patch integrity check failed')
          PY
          git diff --check
          touch /tmp/m36-patch-ok
      - name: Run game in Chromium at landscape sizes and verify portrait round trip
        id: runtime
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          cat > /tmp/m36-layout-test.cjs <<'NODE'
          const fs=require('fs'),http=require('http'),cp=require('child_process');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const report={head:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),boot:[],views:[],errors:[],verdict:'FAIL'};
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const server=http.createServer((req,res)=>{
            if(String(req.url||'').split('?')[0]!=='/Wayward_MOD_v3.36.html'){res.writeHead(404);res.end();return;}
            res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-store'});
            fs.createReadStream('Wayward_MOD_v3.36.html').pipe(res);
          });
          async function click(page,re){
            const b=page.getByRole('button',{name:re}).first();
            if(!await b.count().catch(()=>0)||!await b.isVisible().catch(()=>false))return false;
            await b.evaluate(e=>e.click());await wait(300);return true;
          }
          async function boot(page){
            const actions=[];
            for(let i=0;i<80;i++){
              const ready=await page.evaluate(()=>!!(document.querySelector('.mobile-layout')&&document.querySelector('.mobile-action-panel')&&document.querySelector('.mobile-action-scroll'))).catch(()=>false);
              if(ready){report.boot.push({ok:true,actions});return;}
              if(await click(page,/^예$/)){actions.push('age');continue;}
              if(await click(page,/이해하고 동의합니다/)){actions.push('consent');continue;}
              if(await click(page,/계속하기/)){actions.push('continue');continue;}
              if(actions.includes('wife')&&await click(page,/엘레나/)){actions.push('Elena');continue;}
              if(!actions.includes('wife')&&await click(page,/아내/)){actions.push('wife');continue;}
              if(await click(page,/엘레나/)){actions.push('Elena');continue;}
              if(await click(page,/^새 게임$/)){actions.push('new game');continue;}
              if(await click(page,/건너뛰기/)){actions.push('skip prologue');continue;}
              if(await click(page,/^다음$/)){actions.push('next prologue');continue;}
              await wait(200);
            }
            throw new Error('Game startup did not reach mobile layout: '+JSON.stringify(actions));
          }
          async function snap(page,label){
            const m=await page.evaluate(label=>{
              const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2)};};
              const layout=document.querySelector('.mobile-layout'),panel=document.querySelector('.mobile-action-panel'),
                choices=document.querySelector('.mobile-action-scroll'),third=panel&&panel.querySelector(':scope > .flex-1.min-h-0.flex.flex-col');
              const buttons=[...document.querySelectorAll('.m34-header .m33-launchers button,.m34-header .m34-system-tools button')];
              const smallVisible=buttons.flatMap(b=>[...b.querySelectorAll('small')]).filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(e).display!=='none';}).length;
              const out={label,innerWidth,innerHeight,clientWidth:document.documentElement.clientWidth,docWidth:document.documentElement.scrollWidth,
                oldOverride:!!document.getElementById('m36-landscape-icon-visibility-20261016'),
                newOverride:!!document.getElementById('m36-landscape-column3-original-icons-20261016'),
                layout:box(layout),panel:box(panel),third:box(third),choices:box(choices),toolbarButtonCount:buttons.length,smallVisible};
              const failures=[];
              if(out.docWidth>out.clientWidth+1)failures.push('document horizontal overflow');
              if(innerWidth>innerHeight){
                if(out.oldOverride||!out.newOverride)failures.push('wrong style block present');
                if(out.layout&&(out.layout.x<26||out.layout.right>innerWidth+2))failures.push('main layout outside viewport');
                if(out.panel&&out.layout&&(out.panel.x<out.layout.x-1||out.panel.right>out.layout.right+2))failures.push('action panel outside layout');
                if(out.choices&&out.layout&&(out.choices.x<out.layout.x-1||out.choices.right>out.layout.right+2))failures.push('choices outside layout');
                if(out.third&&out.choices&&out.third.right>out.choices.x+2)failures.push('column-three text area reaches into choices');
                if(out.smallVisible)failures.push('toolbar label text still visible');
                if(out.toolbarButtonCount<1)failures.push('original toolbar controls missing');
              }else{
                if(out.layout&&Math.abs(out.layout.x)>2)failures.push('portrait layout x moved');
              }
              out.failures=failures;return out;
            },label);
            report.views.push(m);
          }
          (async()=>{
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
              page.on('pageerror',e=>report.errors.push(String(e)));
              await page.goto('http://127.0.0.1:'+server.address().port+'/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:60000});
              await boot(page);await wait(700);
              await page.setViewportSize({width:390,height:844});await wait(500);
              const portraitBefore=await page.evaluate(()=>{
                const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2)};};
                return {layout:box(document.querySelector('.mobile-layout')),panel:box(document.querySelector('.mobile-action-panel')),choices:box(document.querySelector('.mobile-action-scroll')),clientWidth:document.documentElement.clientWidth,docWidth:document.documentElement.scrollWidth};
              });
              for(const v of [{width:1280,height:720,label:'1280x720'},{width:915,height:412,label:'915x412'},{width:720,height:360,label:'720x360'}]){
                await page.setViewportSize({width:v.width,height:v.height});await wait(400);await snap(page,v.label);
              }
              await page.setViewportSize({width:390,height:844});await wait(650);
              const portraitAfter=await page.evaluate(()=>{
                const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2)};};
                return {layout:box(document.querySelector('.mobile-layout')),panel:box(document.querySelector('.mobile-action-panel')),choices:box(document.querySelector('.mobile-action-scroll')),clientWidth:document.documentElement.clientWidth,docWidth:document.documentElement.scrollWidth};
              });
              report.portraitBefore=portraitBefore;report.portraitAfter=portraitAfter;
              const eq=(a,b)=>a&&b&&Object.keys(a).every(k=>typeof a[k]==='number'?Math.abs(a[k]-b[k])<=2:JSON.stringify(a[k])===JSON.stringify(b[k]));
              report.portraitUnchanged=['layout','panel','choices'].every(k=>eq(portraitBefore[k],portraitAfter[k]))&&portraitBefore.clientWidth===portraitAfter.clientWidth&&portraitBefore.docWidth===portraitAfter.docWidth;
              if(!report.portraitUnchanged)report.errors.push('portrait geometry changed after landscape round trip');
              for(const v of report.views)for(const f of v.failures)report.errors.push(v.label+': '+f);
              report.verdict=report.boot.length&&report.boot.every(x=>x.ok)&&report.views.length===3&&report.errors.length===0?'PASS':'FAIL';
            }catch(e){report.errors.push(String(e));report.verdict='FAIL';}
            finally{
              fs.writeFileSync('/tmp/m36-runtime.json',JSON.stringify(report,null,2));
              console.log(JSON.stringify(report,null,2));
              await browser.close();server.close();
              if(report.verdict==='PASS')fs.writeFileSync('/tmp/m36-runtime-ok','PASS');
              else process.exitCode=1;
            }
          })();
          NODE
          node /tmp/m36-layout-test.cjs
      - name: Commit tested fix or failure report and remove one-shot workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f /tmp/m36-patch-ok ] && [ -f /tmp/m36-runtime-ok ]; then
            python3 - <<'PY'
          from pathlib import Path
          import json
          patch=json.loads(Path('/tmp/m36-patch.json').read_text())
          r=json.loads(Path('/tmp/m36-runtime.json').read_text())
          text=(
            '# Landscape column-three and original-icon repair — 2026-10-16\n\n'
            'Runtime result: '+r.get('verdict','FAIL')+'\n\n'
            'Exact pre-patch HEAD: '+r.get('head','unknown')+'\n'
            'Feature markers unchanged: '+str(patch.get('featureMarkersUnchanged'))+'\n'
            'Old contrast CSS removed: '+str(patch.get('oldContrastOverrideRemoved'))+'\n'
            'Landscape viewports: '+', '.join(v.get('label','') for v in r.get('views',[]))+'\n'
            'Portrait geometry unchanged: '+str(r.get('portraitUnchanged'))+'\n'
            'Browser errors: '+str(len(r.get('errors',[])))+'\n\n'
            'The left rail retains the existing toolbar controls and icon artwork; only small label text is hidden. The third-column content and choices scroller are width-constrained in landscape only.\n\n'
            'Patch evidence:\n'+json.dumps(patch,ensure_ascii=False,indent=2)+'\n\nRuntime evidence:\n'+json.dumps(r,ensure_ascii=False,indent=2)+'\n'
          )
          Path('idea/M36_LANDSCAPE_COLUMN3_ORIGINAL_ICONS_20261016.md').write_text(text)
          PY
            git add Wayward_MOD_v3.36.html idea/M36_LANDSCAPE_COLUMN3_ORIGINAL_ICONS_20261016.md
            git rm -f .github/workflows/m36-landscape-column3-icons-repair-20261016.yml
            git commit -m "fix(mobile): constrain landscape column three and restore original icons"
          else
            git checkout -- Wayward_MOD_v3.36.html || true
            python3 - <<'PY'
          from pathlib import Path
          import json
          if Path('/tmp/m36-runtime.json').exists():
            obj=json.loads(Path('/tmp/m36-runtime.json').read_text())
            detail=json.dumps(obj,ensure_ascii=False,indent=2)
          elif Path('/tmp/m36-patch.json').exists():
            detail=json.dumps(json.loads(Path('/tmp/m36-patch.json').read_text()),ensure_ascii=False,indent=2)
          else:
            detail='Patch step failed before a report was written. See the Actions logs for the exact error.'
          Path('idea/M36_LANDSCAPE_COLUMN3_ORIGINAL_ICONS_20261016.md').write_text(
            '# Landscape column-three and original-icon repair — 2026-10-16\n\n'
            'Result: FAIL. No HTML changes committed.\n\n'+detail+'\n')
          PY
            git checkout -- Wayward_MOD_v3.36.html || true
            git add idea/M36_LANDSCAPE_COLUMN3_ORIGINAL_ICONS_20261016.md
            git rm -f .github/workflows/m36-landscape-column3-icons-repair-20261016.yml
            git commit -m "docs(mobile): record landscape column repair failure"
          fi
          git push origin HEAD:mobile-migration-v1
          echo "PATCH=$(test -f /tmp/m36-patch-ok && echo PASS || echo FAIL) RUNTIME=$(test -f /tmp/m36-runtime-ok && echo PASS || echo FAIL)"
