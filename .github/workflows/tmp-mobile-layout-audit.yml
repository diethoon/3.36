name: tmp-mobile-layout-audit

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bounded mobile layout audit
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          SRC = Path("Wayward_MOD_v3.36.html")
          OUT = Path("/tmp/mobile-layout-audit.txt")
          CHUNK = 64 * 1024
          PATTERNS = [
              "function AOe()","function HD()","function x3e()",
              "M36MobilePersistentStatus","M36MobileCurrentActivity","M36MobileStockStatus",
              "mobile-layout","mobile-main-panel","mobile-action-panel",
              "mobile-action-scroll","actionPanelSide",
              "wayward-mobile-migration-v1","wayward-mobile-ui-v2","wayward-mobile-stock-v1",
              "grid-template-columns","orientation:portrait","orientation:landscape",
          ]

          data = bytearray()
          with SRC.open("rb") as f:
              while True:
                  b=f.read(CHUNK)
                  if not b: break
                  data.extend(b)
          text=data.decode("utf-8", errors="replace")
          lines=text.splitlines()
          out=[]

          out.append(f"BYTES={len(data)} LINES={len(lines)}")
          out.append("")

          # Exact occurrence counts for relevant owners/labels/classes.
          needles = [
              "function AOe()","function HD()","function x3e()",
              "M36MobilePersistentStatus","M36MobileCurrentActivity","M36MobileStockStatus",
              "className:\"mobile-action-panel","className:\"mobile-main-panel",
              "mobile-layout","mobile-action-scroll","actionPanelSide",
              "현재 위치","당신","침실","피파","기력","기분","신뢰","물자 채우기",
              "오후 영업 준비",
          ]
          out.append("[OCCURRENCES]")
          for n in needles:
              out.append(f"{n} => {text.count(n)}")
          out.append("")

          # Print small source windows around every relevant line, capped.
          out.append("[LINE WINDOWS]")
          seen=set()
          for i,line in enumerate(lines,1):
              if any(p in line for p in PATTERNS):
                  key=(i, line[:700])
                  if key in seen: continue
                  seen.add(key)
                  out.append(f"--- line {i} ---")
                  out.append(line[:2400])
          out.append("")

          # CSS rule extraction, line-oriented, only matching selectors/declarations.
          out.append("[CSS MATCHES]")
          for i,line in enumerate(lines,1):
              s=line.strip()
              if any(x in s for x in [
                  ".mobile-layout",".mobile-main-panel",".mobile-action-panel",
                  ".mobile-action-scroll",".m36-mobile-",".actionPanelSide",
                  "grid-template-columns","@media(max-width:1023px)"
              ]):
                  out.append(f"{i}: {s[:1400]}")
          out.append("")

          # Dimension declarations in relevant mobile JSX lines.
          out.append("[MOBILE DIMENSION DECLARATIONS]")
          dim_re=re.compile(r"(w-\[[^\]]+\]|max-w-\[[^\]]+\]|min-w-\[[^\]]+\]|flex-\[[^\]]+\]|grid-template-columns:[^;}}]+|width:[^;}}]+|flex:\s*0\s*0\s*[^;}}]+)")
          for i,line in enumerate(lines,1):
              if any(x in line for x in ["mobile-action-panel","mobile-main-panel","mobile-layout","m36-mobile-","actionPanelSide"]):
                  hits=dim_re.findall(line)
                  if hits:
                      out.append(f"{i}: {' | '.join(hits)}")
          out.append("")

          # Textual duplicates likely caused by same info being rendered in both panels.
          out.append("[DUPLICATE CONTENT CANDIDATES]")
          labels=["현재 위치","당신","침실","피파","기력","기분","신뢰도","신뢰","대기 중","준비 중","오후 영업 준비","물자 채우기"]
          for lab in labels:
              loc=[i for i,l in enumerate(lines,1) if lab in l]
              if len(loc)>1:
                  out.append(f"{lab}: {loc[:20]}")
          out.append("")

          OUT.write_text("\n".join(out), encoding="utf-8")
          print(OUT.read_text(encoding="utf-8"))

          PY

      - name: Cleanup audit workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-mobile-layout-audit.yml
          git commit -m "chore: remove temporary mobile layout audit tooling"
          git push
