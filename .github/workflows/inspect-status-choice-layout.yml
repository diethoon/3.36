name: Inspect mobile status and Elena choices
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/inspect-status-choice-layout.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Stream bounded inspection
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html"); CH=65536
          needles=[
            b'function M36MobileStoreStatus(){',
            b'u.jsx(M36MobileStoreStatus,{})',
            b'activePatronInteraction&&u.jsx(cOe',
            b'u.jsx(cOe,{customerName:s.customerName',
            b'function AOe()',
            b'function cOe('
          ]
          hits={n:[] for n in needles}; carry=b''; base=0
          with p.open('rb') as f:
            while True:
              c=f.read(CH)
              if not c: break
              d=carry+c; db=base-len(carry)
              for n in needles:
                pos=0
                while True:
                  i=d.find(n,pos)
                  if i<0: break
                  hits[n].append(db+i); pos=i+1
              keep=max(len(n) for n in needles)-1
              carry=d[-keep:] if keep else b''; base+=len(c)
          for n,poses in hits.items():
            print("\n###",n.decode("utf-8","replace"),"COUNT",len(poses))
            for off in poses[:8]:
              with p.open('rb') as f:
                f.seek(max(0,off-2200))
                ctx=f.read(len(n)+5200)
              print("OFFSET",off)
              print(ctx.decode("utf-8","replace"))
          print("\n### EOF")
          size=p.stat().st_size
          with p.open('rb') as f:
            f.seek(max(0,size-512))
            print("HTML_BYTES",size)
            print(f.read(512).decode("utf-8","replace"))
          PY