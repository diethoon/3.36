name: TEMP M36 patch probe

on:
  pull_request:
    branches:
      - mobile-migration-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe target source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          required=[
            "function M36MobileRoomCustomer",
            'label:"인사하기"',
            'label:"주문받기"',
            'type:"serve"',
            ".m36-mobile-room-line"
          ]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit("missing: "+", ".join(missing))
          print("PROBE PASS")
          PY
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: m36-patch-probe
          path: /tmp/no-such-file
          if-no-files-found: ignore
