name: tmp-mobile-activity-relayout

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply activity relayout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          SRC=Path("Wayward_MOD_v3.36.html")
          TMP=SRC.with_suffix(".activityrelayout.tmp")
          CHUNK=65536

          old_right=b'children:[u.jsx(GF,{}),u.jsx(M36MobileStockStatus,{})]'
          new_right=b'children:[u.jsx(M36MobileStatusPanel,{}),u.jsx(M36MobileStockStatus,{})]'
          old_activity_call=b'u.jsx(M36MobileCurrentActivity,{})'
          new_activity_call=b'u.jsx(M36MobileRoomActivity,{})'

          start_footer=b'(()=>{const je=l?h.find(it=>it.id===l.customerId)'
          end_footer=b'})(),W&&y&&u.jsx(fF,{'
          keep_footer=b'W&&y&&u.jsx(fF,{'

          insert_before=b'function M36MobileCurrentActivity(){'
          new_functions=b'''function M36MobileStatusPanel(){
            const state=re(d=>d.state),proximity=Rt(d=>d.proximityMode),current=vt(state),ids=Object.keys(state.characters);
            const rooms=Yie(state,wx,{proximity}),extra=new Set;
            if(!wx.includes(current))extra.add(current);
            for(const id of ids){const room=Hn(state,id);if(room&&!wx.includes(room))extra.add(room)}
            const order=[...extra,...rooms];
            return u.jsx("div",{className:"min-w-0",children:order.map(room=>{
              const canSee=room===current||!proximity;
              const women=ids.map((id,index)=>({id,index,wife:state.characters[id]})).filter(row=>row.wife&&Hn(state,row.id)===room);
              const staff=m315StaffAt(state,room);
              const count=women.length+staff.length+(room===current?1:0);
              if(count===0)return null;
              return u.jsxs("div",{className:"mb-2",children:[
                u.jsxs("div",{className:"flex items-center gap-2 mb-0.5",children:[
                  u.jsx("span",{className:`text-[0.62rem] font-semibold uppercase tracking-widest ${room===current?"text-amber-400/90":canSee?"text-stone-500":"text-stone-600"}`,children:gs(room).replace(/^the /,"")}),
                  u.jsx("span",{className:"text-[0.62rem] text-stone-600",children:room===current?"현재 위치":String(count)}),
                  u.jsx("span",{className:"flex-1 h-px bg-stone-800"})
                ]}),
                room===current&&u.jsx(bOe,{}),
                staff.map(row=>u.jsx(M315StaffCard,{row,canSee},`mod-staff-status:${row.kind}`)),
                women.map(({id,index,wife})=>u.jsx(BD,{id,wife,index,canSee},id))
              ]},room);
            })});
          }
          function M36MobileRoomActivity(){
            const state=re(d=>d.state),proximity=Rt(d=>d.proximityMode),current=vt(state),ids=Object.keys(state.characters);
            const rooms=Yie(state,wx,{proximity}),extra=new Set;
            if(!wx.includes(current))extra.add(current);
            for(const id of ids){const room=Hn(state,id);if(room&&!wx.includes(room))extra.add(room)}
            const order=[...extra,...rooms];
            const sections=order.map(room=>{
              const canSee=room===current||!proximity;
              const patrons=state.customers.filter(customer=>Zi(customer)&&ht(state,customer.id)===room);
              const visitors=b7(state,room);
              return {room,canSee,patrons,visitors};
            }).filter(section=>section.patrons.length>0||section.visitors.length>0);
            if(sections.length===0)return null;
            return u.jsxs("section",{className:"m36-mobile-room-activity shrink-0 min-w-0 px-1 pb-1",children:sections.map(({room,canSee,patrons,visitors})=>u.jsxs("div",{className:"mb-1.5",children:[
              u.jsxs("div",{className:"flex items-center gap-2 mb-0.5",children:[
                u.jsx("span",{className:`text-[0.62rem] font-semibold uppercase tracking-widest ${room===current?"text-amber-400/90":canSee?"text-stone-500":"text-stone-600"}`,children:gs(room).replace(/^the /,"")}),
                u.jsx("span",{className:"text-[0.62rem] text-stone-600",children:String(patrons.length+visitors.length)}),
                u.jsx("span",{className:"flex-1 h-px bg-stone-800"})
              ]}),
              patrons.map(customer=>canSee?u.jsx(e3,{customer},customer.id):u.jsxs("div",{className:"flex items-center gap-1.5 px-1.5 py-0.5 text-[0.7rem] text-stone-500",children:[
                u.jsx("span",{className:"w-1.5 h-1.5 rounded-full bg-stone-700 flex-shrink-0","aria-hidden":!0}),
                u.jsx("span",{className:"truncate",children:customer.name})
              ]},customer.id)),
              visitors.map(({of,person})=>u.jsx(wOe,{of,person},person.id))
            ]},room.id??room));
            })});
          }
          '''

          def count_stream(needle):
              total=0;carry=b"";k=max(0,len(needle)-1)
              with SRC.open("rb") as f:
                  while True:
                      b=f.read(CHUNK)
                      if not b:break
                      q=carry+b;total+=q.count(needle);carry=q[-k:] if k else b""
              return total

          checks={
            "right":count_stream(old_right),
            "activity":count_stream(old_activity_call),
            "footer_start":count_stream(start_footer),
            "footer_end":count_stream(end_footer),
            "insert":count_stream(insert_before),
            "new_right":count_stream(new_right)
          }
          print("BEFORE",checks)
          if checks["right"]!=1 or checks["activity"]!=1 or checks["footer_start"]!=1 or checks["footer_end"]!=1 or checks["insert"]!=1 or checks["new_right"]!=0:
              raise SystemExit("TARGET_MISMATCH")

          repl=[
            (old_right,new_right),
            (old_activity_call,new_activity_call)
          ]
          maxlen=max(len(a) for a,_ in repl)
          carry=b""
          inserted=False
          footer_removed=False
          with SRC.open("rb") as s,TMP.open("wb") as d:
              while True:
                  b=s.read(CHUNK)
                  if not b:break
                  q=carry+b
                  safe=max(0,len(q)-max(len(start_footer),len(end_footer),maxlen, len(insert_before))+1)
                  out=q[:safe];carry=q[safe:]
                  for a,z in repl:out=out.replace(a,z)
                  if not inserted:
                      p=out.find(insert_before)
                      if p>=0:
                          out=out[:p]+new_functions+out[p:]
                          inserted=True
                  if footer_removed:
                      d.write(out);continue
                  p=out.find(start_footer)
                  if p>=0:
                      d.write(out[:p])
                      out=out[p+len(start_footer):]
                      q2=out
                      z=q2.find(end_footer)
                      if z>=0:
                          d.write(keep_footer+q2[z+len(end_footer):])
                          footer_removed=True
                      else:
                          carry=q2
                      continue
                  d.write(out)
              out=carry
              for a,z in repl:out=out.replace(a,z)
              if not inserted:
                  p=out.find(insert_before)
                  if p>=0:
                      out=out[:p]+new_functions+out[p:]
                      inserted=True
              if not footer_removed:
                  p=out.find(start_footer)
                  if p>=0:
                      prefix=out[:p];rest=out[p+len(start_footer):];z=rest.find(end_footer)
                      if z<0:raise SystemExit("FOOTER_END_NOT_FOUND")
                      out=prefix+keep_footer+rest[z+len(end_footer):]
                      footer_removed=True
              d.write(out)
          TMP.replace(SRC)

          after={
            "right_old":count_stream(old_right),
            "right_new":count_stream(new_right),
            "activity_old":count_stream(old_activity_call),
            "activity_new":count_stream(new_activity_call),
            "footer_start":count_stream(start_footer),
            "footer_end":count_stream(end_footer),
            "status_panel":count_stream(b'function M36MobileStatusPanel(){'),
            "room_activity":count_stream(b'function M36MobileRoomActivity(){'),
            "gf_calls":count_stream(b'u.jsx(GF,{})')
          }
          print("AFTER",after)
          if after["right_old"]!=0 or after["right_new"]!=1 or after["activity_old"]!=0 or after["activity_new"]!=1:
              raise SystemExit("CALL_REWIRE_FAIL")
          if after["footer_start"]!=0 or after["footer_end"]!=0:
              raise SystemExit("PORTRAIT_STATUS_NOT_REMOVED")
          if after["status_panel"]!=1 or after["room_activity"]!=1 or after["gf_calls"]!=1:
              raise SystemExit("OWNER_COUNTS_FAIL")

          subprocess.run(["git","diff","--check"],check=True)

          # Stream all inline script blocks and syntax-check without loading the HTML as a whole.
          outdir=Path("/tmp/m36-inline");outdir.mkdir(exist_ok=True)
          for f in outdir.glob("*.js"):f.unlink()
          files=[];buf=b"";inside=False;cur=None;idx=0
          with SRC.open("rb") as f:
              while True:
                  b=f.read(CHUNK);eof=not b;buf+=b
                  while True:
                      if not inside:
                          a=buf.find(b"<script")
                          if a<0:
                              if eof:buf=b""
                              else:buf=buf[-8192:]
                              break
                          z=buf.find(b">",a+7)
                          if z<0:buf=buf[a:];break
                          idx+=1;cur=outdir/f"{idx}.js";cur.write_bytes(b"");files.append(cur);buf=buf[z+1:];inside=True
                      else:
                          a=buf.find(b"</script>")
                          if a<0:
                              if eof:
                                  cur.open("ab").write(buf);buf=b"";inside=False
                              else:
                                  k=len(b"</script>")-1
                                  if len(buf)>k:cur.open("ab").write(buf[:-k])
                                  buf=buf[-k:]
                              break
                          cur.open("ab").write(buf[:a]);buf=buf[a+9:];cur=None;inside=False
                  if eof:break
          if inside or buf:raise SystemExit("SCRIPT_EOF_FAIL")
          for f in files:subprocess.run(["node","--check",str(f)],check=True)
          print("NODE_CHECK=PASS",len(files))
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): move room activity below portrait"
          git rm .github/workflows/tmp-mobile-activity-relayout.yml
          git commit -m "chore: remove temporary activity relayout tooling"
          git push
