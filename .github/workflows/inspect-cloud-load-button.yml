name: One-time cloud-load button inspection

on:
  push:
    branches:
      - inspect-cloud-load-button-20261010
    paths:
      - .github/workflows/inspect-cloud-load-button.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read only importer component and save-modal window
        shell: bash
        run: |
          set -eu
          file="Wayward_MOD_v3.36.html"
          echo "FILE_SIZE_BYTES=$(stat -c %s "$file")"
          for token in "function M36CloudImportControl" "const M36_SAVE_SHARE_API" "function EOe"; do
            echo
            echo "===== $token OFFSETS ====="
            LC_ALL=C grep -aboF "$token" "$file" | cut -d: -f1 | head -n 2 || true
            offset=$(LC_ALL=C grep -aboF "$token" "$file" | head -n 1 | cut -d: -f1 || true)
            if [ -n "$offset" ]; then
              before=500
              start=$(( offset > before ? offset-before : 0 ))
              echo "===== $token bounded context; start=$start count=3000 ====="
              dd if="$file" iflag=skip_bytes,count_bytes skip="$start" count=3000 status=none | python -c 'import sys; print(sys.stdin.buffer.read().decode("utf-8", "replace"))'
            fi
          done
