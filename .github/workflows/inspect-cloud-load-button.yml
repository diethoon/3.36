name: One-time cloud-load button inspection

on:
  push:
    branches:
      - inspect-cloud-load-button-20261010
    paths:
      - .github/workflows/inspect-cloud-load-button.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read only cloud-load mount anchor
        shell: bash
        run: |
          set -eu
          file="Wayward_MOD_v3.36.html"
          echo "FILE_SIZE_BYTES=$(stat -c %s "$file")"
          token='I==="saves"&&u.jsxs(u.Fragment,{children:['
          echo "===== target offset ====="
          offset=$(LC_ALL=C grep -aboF "$token" "$file" | head -n 1 | cut -d: -f1 || true)
          echo "offset=$offset"
          if [ -z "$offset" ]; then exit 2; fi
          start=$(( offset > 900 ? offset-900 : 0 ))
          echo "===== only 2600-byte context from $start ====="
          dd if="$file" iflag=skip_bytes,count_bytes skip="$start" count=2600 status=none | python -c 'import sys; print(sys.stdin.buffer.read().decode("utf-8", "replace"))'
