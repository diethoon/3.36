name: one-shot m36 wife location forensic patch v2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[m36-wife-location-run]'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'tmp-m36-wife-location-forensic')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch current mobile branch from exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="b9e01c47338dc574d70c2d81f1c6be74cfd3a721"
          git fetch origin mobile-migration-v1
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          echo "--- forensic chunk locator ---"
          line=$(grep -n -m1 'function M36MobileStoreStatus' Wayward_MOD_v3.36.html | cut -d: -f1)
          echo "M36MobileStoreStatus line=$line"
          start=$((line - 12))
          end=$((line + 60))
          sed -n "${start},${end}p" Wayward_MOD_v3.36.html

          python3 - <<'PY'
          from pathlib import Path
          p = Path("Wayward_MOD_v3.36.html")
          data = p.read_bytes()

          targets = [
            (
              b'const state=re(d=>d.state),dispatch=re(d=>d.dispatch),wife=g(state),playerLoc=re(d=>vt(d.state)),activePatronInteraction=G9(state),',
              b'const state=re(d=>d.state),dispatch=re(d=>d.dispatch),wife=g(state),playerLoc=re(d=>vt(d.state)),wifeLoc=re(d=>be(d.state)),activePatronInteraction=G9(state),',
              "wife location selector"
            ),
            (
              b'  const feeling=topFeeling?u.koLabel("emotion",topFeeling.emotion):"평온";\n',
              b'  const feeling=topFeeling?u.koLabel("emotion",topFeeling.emotion):"평온";\n  const wifeRoomCount=1+state.customers.filter(customer=>Zi(customer)&&ht(state,customer.id)===wifeLoc).length+b7(state,wifeLoc).length+m315StaffAt(state,wifeLoc).length;\n',
              "wife room count"
            ),
            (
              b'''    u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
      u.jsx("span",{className:"m36-mobile-store-label",children:wife.name||"엘레나"}),''',
              b'''    wifeLoc!==playerLoc&&u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
      u.jsx("span",{className:"m36-mobile-store-label",children:gs(wifeLoc).replace(/^the /,"")}),
      u.jsx("span",{className:"m36-mobile-store-value",children:wifeRoomCount})
    ]}),
    u.jsxs("div",{className:"m36-mobile-store-status-line",children:[
      u.jsx("span",{className:"m36-mobile-store-label",children:wife.name||"엘레나"}),''',
              "wife location row"
            )
          ]

          for old,new,label in targets:
              n=data.count(old)
              print(f"{label}: anchor_count={n}")
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, got {n}")
          if b"wifeLoc!==playerLoc" in data:
              raise SystemExit("wife location row already present; refusing duplicate patch")

          for old,new,_ in targets:
              data=data.replace(old,new,1)
          p.write_bytes(data)
          print("PATCH_APPLIED=3")
          PY

          echo "--- post-patch chunk ---"
          line=$(grep -n -m1 'function M36MobileStoreStatus' Wayward_MOD_v3.36.html | cut -d: -f1)
          start=$((line - 4))
          end=$((line + 65))
          sed -n "${start},${end}p" Wayward_MOD_v3.36.html

          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>",text,re.S)
          main=next((x for x in scripts if "function AOe(" in x and "function M36MobileStoreStatus(" in x),None)
          if not main:
              raise SystemExit("main JS block not found")
          Path("/tmp/m36-main.js").write_text(main,encoding="utf-8")
          for marker in [
              "playerLoc=re(d=>vt(d.state))",
              "wifeLoc=re(d=>be(d.state))",
              "wifeRoomCount=",
              "wifeLoc!==playerLoc"
          ]:
              if marker not in main:
                  raise SystemExit("missing marker: "+marker)
          for marker in ['label:"인사하기"','label:"주문받기"','type:"serve",customerId:e.id']:
              if marker not in main:
                  raise SystemExit("existing interaction marker missing: "+marker)
          print("TARGETED_FORENSIC_ASSERTIONS=PASS")
          PY

          node --check /tmp/m36-main.js
          git diff --check
          test "$(git diff --name-only)" = "Wayward_MOD_v3.36.html"
          git diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git diff --cached --check
          git commit -m "fix(mobile): show wife location in right status"
          git push --force-with-lease origin "HEAD:refs/heads/mobile-migration-v1"
          echo "PATCH_HEAD=$(git rev-parse HEAD)"
