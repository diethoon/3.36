name: Temporary Faith launcher ZIP audit
on:
  push:
    branches:
      - audit/faith-launcher-zip
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect image-pack registration and image loading in chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          zpath = pathlib.Path("Wayward_Faith_NoSound_v3.0.0.zip")
          terms = [
            "webkitdirectory", "async function wfPackScanFolder",
            "async function wfPackLoadCatalogues", "function wfPackLoadCatalogues",
            "async function wfPackFindImage", "function wfPackFindImage",
            "function wfPackImage", "function mx(", "const mx=",
            "wfPackValidate(o,s)", "imagePath:n.version===2"
          ]
          with zipfile.ZipFile(zpath) as z:
            html = next(i for i in z.infolist() if i.filename.lower().endswith(".html") and "Wayward_Faith_v3.0.0" in i.filename)
            found = {t: 0 for t in terms}
            overlap = b""
            offset = 0
            with z.open(html) as f:
              while True:
                chunk = f.read(65536)
                if not chunk: break
                data = overlap + chunk
                base = offset - len(overlap)
                low = data.lower()
                for term in terms:
                  if found[term] >= 2: continue
                  needle = term.encode("utf-8").lower()
                  pos = 0
                  while True:
                    pos = low.find(needle, pos)
                    if pos < 0: break
                    abspos = base + pos
                    if abspos >= 0:
                      start, end = max(0, pos-350), min(len(data), pos+len(needle)+2800)
                      snippet = data[start:end].decode("utf-8", "replace")
                      print(f"\\n[{term} offset={abspos}]\\n{snippet[:3200]}")
                      found[term] += 1
                    pos += len(needle)
                    if found[term] >= 2: break
                overlap = data[-4096:]
                offset += len(chunk)
            print("\\nMATCH COUNTS:", ", ".join(f"{k}={v}" for k,v in found.items()))
          PY
