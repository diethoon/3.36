name: Temporary Faith launcher ZIP audit
on:
  push:
    branches:
      - audit/faith-launcher-zip
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted image-pack functions in chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          zpath = pathlib.Path("Wayward_Faith_NoSound_v3.0.0.zip")
          terms = [
            "async function wfPackScanFolder", "function wfPackScanFolder",
            "webkitdirectory", "wfPackValidate", "wfPackParseScript",
            "wfPackCatalogues", "image-packs 폴더 선택"
          ]
          with zipfile.ZipFile(zpath) as z:
            print("=== INSTALLER / DOCS ===")
            for name in [r"Wayward_Faith\\install-packs.cmd", r"Wayward_Faith\\README.md", r"Wayward_Faith\\모바일로_묶기.cmd"]:
              try:
                data = z.read(name).decode("utf-8", "replace")
                print(f"\\n--- {name} ({len(data)} chars) ---\\n{data[:9000]}")
              except KeyError:
                print("MISSING:", name)
            for info in [i for i in z.infolist() if i.filename.lower().endswith((".html", ".htm"))]:
              print(f"\\n=== {info.filename} ({info.file_size} bytes; 64 KiB streaming scan) ===")
              found = {t: 0 for t in terms}
              overlap = b""
              offset = 0
              with z.open(info) as f:
                while True:
                  chunk = f.read(65536)
                  if not chunk: break
                  data = overlap + chunk
                  base = offset - len(overlap)
                  low = data.lower()
                  for term in terms:
                    if found[term] >= 2: continue
                    needle = term.encode("utf-8").lower()
                    pos = 0
                    while True:
                      pos = low.find(needle, pos)
                      if pos < 0: break
                      abspos = base + pos
                      if abspos >= 0:
                        start, end = max(0, pos-450), min(len(data), pos+len(needle)+3400)
                        snippet = data[start:end].decode("utf-8", "replace")
                        print(f"\\n[{term} offset={abspos}]\\n{snippet[:3900]}")
                        found[term] += 1
                      pos += len(needle)
                      if found[term] >= 2: break
                  overlap = data[-4096:]
                  offset += len(chunk)
              print("MATCH COUNTS:", ", ".join(f"{k}={v}" for k,v in found.items()))
          PY
