name: M36 portrait and gauge runtime probe
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/m36-portrait-gauge-probe-20261014.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Run targeted Chromium UI probe
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 >/tmp/wayward-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function start(page){
            await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:60000});
            await wait(500);
            for(let i=0;i<32;i++){
              const body=await page.locator('body').innerText().catch(()=> '');
              if(body.includes('물자 채우기')&&body.includes('대출')) return;
              let clicked=false;
              const next=page.getByRole('button',{name:/^예$|이해하고 동의합니다|다음|계속|시작|확인|완료|진행|게임 시작|새 게임/});
              for(let k=0;k<await next.count();k++){
                try{const b=next.nth(k);if(await b.isVisible()&&await b.isEnabled()){await b.evaluate(e=>e.click());await wait(180);clicked=true;break}}catch{}
              }
              const elena=page.getByRole('button',{name:/^엘레나/});
              if(!clicked&&await elena.count()){try{await elena.first().evaluate(e=>e.click());await wait(180);clicked=true}catch{}}
              if(!clicked) break;
            }
            const body=await page.locator('body').innerText().catch(()=> '');
            console.log('STARTUP_BODY_HEAD',JSON.stringify(body.slice(0,800)));
          }
          async function probe(w,h,label){
            const browser=await chromium.launch({headless:true,args:['--allow-file-access-from-files']});
            const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
            await start(page);
            const result=await page.evaluate(({w,h,label})=>{
              const visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0};
              const rect=e=>{const r=e.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}};
              const info=e=>({tag:e.tagName,cls:String(e.className||'').slice(0,130),id:e.id||'',text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,180),rect:rect(e),display:getComputedStyle(e).display,visibility:getComputedStyle(e).visibility});
              const imgs=[...document.querySelectorAll('img,video,canvas,[style*=\"background-image\"]')].filter(visible).map(e=>({self:info(e),parents:[e.parentElement,e.parentElement?.parentElement,e.parentElement?.parentElement?.parentElement].filter(Boolean).map(info)})).filter(x=>x.self.rect.w>=65&&x.self.rect.h>=65).slice(0,18);
              const special=[...document.querySelectorAll('body *')].filter(visible).filter(e=>{const t=(e.innerText||'').trim();return t==='대기 중'||t==='대기'||/^[+-]\\d+(?:\\.\\d+)?(?:%|점)?$/.test(t)||/상태|관계|에너지|기분|호감/.test(t)}).slice(0,50).map(info);
              const gauge=[...document.querySelectorAll('.m36-mobile-pleasure-fixed,.m36-mobile-choice-gauge,.mobile-action-panel,.mobile-action-scroll,.mobile-layout')].map(info);
              return{label,viewport:{w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth,fullscreen:!!document.fullscreenElement},body:document.body.innerText.slice(0,1200),images:imgs,special,gauge};
            },{w,h,label});
            console.log('PROBE_RESULT',JSON.stringify(result));
            await browser.close();
          }
          (async()=>{await probe(900,600,'landscape-windowed-900x600');await probe(1280,720,'landscape-wide-1280x720');await probe(390,844,'portrait-390x844')})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Remove temporary probe workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/m36-portrait-gauge-probe-20261014.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then git commit -m "chore: remove temporary portrait and gauge probe"; git push origin mobile-migration-v1; fi
