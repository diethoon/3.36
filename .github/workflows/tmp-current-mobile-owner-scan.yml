name: tmp-current-mobile-owner-scan

on:
  push:
    branches: [mobile-migration-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stream current owner targets
        shell: python
        run: |
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          needles=[
            "WaywardMobileStockButton","MobileBar","MobileIie","MobileStatus","MobileLayout",
            "function ple(","function AOe(){","function HD(){","function rI(","function eOe(",
            "물자 채우기","영업 준비","현재 위치","오늘 밤","가게 안","진행일",
            "actionPanelSide","locations","prepStockUpDone","supplyTargets"
          ]
          carry=b""
          chunk=64*1024
          context=6000
          hits=[]
          offset=0
          seen=set()
          with p.open("rb") as f:
            while True:
              c=f.read(chunk)
              if not c: break
              d=carry+c
              base=offset-len(carry)
              s=d.decode("utf-8",errors="replace")
              for n in needles:
                st=0
                while True:
                  i=s.find(n,st)
                  if i<0: break
                  pos=base+len(s[:i].encode("utf-8"))
                  k=(n,pos)
                  if k not in seen:
                    l=max(0,i-context); r=min(len(s),i+len(n)+context)
                    hits.append((pos,n,s[l:r]))
                    seen.add(k)
                  st=i+len(n)
              carry=d[-12000:]
              offset+=len(c)
          out=Path("current_owner_scan.txt")
          lines=[f"SIZE={p.stat().st_size}",f"HITS={len(hits)}",""]
          for pos,n,s in sorted(hits):
            lines += [f"===== {n} @ {pos} =====",s,""]
          out.write_text("\n".join(lines),encoding="utf-8")
      - name: Commit scan
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add current_owner_scan.txt
          git commit -m "chore: temporary current owner scan" || exit 0
          git push
