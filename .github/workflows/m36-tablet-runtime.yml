name: m36 tablet runtime discovery
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Capture four tablet font sizes
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const url='https://static-3-36.onrender.com/Wayward_MOD_v3.36.html';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({
            viewport:{width:1280,height:800},
            deviceScaleFactor:1
          });

          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(1500);

          const yes=page.getByText('예',{exact:true}).first();
          if(await yes.count()) { await yes.click(); await page.waitForTimeout(1800); }

          const agree=page.getByText('이해하고 동의합니다',{exact:true}).first();
          if(await agree.count()) { await agree.click(); await page.waitForTimeout(3000); }

          const settings=page.getByText('설정',{exact:true}).first();
          if(await settings.count()) {
            await settings.click();
            await page.waitForTimeout(700);
          }
          const close0=page.getByText('✕',{exact:true}).last();
          if(await close0.count()) { await close0.click(); await page.waitForTimeout(300); }

          const newGame=page.getByText('새 게임',{exact:true}).first();
          await newGame.click();
          await page.waitForTimeout(2500);

          const pipa=page.getByText('피파',{exact:true}).first();
          await pipa.click();
          await page.waitForTimeout(1500);

          const cont=page.getByText('계속하기 — 피파 →',{exact:true}).first();
          await cont.click();
          await page.waitForTimeout(1800);

          const fateChoices=page.getByText('운명에 맡김',{exact:true});
          for(const b of await fateChoices.all()) {
            if(await b.isEnabled()) {
              await b.click();
              await page.waitForTimeout(60);
            }
          }

          const start=page.getByText('시작 — 피파 →',{exact:true}).first();
          await start.click();
          await page.waitForTimeout(4000);

          const skip=page.getByText('건너뛰기',{exact:true}).first();
          if(await skip.count()) {
            await skip.click();
            await page.waitForTimeout(3000);
          }

          fs.mkdirSync('shots',{recursive:true});

          async function setFontSize(label,file) {
            const menu=page.getByText('☰',{exact:true}).last();
            await menu.click();
            await page.waitForTimeout(350);

            const settingsBtn=page.getByText('설정',{exact:true}).last();
            await settingsBtn.click();
            await page.waitForTimeout(350);

            const fontSelect=page.locator('select').filter({
              has:page.locator('option[value="0.9"]')
            }).first();
            await fontSelect.selectOption({label});
            await page.waitForTimeout(700);

            const close=page.getByText('✕',{exact:true}).last();
            await close.click();
            await page.waitForTimeout(500);

            await page.screenshot({path:file,fullPage:false});
          }

          await setFontSize('작게','shots/tablet-small.png');
          await setFontSize('보통','shots/tablet-normal.png');
          await setFontSize('크게','shots/tablet-large.png');
          await setFontSize('매우 크게','shots/tablet-xlarge.png');

          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: m36-tablet-font-screens
          path: shots/
      - name: Remove temporary runtime workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/m36-tablet-runtime.yml
          git commit -m "chore(test): remove temporary tablet runtime workflow"
          git push origin mobile-migration-v1
