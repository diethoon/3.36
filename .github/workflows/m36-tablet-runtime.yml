name: m36 tablet runtime discovery
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Discover tablet UI
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url='https://static-3-36.onrender.com/Wayward_MOD_v3.36.html';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(1500);
          const yes=page.getByText('예',{exact:true}).first();
          if(await yes.count()) { await yes.click(); await page.waitForTimeout(2500); }
          const agree=page.getByText('이해하고 동의합니다',{exact:true}).first();
          if(await agree.count()) { await agree.click(); await page.waitForTimeout(4000);
          const settings=page.getByText('설정',{exact:true}).first();
          if(await settings.count()) { await settings.click(); await page.waitForTimeout(1000); }
          const sizes=await page.getByText(/^(작게|보통|크게|매우 크게)$/).allTextContents();
          console.log('FONT_SIZE_OPTIONS',sizes.join('|'));
          const close=page.getByText('✕',{exact:true}).last();
          if(await close.count()) { await close.click(); await page.waitForTimeout(500); }
          const newGame=page.getByText('새 게임',{exact:true}).first();
          if(await newGame.count()) { await newGame.click(); await page.waitForTimeout(3500); }
          const pipa=page.getByText('피파',{exact:true}).first();
          if(await pipa.count()) { await pipa.click(); await page.waitForTimeout(2500); }
          const cont=page.getByText('계속하기 — 피파 →',{exact:true}).first();
          if(await cont.count()) { await cont.click(); await page.waitForTimeout(3000); }
          const fateChoices=page.getByText('운명에 맡김',{exact:true});
          for(const b of await fateChoices.all()) { if(await b.isEnabled()) { await b.click(); await page.waitForTimeout(80); } }
          const randomize=page.getByText('모두 운명에 맡기기',{exact:true}).first();
          if(await randomize.count() && await randomize.isEnabled()) { await randomize.click(); await page.waitForTimeout(500); }
          const start=page.getByText('시작 — 피파 →',{exact:true}).first();
          if(await start.count()) { await start.click(); await page.waitForTimeout(6000); } }
          fs.mkdirSync('shots',{recursive:true});
          await page.screenshot({path:'shots/tablet-initial.png',fullPage:false});
          const body=(await page.locator('body').innerText()).slice(0,12000);
          fs.writeFileSync('shots/body.txt',body);
          console.log('BODY_START');
          console.log(body);
          console.log('BODY_END');
          const texts=await page.locator('button').allTextContents();
          fs.writeFileSync('shots/buttons.txt',texts.join('\n'));
          console.log('BUTTONS_START');
          console.log(texts.join('\n'));
          console.log('BUTTONS_END');
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: m36-tablet-discovery
          path: shots/
