name: m36-forensic-choice-area
on:
  push:
    branches: [mobile-migration-v1]
    paths-ignore: ["__m36_forensic_choice_area.txt"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Extract targeted area
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          out=[]
          for needle in ["function M36MobilePleasureFixed","function M36MobileDialogueFixed","mobile-action-scroll","u.jsx(HD,{})","function HD","HD=","m36-mobile-choice-gauge"]:
              pos=[m.start() for m in re.finditer(re.escape(needle),s)]
              out.append(f"### {needle} count={len(pos)}")
              for p in pos[:4]:
                  out.append(f"--- offset={p} ---")
                  out.append(s[max(0,p-5000):min(len(s),p+9000)])
          Path("__m36_forensic_choice_area.txt").write_text("\n".join(out),encoding="utf-8")
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __m36_forensic_choice_area.txt
          git commit -m "chore: temporary choice area forensic report" || exit 0
          git push
