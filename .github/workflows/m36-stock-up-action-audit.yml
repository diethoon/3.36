name: One-shot stock-up action logic audit
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-stock-up-action-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Stream only stock-up function contexts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git show origin/main:Wayward_MOD_v3.36.html > /tmp/main-v336.html
          python3 - <<'PY'
          from pathlib import Path
          terms=['function QM(','function Sge(','function Tge(','stock_up','marketTrip','supplyTargets','max(10','Math.min(10','Math.min(12']
          for ref,path in [('mobile','Wayward_MOD_v3.36.html'),('main','/tmp/main-v336.html')]:
            p=Path(path); size=p.stat().st_size; data={}
            carry=b''; offset=0; maxlen=max(map(lambda x:len(x.encode()),terms))
            with p.open('rb') as f:
              while True:
                ch=f.read(65536)
                if not ch:break
                chunk=carry+ch; base=offset-len(carry)
                for term in terms:
                  pat=term.encode(); pos=0
                  while True:
                    i=chunk.find(pat,pos)
                    if i<0:break
                    at=base+i
                    if len(data.get(term,[]))<10:data.setdefault(term,[]).append(at)
                    pos=i+1
                offset+=len(ch);carry=chunk[-maxlen:]
            print('\n=====REF',ref,'BYTES',size,'=====')
            shown=[]
            for term in terms:
              poses=data.get(term,[])
              print('TERM',term,'OFFSETS',poses[:5])
              for at in poses[:3]:
                if any(abs(at-old)<800 for old in shown):continue
                shown.append(at)
                with p.open('rb') as f:
                  f.seek(max(0,at-2400)); snippet=f.read(5200)
                print('\n---',term,'OFFSET',at,'---')
                print(snippet.decode('utf-8','replace').replace('\n',' ')[:5200])
          PY
      - name: Remove temporary stock-up audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/m36-stock-up-action-audit.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary stock-up action audit"
            git push origin HEAD:mobile-migration-v1
          fi
