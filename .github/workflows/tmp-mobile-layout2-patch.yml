name: tmp-mobile-layout2-patch
on:
  push:
    branches: [mobile-migration-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Apply mobile layout 2 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path=Path("Wayward_MOD_v3.36.html")
          CHUNK=64*1024

          def replace_once(old: bytes,new: bytes):
              tmp=path.with_suffix(".html.tmp")
              keep=max(0,len(old)-1)
              carry=b"";count=0
              with path.open("rb") as src,tmp.open("wb") as dst:
                  while True:
                      c=src.read(CHUNK)
                      if not c:break
                      data=carry+c;cursor=0
                      while True:
                          i=data.find(old,cursor)
                          if i<0:break
                          dst.write(data[cursor:i]);dst.write(new);count+=1;cursor=i+len(old)
                      data=data[cursor:]
                      if len(data)>keep:
                          dst.write(data[:-keep] if keep else data)
                          carry=data[-keep:] if keep else b""
                      else:
                          carry=data
                  dst.write(carry)
              if count!=1:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f"replacement count {count}: {old[:160]!r}")
              tmp.replace(path)

          old_status=b'''function M36MobileStatusPanel(){
