          git diff --check

          python3 <<'PY'
          from pathlib import Path
          import re,subprocess
          src=Path("Wayward_MOD_v3.36.html")
          out=Path("/tmp/wayward-node-check");out.mkdir(parents=True,exist_ok=True)
          for f in out.glob("*.js"):f.unlink()
          buf=b"";active=False;idx=0;h=None;keep=2048
          with src.open("rb") as f:
              while True:
                  c=f.read(64*1024)
                  if not c:break
                  buf+=c
                  while True:
                      if not active:
                          m=re.search(br"<script\b[^>]*>",buf,re.I)
                          if not m:
                              if len(buf)>keep:buf=buf[-keep:]
                              break
                          buf=buf[m.end():];idx+=1;h=(out/f"s{idx}.js").open("wb");active=True
                      else:
                          m=re.search(br"</script\s*>",buf,re.I)
                          if not m:
                              if len(buf)>keep:h.write(buf[:-keep]);buf=buf[-keep:]
                              break
                          h.write(buf[:m.start()]);buf=buf[m.end():];h.close();h=None;active=False
          if active and h:h.write(buf);h.close()
          scripts=list(out.glob("*.js"))
          if not scripts:raise SystemExit("NO_SCRIPT_BLOCKS")
          for s in scripts:
              r=subprocess.run(["node","--check",str(s)],capture_output=True,text=True)
              if r.returncode:print(r.stderr);raise SystemExit("NODE_CHECK_FAIL "+s.name)
          print("NODE_CHECK=PASS",len(scripts))
          tail=b"";total=0
          with src.open("rb") as f:
              while True:
                  c=f.read(64*1024)
                  if not c:break
                  total+=len(c);tail=(tail+c)[-256:]
          print("EOF_STREAM=PASS",total,tail.decode("utf-8","replace"))
          checks=[
            (b'u.jsx(M36MobileRoomActivity,{room,canSee})',1),
            (b'u.jsx(M36MobileRoomActivity,{})',0),
            (b'm36-mobile-wife-status',1),
            (b'wayward-mobile-cleanup-v7',1),
            (b'height:22px !important',1),
            (b'hideStats:!1,forceVisibility:!0',1)
          ]
          def count_stream(needle):
              n=0; carry=b""
              with src.open("rb") as f:
                  while True:
                      ch=f.read(64*1024)
                      if not ch: break
                      d=carry+ch
                      n += d.count(needle)
                      carry=d[-max(0,len(needle)-1):]
              return n
          for needle,expected in checks:
              got=count_stream(needle)
              print("CHECK",needle,got)
              if expected==0 and got!=0:raise SystemExit("UNEXPECTED_MARKER")
              if expected>0 and got<expected:raise SystemExit("MISSING_MARKER")
          PY

          # remove this workflow and known temporary inspection artifacts; harmless if already gone
          for f in             .github/workflows/tmp-mobile-layout2-patch.yml             .github/workflows/tmp-mobile-layout2-context.yml             .github/workflows/tmp-mobile-layout2-fns.yml             .github/workflows/tmp-mobile-layout2-ranges.yml             .github/workflows/tmp-mobile-layout2-focus.yml             .github/workflows/tmp-mobile-layout2-components.yml; do
            [ -e "$f" ] && git rm "$f" || true
          done
          for f in             .github/tmp-mobile-layout2-context.txt             .github/tmp-mobile-layout2-fns.txt             .github/tmp-mobile-layout2-ranges.txt             .github/tmp-mobile-layout2-focus.txt             .github/tmp-mobile-layout2-components.txt; do
            [ -e "$f" ] && git rm "$f" || true
          done
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): compact wife status and activity layout"
          git push origin mobile-migration-v1
