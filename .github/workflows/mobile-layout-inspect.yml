name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-static.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/m36-static.log
          exit 1
      - name: Diagnose app mount and measure layout
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const cases = [{name:'portrait',width:390,height:844},{name:'landscape',width:1920,height:1080}];
          for (const c of cases) {
            const page = await browser.newPage({viewport:{width:c.width,height:c.height}});
            const errors=[], failed=[];
            page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text().slice(0,250));});
            page.on('requestfailed',r=>failed.push(r.url()+':'+(r.failure()?.errorText||'')));
            const response=await page.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            const m=await page.evaluate(()=>({title:document.title,ready:document.readyState,bodyText:document.body?.innerText?.slice(0,500),bodyHtml:document.body?.innerHTML?.slice(0,1000),scripts:[...document.scripts].map(s=>({src:s.src,type:s.type,bytes:s.textContent.length})).slice(-8),root:document.querySelector('#root')?.outerHTML?.slice(0,500),headers:document.querySelectorAll('.m34-header').length,htmlBytes:document.documentElement.outerHTML.length,viewport:{w:innerWidth,h:innerHeight,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight}}));
            console.log('CASE '+c.name+' status='+response.status()+' '+JSON.stringify({m,errors:errors.slice(0,15),failed:failed.slice(0,10)}));
            await page.close();
          }
          await browser.close();
          JS
