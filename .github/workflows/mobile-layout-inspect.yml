name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-static.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/m36-static.log
          exit 1
      - name: Inspect character setup continuation controls
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          const p=await b.newPage({viewport:{width:1920,height:1080}});
          await p.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
          for(let step=0;step<6;step++){
            await p.waitForTimeout(250);
            const labels=(await p.locator('button').allTextContents()).map(t=>t.trim());
            const body=await p.locator('body').innerText();
            let label=null;
            if(labels.includes('예'))label='예';
            else if(labels.includes('이해하고 동의합니다'))label='이해하고 동의합니다';
            else if(labels.includes('새 게임'))label='새 게임';
            else if(body.includes('그녀는 당신에게 어떤 존재인가요?')&&labels.includes('아내'))label='아내';
            else if(labels.some(t=>t.startsWith('엘레나')))label=labels.find(t=>t.startsWith('엘레나'));
            else if(labels.some(t=>t.includes('계속하기 — 엘레나')))label=labels.find(t=>t.includes('계속하기 — 엘레나'));
            if(!label)break;
            await p.locator('button').nth(labels.indexOf(label)).click();
          }
          await p.waitForTimeout(500);
          await p.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
          await p.waitForTimeout(500);
          console.log('SCROLL_BOTTOM '+JSON.stringify(await p.evaluate(()=>({scroll:{y:scrollY,docH:document.documentElement.scrollHeight,bodyH:document.body.scrollHeight},buttons:[...document.querySelectorAll('button')].map((e,i)=>({i,text:e.innerText.trim().replace(/\s+/g,' ').slice(0,140),disabled:e.disabled,rect:(()=>{const r=e.getBoundingClientRect();return {y:Math.round(r.y),h:Math.round(r.height)}})()})),tail:document.body.innerText.slice(-1800)}))));
          await b.close();
          JS
