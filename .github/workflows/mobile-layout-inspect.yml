name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-static.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/m36-static.log
          exit 1
      - name: Enter game and inspect resulting screen
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          const p=await b.newPage({viewport:{width:900,height:400}});
          const errs=[];p.on('pageerror',e=>errs.push(String(e)));
          await p.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
          let relationDone=false,wifeDone=false;
          for(let step=0;step<12;step++){
            await p.waitForTimeout(250);
            const labels=(await p.locator('button').allTextContents()).map(t=>t.trim());
            const body=await p.locator('body').innerText();
            let label=null;
            if(labels.includes('예'))label='예';
            else if(labels.includes('이해하고 동의합니다'))label='이해하고 동의합니다';
            else if(labels.includes('새 게임'))label='새 게임';
            else if(!relationDone&&body.includes('그녀는 당신에게 어떤 존재인가요?')&&labels.includes('아내')){label='아내';relationDone=true;}
            else if(relationDone&&!wifeDone&&labels.some(t=>t.startsWith('엘레나'))){label=labels.find(t=>t.startsWith('엘레나'));wifeDone=true;}
            else if(wifeDone&&labels.some(t=>t.includes('계속하기 — 엘레나'))){label=labels.find(t=>t.includes('계속하기 — 엘레나'));}
            else if(labels.some(t=>t.includes('모두 운명에 맡기기'))){label=labels.find(t=>t.includes('모두 운명에 맡기기'));}
            else if(labels.some(t=>t.includes('시작 — 엘레나'))){label=labels.find(t=>t.includes('시작 — 엘레나'));}
            else if(labels.some(t=>t.includes('시작'))){label=labels.find(t=>t.includes('시작'));}
            else break;
            console.log('STEP '+step+' '+JSON.stringify(label));
            await p.getByRole('button',{name:label,exact:true}).click({timeout:3000}).catch(async()=>{await p.getByText(label,{exact:true}).click({timeout:3000}).catch(()=>{});});
          }
          await p.waitForTimeout(1000);
          console.log('RESULT '+JSON.stringify(await p.evaluate(()=>({body:document.body.innerText.slice(0,1800),buttons:[...document.querySelectorAll('button')].map((e,i)=>({i,t:e.innerText.trim().replace(/\s+/g,' ').slice(0,100),disabled:e.disabled})).slice(0,50),viewport:{w:innerWidth,h:innerHeight,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight},styleIds:[...document.querySelectorAll('style[id]')].map(e=>e.id).filter(x=>/landscape|mobile/i.test(x))}))));
          console.log('ERRORS '+JSON.stringify(errs.slice(0,10)));
          await b.close();
          JS
