name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Extract bounded landscape CSS and layout structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          s = Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8", errors="replace")
          print(f"SOURCE_BYTES={len(s.encode())}")
          print(f"SOURCE_SHA256={hashlib.sha256(s.encode()).hexdigest()}")
          ids = ["wayward-mobile-landscape-clean-v11", "wayward-landscape-header-fit-v10"]
          for ident in ids:
              needle = 'id="' + ident + '"'
              pos = s.find(needle)
              print(f"\nBLOCK={ident} FOUND={pos >= 0} OFFSET={pos}")
              if pos >= 0:
                  start = s.rfind("<style", 0, pos)
                  end = s.find("</style>", pos)
                  if end >= 0:
                      block = s[start:end+8]
                      print(f"BLOCK_CHARS={len(block)}")
                      print(block[:18000])
          for term in ["className:\"mobile-layout\"", "className:\"mobile-portrait-panel\"", "className:\"mobile-action-scroll\""]:
              pos = s.find(term)
              print(f"\nSTRUCTURE={term} OFFSET={pos}")
              if pos >= 0:
                  print(s[max(0,pos-900):pos+1700])
          PY
