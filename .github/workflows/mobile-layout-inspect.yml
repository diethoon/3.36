name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Map injected style blocks and targeted anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          s = Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8", errors="replace")
          print(f"SOURCE_BYTES={len(s.encode())}")
          print(f"SOURCE_SHA256={hashlib.sha256(s.encode()).hexdigest()}")
          tags = list(re.finditer(r'<(?:style|script)\b[^>]*\bid=["\']([^"\']+)["\'][^>]*>', s, re.I))
          print("\nLAST_NAMED_BLOCKS")
          for m in tags[-60:]:
              print(f"{m.start()} {m.group(0)[:180]}")
          print("\nLANDSCAPE_BLOCKS")
          for m in re.finditer(r'<style\b[^>]*>.*?</style>', s, re.I|re.S):
              block=m.group(0)
              if re.search(r'orientation\s*:\s*landscape|wayward.*landscape|landscape.*wayward',block,re.I):
                  ident=re.search(r'\bid=["\']([^"\']+)',block,re.I)
                  print(f"OFFSET={m.start()} LEN={len(block)} ID={ident.group(1) if ident else '(unnamed)'}")
          print("\nEOF_8000")
          print(s[-8000:])
          PY
