name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Extract bounded layout CSS and selector inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8",errors="replace")
          print("SOURCE_BYTES",len(s.encode()),"SHA256",hashlib.sha256(s.encode()).hexdigest())
          ids=["wayward-mobile-migration-v1","m36-mobile-space-layout-v2","wayward-mobile-landscape-clean-v11","wayward-landscape-header-fit-v10"]
          for ident in ids:
              m=re.search(r'<style\b[^>]*\bid=["\']'+re.escape(ident)+r'["\'][^>]*>(.*?)</style>',s,re.I|re.S)
              print("\n===== CSS_BLOCK",ident,"FOUND",bool(m),"LEN",len(m.group(1)) if m else 0,"=====")
              if m: print(m.group(1)[:14000])
          print("\n===== TARGET SELECTORS IN LANDSCAPE CSS =====")
          for m in re.finditer(r'([^{}]+)\{([^{}]*)\}',s,re.S):
              sel=m.group(1).strip()
              if re.search(r'landscape|m34-header|mobile-layout|portrait-panel|main-panel|action-panel|choice-scroll',sel,re.I) and len(sel)<500 and ("@media" in sel or "m34-" in sel or "mobile-" in sel):
                  print(sel[:450].replace("\n"," "),"=>",m.group(2)[:400].replace("\n"," "))
          PY
