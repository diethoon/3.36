name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-static.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/m36-static.log
          exit 1
      - name: Inspect gate buttons and reach game layout
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:1920,height:1080}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text().slice(0,200));});
          await page.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
          for(let step=0;step<5;step++){
            await page.waitForTimeout(700);
            const state=await page.evaluate(()=>({text:document.body.innerText.slice(0,500),buttons:[...document.querySelectorAll('button')].map((b,i)=>({i,text:b.innerText.trim(),disabled:b.disabled,cls:b.className})).slice(0,20),inputs:[...document.querySelectorAll('input')].map((e,i)=>({i,type:e.type,checked:e.checked,label:e.getAttribute('aria-label')})).slice(0,10)}));
            console.log('GATE_STEP '+step+' '+JSON.stringify(state));
            const btn=page.locator('button').filter({hasText:/^(예|이해하고 동의합니다|계속|시작|확인|게임 시작|이미지 없이|확인하고 계속)$/}).first();
            if(await btn.count()) {await btn.click({timeout:2000}).catch(()=>{});continue;}
            const candidates=page.locator('button');
            const n=await candidates.count();
            if(n===1) {await candidates.first().click({timeout:2000}).catch(()=>{});continue;}
            break;
          }
          await page.waitForTimeout(2500);
          const final=await page.evaluate(()=>({
            title:document.title,bodyText:document.body.innerText.slice(0,1000),
            buttons:[...document.querySelectorAll('button')].map(b=>b.innerText.trim()).slice(0,30),
            classes:[...document.querySelectorAll('[class]')].map(e=>e.className).filter(x=>typeof x==='string'&&/m34-header|mobile-layout|landscape/i.test(x)).slice(0,50),
            viewport:{w:innerWidth,h:innerHeight,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight},
            blocks:[...document.querySelectorAll('style[id]')].map(e=>({id:e.id,len:e.textContent.length})).filter(x=>/landscape|mobile/i.test(x.id)).slice(-30)
          }));
          console.log('FINAL '+JSON.stringify({final,errors:errors.slice(0,20)}));
          await browser.close();
          JS
