name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-static.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/m36-static.log
          exit 1
      - name: Find the final character-setup action
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1920,height:1080}});
          await page.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
          for(let step=0;step<8;step++){
            await page.waitForTimeout(250);
            const labels=(await page.locator('button').allTextContents()).map(t=>t.trim());
            const body=await page.locator('body').innerText();
            let label=null;
            if(labels.includes('예'))label='예';
            else if(labels.includes('이해하고 동의합니다'))label='이해하고 동의합니다';
            else if(labels.includes('새 게임'))label='새 게임';
            else if(body.includes('그녀는 당신에게 어떤 존재인가요?')&&labels.includes('아내'))label='아내';
            else if(labels.some(t=>t.startsWith('엘레나')))label=labels.find(t=>t.startsWith('엘레나'));
            else if(labels.some(t=>t.includes('계속하기 — 엘레나')))label=labels.find(t=>t.includes('계속하기 — 엘레나'));
            if(!label)break;
            const idx=labels.indexOf(label);
            await page.locator('button').nth(idx).click();
          }
          await page.waitForTimeout(600);
          const details=await page.evaluate(()=>({
            text:document.body.innerText.slice(0,1800),
            buttons:[...document.querySelectorAll('button')].map((b,i)=>({i,text:b.innerText.trim().replace(/\s+/g,' ').slice(0,120),disabled:b.disabled,cls:typeof b.className==='string'?b.className.slice(0,100):''})),
            forms:[...document.querySelectorAll('input,select,[role=button]')].map((e,i)=>({i,tag:e.tagName,role:e.getAttribute('role'),text:(e.innerText||'').trim().slice(0,70),type:e.type,cls:typeof e.className==='string'?e.className.slice(0,80):''})).slice(0,100)
          }));
          console.log('SETUP_DETAILS '+JSON.stringify(details));
          await browser.close();
          JS
