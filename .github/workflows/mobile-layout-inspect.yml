name: Mobile layout targeted source inspection

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/mobile-layout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-static.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/m36-static.log
          exit 1
      - name: Enter game and collect actual layout measurements
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const cases=[{name:'portrait-390x844',width:390,height:844},{name:'landscape-900x400',width:900,height:400},{name:'landscape-1280x720',width:1280,height:720},{name:'landscape-1920x1080',width:1920,height:1080},{name:'landscape-2560x1080',width:2560,height:1080}];
          for(const c of cases){
            const page=await browser.newPage({viewport:{width:c.width,height:c.height}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text().slice(0,130));});
            await page.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
            let relationDone=false,wifeDone=false,started=false;
            for(let step=0;step<20;step++){
              await page.waitForTimeout(250);
              const body=await page.locator('body').innerText();
              const labels=(await page.locator('button').allTextContents()).map(t=>t.trim());
              let idx=-1,reason='';
              if(labels.includes('예')){idx=labels.indexOf('예');reason='age';}
              else if(labels.includes('이해하고 동의합니다')){idx=labels.indexOf('이해하고 동의합니다');reason='consent';}
              else if(labels.includes('새 게임')){idx=labels.indexOf('새 게임');reason='new game';}
              else if(!relationDone&&body.includes('그녀는 당신에게 어떤 존재인가요?')&&labels.includes('아내')){idx=labels.indexOf('아내');relationDone=true;reason='relationship';}
              else if(relationDone&&!wifeDone&&labels.some(t=>t.startsWith('엘레나'))){idx=labels.findIndex(t=>t.startsWith('엘레나'));wifeDone=true;reason='choose Elena';}
              else if(wifeDone&&labels.some(t=>t.includes('계속하기 — 엘레나'))){idx=labels.findIndex(t=>t.includes('계속하기 — 엘레나'));reason='confirm Elena';}
              else if(wifeDone&&labels.some(t=>t.includes('계속하기'))){idx=labels.findIndex(t=>t.includes('계속하기'));reason='continue setup';}
              else if(labels.some(t=>t==='시작')){idx=labels.indexOf('시작');reason='start';}
              else if(labels.some(t=>t==='확인')){idx=labels.indexOf('확인');reason='confirm';}
              else {console.log('STOP '+c.name+' '+JSON.stringify({step,body:body.slice(0,260),labels:labels.slice(0,15)}));break;}
              console.log('CLICK '+c.name+' '+reason+' '+JSON.stringify(labels[idx]));
              await page.locator('button').nth(idx).click({timeout:3000}).catch(e=>console.log('CLICK_ERROR '+String(e).slice(0,100)));
              if(body.includes('이야기')&&body.includes('가게')&&body.includes('엘레나')){started=true;break;}
            }
            await page.waitForTimeout(1000);
            const m=await page.evaluate(()=>{
              const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();const s=getComputedStyle(e);return {tag:e.tagName,cls:typeof e.className==='string'?e.className.slice(0,100):'',id:e.id,x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),scrollW:e.scrollWidth,clientW:e.clientWidth,scrollH:e.scrollHeight,clientH:e.clientHeight,display:s.display,position:s.position,overflow:s.overflow};};
              const all=[...document.querySelectorAll('body *')];
              const candidates=all.filter(e=>{const t=(e.innerText||'').trim();return t==='이야기'||t==='가게'||t==='엘레나'||t.includes('당신과')&&t.length<100;}).slice(0,30).map(rect);
              return {body:document.body.innerText.slice(0,450),buttons:[...document.querySelectorAll('button')].map(b=>b.innerText.trim()).slice(0,20),viewport:{w:innerWidth,h:innerHeight,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight},candidates,styleIds:[...document.querySelectorAll('style[id]')].map(e=>e.id).filter(x=>/landscape|header|mobile/i.test(x)).slice(-20)};
            });
            console.log('CASE '+c.name+' '+JSON.stringify({started,metrics:m,errors:errors.slice(0,5)}));
            await page.close();
          }
          await browser.close();
          JS
