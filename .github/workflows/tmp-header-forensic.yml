name: tmp-header-forensic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !startsWith(github.event.head_commit.message, 'cleanup: remove tmp-header-forensic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          path: mobile
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 1
      - name: Bounded header inspect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mobile/Wayward_MOD_v3.36.html")
          out=Path("mainrepo/header_forensic.txt")
          needles=[
            b"function M36FullscreenButton",
            b"m34-header",
            b"m34-header-tools",
            b"m34-system-tools",
            b"m34-header-control",
            b"m33-theme-button",
            b"m33-launchers",
            b"requestFullscreen",
          ]
          CH=64*1024
          size=p.stat().st_size
          with out.open("w",encoding="utf-8") as w:
              w.write(f"FILE_BYTES={size}\n")
              for needle in needles:
                  hits=[];carry=b"";base=0
                  with p.open("rb") as f:
                      while True:
                          c=f.read(CH)
                          if not c: break
                          d=carry+c
                          start=base-len(carry)
                          at=0
                          while True:
                              i=d.find(needle,at)
                              if i<0: break
                              hits.append(start+i); at=i+1
                          carry=d[-(len(needle)-1):] if len(needle)>1 else b""
                          base+=len(c)
                  w.write(f"\nNEEDLE={needle.decode('utf-8','replace')} HITS={len(hits)}\n")
                  with p.open("rb") as f:
                      for pos in hits[:5]:
                          lo=max(0,pos-3500); hi=min(size,pos+9000)
                          f.seek(lo)
                          w.write(f"\n---OFFSET {pos}---\n")
                          w.write(f.read(hi-lo).decode("utf-8","replace"))
                          w.write("\n")
          print("HEADER_FORENSIC_WRITTEN")
          PY
      - name: Save report
        working-directory: mainrepo
        shell: bash
        run: |
          git add header_forensic.txt
          git commit -m "temp: save header forensic"
          git push origin main
