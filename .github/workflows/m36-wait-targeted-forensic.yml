name: m36-wait-targeted-forensic
on:
  push:
    branches: [mobile-migration-v1]
    paths-ignore: ["__m36_wait_targeted_trigger.txt"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Extract exact target
        shell: python
        run: |
          from pathlib import Path
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          out=[]
          for needle in ["1분","5분","15분"]:
              pos=0
              while True:
                  p=s.find(needle,pos)
                  if p<0: break
                  lo=max(0,p-2500); hi=min(len(s),p+3500)
                  chunk=s[lo:hi]
                  if "5분" in chunk and "15분" in chunk:
                      out.append(f"### TARGET around {needle} offset={p}\n{chunk}")
                  pos=p+len(needle)
          Path("__m36_wait_targeted.txt").write_text("\n---\n".join(out[:12]),encoding="utf-8")
          print("TARGET_MATCHES",len(out))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __m36_wait_targeted.txt
          git commit -m "chore: temporary targeted wait report" || exit 0
          git push
