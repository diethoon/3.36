name: One-shot mobile UI navigation-safe repair
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-ui-navigation-safe-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Repair the malformed tail and make folding navigation-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path("Wayward_MOD_v3.36.html")
          temp = p.with_name(p.name + ".ui-repair.tmp")
          start = b'<style id="m36-mobile-next-ui-v1">'
          end = b'</script></body>'
          replacement = r"""<style id="m36-mobile-next-ui-v1">
          .m36-mobile-disabled-choice{
            position:relative!important;
            display:block!important;
            width:100%!important;
            min-width:0!important;
            min-height:1.9rem!important;
            margin:.08rem 0!important;
            padding:.32rem .5rem!important;
            border:1px solid rgb(68 64 60)!important;
            border-radius:.45rem!important;
            background:rgba(28,25,23,.72)!important;
            color:rgb(120 113 108)!important;
            text-align:left!important;
            font-size:0!important;
            line-height:1.2!important;
            opacity:.62!important;
            overflow:hidden!important;
            white-space:nowrap!important;
          }
          .m36-mobile-disabled-choice > *{display:none!important;}
          .m36-mobile-disabled-choice::before{
            content:attr(data-m36-disabled-choice-label);
            display:block!important;
            min-width:0!important;
            overflow:hidden!important;
            text-overflow:ellipsis!important;
            white-space:nowrap!important;
            font-size:.74rem!important;
            line-height:1.2!important;
          }
          @media(min-width:1024px){
            .m36-mobile-disabled-choice{font-size:inherit!important;opacity:1!important;}
            .m36-mobile-disabled-choice > *{display:revert!important;}
            .m36-mobile-disabled-choice::before{content:none!important;}
          }
          </style>
          <script id="m36-mobile-next-ui-script">
          (() => {
            const mq = window.matchMedia("(max-width:1023px)");
            const root = () => document.querySelector(".mobile-layout");
            const norm = value => String(value || "").replace(/\s+/g, " ").trim();

            function cutAtNumberToken(text, token) {
              const idx = text.indexOf(token);
              if (idx < 0) return text;
              let start = idx;
              const allowed = "0123456789 ";
              while (start > 0 && allowed.includes(text[start - 1])) start--;
              return text.slice(0, start);
            }

            function cleanLabel(value) {
              let text = norm(value);
              const cuts = ["·", "•", "무료", "영업 전", "시간 부족", "시간이 부족",
                "사용 불가", "이용 불가", "완료", "종료", "마감", "끝났", "오후"];
              let cut = text.length;
              for (const token of cuts) {
                const idx = text.indexOf(token);
                if (idx >= 0 && idx < cut) cut = idx;
              }
              text = text.slice(0, cut);
              text = cutAtNumberToken(text, "골드");
              text = cutAtNumberToken(text, "분");
              text = cutAtNumberToken(text, "시간");
              return norm(text);
            }

            function choiceLabel(button) {
              const candidates = [...button.querySelectorAll("span,strong,b")]
                .map(el => norm(el.textContent)).filter(Boolean);
              for (const candidate of candidates) {
                const cleaned = cleanLabel(candidate);
                if (cleaned && cleaned.length <= 60) return cleaned;
              }
              return cleanLabel(button.textContent) || "선택지";
            }

            function choiceStatus(value) {
              const text = norm(value);
              if (text.includes("완료")) return "완료";
              if (text.includes("오후 5시") || text.includes("영업 전") || text.includes("영업시간")) return "영업 전";
              if (text.includes("시간이 부족") || text.includes("시간 부족") ||
                  text.includes("시간이 너무") || text.includes("너무 늦") || text.includes("늦었습니다")) return "시간 부족";
              if (text.includes("종료") || text.includes("마감") || text.includes("끝났")) return "종료";
              if (text.includes("없습니다") || text.includes("없어요") || text.includes("방 안에")) return "이용 불가";
              return "사용 불가";
            }

            function clearButton(button) {
              button.classList.remove("m36-mobile-disabled-choice");
              button.removeAttribute("data-m36-disabled-choice-label");
              button.removeAttribute("data-m36-disabled-choice-status");
            }

            function renderDisabled() {
              const container = root();
              if (!container) return;
              if (!mq.matches) {
                container.querySelectorAll("button.m36-mobile-disabled-choice").forEach(clearButton);
                return;
              }
              // Keep React-owned buttons intact. Only apply classes/data attributes;
              // never replace a button with a different DOM node.
              container.querySelectorAll("button:disabled").forEach(button => {
                button.classList.add("m36-mobile-disabled-choice");
                const label = choiceLabel(button);
                const status = choiceStatus(button.textContent);
                if (button.getAttribute("data-m36-disabled-choice-label") !== label) {
                  button.setAttribute("data-m36-disabled-choice-label", label);
                }
                if (button.getAttribute("data-m36-disabled-choice-status") !== status) {
                  button.setAttribute("data-m36-disabled-choice-status", status);
                }
              });
              container.querySelectorAll("button.m36-mobile-disabled-choice:not(:disabled)").forEach(clearButton);
            }

            // Store fold state independently of DOM nodes. A location change can
            // replace the heading/list while keeping the user's collapsed state.
            const categoryOpen = new Map();

            function categoryKey(heading) {
              const title = norm(heading.textContent).replace(/[▸▾]/g, "").trim();
              if (title === "외출") return "outside";
              if (title.indexOf("마을 둘러보기") === 0) return "village";
              return null;
            }

            function syncCategory(heading, key) {
              const list = heading.nextElementSibling;
              if (!list) return;
              if (!mq.matches) {
                list.style.display = "";
                const oldArrow = heading.querySelector(".m36-category-arrow");
                if (oldArrow) oldArrow.remove();
                heading.style.cursor = "";
                heading.style.userSelect = "";
                heading.removeAttribute("aria-expanded");
                return;
              }

              if (!categoryOpen.has(key)) categoryOpen.set(key, false);
              const open = categoryOpen.get(key) === true;
              let arrow = heading.querySelector(".m36-category-arrow");
              if (!arrow) {
                arrow = document.createElement("span");
                arrow.className = "m36-category-arrow";
                heading.appendChild(arrow);
              }
              const arrowText = open ? " ▾" : " ▸";
              if (arrow.textContent !== arrowText) arrow.textContent = arrowText;
              const display = open ? "" : "none";
              if (list.style.display !== display) list.style.display = display;
              heading.style.cursor = "pointer";
              heading.style.userSelect = "none";
              heading.setAttribute("aria-expanded", open ? "true" : "false");
            }

            function bindCategories() {
              const container = root();
              if (!container) return;
              container.querySelectorAll("h4").forEach(heading => {
                const key = categoryKey(heading);
                if (key) syncCategory(heading, key);
              });
            }

            // Delegation deliberately resolves heading.nextElementSibling at click
            // time so a rerendered list cannot leave a handler pointing at stale DOM.
            document.addEventListener("click", event => {
              const target = event.target;
              if (!mq.matches || !target || typeof target.closest !== "function") return;
              const heading = target.closest(".mobile-layout h4");
              if (!heading) return;
              const key = categoryKey(heading);
              const list = heading.nextElementSibling;
              if (!key || !list) return;
              event.preventDefault();
              event.stopPropagation();
              const open = !(categoryOpen.get(key) === true);
              categoryOpen.set(key, open);
              syncCategory(heading, key);
            }, true);

            let ticking = false;
            function sync() {
              if (ticking) return;
              ticking = true;
              queueMicrotask(() => {
                ticking = false;
                renderDisabled();
                bindCategories();
              });
            }

            const observer = new MutationObserver(sync);
            observer.observe(document.body, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ["disabled", "style"]
            });
            mq.addEventListener?.("change", sync);
            sync();
          })();
          </script>"""
          replacement = replacement.encode("utf-8")
          start_count = 0
          end_count = 0
          state = "before"
          pending = b""
          try:
              with p.open("rb") as src, temp.open("wb") as dst:
                  while True:
                      chunk = src.read(65536)
                      if not chunk:
                          break
                      if state == "after":
                          dst.write(chunk)
                          continue
                      pending += chunk
                      if state == "before":
                          idx = pending.find(start)
                          if idx < 0:
                              safe = max(0, len(pending) - len(start) + 1)
                              if safe:
                                  dst.write(pending[:safe])
                                  pending = pending[safe:]
                              continue
                          start_count += 1
                          if start_count != 1:
                              raise RuntimeError("STYLE_START_NOT_UNIQUE")
                          dst.write(pending[:idx])
                          pending = pending[idx + len(start):]
                          dst.write(replacement)
                          state = "skip"
                      if state == "skip":
                          idx = pending.find(end)
                          if idx < 0:
                              pending = pending[-(len(end) - 1):]
                              continue
                          end_count += 1
                          if end_count != 1:
                              raise RuntimeError("SCRIPT_BODY_END_NOT_UNIQUE")
                          dst.write(b"</body>")
                          dst.write(pending[idx + len(end):])
                          pending = b""
                          state = "after"
                  if state != "after" or start_count != 1 or end_count != 1:
                      raise RuntimeError(f"BOUNDARY_FAIL state={state} start={start_count} end={end_count}")
              # Validate the injected JavaScript, not the 19.6 MB HTML as a whole.
              script = replacement.split(b'<script id="m36-mobile-next-ui-script">', 1)[1].split(b"</script>", 1)[0]
              check = Path("/tmp/m36-mobile-next-ui-script.js")
              check.write_bytes(script)
              result = subprocess.run(["node", "--check", str(check)], capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError("INJECTED_JS_SYNTAX_FAIL\n" + result.stderr)
              # Read-only stream checks of the resulting file; no full-file load.
              def count_bytes(needle):
                  total = 0
                  carry = b""
                  with temp.open("rb") as stream:
                      while True:
                          part = stream.read(65536)
                          if not part: break
                          data = carry + part
                          total += data.count(needle)
                          carry = data[-(len(needle)-1):] if len(needle) > 1 else b""
                  return total
              for needle in (b'<style id="m36-mobile-next-ui-v1">', b"</style>", b'<script id="m36-mobile-next-ui-script">'):
                  print("ANCHOR_COUNT", needle.decode("ascii"), count_bytes(needle))
              if count_bytes(b'<style id="m36-mobile-next-ui-v1">') != 1:
                  raise RuntimeError("NEW_STYLE_ANCHOR_COUNT_FAIL")
              if count_bytes(b'<script id="m36-mobile-next-ui-script">') != 1:
                  raise RuntimeError("NEW_SCRIPT_ANCHOR_COUNT_FAIL")
              if count_bytes(b"replaceWith(row)") != 0:
                  raise RuntimeError("REACT_DOM_REPLACEMENT_STILL_PRESENT")
              if count_bytes(b"font-size:.74rem!importa") != 0:
                  raise RuntimeError("BROKEN_STYLE_SCRIPT_SEAM_REMAINS")
              temp_size = temp.stat().st_size
              print("PATCH_BOUNDARIES=PASS")
              print("INJECTED_JS_NODE_CHECK=PASS")
              print("REACT_DOM_REPLACEMENT=ABSENT")
              print("OUTPUT_BYTES", temp_size)
              temp.replace(p)
          except Exception:
              try: temp.unlink()
              except FileNotFoundError: pass
              raise
          PY
      - name: Verify minimal diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --numstat -- Wayward_MOD_v3.36.html
          test "$(grep -o '<style id="m36-mobile-next-ui-v1">' Wayward_MOD_v3.36.html | wc -l)" -eq 1
          test "$(grep -o '<script id="m36-mobile-next-ui-script">' Wayward_MOD_v3.36.html | wc -l)" -eq 1
          ! grep -q 'font-size:.74rem!importa' Wayward_MOD_v3.36.html
          ! grep -q 'replaceWith(row)' Wayward_MOD_v3.36.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          rm -f .github/workflows/m36-ui-navigation-safe-repair.yml
          git add -u .github/workflows/m36-ui-navigation-safe-repair.yml
          git commit -m "fix(mobile): restore choice folding without navigation DOM corruption"
          git push origin HEAD:mobile-migration-v1
