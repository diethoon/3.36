name: tmp-mobile-ux-audit
on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Bounded audit
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          size=p.stat().st_size
          print("FILE_BYTES", size)
          data=p.read_bytes()
          PY
