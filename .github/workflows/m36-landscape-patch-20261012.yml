name: M36 mobile landscape four-column patch + runtime verification

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: mobile-migration-v1
          fetch-depth: 1

      - name: Replace legacy landscape overrides using bounded I/O
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/m36-landscape-patch.txt
          from pathlib import Path
          import mmap, os, sys

          path = Path("Wayward_MOD_v3.36.html")
          if not path.exists():
              raise SystemExit("SOURCE_NOT_FOUND")
          if path.stat().st_size < 10_000_000:
              raise SystemExit("SOURCE_SIZE_UNEXPECTED")
          patch_id = b'wayward-mobile-landscape-four-column-v13'
          with path.open("rb") as f:
              with mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ) as mm:
                  if mm.find(patch_id) >= 0:
                      raise SystemExit("PATCH_ALREADY_PRESENT")
                  ranges = []
                  for marker in (
                      b'id="wayward-landscape-header-unified-v12"',
                      b'id="wayward-mobile-landscape-clean-v11"',
                  ):
                      pos = mm.find(marker)
                      if pos < 0:
                          raise SystemExit("LEGACY_STYLE_MARKER_NOT_FOUND: " + marker.decode())
                      start = mm.rfind(b"<style", 0, pos)
                      close = mm.find(b"</style>", pos)
                      if start < 0 or close < 0:
                          raise SystemExit("LEGACY_STYLE_BOUNDARY_NOT_FOUND: " + marker.decode())
                      end = close + len(b"</style>")
                      ranges.append((start, end))
                  body_pos = mm.find(b"</body>")
                  if body_pos < 0:
                      raise SystemExit("BODY_END_NOT_FOUND")
                  if len(ranges) != 2 or ranges[0][1] > ranges[1][0]:
                      raise SystemExit("LEGACY_STYLE_RANGES_INVALID")
                  print("SOURCE_BYTES", len(mm))
                  f.seek(0)
                  newline_count = 0
                  while True:
                      block = f.read(65536)
                      if not block: break
                      newline_count += block.count(b"\\n")
                  f.seek(0)
                  print("SOURCE_NEWLINES", newline_count)
                  print("REMOVE_STYLE_RANGES", ranges)
                  print("INSERT_BEFORE_BODY", body_pos)

          css = r"""<style id="wayward-mobile-landscape-four-column-v13">
          @media (orientation:landscape) {
            .m34-header {
              box-sizing:border-box!important;display:flex!important;flex-flow:row wrap!important;
              align-items:center!important;justify-content:flex-start!important;width:100%!important;
              height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;
              padding:2px max(4px,env(safe-area-inset-right)) 2px max(4px,env(safe-area-inset-left))!important;
              column-gap:.55rem!important;row-gap:4px!important;font-size:.65rem!important;
            }
            .m34-header .m34-header-stats,.m34-header .m34-header-tools {
              box-sizing:border-box!important;flex:0 1 auto!important;width:auto!important;min-width:0!important;
              max-width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;
              overflow:visible!important;font-size:.65rem!important;
            }
            .m34-header .m34-header-stats {
              display:flex!important;flex-flow:row wrap!important;align-items:center!important;
              justify-content:flex-start!important;gap:3px .55rem!important;padding:0!important;
            }
            .m34-header .m34-header-stats>div:first-child,.m34-header .m34-header-stats>div:nth-child(2) {
              box-sizing:border-box!important;display:flex!important;flex:0 1 max-content!important;
              flex-flow:row wrap!important;align-items:center!important;min-width:0!important;max-width:100%!important;
              height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;
            }
            .m34-header .m34-header-stats *,.m34-header .m34-header-tools * {
              font-size:.65rem!important;line-height:1.15!important;
            }
            .m34-header .m34-header-tools {
              display:flex!important;flex-flow:row wrap!important;align-items:center!important;
              gap:3px 6px!important;margin:0!important;padding:0!important;
            }
            .m34-header .m34-header-tools>* {
              flex:0 1 auto!important;min-width:0!important;max-width:100%!important;
              white-space:nowrap!important;font-size:inherit!important;line-height:1.15!important;
            }
          }

          @media (orientation:landscape) and (max-height:900px) {
            html,body {width:100%!important;height:100%!important;min-height:0!important;max-height:100%!important;overflow:hidden!important;}
            #root {width:100%!important;height:100dvh!important;min-height:0!important;max-height:100dvh!important;overflow:hidden!important;}
            #root>div {height:100%!important;min-height:0!important;max-height:100%!important;overflow:hidden!important;}
            .flex.flex-col.min-h-0.flex-1:has(> .mobile-layout) {
              flex:1 1 0%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:hidden!important;
            }
            .flex.flex-col.min-h-0.flex-1:has(> .mobile-layout)>.hidden[class~="lg:flex"] {display:none!important;}

            .mobile-layout {
              box-sizing:border-box!important;position:relative!important;display:grid!important;
              grid-template-columns:minmax(0,20%) minmax(0,1fr) minmax(0,min(24vw,17rem)) minmax(0,min(24vw,17rem))!important;
              grid-template-rows:minmax(0,1fr)!important;align-items:stretch!important;gap:4px!important;
              width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;
              max-height:none!important;margin:0!important;overflow:hidden!important;flex:1 1 0%!important;
            }

            .mobile-portrait-panel {
              box-sizing:border-box!important;grid-column:1!important;grid-row:1!important;position:relative!important;
              display:flex!important;flex-direction:column!important;align-items:stretch!important;justify-content:stretch!important;
              width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;
              max-width:100%!important;max-height:none!important;margin:0!important;padding:0!important;overflow:hidden!important;
            }
            .mobile-portrait-panel>* {
              box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;
              justify-content:stretch!important;flex:1 1 0%!important;width:100%!important;height:100%!important;
              min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;
              margin:0!important;padding:0!important;overflow:hidden!important;
            }
            .mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:first-child,
            .mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:nth-child(n+3) {display:none!important;}
            .mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:nth-child(2) {
              box-sizing:border-box!important;display:flex!important;flex:1 1 0%!important;flex-direction:column!important;
              align-items:stretch!important;justify-content:stretch!important;width:100%!important;height:100%!important;
              min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;
              margin:0!important;padding:0!important;overflow:hidden!important;
            }
            .mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:nth-child(2)>:nth-child(2) {display:none!important;}
            .mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:nth-child(2)>:first-child {
              box-sizing:border-box!important;display:flex!important;flex:1 1 0%!important;align-items:stretch!important;
              justify-content:stretch!important;width:100%!important;height:100%!important;min-width:0!important;
              min-height:0!important;max-width:none!important;max-height:none!important;margin:0!important;
              padding:0!important;overflow:hidden!important;background-size:cover!important;background-position:center top!important;
            }
            .mobile-portrait-panel img {
              display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:none!important;
              min-width:0!important;min-height:0!important;object-fit:cover!important;object-position:center top!important;
            }

            .mobile-main-panel {
              box-sizing:border-box!important;grid-column:2!important;grid-row:1!important;position:relative!important;
              display:flex!important;flex-direction:column!important;align-items:stretch!important;width:100%!important;
              height:100%!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;
              margin:0!important;padding:0!important;overflow:hidden!important;border:0!important;
            }
            .mobile-main-panel>.shrink-0.border-b {display:none!important;}
            .mobile-main-panel>.flex-1 {
              box-sizing:border-box!important;display:block!important;flex:1 1 0%!important;width:100%!important;
              height:auto!important;min-width:0!important;min-height:0!important;max-height:none!important;padding:4px!important;
              overflow-x:hidden!important;overflow-y:auto!important;
            }
            .mobile-main-panel .m36-mobile-tabs {
              position:static!important;display:flex!important;flex:0 0 auto!important;flex-flow:row nowrap!important;
              align-items:center!important;justify-content:stretch!important;gap:3px!important;width:100%!important;
              min-width:0!important;max-width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;
              margin:0!important;padding:2px!important;overflow:hidden!important;border:0!important;background:transparent!important;
            }
            .mobile-main-panel .m36-mobile-tabs>* {
              display:inline-flex!important;flex:1 1 0%!important;width:auto!important;min-width:0!important;max-width:100%!important;
              height:auto!important;min-height:28px!important;max-height:none!important;margin:0!important;padding:3px 5px!important;
              overflow:hidden!important;font-size:inherit!important;white-space:nowrap!important;justify-content:center!important;
            }

            .mobile-action-panel {
              box-sizing:border-box!important;grid-column:3/span 2!important;grid-row:1!important;position:relative!important;
              display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
              grid-template-rows:minmax(0,auto) minmax(0,auto) minmax(0,1fr) 26px!important;
              align-items:stretch!important;gap:3px!important;width:100%!important;height:100%!important;
              min-width:0!important;min-height:0!important;max-width:none!important;max-height:none!important;
              margin:0!important;padding:0!important;overflow:hidden!important;border:0!important;
            }
            .mobile-action-panel>* {
              box-sizing:border-box!important;position:static!important;min-width:0!important;max-width:100%!important;
              min-height:0!important;height:auto!important;max-height:100%!important;margin:0!important;
              overflow:auto!important;overflow-wrap:anywhere!important;
            }
            .mobile-action-panel>.m36-mobile-store-status {grid-column:2!important;grid-row:1!important;overflow:auto!important;}
            .mobile-action-panel>.m36-mobile-prep-compact {grid-column:2!important;grid-row:2!important;overflow:auto!important;}
            .mobile-action-panel>.m36-mobile-facility-only {grid-column:2!important;grid-row:3!important;overflow:auto!important;}
            .mobile-action-panel>.flex-1.min-h-0.flex.flex-col {display:contents!important;}
            .mobile-action-panel .m36-mobile-dialogue-fixed {
              box-sizing:border-box!important;grid-column:1!important;grid-row:1!important;align-self:start!important;
              min-width:0!important;min-height:0!important;max-width:100%!important;max-height:100%!important;
              overflow-x:hidden!important;overflow-y:auto!important;
            }
            .mobile-action-panel .m36-mobile-pleasure-fixed {
              box-sizing:border-box!important;grid-column:1!important;grid-row:2!important;align-self:start!important;
              min-width:0!important;min-height:0!important;max-width:100%!important;max-height:100%!important;
              overflow-x:hidden!important;overflow-y:auto!important;
            }
            .mobile-action-panel .mobile-action-scroll {
              box-sizing:border-box!important;grid-column:2!important;grid-row:3!important;position:static!important;
              display:block!important;min-width:0!important;min-height:0!important;width:100%!important;height:auto!important;
              max-width:100%!important;max-height:none!important;margin:0!important;padding:2px!important;
              overflow-x:hidden!important;overflow-y:auto!important;border:0!important;
            }
            .mobile-action-panel:has(>.m36-mobile-prep-compact) {
              grid-template-rows:minmax(0,18%) minmax(0,34%) minmax(0,10%) minmax(0,1fr) 26px!important;
            }
            .mobile-action-panel:has(>.m36-mobile-prep-compact) .mobile-action-scroll {grid-row:4!important;}
            .mobile-action-panel:has(>.m36-mobile-facility-only):not(:has(>.m36-mobile-prep-compact)) {
              grid-template-rows:minmax(0,auto) minmax(0,10%) minmax(0,1fr) 26px!important;
            }
            .mobile-action-panel:has(>.m36-mobile-facility-only):not(:has(>.m36-mobile-prep-compact)) .mobile-action-scroll {grid-row:3!important;}
            .mobile-action-panel>.shrink-0.flex.items-center {
              box-sizing:border-box!important;display:flex!important;grid-column:1/span 2!important;grid-row:-1!important;
              align-items:center!important;justify-content:center!important;width:100%!important;height:26px!important;
              min-width:0!important;min-height:26px!important;max-width:100%!important;max-height:26px!important;
              margin:0!important;padding:0!important;overflow:hidden!important;
            }
            .mobile-action-panel .m36-mobile-dialogue-box {height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;}
            .mobile-action-panel .mobile-action-scroll>div {width:100%!important;min-width:0!important;max-width:100%!important;}
            .mobile-action-panel .mobile-action-scroll button {box-sizing:border-box!important;min-width:0!important;max-width:100%!important;white-space:normal!important;}
          }
          </style>
          """
          css_bytes = ("\n" + css + "\n").encode("utf-8")
          ops = [(a, b, b"") for a, b in ranges]
          ops.append((body_pos, body_pos, css_bytes))
          ops.sort(key=lambda item: item[0])
          temp = path.with_suffix(path.suffix + ".m36tmp")
          cursor = 0
          with path.open("rb") as src, temp.open("wb") as dst:
              for start, end, replacement in ops:
                  if start < cursor:
                      raise SystemExit("PATCH_OPERATIONS_OVERLAP")
                  src.seek(cursor)
                  remaining = start - cursor
                  while remaining:
                      block = src.read(min(65536, remaining))
                      if not block: raise SystemExit("UNEXPECTED_EOF_COPYING_SOURCE")
                      dst.write(block)
                      remaining -= len(block)
                  if replacement:
                      dst.write(replacement)
                  cursor = end
              src.seek(cursor)
              while True:
                  block = src.read(65536)
                  if not block: break
                  dst.write(block)
          os.replace(temp, path)

          with path.open("rb") as f, mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ) as mm:
              for marker in (b'wayward-mobile-landscape-four-column-v13',):
                  if mm.find(marker) < 0: raise SystemExit("PATCH_MARKER_MISSING")
              for marker in (b'wayward-landscape-header-unified-v12', b'wayward-mobile-landscape-clean-v11'):
                  if mm.find(marker) >= 0: raise SystemExit("LEGACY_LANDSCAPE_STYLE_REMAINS")
              print("PATCH_APPLIED_BYTES", len(mm))
              print("PATCH_NEW_STYLE_COUNT", mm[:].count(b'wayward-mobile-landscape-four-column-v13'))
          PY
          git diff --check

      - name: Install browser and inspect four-column layout
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-landscape-static.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS' > /tmp/m36-landscape-runtime.txt 2>&1
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const cases=[{name:'landscape-900x400',width:900,height:400},{name:'landscape-1280x720',width:1280,height:720},{name:'landscape-1920x1080',width:1920,height:1080}];
          let failed=false;
          for(const c of cases){
            const page=await browser.newPage({viewport:{width:c.width,height:c.height}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e).slice(0,150)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text().slice(0,150));});
            try {
              await page.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
              let relationDone=false,wifeDone=false;
              for(let step=0;step<16;step++){
                await page.waitForTimeout(200);
                const labels=(await page.locator('button').allTextContents()).map(t=>t.trim());
                const body=await page.locator('body').innerText();
                let label=null;
                if(labels.includes('예'))label='예';
                else if(labels.includes('이해하고 동의합니다'))label='이해하고 동의합니다';
                else if(labels.includes('새 게임'))label='새 게임';
                else if(!relationDone&&body.includes('그녀는 당신에게 어떤 존재인가요?')&&labels.includes('아내')){label='아내';relationDone=true;}
                else if(relationDone&&!wifeDone&&labels.some(t=>t.startsWith('엘레나'))){label=labels.find(t=>t.startsWith('엘레나'));wifeDone=true;}
                else if(wifeDone&&labels.some(t=>t.includes('계속하기 — 엘레나'))){label=labels.find(t=>t.includes('계속하기 — 엘레나'));}
                else if(labels.some(t=>t.includes('시작 — 엘레나'))){label=labels.find(t=>t.includes('시작 — 엘레나'));}
                else if(labels.includes('건너뛰기'))label='건너뛰기';
                else if(labels.includes('다음'))label='다음';
                else break;
                await page.locator('button').nth(labels.indexOf(label)).click({timeout:2500}).catch(()=>{});
              }
              await page.waitForTimeout(900);
              const out=await page.evaluate(()=>{
                const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),right:Math.round(r.right),bottom:Math.round(r.bottom),scrollW:e.scrollWidth,clientW:e.clientWidth,scrollH:e.scrollHeight,clientH:e.clientHeight,display:s.display,overflowX:s.overflowX,overflowY:s.overflowY,gridTemplateColumns:s.gridTemplateColumns};};
                const pick=s=>rect(document.querySelector(s));
                const stock=[...document.querySelectorAll('.m34-header *')].find(e=>e.children.length===0&&e.textContent.trim()==='재고');
                return {viewport:{w:innerWidth,h:innerHeight,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight},
                  header:pick('.m34-header'),stats:pick('.m34-header-stats'),tools:pick('.m34-header-tools'),
                  stockFont:stock?getComputedStyle(stock).fontSize:null,
                  layout:pick('.mobile-layout'),portrait:pick('.mobile-portrait-panel'),portraitImage:pick('.mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:nth-child(2)>:first-child'),
                  main:pick('.mobile-main-panel'),action:pick('.mobile-action-panel'),dialogue:pick('.mobile-action-panel .m36-mobile-dialogue-fixed'),
                  gauges:pick('.mobile-action-panel .m36-mobile-pleasure-fixed'),choices:pick('.mobile-action-panel .mobile-action-scroll'),
                  status:pick('.mobile-action-panel>.m36-mobile-store-status'),prep:pick('.mobile-action-panel>.m36-mobile-prep-compact'),
                  facility:pick('.mobile-action-panel>.m36-mobile-facility-only'),
                  waiting:pick('.mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:nth-child(2)>:nth-child(2)'),
                  wrapper:getComputedStyle(document.querySelector('.mobile-action-panel>.flex-1.min-h-0.flex.flex-col')||document.body).display,
                  styles:[...document.querySelectorAll('style[id]')].map(e=>e.id).filter(x=>/landscape/i.test(x))};
              });
              console.log('CASE '+c.name+' '+JSON.stringify({out,errors:errors.slice(0,5)}));
              if(c.width<1500){
                if(!out.layout||out.layout.display!=='grid') {console.log('FAIL mobile layout not grid');failed=true;}
                if(!out.layout||out.layout.gridTemplateColumns.split(' ').length!==4) {console.log('FAIL layout does not have four tracks');failed=true;}
                if(!out.header||out.header.h>100) {console.log('FAIL header height');failed=true;}
                if(out.viewport.docW>c.width+2||out.viewport.docH>c.height+3) {console.log('FAIL document overflows viewport');failed=true;}
                if(!out.portrait||!out.main||!out.action||Math.abs(out.portrait.h-out.layout.h)>3||Math.abs(out.main.h-out.layout.h)>3||Math.abs(out.action.h-out.layout.h)>3) {console.log('FAIL panels do not fill layout height');failed=true;}
                if(!out.waiting||out.waiting.display!=='none') {console.log('FAIL portrait waiting-space not hidden');failed=true;}
                const inside=out.action?.gridTemplateColumns?.split(' ')||[];
                if(inside.length!==2||Math.abs(parseFloat(inside[0])-parseFloat(inside[1]))>2) {console.log('FAIL third/fourth content widths differ '+JSON.stringify(inside));failed=true;}
                if(out.choices&&out.choices.x < (out.action.x+out.action.w/2-6)) {console.log('FAIL choices region is not fourth column');failed=true;}
                if(out.stats&&(out.stats.overflowX==='auto'||out.stats.overflowX==='scroll')) {console.log('FAIL header still horizontally scrolls');failed=true;}
              }
            } catch(e) { console.log('CASE_FAIL '+c.name+' '+String(e)); failed=true; }
            await page.close();
          }
          await browser.close();
          if(failed) process.exit(1);
          console.log('RUNTIME_LAYOUT_VALIDATION_PASS');
          JS
          status=$?
          cat /tmp/m36-landscape-runtime.txt
          exit $status

      - name: Commit and push the verified CSS-only patch to mobile-migration-v1
        if: success()
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): reuse portrait UI in four-column landscape layout"
          git push origin HEAD:mobile-migration-v1
          git rev-parse HEAD | tee /tmp/m36-landscape-commit.txt

      - name: Report and clean temporary runner
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROBE_BRANCH: m36-landscape-patch-20261012
          WF_PATH: .github/workflows/m36-landscape-patch-20261012.yml
        run: |
          set +e
          {
            echo "Mobile landscape patch runner result."
            echo
            [ -f /tmp/m36-landscape-patch.txt ] && cat /tmp/m36-landscape-patch.txt
            echo
            [ -f /tmp/m36-landscape-runtime.txt ] && cat /tmp/m36-landscape-runtime.txt
            echo
            [ -f /tmp/m36-landscape-commit.txt ] && echo "COMMIT $(cat /tmp/m36-landscape-commit.txt)"
            echo
            echo "JOB_STATUS: ${{ job.status }}"
          } > /tmp/m36-landscape-patch-report.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/m36-landscape-patch-report.txt)" >/tmp/m36-landscape-report-comment.log 2>&1
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Temporary patch runner completed; no merge performed." >/tmp/m36-landscape-pr-close.log 2>&1
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PROBE_BRANCH" >/tmp/m36-landscape-branch-delete.log 2>&1
          WF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WF_PATH?ref=main" --jq .sha 2>/dev/null)"
          if [ -n "$WF_SHA" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WF_PATH" -f message="chore: remove temporary landscape patch runner" -f sha="$WF_SHA" -f branch=main >/tmp/m36-landscape-workflow-delete.log 2>&1
          fi
          echo "Temporary runner cleanup attempted."
