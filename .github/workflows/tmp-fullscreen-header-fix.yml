name: tmp-fullscreen-header-fix
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Patch fullscreen header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("Wayward_MOD_v3.36.html")
          CH=64*1024

          def replace_once(old: bytes, new: bytes):
              tmp=path.with_suffix(".html.tmp")
              carry=b""; count=0; keep=max(0,len(old)-1)
              with path.open("rb") as src, tmp.open("wb") as dst:
                  while True:
                      c=src.read(CH)
                      if not c: break
                      data=carry+c; pos=0
                      while True:
                          i=data.find(old,pos)
                          if i<0: break
                          dst.write(data[pos:i]); dst.write(new); count+=1; pos=i+len(old)
                      data=data[pos:]
                      if len(data)>keep:
                          dst.write(data[:-keep] if keep else data)
                          carry=data[-keep:] if keep else b""
                      else:
                          carry=data
                  dst.write(carry)
              if count != 1:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f"replacement count={count} old={old!r}")
              tmp.replace(path)

          old=b''':fullscreen .m34-header-tools{flex-wrap:nowrap !important;max-width:none !important}
          :fullscreen .m33-launchers{flex-wrap:nowrap !important}
          :fullscreen .m34-system-tools{flex-wrap:nowrap !important}
          :fullscreen .m34-system-tools .m34-header-control{flex:0 0 32px !important;width:32px !important;min-width:32px !important;max-width:32px !important;height:32px !important;min-height:32px !important;max-height:32px !important;padding:0 !important;font-size:20px !important;line-height:1 !important;display:inline-flex !important;align-items:center !important;justify-content:center !important;white-space:nowrap !important}

          '''
          new=b''':fullscreen .m34-header{width:100% !important;max-width:100% !important;min-width:0 !important;overflow:hidden !important;box-sizing:border-box !important}
          :fullscreen .m34-header-tools{display:flex !important;flex:0 0 auto !important;flex-wrap:nowrap !important;width:auto !important;max-width:none !important;min-width:0 !important;overflow:visible !important;box-sizing:border-box !important}
          :fullscreen .m33-launchers{display:flex !important;flex:0 0 auto !important;flex-wrap:nowrap !important;width:auto !important;max-width:none !important;min-width:0 !important;overflow:visible !important}
          :fullscreen .m34-system-tools{display:flex !important;flex:0 0 auto !important;flex-wrap:nowrap !important;width:auto !important;max-width:none !important;min-width:0 !important;overflow:visible !important;box-sizing:border-box !important}
          :fullscreen .m34-header .m33-theme-button,
          :fullscreen .m34-header .m34-header-control,
          :fullscreen .m33-launchers button,
          :fullscreen .m34-system-tools button{
            flex:0 0 32px !important;
            width:32px !important;
            min-width:32px !important;
            max-width:32px !important;
            height:32px !important;
            min-height:32px !important;
            max-height:32px !important;
            padding:0 !important;
            margin:0 !important;
            font-size:20px !important;
            line-height:1 !important;
            display:inline-flex !important;
            align-items:center !important;
            justify-content:center !important;
            white-space:nowrap !important;
            box-sizing:border-box !important;
            transform:none !important;
          }

          '''
          replace_once(old,new)

          # Harden the existing small-screen media rule too, so fullscreen and normal mobile use the same metrics.
          old2=b'''.m34-header .m33-theme-button,.m34-header-control{width:36px;height:36px;flex:none;'''
          new2=b'''.m34-header .m33-theme-button,.m34-header-control{width:32px;height:32px;flex:0 0 32px;'''
          replace_once(old2,new2)

          print("PATCH=PASS")
          PY

          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          src=Path("Wayward_MOD_v3.36.html")
          out=Path("/tmp/wayward-node-check"); out.mkdir(exist_ok=True)
          for f in out.glob("*.js"): f.unlink()
          buf=b""; active=False; idx=0; h=None; keep=2048
          with src.open("rb") as f:
              while True:
                  c=f.read(64*1024)
                  if not c: break
                  buf += c
                  while True:
                      if not active:
                          m=re.search(br"<script\b[^>]*>",buf,re.I)
                          if not m:
                              if len(buf)>keep: buf=buf[-keep:]
                              break
                          buf=buf[m.end():]; idx += 1
                          h=(out/f"s{idx}.js").open("wb"); active=True
                      else:
                          m=re.search(br"</script\s*>",buf,re.I)
                          if not m:
                              if len(buf)>keep: h.write(buf[:-keep]); buf=buf[-keep:]
                              break
                          h.write(buf[:m.start()]); buf=buf[m.end():]
                          h.close(); h=None; active=False
          if active and h: h.close()
          scripts=list(out.glob("*.js"))
          if len(scripts)!=1: raise SystemExit(f"INLINE_SCRIPT_COUNT={len(scripts)}")
          r=subprocess.run(["node","--check",str(scripts[0])],capture_output=True,text=True)
          if r.returncode:
              print(r.stderr)
              raise SystemExit("NODE_CHECK_FAIL")
          print("NODE_CHECK=PASS")
          total=0; tail=b""
          with src.open("rb") as f:
              while True:
                  c=f.read(64*1024)
                  if not c: break
                  total += len(c); tail=(tail+c)[-256:]
          print("EOF_STREAM=PASS",total,tail.decode("utf-8","replace"))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): lock fullscreen header control size"
          git push origin mobile-migration-v1
