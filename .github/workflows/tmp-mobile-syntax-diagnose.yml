name: tmp-mobile-syntax-diagnose

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current UI patch for diagnosis
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess,sys
          SRC=Path("Wayward_MOD_v3.36.html"); TMP=SRC.with_suffix(".diag.tmp")
          old_left='r==="story"&&u.jsxs(u.Fragment,{children:[u.jsx(qF,{limit:3}),u.jsx("div",{className:"mb-2 pb-2 border-b border-stone-800",children:u.jsx(GF,{})}),T]})'
          old_call='u.jsx(M36MobilePersistentStatus,{})'
          old_narr='return koStoryRootRenderer30(r.logOrder)("div",{ref:a,className:"text-sm",children:['
          new_narr='return koStoryRootRenderer30(r.logOrder)("div",{ref:a,className:"text-sm mobile-narration",children:['
          with SRC.open("rb") as s,TMP.open("wb") as d:
              while True:
                  b=s.read(65536)
                  if not b: break
                  q=b.replace(old_call.encode(),b'u.jsx(GF,{})')
                  q=q.replace(old_left.encode(),b'r==="story"&&u.jsxs(u.Fragment,{children:[u.jsx(qF,{limit:3}),T]})')
                  q=q.replace(old_narr.encode(),new_narr.encode())
                  d.write(q)
          TMP.replace(SRC)
          out=Path("/tmp/m36js");out.mkdir(exist_ok=True)
          for f in out.glob("*.js"):f.unlink()
          buf=b"";inside=False;cur=None;idx=0;files=[]
          with SRC.open("rb") as f:
              while True:
                  b=f.read(65536);eof=not b;buf+=b
                  while True:
                      if not inside:
                          a=buf.find(b"<script")
                          if a<0:
                              if eof:buf=b""
                              else:buf=buf[-8192:]
                              break
                          z=buf.find(b">",a+7)
                          if z<0:buf=buf[a:];break
                          idx+=1;cur=out/f"{idx}.js";cur.write_bytes(b"");files.append(cur);buf=buf[z+1:];inside=True
                      else:
                          a=buf.find(b"</script>")
                          if a<0:
                              if eof:cur.open("ab").write(buf);buf=b"";inside=False
                              else:
                                  k=len(b"</script>")-1
                                  if len(buf)>k:cur.open("ab").write(buf[:-k])
                                  buf=buf[-k:]
                              break
                          cur.open("ab").write(buf[:a]);buf=buf[a+9:];cur=None;inside=False
                  if eof:break
          for f in files:
              p=subprocess.run(["node","--check",str(f)],capture_output=True,text=True)
              print("\n=== NODE RESULT",f,p.returncode,"===")
              print(p.stdout)
              print(p.stderr)
              if p.returncode:
                  lines=f.read_text(encoding="utf-8").splitlines()
                  for n in range(max(1,1980),min(len(lines),1992)+1):
                      print(f"LINE {n}: {lines[n-1]}")
                  raise SystemExit(p.returncode)
          print("NODE_OK")
          PY
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-mobile-syntax-diagnose.yml || true
          git commit -m "chore: remove temporary mobile syntax diagnosis" || true
          git push || true
