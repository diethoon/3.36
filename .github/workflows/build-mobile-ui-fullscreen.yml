name: Build mobile UI fullscreen restore package
on:
  push:
    branches:
      - mobile-ui-migration-438-v7-fullscreen-restore
    paths:
      - "mobile-ui-migration/**"
permissions:
  contents: write
  actions: write
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-migration-438-v7-fullscreen-restore
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and regression tests
        run: |
          node --check mobile-ui-migration/mod.js
          if [ -f mobile-ui-migration/tests/pinned-renderers.test.cjs ]; then
            node mobile-ui-migration/tests/pinned-renderers.test.cjs
          fi
          git diff --check
      - name: Rebuild distributable ZIP
        run: |
          test -f mobile-ui-migration/mobile-ui-migration-438.zip
          rm -rf /tmp/m36-package
          mkdir -p /tmp/m36-package
          unzip -q mobile-ui-migration/mobile-ui-migration-438.zip -d /tmp/m36-package
          MOD_PATH="$(find /tmp/m36-package -type f -name mod.js -print -quit)"
          README_PATH="$(find /tmp/m36-package -type f -name README_ko.md -print -quit)"
          test -n "$MOD_PATH"
          test -n "$README_PATH"
          cp mobile-ui-migration/mod.js "$MOD_PATH"
          cp mobile-ui-migration/README_ko.md "$README_PATH"
          rm -f mobile-ui-migration/mobile-ui-migration-438.zip
          (cd /tmp/m36-package && zip -qr "$GITHUB_WORKSPACE/mobile-ui-migration/mobile-ui-migration-438.zip" .)
          unzip -t mobile-ui-migration/mobile-ui-migration-438.zip
          unzip -p mobile-ui-migration/mobile-ui-migration-438.zip "$(realpath --relative-to=/tmp/m36-package "$MOD_PATH")" | cmp - mobile-ui-migration/mod.js
          unzip -p mobile-ui-migration/mobile-ui-migration-438.zip "$(realpath --relative-to=/tmp/m36-package "$README_PATH")" | cmp - mobile-ui-migration/README_ko.md
          sha256sum mobile-ui-migration/mobile-ui-migration-438.zip
      - name: Commit package and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f mobile-ui-migration/.build-trigger
          rm -f .github/workflows/build-mobile-ui-fullscreen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-ui-migration/mobile-ui-migration-438.zip mobile-ui-migration/.build-trigger .github/workflows/build-mobile-ui-fullscreen.yml
          git commit -m "build(mobile): package fullscreen restore 1.3.3 [skip ci]"
          git push origin HEAD:mobile-ui-migration-438-v7-fullscreen-restore
