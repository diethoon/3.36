name: Forensic apply wife location status

on:
  push:
    branches:
      - gpt-apply-wife-location-20261007

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact verified mobile patch
        shell: python
        run: |
          from pathlib import Path

          p = Path("Wayward_MOD_v3.36.html")
          d = p.read_bytes()

          room_line = b'  const wifeRoomCount=1+state.customers.filter(customer=>Zi(customer)&&ht(state,customer.id)===wifeLoc).length+b7(state,wifeLoc).length+m315StaffAt(state,wifeLoc).length;\n'
          if d.count(room_line) != 1:
              raise SystemExit(f"wifeRoomCount line count={d.count(room_line)}; expected 1")
          d = d.replace(room_line, b"", 1)

          old = b'children:wifeRoomCount'
          if d.count(old) != 1:
              raise SystemExit(f"wifeRoomCount value count={d.count(old)}; expected 1")
          d = d.replace(old, b'children:"\\xed\\x98\\x84\\xec\\uc7ac \\xec\\uc704\\xec\\uce58"', 1)

          p.write_bytes(d)

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', s, re.S)
          main = next((x for x in scripts if 'function AOe(' in x and 'function M36MobileStoreStatus(' in x), None)
          if not main:
              raise SystemExit("main JS block not found")
          for marker in [
              'playerLoc=re(d=>vt(d.state))',
              'wifeLoc=re(d=>be(d.state))',
              'wifeLoc!==playerLoc',
              'children:"현재 위치"'
          ]:
              if marker not in main:
                  raise SystemExit(f"missing marker: {marker}")
          if 'wifeRoomCount=' in main:
              raise SystemExit("wifeRoomCount should be removed")
          Path('/tmp/wayward-main.js').write_text(main, encoding='utf-8')
          PY
          node --check /tmp/wayward-main.js
          git diff --check
          git diff --stat
          git status --short

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "diethoon"
          git config user.email "jhy67439787@gmail.com"
          git rm .github/workflows/forensic-apply-wife-location.yml
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): refine wife location status label"
          git push origin HEAD:gpt-apply-wife-location-20261007
