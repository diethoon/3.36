name: M36 landscape choice placement and prep scroll inspection
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/m36-landscape-choice-prep-inspection-20261014.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect targeted component and styles in bounded chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          terms=[
            "function M36MobileStoreStatus",
            "function M36MobileStockStatus",
            "function uOe",
            "function p3e",
            "function _3e",
            "m36-mobile-choice-fixed",
            "m36-mobile-prep-detail",
            "mobile-action-scroll",
            "mobile-action-panel",
            "m36-mobile-store-status",
            "orientation:landscape",
            "grid-template-columns:repeat(3",
            "m36-landscape",
            "M36MobileStockStatus"
          ]
          counts={t:0 for t in terms}; seen=set(); overlap=b""; offset=0
          with p.open("rb") as f:
            while True:
              chunk=f.read(256*1024)
              if not chunk: break
              buf=overlap+chunk; base=offset-len(overlap)
              for term in terms:
                needle=term.encode("utf-8"); pos=0
                while True:
                  i=buf.find(needle,pos)
                  if i<0: break
                  absolute=base+i; key=(term,absolute)
                  if absolute>=offset and key not in seen:
                    seen.add(key); counts[term]+=1
                    limit=5 if term in ("function M36MobileStoreStatus","function M36MobileStockStatus","function uOe","m36-mobile-choice-fixed") else 4
                    if counts[term]<=limit:
                      a=max(0,i-750); z=min(len(buf),i+len(needle)+1400)
                      print(f"\n--- {term} #{counts[term]} OFFSET={absolute} ---")
                      print(buf[a:z].decode("utf-8","replace").replace("\\n"," ")[:2200])
                  pos=i+len(needle)
              offset+=len(chunk); overlap=buf[-4096:]
          print("\n--- COUNTS ---")
          for t,n in counts.items(): print(t,n)
          PY
      - name: Remove temporary inspection workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/m36-landscape-choice-prep-inspection-20261014.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary landscape choice inspection"
            git push origin mobile-migration-v1
          fi
