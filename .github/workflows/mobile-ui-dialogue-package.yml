name: Temporary M36 mobile dialogue package test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - mobile-ui-migration-dialogue-pinned-20261103
    paths:
      - .github/workflows/mobile-ui-dialogue-package.yml
      - mobile-ui-migration/mod.js
      - mobile-ui-migration/README_ko.md
      - tests/test-dialogue-pin.cjs

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check mobile-ui-migration/mod.js

      - name: Test React tree preservation and UI conditions
        run: node tests/test-dialogue-pin.cjs

      - name: Check patch whitespace
        env:
          BASE_SHA: \${{ github.event.pull_request.base.sha }}
          HEAD_SHA: \${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Build and verify install ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/mobile-ui-migration-1.4.0.zip \
            mobile-ui-migration/mod.js \
            mobile-ui-migration/README_ko.md
          unzip -t dist/mobile-ui-migration-1.4.0.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib

          archive = Path("dist/mobile-ui-migration-1.4.0.zip")
          expected = {
              "mobile-ui-migration/mod.js",
              "mobile-ui-migration/README_ko.md",
          }
          with ZipFile(archive) as z:
              names = set(z.namelist())
              assert names == expected, (names, expected)
              mod = z.read("mobile-ui-migration/mod.js").decode("utf-8")
              readme = z.read("mobile-ui-migration/README_ko.md").decode("utf-8")
              assert 'version: "1.4.0"' in mod
              assert 'id: "mobile-ui-migration"' in mod
              assert "대화·게이지 고정" in readme
          print("ZIP_BYTES", archive.stat().st_size)
          print("ZIP_SHA256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("ZIP_MEMBERS", sorted(expected))
          PY

      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-migration-1.4.0
          path: dist/mobile-ui-migration-1.4.0.zip
          if-no-files-found: error
          retention-days: 1
