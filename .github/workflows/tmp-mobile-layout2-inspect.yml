name: tmp-mobile-layout2-inspect
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Inspect exact markers
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          terms=[b"function M36MobileStatusPanel(){",b"function M36MobileRoomActivity(){",b"women.map",b"u.jsx(M36MobileRoomActivity,{})"]
          CH=65536
          hits={t:[] for t in terms}
          carry=b""; pos=0
          with p.open("rb") as f:
              while True:
                  c=f.read(CH)
                  if not c: break
                  d=carry+c
                  base=pos-len(carry)
                  for t in terms:
                      i=d.find(t)
                      if i>=0: hits[t].append(base+i)
                  pos+=len(c); carry=d[-65535:]
          for t,ps in hits.items():
              print("TERM",t,"POS",ps[:5])
              for q in ps[:1]:
                  with p.open("rb") as f:
                      f.seek(max(0,q-1800)); x=f.read(4200)
                  print(x.decode("utf-8","replace"))
                  print("\n---END---")
          PY
