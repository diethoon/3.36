name: tmp-mobile-status-component-audit

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read exact component neighborhoods
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          P=Path("Wayward_MOD_v3.36.html")
          for p in [18793000,18877000,18883500]:
              print("\n=== OFFSET",p,"===")
              with P.open("rb") as f:
                  f.seek(p); print(f.read(15000).decode("utf-8","replace"))
          PY
      - name: Cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-mobile-status-component-audit.yml
          git commit -m "chore: remove temporary status component audit"
          git push
