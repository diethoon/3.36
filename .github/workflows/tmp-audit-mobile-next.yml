name: tmp-audit-mobile-next

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted source audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path("Wayward_MOD_v3.36.html")
          targets=[
            "function x3e",
            "function eOe",
            "당신의 뜻에 대한 인식",
            "만남 기록",
            "function M36MobileStockStatus",
            "supplyTargets",
            "stock_up",
            "loan",
            "대출금",
            "오늘 밤 전부 갚을 수도 있습니다.",
            "mobile-main-panel",
            "min-h-[44px]",
            "paneOrder",
            "jOe",
          ]
          chunk=65536
          tail=b""
          hits={t:[] for t in targets}
          with path.open("rb") as f:
            off=0
            while True:
              c=f.read(chunk)
              if not c: break
              buf=tail+c
              base=off-len(tail)
              for t in targets:
                b=t.encode("utf-8")
                p=0
                while True:
                  i=buf.find(b,p)
                  if i<0: break
                  hits[t].append(base+i)
                  p=i+max(1,len(b))
              tail=buf[-8192:]
              off+=len(c)

          print("FILE_BYTES", path.stat().st_size)
          for t in targets:
            print("TARGET",t,"COUNT",len(hits[t]),"OFFSETS",hits[t][:12])

          wanted=["function x3e","function eOe","function M36MobileStockStatus","당신의 뜻에 대한 인식","만남 기록","min-h-[44px]"]
          seen=set()
          for t in wanted:
            if not hits[t]: continue
            o=hits[t][0]
            key=(t,o)
            if key in seen: continue
            seen.add(key)
            print("\n===== CONTEXT",t,"@",o,"=====")
            with path.open("rb") as f:
              f.seek(max(0,o-7000))
              data=f.read(18000)
            print(data.decode("utf-8","replace"))
            print("\n===== END",t,"=====")

          PY
      - name: Self cleanup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-audit-mobile-next.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove temporary mobile next audit workflow"
          git push origin HEAD:mobile-migration-v1
