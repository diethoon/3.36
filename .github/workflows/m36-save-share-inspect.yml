name: One-shot save-share verification

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-save-share-inspect.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect save-sharing markers without dumping the game file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          path = Path("Wayward_MOD_v3.36.html")
          raw = path.read_bytes()
          text = raw.decode("utf-8")
          markers = {
              "Worker API constant": 'const M36_SAVE_SHARE_API="https://wayward-save-share.trpgengine.workers.dev";',
              "per-slot saved title key": 'const M36_SAVE_TITLE_KEY="wayward-save-title-slot-";',
              "cloud import control": "function M36CloudImportControl({onDone})",
              "share request handler": "shareSlot=async O=>",
              "per-slot share button wiring": "onShare:()=>shareSlot(O.slot)",
              "per-slot rename button wiring": "onRename:()=>renameSlot(O.slot)",
              "settings import control wiring": "u.jsx(M36CloudImportControl,{onDone:e})",
              "share-title response handling": 'response.headers.get("X-Share-Title")',
          }
          print(f"GAME_FILE bytes={len(raw)} utf8=ok")
          failed = []
          for label, marker in markers.items():
              count = text.count(marker)
              print(f"CHECK {label}: count={count}")
              if count < 1:
                  failed.append(label)
          print(f"CHECK closing_body_tag: count={text.count('</body>')}")
          if text.count("</body>") != 1:
              failed.append("closing body tag count")
          if failed:
              print("FAILED_MARKERS=" + ", ".join(failed))
              sys.exit(1)
          print("GAME_SAVE_SHARE_MARKERS=PASS")
          PY
      - name: Check Worker JavaScript syntax
        run: node --check workers/wayward-save-share/index.js
      - name: Exercise live Worker create, import, and one-time consume
        run: |
          node --input-type=module <<'NODE'
          const base = "https://wayward-save-share.trpgengine.workers.dev";
          const healthResponse = await fetch(base + "/api/health");
          const health = await healthResponse.json();
          console.log("HEALTH", JSON.stringify({status: healthResponse.status, ok: health.ok, service: health.service, storage: health.storage, schema: health.schema}));
          if (!healthResponse.ok || health.ok !== true || health.schema !== "ready") throw new Error("health check failed");

          const title = "Wayward API 검증 · one-time import";
          const save = JSON.stringify({state:{probe:"save-share-e2e"}, metadata:{kind:"test-only"}});
          const createResponse = await fetch(base + "/api/share?title=" + encodeURIComponent(title), {
            method: "POST",
            headers: {"Content-Type":"application/json; charset=utf-8"},
            body: save
          });
          const created = await createResponse.json();
          console.log("CREATE", JSON.stringify({status:createResponse.status, ok:created.ok, codeFormat:typeof created.code === "string" && /^[A-Za-z0-9]{6}$/.test(created.code), title:created.title, expiresInSeconds:created.expiresInSeconds}));
          if (createResponse.status !== 201 || created.ok !== true || !/^[A-Za-z0-9]{6}$/.test(created.code || "") || created.expiresInSeconds !== 604800) throw new Error("share creation failed");

          const importPayload = JSON.stringify({code:created.code});
          const importResponse = await fetch(base + "/api/import", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: importPayload
          });
          const imported = await importResponse.text();
          let headerTitle = "";
          try { headerTitle = decodeURIComponent(importResponse.headers.get("X-Share-Title") || ""); } catch {}
          console.log("IMPORT", JSON.stringify({status:importResponse.status, bodyMatches:imported === save, titleMatches:headerTitle === title, bodyBytes:imported.length}));
          if (!importResponse.ok || imported !== save || headerTitle !== title) throw new Error("share import payload/title mismatch");

          const replayResponse = await fetch(base + "/api/import", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: importPayload
          });
          const replay = await replayResponse.json();
          console.log("REPLAY", JSON.stringify({status:replayResponse.status, ok:replay.ok, error:replay.error}));
          if (replayResponse.ok || !["code_unavailable", "code_expired"].includes(replay.error)) throw new Error("one-time code was accepted more than once");
          console.log("LIVE_WORKER_E2E=PASS");
          NODE
