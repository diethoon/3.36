name: mobile-migration-apply

on:
  push:
    branches:
      - mobile-migration-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply streaming mobile migration
        run: python tools/mobile_migration_patch.py

      - name: Validate diff
        run: |
          git diff --check
          git diff --numstat
          git status --short

      - name: Commit HTML migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Wayward_MOD_v3.36.html
          git commit -m "feat(mobile): migrate studio portrait layout to v3.36" || exit 0
          git push
