name: Locate original shop status component
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/locate-original-shop-status.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect bounded region around room overview
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          pos=18924000
          with p.open("rb") as f:
              f.seek(pos)
              data=f.read(10000)
          s=data.decode("utf-8","replace")
          print(s)
          print("\n--- FUNCTION DECLARATIONS IN REGION ---")
          import re
          for m in re.finditer(r'function [A-Za-z0-9_]+\(', s):
              print(m.group(0), "at", pos+m.start())
          print("\n--- JSX COMPONENT CALLS IN REGION ---")
          for m in re.finditer(r'u\.jsx\(([A-Z][A-Za-z0-9_]+),\{\}\)', s):
              print(m.group(1), "at", pos+m.start())
          PY
