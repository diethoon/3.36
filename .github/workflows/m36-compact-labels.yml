name: m36 compact labels finalize
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect compact UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          for key in ['label:"부탁"','label:"접대"','label:"골드"','label:"호기심"']:
              assert key in s, key
          i=s.find(".m36-responsive-reasons{")
          assert i >= 0
          print(s[i:i+1200])
          assert "display:flex!important" in s[i:i+1200]
          print("CURRENT_COMPACT_UI_OK")
          PY
          git diff --check
      - name: Remove temporary tooling
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f             .github/m36_compact_labels_patch.py             .github/m36_responsive_layout_patch.py             .github/workflows/m36-compact-labels.yml             .github/workflows/m36-responsive-layout.yml             .github/workflows/m36-responsive-ui.yml
          git commit -m "chore: remove temporary responsive UI tooling"
          git push origin mobile-migration-v1
