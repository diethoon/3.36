name: m36 compact labels finalize
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Apply compact layout
        run: python3 .github/m36_compact_labels_patch.py
      - name: Clean injected style whitespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          s=p.read_text(encoding="utf-8")
          marker=".m36-responsive-reasons{"
          i=s.find(marker)
          assert i >= 0
          a=s.rfind("<style",0,i)
          b=s.find("</style>",i)
          assert a >= 0 and b > a
          block=s[a:b]
          block="\n".join(line.rstrip() for line in block.splitlines())
          s=s[:a]+block+s[b:]
          p.write_text(s,encoding="utf-8")
          PY
      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'label:"부탁"' Wayward_MOD_v3.36.html
          grep -q 'label:"접대"' Wayward_MOD_v3.36.html
          grep -q 'label:"골드"' Wayward_MOD_v3.36.html
          grep -q 'label:"호기심"' Wayward_MOD_v3.36.html
          ! grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' Wayward_MOD_v3.36.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          i=s.find(".m36-responsive-reasons{")
          assert i >= 0
          snippet=s[i:i+1200]
          assert "display:flex!important" in snippet
          print("COMPACT_LAYOUT_VALIDATION_PASS")
          PY
      - name: Remove temporary tooling
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git rm -f             .github/m36_compact_labels_patch.py             .github/m36_responsive_layout_patch.py             .github/workflows/m36-compact-labels.yml             .github/workflows/m36-responsive-layout.yml             .github/workflows/m36-responsive-ui.yml
          git commit -m "fix(mobile): compact controls and remove temporary tooling"
          git push origin mobile-migration-v1
