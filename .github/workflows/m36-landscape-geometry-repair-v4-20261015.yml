name: M36 landscape geometry repair v4

on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/m36-landscape-geometry-repair-v4-20261015.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Boot using Continue and inspect geometry
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),http=require('http'),cp=require('child_process'),{chromium}=require('playwright');
          const file='Wayward_MOD_v3.36.html',reportPath='idea/M36_LANDSCAPE_GEOMETRY_REPAIR_20261015.md';
          const original=fs.readFileSync(file,'utf8'),backup='/tmp/m36-landscape-before.html';
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const blob=cp.execFileSync('git',['rev-parse','HEAD:'+file],{encoding:'utf8'}).trim();
          const report={branch:'mobile-migration-v1',sourceHead:head,sourceHtmlBlob:blob,bytesBefore:Buffer.byteLength(original),boot:[],measurements:[],patch:null,failures:[],verdict:'NOT_RUN'};
          const write=()=>fs.writeFileSync(reportPath,'# M36 Landscape Geometry Repair — 2026-10-15\n\nResult: **'+report.verdict+'**\n\n\`\`\`json\n'+JSON.stringify(report,null,2)+'\n\`\`\`\n');
          let server,browser;
          async function boot(page,label){
            const actions=[];
            for(let i=0;i<50;i++){
              const body=await page.locator('body').innerText().catch(()=>'');
              if(body.includes('물자 채우기')&&body.includes('대출')){report.boot.push({label,ok:true,actions});return true;}
              let btn=page.getByRole('button',{name:/계속하기/}).first();
              if(await btn.count().catch(()=>0) && await btn.isVisible().catch(()=>false)){
                await btn.evaluate(e=>e.click());actions.push('clicked Continue');await page.waitForTimeout(700);continue;
              }
              btn=page.getByRole('button',{name:/닫기/}).first();
              if(await btn.count().catch(()=>0) && await btn.isVisible().catch(()=>false)){
                await btn.evaluate(e=>e.click());actions.push('closed notice');await page.waitForTimeout(200);continue;
              }
              btn=page.getByRole('button',{name:/이해하고 동의합니다/}).first();
              if(await btn.count().catch(()=>0) && await btn.isVisible().catch(()=>false)){
                await btn.evaluate(e=>e.click());actions.push('accepted content notice');await page.waitForTimeout(250);continue;
              }
              await page.waitForTimeout(250);
            }
            report.boot.push({label,ok:false,actions,tail:(await page.locator('body').innerText().catch(()=>'' )).slice(-700)});
            throw new Error(label+': failed to enter gameplay; actions='+JSON.stringify(actions));
          }
          async function measure(page,label){
            const m=await page.evaluate(label=>{
              const box=e=>{if(!e)return null;let r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),right:+r.right.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2)};};
              const l=document.querySelector('.mobile-layout'),p=document.querySelector('.mobile-action-panel'),i=document.querySelector('.m36-landscape-info-scroll'),c=document.querySelector('.mobile-action-scroll');
              return {label,viewport:{width:innerWidth,height:innerHeight,docWidth:document.documentElement.scrollWidth,fullscreen:!!document.fullscreenElement},
                layout:box(l),grid:l?getComputedStyle(l).gridTemplateColumns:null,panel:box(p),panelGrid:p?getComputedStyle(p).gridColumn:null,
                info:box(i),choices:box(c),prep:document.body.innerText.includes('물자 채우기'),loan:document.body.innerText.includes('대출'),upgrade:document.body.innerText.includes('시설 업그레이드')};
            },label);report.measurements.push(m);return m;
          }
          async function main(){
            if(Buffer.byteLength(original)<10000000)throw new Error('HTML size guard failed');
            fs.copyFileSync(file,backup);
            try{
              server=http.createServer((req,res)=>{res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-store'});fs.createReadStream(file).pipe(res);});
              await new Promise((resolve,reject)=>server.listen(4173,'127.0.0.1',resolve).once('error',reject));
              browser=await chromium.launch({headless:true,args:['--no-sandbox']});
              const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const p=await ctx.newPage();p.on('pageerror',e=>report.failures.push('browser error: '+String(e)));
              await p.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});await boot(p,'portrait baseline');
              report.portraitBefore=await p.evaluate(()=>{const r=e=>{if(!e)return null;let b=e.getBoundingClientRect();return [b.x,b.y,b.width,b.height].map(n=>+n.toFixed(2));};return {layout:r(document.querySelector('.mobile-layout')),main:r(document.querySelector('.mobile-main-panel')),choices:!!document.querySelector('.mobile-action-scroll'),pleasure:!!document.querySelector('.m36-mobile-pleasure-fixed'),dialogue:!!document.querySelector('.m36-mobile-dialogue-fixed')};});
              await ctx.close();
              const lc=await browser.newContext({viewport:{width:1280,height:720},isMobile:true,hasTouch:true}),lp=await lc.newPage();
              await lp.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});await boot(lp,'landscape baseline');report.baselineLandscape=await measure(lp,'before');await lc.close();
              const re=/<style\b([^>]*)>([\s\S]*?)<\/style>/gi;let widthFound=0,styles=0;
              let patched=original.replace(re,(all,attrs,css)=>{
                const idm=attrs.match(/\bid\s*=\s*["']([^"']+)["']/i),id=idm?idm[1]:'';
                let out=css;
                if(id==='m36-landscape-fill-four-columns-20261015'){
                  widthFound++;
                  out+='\n@media (orientation:landscape) and (min-width:600px){.mobile-layout{width:calc(100% - 28px)!important;max-width:calc(100% - 28px)!important;left:28px!important;box-sizing:border-box!important;}}\n';
                }
                if(/landscape/i.test(id)&&out.includes('.mobile-action-panel')&&out.includes('grid-column')){
                  const before=out;
                  out=out.replace(/(\.mobile-action-panel\s*\{[^}]*?)grid-column\s*:\s*3\s*(?:!important\s*)?;/g,(_,prefix)=>prefix+'grid-column:3 / 5 !important;');
                  if(out!==before)styles++;
                }
                return out===css?all:'<style'+attrs+'>'+out+'</style>';
              });
              if(widthFound!==1||styles<1)throw new Error('Guard failed: width style count='+widthFound+', action panel rules changed='+styles);
              if(Math.abs(Buffer.byteLength(patched)-Buffer.byteLength(original))>5000)throw new Error('Unexpected patch size');
              fs.writeFileSync(file,patched,'utf8');report.patch={widthRule:'landscape only; 28px rail accounted for in width',panelRulesChanged:styles,bytesDelta:Buffer.byteLength(patched)-Buffer.byteLength(original)};
              cp.execFileSync('git',['diff','--check'],{stdio:'pipe'});
              const pc=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true}),pp=await pc.newPage();await pp.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});await boot(pp,'portrait patched');
              report.portraitAfter=await pp.evaluate(()=>{const r=e=>{if(!e)return null;let b=e.getBoundingClientRect();return [b.x,b.y,b.width,b.height].map(n=>+n.toFixed(2));};return {layout:r(document.querySelector('.mobile-layout')),main:r(document.querySelector('.mobile-main-panel')),choices:!!document.querySelector('.mobile-action-scroll'),pleasure:!!document.querySelector('.m36-mobile-pleasure-fixed'),dialogue:!!document.querySelector('.m36-mobile-dialogue-fixed')};});
              if(JSON.stringify(report.portraitBefore)!==JSON.stringify(report.portraitAfter))throw new Error('Portrait geometry/required fixed regions changed');await pc.close();
              for(const vp of [{w:1280,h:720},{w:915,h:412},{w:720,h:360}]){
                const c=await browser.newContext({viewport:{width:vp.w,height:vp.h},isMobile:true,hasTouch:true}),page=await c.newPage();
                page.on('pageerror',e=>report.failures.push('browser error '+vp.w+': '+String(e)));
                await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});await boot(page,'patched '+vp.w+'x'+vp.h);
                const m=await measure(page,'patched '+vp.w+'x'+vp.h);
                if(!m.layout||!m.panel||!m.info||!m.choices)throw new Error('Required layout nodes missing at '+vp.w);
                if(!/^3\s*\/\s*5/.test(m.panelGrid))throw new Error('Action panel still not spanning columns 3–4 at '+vp.w+': '+m.panelGrid);
                if(Math.abs(m.layout.right-m.viewport.width)>1.2)throw new Error('Layout right edge overflow at '+vp.w);
                if(Math.abs(m.panel.right-m.layout.right)>1.2)throw new Error('Action panel does not reach layout right edge at '+vp.w);
                if(Math.abs(m.choices.right-m.layout.right)>1.2)throw new Error('Choices do not reach right edge at '+vp.w);
                if(m.viewport.docWidth>m.viewport.width+1)throw new Error('Horizontal document overflow at '+vp.w);
                if(!m.prep||!m.loan||!m.upgrade)throw new Error('Prep/supply/loan/facility upgrade feature missing at '+vp.w);
                await c.close();
              }
              if(report.failures.length)throw new Error(report.failures.join('; '));
              report.verdict='PASS';fs.writeFileSync('/tmp/m36-repair-pass','PASS');
            }catch(e){report.verdict='FAIL';report.failures.push(String(e&&e.stack||e).slice(0,4000));if(fs.existsSync(backup))fs.copyFileSync(backup,file);throw e;}
            finally{if(browser)await browser.close().catch(()=>{});if(server)await new Promise(r=>server.close(r));write();}
          }
          main().catch(e=>{console.error(e.stack||e);process.exitCode=1;});
          NODE
      - name: Commit verified patch or failure report and remove workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/m36-landscape-geometry-repair-v4-20261015.yml
          if [ -f /tmp/m36-repair-pass ]; then
            git add Wayward_MOD_v3.36.html idea/M36_LANDSCAPE_GEOMETRY_REPAIR_20261015.md
            git commit -m "fix(mobile): repair landscape column geometry and remove repair workflow"
          else
            git add idea/M36_LANDSCAPE_GEOMETRY_REPAIR_20261015.md
            git commit -m "test(mobile): record landscape repair verification and remove repair workflow"
          fi
          git push origin HEAD:mobile-migration-v1
      - name: Require passing runtime verification
        if: always()
        run: |
          test -f /tmp/m36-repair-pass || (echo "Verification failed; HTML restored." && exit 1)
