name: One-shot mobile UI anchor scan
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-ui-forensic-anchors.yml
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect only exact UI anchors in chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/m36-ui-anchor-report.txt
          from pathlib import Path
          import re
          import subprocess

          p = Path("Wayward_MOD_v3.36.html")
          print("SOURCE_BYTES", p.stat().st_size)
          print("CHECKOUT_SHA", subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          pats = [
              ("CSS_CHOICE_FIXED", re.compile(rb"\.m36-mobile-choice-fixed\s*\{", re.I)),
              ("CSS_DIALOGUE_FIXED", re.compile(rb"\.m36-mobile-dialogue-fixed\s*\{", re.I)),
              ("CSS_DIALOGUE_BOX", re.compile(rb"\.m36-mobile-dialogue-box\s*\{", re.I)),
              ("CSS_DISABLED_CHOICE", re.compile(rb"\.m36-mobile-disabled-choice(?:\s|\{|:)", re.I)),
              ("BAD_SEAM_FONT_IMPORT", re.compile(rb"font-size:\.74rem!importa", re.I)),
              ("GOOD_FONT_IMPORT", re.compile(rb"font-size:\.74rem!important", re.I)),
              ("OLD_DOM_REPLACE", re.compile(rb"replaceWith\(row\)")),
              ("SAFE_DISABLED_CLASS", re.compile(rb"btn\.classList\.add\(\"m36-mobile-disabled-choice\"\)")),
              ("CATEGORY_BIND_FUNCTION", re.compile(rb"function bindCategories\(\)")),
              ("CATEGORY_BOUND_GUARD", re.compile(rb"h\.dataset\.m36CategoryBound===\"1\"")),
              ("CATEGORY_LIST_TOGGLE", re.compile(rb"list\.style\.display=open\?\"none\":\"\"")),
              ("CATEGORY_OBSERVER", re.compile(rb"observer\.observe\(document\.body")),
              ("NEXT_UI_STYLE_ID", re.compile(rb"<style id=\"m36-mobile-next-ui-v1\">")),
              ("NEXT_UI_SCRIPT_ID", re.compile(rb"<script id=\"m36-mobile-next-ui-script\">")),
              ("DUP_STORE_STATUS_STYLE_ID", re.compile(rb'id="wayward-mobile-store-status-v1"')),
              ("DUP_STOCK_STYLE_ID", re.compile(rb'id="wayward-mobile-stock-v1"')),
              ("DUP_NEXT_UI_STYLE_ID", re.compile(rb'id="m36-mobile-next-ui-v1"')),
          ]
          counts = {name: 0 for name, _ in pats}
          first = {name: [] for name, _ in pats}
          last = {name: [] for name, _ in pats}
          state = {"buf": b"", "base": 0, "processed": 0}
          lookahead = 1500

          def compact(raw):
              return re.sub(r"\s+", " ", raw.decode("utf-8", "replace")).strip()[:1350]

          def process(safe_local):
              buf = state["buf"]
              base = state["base"]
              safe_global = base + safe_local
              begin = max(0, state["processed"] - base)
              for name, pat in pats:
                  at = begin
                  while True:
                      m = pat.search(buf, at)
                      if not m or m.start() >= safe_local:
                          break
                      counts[name] += 1
                      offset = base + m.start()
                      excerpt = compact(buf[max(0, m.start()-420):min(len(buf), m.end()+850)])
                      item = (offset, excerpt)
                      if len(first[name]) < 2:
                          first[name].append(item)
                      last[name].append(item)
                      if len(last[name]) > 3:
                          last[name].pop(0)
                      at = m.start() + 1
              state["processed"] = safe_global
              state["buf"] = buf[safe_local:]
              state["base"] = safe_global

          with p.open("rb") as src:
              while True:
                  chunk = src.read(65536)
                  if not chunk:
                      break
                  state["buf"] += chunk
                  safe = max(0, len(state["buf"]) - lookahead)
                  if safe:
                      process(safe)
              if state["buf"]:
                  process(len(state["buf"]))

          for name, _ in pats:
              print(f"\n=== {name}: {counts[name]} ===")
              items = []
              for item in first[name] + last[name]:
                  if item[0] not in [x[0] for x in items]:
                      items.append(item)
              for offset, excerpt in items:
                  print(f"@{offset}: {excerpt}")
          print("\nANCHOR_SCAN=PASS")
          PY
      - name: Remove temporary anchor scanner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m36-ui-forensic-anchors.yml
          git add -u .github/workflows/m36-ui-forensic-anchors.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove temporary UI anchor scanner"
            git push origin HEAD:mobile-migration-v1
          fi
