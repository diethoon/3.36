name: M36 delta display and landscape gauge inspection
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/m36-delta-display-inspection-20261014.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Print bounded renderer and style contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          terms=["function nOe","const nOe","m36-landscape-last-action-delta","m36-mobile-pleasure-fixed","m36-mobile-choice-gauge"]
          counts={x:0 for x in terms}; seen=set(); overlap=b""; offset=0
          with p.open("rb") as f:
            while True:
              chunk=f.read(256*1024)
              if not chunk: break
              buf=overlap+chunk; base=offset-len(overlap)
              for term in terms:
                needle=term.encode(); pos=0
                while True:
                  i=buf.find(needle,pos)
                  if i<0: break
                  absolute=base+i; key=(term,absolute)
                  if absolute>=offset and key not in seen:
                    seen.add(key); counts[term]+=1
                    if counts[term]<=8:
                      a=max(0,i-1200); b=min(len(buf),i+len(needle)+2300)
                      print(f"\n--- {term} #{counts[term]} OFFSET={absolute} ---")
                      print(buf[a:b].decode("utf-8","replace").replace("\\n"," ")[:3600])
                  pos=i+len(needle)
              offset+=len(chunk); overlap=buf[-4096:]
          print("\nCOUNTS")
          for term,n in counts.items(): print(term,n)
          PY
      - name: Remove temporary inspection workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/m36-delta-display-inspection-20261014.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then git commit -m "chore: remove temporary delta display inspection"; git push origin mobile-migration-v1; fi
