name: M36 narrow status component inspection
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/m36-narrow-status-inspection-20261014.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect exact status component symbols
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          terms=[b"function M331ActionStatus",b"function m331ActionStatus",b"m331ActionStatus=",b"m312State",b"function M331",b"m36-mobile-pleasure-fixed-v1"]
          seen={x:0 for x in terms}
          with p.open("rb") as f:
            roll=b""; base=0
            while True:
              c=f.read(256*1024)
              if not c: break
              b=roll+c; origin=base-len(roll)
              for n in terms:
                j=0
                while True:
                  i=b.find(n,j)
                  if i<0: break
                  off=origin+i
                  if off>=base:
                    seen[n]+=1
                    if seen[n]<=4:
                      a=max(0,i-900); z=min(len(b),i+len(n)+2600)
                      print(f"\n--- {n.decode()} #{seen[n]} OFFSET {off} ---")
                      print(b[a:z].decode("utf-8","replace").replace("\\n"," ")[:3700])
                  j=i+len(n)
              base+=len(c); roll=b[-4096:]
          print("\nCOUNTS")
          for n,v in seen.items(): print(n.decode(),v)
          PY
      - name: Remove temporary inspection workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/m36-narrow-status-inspection-20261014.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then git commit -m "chore: remove temporary narrow status inspection"; git push origin mobile-migration-v1; fi
