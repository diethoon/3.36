name: Diagnose persistent status render calls
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/diagnose-persistent-status.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Stream-search component call sites
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path("Wayward_MOD_v3.36.html")
          CH=65536
          needles=[
            b"M36MobilePersistentStatus",
            b"M36MobileCurrentActivity",
            b"M36MobileStoreStatus",
            b"M36MobileStockStatus",
          ]
          carry=b""
          base=0
          hits={n:[] for n in needles}
          with p.open("rb") as f:
            while True:
              c=f.read(CH)
              if not c: break
              d=carry+c
              data_base=base-len(carry)
              for n in needles:
                start=0
                while True:
                  i=d.find(n,start)
                  if i<0: break
                  hits[n].append(data_base+i)
                  start=i+1
              carry=d[-max(len(n) for n in needles)+1:]
              base+=len(c)

          for n,poss in hits.items():
            print("\n###",n.decode(),"COUNT",len(poss))
            # Show only likely invocation sites, not function definition.
            for pos in poss:
              with p.open("rb") as f:
                f.seek(max(0,pos-500))
                ctx=f.read(len(n)+900)
              text=ctx.decode("utf-8","replace")
              print("\nOFFSET",pos)
              print(text)
          PY
