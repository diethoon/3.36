name: Temporary landscape layout runtime verification
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-landscape-runtime-verify.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify actual mobile game layout
        shell: bash
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/m36-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          cat > /tmp/verify.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:844,height:390}});
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(1200);
            const clickNext=async()=>{
              const result=await page.evaluate(()=>{
                const bs=[...document.querySelectorAll('button')].filter(b=>b.getClientRects().length && !b.disabled);
                const txt=b=>(b.innerText||b.getAttribute('aria-label')||'').trim().replace(/\\s+/g,' ');
                let target=bs.find(b=>txt(b)==='이해하고 동의합니다')
                  ||bs.find(b=>txt(b)==='예')
                  ||bs.find(b=>/^계속하기/.test(txt(b)))
                  ||bs.find(b=>/^(새 게임|게임 시작|시작하기|이어하기|계속하기|확인|다음)$/.test(txt(b)))
                  ||bs.find(b=>txt(b).startsWith('엘레나'));
                if(!target) return {clicked:null,buttons:bs.slice(0,22).map(txt)};
                const clicked=txt(target); target.click(); return {clicked};
              });
              console.log('FLOW',JSON.stringify(result));
              if(result.clicked) await page.waitForTimeout(1000);
              return !!result.clicked;
            };
            for(let i=0;i<14;i++){ if(!await clickNext()) break; }
            await page.waitForTimeout(2500);
            const inspect=async label=>page.evaluate(label=>{
              const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:s.display,position:s.position,overflow:s.overflow,grid:s.gridTemplateColumns,flex:s.flex};};
              const sel=['.m34-header','.m34-header-stats','.mobile-layout','.mobile-portrait-panel','.mobile-main-panel','.mobile-action-panel','.m36-mobile-tabs','.mobile-action-scroll','.m36-mobile-dialogue-fixed','.m36-mobile-store-status'];
              return {label,viewport:{w:innerWidth,h:innerHeight},hasLayout:!!document.querySelector('.mobile-layout'),
                selectors:Object.fromEntries(sel.map(s=>[s,rect(document.querySelector(s))])),
                bodyText:document.body.innerText.slice(0,280).replace(/\\s+/g,' '),
                buttons:[...document.querySelectorAll('button')].filter(b=>b.getClientRects().length).slice(0,20).map(b=>(b.innerText||b.getAttribute('aria-label')||'').trim().replace(/\\s+/g,' ').slice(0,50))};
            },label);
            const landscape=await inspect('landscape');
            await page.screenshot({path:'/tmp/m36-landscape-verification.png',fullPage:false});
            await page.setViewportSize({width:390,height:844}); await page.waitForTimeout(700);
            const portrait=await inspect('portrait');
            console.log('LANDSCAPE_RESULT',JSON.stringify(landscape));
            console.log('PORTRAIT_RESULT',JSON.stringify(portrait));
            console.log('PAGE_ERRORS',JSON.stringify(errors));
            if(errors.length) throw new Error(errors.join('; '));
            if(!landscape.hasLayout) throw new Error('Could not reach the game screen; runtime geometry not verified');
            const p=landscape.selectors['.mobile-portrait-panel'],t=landscape.selectors['.m36-mobile-tabs'],a=landscape.selectors['.mobile-action-panel'],choices=landscape.selectors['.mobile-action-scroll'];
            if(!p || p.display==='none' || !t || !a || !choices) throw new Error('Required landscape columns did not render');
            if(p.w<50 || p.h<100) throw new Error('Portrait column unexpectedly small');
            if(!portrait.selectors['.mobile-portrait-panel'] || portrait.selectors['.mobile-portrait-panel'].display!=='none') throw new Error('Added portrait column must be hidden in portrait orientation');
            if(t.x>45) throw new Error('Tab icon rail not at left edge');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/verify.cjs
      - name: Remove temporary runtime verification workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/m36-landscape-runtime-verify.yml
          git diff --cached --check
          git commit -m "chore: remove temporary landscape runtime verifier" || true
          git push origin HEAD:mobile-migration-v1
