name: TEMP m36 landscape runtime verification
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - .github/workflows/m36-landscape-runtime-verify.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise real setup and capture mobile geometry
        continue-on-error: true
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/m36-http.log 2>&1 &
          echo $! >/tmp/m36-http.pid
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:844,height:390},deviceScaleFactor:1});
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type()==='error') errors.push('console: '+m.text()); });
            await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2500);
            const getButtons = () => page.locator('button').evaluateAll(els => els.map((e,i)=>({
              i, text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,100),
              disabled:!!e.disabled || e.getAttribute('aria-disabled')==='true',
              display:getComputedStyle(e).display,
              visibility:getComputedStyle(e).visibility,
              rect:(()=>{const r=e.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}})()
            })));
            async function clickText(predicate, label) {
              const bs=await getButtons();
              const target=bs.find(b=>predicate(b.text));
              if (!target) return false;
              if(target.disabled){ console.log('FLOW_DISABLED',JSON.stringify({label,target,buttons:bs.filter(b=>b.text).slice(0,55)})); return false; }
              const el=page.locator('button').nth(target.i);
              await el.scrollIntoViewIfNeeded({timeout:4000}).catch(()=>{});
              await el.click({timeout:5000}).catch(async e=>{
                console.log('FLOW_CLICK_RETRY',JSON.stringify({label,button:target,error:String(e).slice(0,250)}));
                await el.evaluate(e=>e.click());
              });
              console.log('FLOW',JSON.stringify({clicked:label,actual:target.text}));
              await page.waitForTimeout(900);
              return true;
            }
            let reached=false;
            for(let step=0;step<18;step++){
              if(await page.locator('.mobile-layout').count()){ reached=true; break; }
              const text=(await page.locator('body').innerText().catch(()=>'' )).slice(0,1500);
              let ok=false;
              if(await clickText(t=>t==='예','예')) ok=true;
              else if(await clickText(t=>t.includes('이해하고 동의합니다'),'이해하고 동의합니다')) ok=true;
              else if(await clickText(t=>t==='새 게임','새 게임')) ok=true;
              else if(await clickText(t=>t.includes('엘레나') && t.includes('농가 출신 여성') && !t.includes('계속하기'),'엘레나 선택')) ok=true;
              else if(await clickText(t=>t.startsWith('계속하기') && t.includes('엘레나'),'계속하기 — 엘레나')) ok=true;
              else if(await clickText(t=>t.startsWith('시작') && t.includes('엘레나'),'시작 — 엘레나')) ok=true;
              else {
                const buttons=await getButtons();
                const start=buttons.find(b=>b.text.startsWith('시작') && b.text.includes('엘레나'));
                console.log('FLOW_STALLED',JSON.stringify({step,body:text.slice(0,900),start,buttons:buttons.filter(b=>b.text).slice(-32)}));
                // Retry the deterministic default option once in case the final setup requires an explicit random assignment.
                if (buttons.some(b=>b.text==='운명에 맡김' && !b.disabled) && !globalThis.randomDefaultTried) {
                  globalThis.randomDefaultTried=true;
                  if(await clickText(t=>t==='운명에 맡김','운명에 맡김')) ok=true;
                }
              }
              if(!ok) break;
            }
            await page.waitForTimeout(1800);
            async function measure(name,w,h,path){
              await page.setViewportSize({width:w,height:h});
              await page.waitForTimeout(800);
              const data=await page.evaluate(()=>{
                const sel=['.m34-header','.m34-header-stats','.mobile-layout','.mobile-portrait-panel','.mobile-main-panel','.mobile-action-panel','.m36-mobile-tabs','.mobile-action-scroll','.m36-mobile-dialogue-fixed','.m36-mobile-store-status'];
                const out={viewport:{w:innerWidth,h:innerHeight},bodySize:{w:document.body.scrollWidth,h:document.body.scrollHeight},bodyText:(document.body.innerText||'').slice(0,1300)};
                out.elements=Object.fromEntries(sel.map(s=>{const e=document.querySelector(s);if(!e)return [s,null];const r=e.getBoundingClientRect(),c=getComputedStyle(e);return [s,{rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},display:c.display,position:c.position,overflow:c.overflow,overflowX:c.overflowX,overflowY:c.overflowY,gridColumns:c.gridTemplateColumns,flexDirection:c.flexDirection,scrollH:e.scrollHeight,clientH:e.clientHeight,scrollW:e.scrollWidth,clientW:e.clientWidth}]}));
                out.headerControls=[...document.querySelectorAll('.m34-header-control')].map(e=>{const r=e.getBoundingClientRect(),c=getComputedStyle(e);return {text:(e.innerText||e.textContent||'').trim().slice(0,30),rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},fontSize:c.fontSize,whiteSpace:c.whiteSpace}}).slice(0,24);
                return out;
              });
              console.log(name+'_RESULT',JSON.stringify(data));
              await page.screenshot({path:path,fullPage:false}).catch(e=>console.log('SCREENSHOT_ERROR',name,String(e)));
            }
            await measure('LANDSCAPE',844,390,'/tmp/m36-landscape.png');
            await measure('PORTRAIT',390,844,'/tmp/m36-portrait.png');
            await measure('NARROW_PORTRAIT',320,640,'/tmp/m36-narrow.png');
            console.log('REACHED_MOBILE_LAYOUT',reached || await page.locator('.mobile-layout').count()>0);
            console.log('PAGE_ERRORS',JSON.stringify(errors.slice(0,30)));
            await browser.close();
            if (!(reached || errors.some(x=>x.includes('ReferenceError')||x.includes('TypeError')) || await Promise.resolve(false))) process.exitCode=0;
          })().catch(e=>{console.error('VERIFY_EXCEPTION',e);process.exitCode=1;});
          NODE
      - name: Upload geometry screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m36-landscape-runtime-screenshots
          path: /tmp/m36-*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Remove temporary runtime verifier
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/m36-landscape-runtime-verify.yml
          git diff --cached --check
          git commit -m "chore: remove temporary landscape runtime verifier" || true
          git push origin HEAD:mobile-migration-v1
