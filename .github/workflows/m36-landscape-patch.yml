name: One-shot landscape four-column layout
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-landscape-patch.yml
permissions:
  contents: write
jobs:
  landscape-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply bounded in-place patch
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          path = 'Wayward_MOD_v3.36.html'
          chunk_size = 65536

          def find_offsets(needle):
              hits = []
              pos = 0
              carry = b''
              with open(path, 'rb') as src:
                  while True:
                      chunk = src.read(chunk_size)
                      if not chunk:
                          break
                      data = carry + chunk
                      base = pos - len(carry)
                      start = 0
                      while True:
                          at = data.find(needle, start)
                          if at < 0:
                              break
                          absolute = base + at
                          if absolute >= 0 and (not hits or hits[-1] != absolute):
                              hits.append(absolute)
                          start = at + 1
                      pos += len(chunk)
                      carry = data[-max(len(needle)-1, 1):]
              return hits

          def replace_in_place(needle, replacement, last=False):
              hits = find_offsets(needle)
              if not hits or (not last and len(hits) != 1):
                  raise SystemExit(f'Expected {"at least one" if last else "one"} occurrence of {needle!r}; found {len(hits)} at {hits[:12]}')
              offset = hits[-1] if last else hits[0]
              delta = len(replacement) - len(needle)
              with open(path, 'r+b', buffering=0) as f:
                  f.seek(0, os.SEEK_END)
                  old_size = f.tell()
                  end = offset + len(needle)
                  if delta > 0:
                      f.truncate(old_size + delta)
                      cursor = old_size
                      while cursor > end:
                          start = max(end, cursor - chunk_size)
                          f.seek(start)
                          block = f.read(cursor - start)
                          f.seek(start + delta)
                          f.write(block)
                          cursor = start
                  elif delta < 0:
                      cursor = end
                      while cursor < old_size:
                          f.seek(cursor)
                          block = f.read(min(chunk_size, old_size - cursor))
                          if not block:
                              break
                          f.seek(cursor + delta)
                          f.write(block)
                          cursor += len(block)
                      f.truncate(old_size + delta)
                  f.seek(offset)
                  f.write(replacement)
              print(f'PATCHED offset={offset} old={len(needle)} new={len(replacement)} file_size={os.path.getsize(path)}')

          # Add the existing focus-pane character portrait as a reusable column;
          # it is hidden in portrait mode by the CSS below.
          marker = b'className:"mobile-layout lg:hidden flex-1 min-h-0",children:[n&&N,'
          replacement = b'className:"mobile-layout lg:hidden flex-1 min-h-0",children:[u.jsx("div",{className:"mobile-portrait-panel",children:x}),n&&N,'
          replace_in_place(marker, replacement)

          css = br"""<style id="wayward-mobile-landscape-v1">
          @media (max-width:1023px) and (orientation:landscape) {
            html,body,#root {
              width:100vw!important;height:100dvh!important;min-height:0!important;max-height:100dvh!important;overflow:hidden!important;
            }
            #root>div {
              height:100dvh!important;min-height:0!important;overflow:hidden!important;
            }
            .m34-header {
              display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;
              gap:3px!important;padding:1px 2px!important;min-height:0!important;width:100%!important;flex:0 0 auto!important;
            }
            .m34-header-stats {
              flex:1 1 auto!important;min-width:0!important;max-width:none!important;overflow:hidden!important;
              line-height:1!important;padding:0!important;font-size:.62rem!important;
            }
            .m34-header-tools {
              display:flex!important;flex:0 0 auto!important;min-width:0!important;max-width:58%!important;
              gap:2px!important;padding:0!important;align-items:center!important;overflow:hidden!important;
            }
            .m34-system-tools {display:flex!important;align-items:center!important;gap:2px!important;min-width:0!important;}
            .m34-header-control {
              box-sizing:border-box!important;width:26px!important;min-width:26px!important;height:26px!important;min-height:26px!important;
              padding:0!important;font-size:14px!important;line-height:1!important;
            }

            .mobile-layout {
              position:relative!important;display:grid!important;
              grid-template-columns:30px minmax(76px,.82fr) minmax(126px,1.22fr) minmax(0,2.15fr)!important;
              grid-template-rows:minmax(0,1fr)!important;gap:2px!important;
              width:100%!important;height:100%!important;min-height:0!important;max-height:100%!important;overflow:hidden!important;
              align-items:stretch!important;
            }

            .mobile-portrait-panel {
              display:flex!important;grid-column:2!important;grid-row:1!important;align-items:stretch!important;justify-content:center!important;
              width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;overflow:hidden!important;
              border-right:1px solid rgba(120,113,108,.48)!important;background:rgba(0,0,0,.14)!important;
            }
            .mobile-portrait-panel>* {
              box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;justify-content:center!important;
              width:100%!important;max-width:100%!important;height:100%!important;max-height:100%!important;min-width:0!important;min-height:0!important;
              margin:0!important;padding:0!important;overflow:hidden!important;
            }
            .mobile-portrait-panel img {
              display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;
              min-width:0!important;min-height:0!important;object-fit:contain!important;object-position:center!important;
            }

            .mobile-main-panel {
              position:static!important;grid-column:3!important;grid-row:1!important;
              display:flex!important;flex-direction:column!important;flex:initial!important;width:100%!important;height:100%!important;
              max-width:none!important;min-width:0!important;min-height:0!important;overflow:hidden!important;
              border:0!important;padding:0!important;
            }
            .mobile-main-panel>.shrink-0 {flex:0 0 auto!important;min-width:0!important;padding:1px 2px 0!important;}
            .mobile-main-panel>.flex-1 {
              flex:1 1 0!important;width:100%!important;min-width:0!important;min-height:0!important;
              padding:2px!important;overflow-x:hidden!important;overflow-y:auto!important;overscroll-behavior:contain!important;
            }

            /* Existing Story/Shop/Elena tab buttons become the left icon rail;
               text remains in the DOM while the visual labels are replaced by compact symbols. */
            .m36-mobile-tabs {
              position:absolute!important;z-index:30!important;left:0!important;top:0!important;bottom:0!important;right:auto!important;
              display:flex!important;flex-direction:column!important;align-items:stretch!important;justify-content:flex-start!important;
              gap:1px!important;width:30px!important;min-width:30px!important;max-width:30px!important;height:auto!important;
              margin:0!important;padding:2px 0!important;flex:initial!important;overflow:hidden!important;
              border:0!important;border-right:1px solid rgba(120,113,108,.6)!important;background:rgba(28,25,23,.96)!important;
            }
            .m36-mobile-tabs>button {
              position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;
              flex:0 0 auto!important;width:100%!important;min-width:0!important;height:38px!important;min-height:38px!important;
              margin:0!important;padding:2px 0!important;font-size:0!important;line-height:1!important;letter-spacing:0!important;
              border:0!important;border-bottom:1px solid rgba(68,64,60,.8)!important;white-space:nowrap!important;overflow:hidden!important;
            }
            .m36-mobile-tabs>button::before {display:block!important;font-size:17px!important;line-height:1!important;color:currentColor!important;}
            .m36-mobile-tabs>button:nth-child(1)::before {content:"▤";}
            .m36-mobile-tabs>button:nth-child(2)::before {content:"⌂";}
            .m36-mobile-tabs>button:nth-child(3)::before {content:"♡";}

            /* The existing action pane is split into its fixed information on the left
               and its existing scrollable choices on the right. */
            .mobile-action-panel {
              position:relative!important;grid-column:4!important;grid-row:1!important;
              display:flex!important;flex-direction:column!important;align-items:stretch!important;flex:initial!important;
              width:100%!important;max-width:none!important;min-width:0!important;min-height:0!important;height:100%!important;
              max-height:100%!important;margin:0!important;padding:0!important;overflow:hidden!important;
              border:0!important;gap:1px!important;
            }
            .mobile-action-panel>.m36-mobile-store-status,
            .mobile-action-panel>.m36-mobile-status-panel,
            .mobile-action-panel>.m36-mobile-prep-compact,
            .mobile-action-panel>.m36-mobile-dialogue-fixed,
            .mobile-action-panel>.m36-mobile-pleasure-fixed,
            .mobile-action-panel>.m36-mobile-current-activity {
              box-sizing:border-box!important;width:50%!important;max-width:50%!important;min-width:0!important;
              margin:0!important;flex:0 1 auto!important;overflow-x:hidden!important;
            }
            .mobile-action-panel>.m36-mobile-store-status {
              flex:0 0 auto!important;max-height:14vh!important;overflow-y:auto!important;padding:1px 2px!important;
            }
            .mobile-action-panel>.m36-mobile-status-panel {
              flex:0 1 auto!important;max-height:17vh!important;min-height:0!important;overflow-y:auto!important;padding:1px 2px!important;
            }
            .mobile-action-panel>.m36-mobile-prep-compact {
              flex:0 1 auto!important;max-height:16vh!important;min-height:0!important;overflow-y:auto!important;padding:1px 2px!important;
            }
            .mobile-action-panel>.m36-mobile-current-activity {max-height:12vh!important;overflow-y:auto!important;}
            .mobile-action-panel>.flex-1.min-h-0.flex.flex-col {display:contents!important;}
            .mobile-action-panel>.m36-mobile-dialogue-fixed {
              flex:0 1 auto!important;max-height:22vh!important;min-height:0!important;overflow:hidden!important;padding:1px 2px!important;
            }
            .mobile-action-panel .m36-mobile-dialogue-box {
              max-height:calc(22vh - 1.8rem)!important;min-height:0!important;overflow-x:hidden!important;overflow-y:auto!important;
              overscroll-behavior:contain!important;
            }
            .mobile-action-panel .m36-mobile-pleasure-fixed {
              width:50%!important;max-width:50%!important;max-height:10vh!important;min-height:0!important;overflow:auto!important;
            }
            .mobile-action-panel .mobile-action-scroll {
              position:absolute!important;z-index:2!important;left:50%!important;right:0!important;top:0!important;bottom:0!important;
              width:50%!important;height:auto!important;max-height:none!important;min-width:0!important;min-height:0!important;
              flex:none!important;margin:0!important;padding:2px 3px!important;overflow-x:hidden!important;overflow-y:auto!important;
              border-left:1px solid rgba(120,113,108,.55)!important;overscroll-behavior:contain!important;
            }
            .mobile-action-panel>button {display:none!important;}
          }

          @media (max-width:1023px) and (orientation:portrait) {
            .mobile-portrait-panel {display:none!important;}
          }
          @media (min-width:1024px) {
            .mobile-portrait-panel {display:none!important;}
          }
          </style>
          """
          end_body = b'</body>'
          replace_in_place(end_body, css + end_body, last=True)

          # Verify the exact targets and injected stylesheet using streaming scans.
          for needle in [b'className:"mobile-portrait-panel",children:x', b'id="wayward-mobile-landscape-v1"', b'@media (max-width:1023px) and (orientation:landscape)']:
              found = find_offsets(needle)
              print(f'VERIFY {needle!r}: {len(found)} occurrence(s) {found[:5]}')
              if not found:
                  raise SystemExit(f'Missing verification marker: {needle!r}')
          print(f'FINAL_SIZE={os.path.getsize(path)}')
          PY
      - name: Browser-check landscape and portrait layout
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/m36-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          cat > /tmp/m36-layout-check.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:844,height:390}});
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(1500);
            for (let step=0; step<7; step++) {
              const action = await page.evaluate(() => {
                const buttons=[...document.querySelectorAll('button')].filter(b=>b.getClientRects().length);
                const exact=(text)=>buttons.find(b=>(b.innerText||'').trim()===text);
                const pick=exact('이해하고 동의합니다') || exact('예') ||
                  buttons.find(b=>/새 게임|새로 시작/.test((b.innerText||'').trim())) ||
                  buttons.find(b=>/게임 시작|계속하기|이어하기/.test((b.innerText||'').trim()));
                if (!pick) return {clicked:null, buttons:buttons.slice(0,18).map(b=>(b.innerText||'').trim().slice(0,45))};
                const text=(pick.innerText||'').trim(); pick.click(); return {clicked:text};
              });
              if (!action.clicked) break;
              console.log('START_FLOW',JSON.stringify(action));
              await page.waitForTimeout(1400);
            }
            await page.waitForTimeout(4500);
            const inspect = async label => page.evaluate(label => {
              const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:s.display,position:s.position,overflow:s.overflow,grid:s.gridTemplateColumns,flex:s.flex};};
              const one=s=>document.querySelector(s);
              return {label,viewport:{w:innerWidth,h:innerHeight},hasLayout:!!one('.mobile-layout'),
                selectors:Object.fromEntries(['.m34-header','.m34-header-stats','.mobile-layout','.mobile-portrait-panel','.mobile-main-panel','.mobile-action-panel','.m36-mobile-tabs','.mobile-action-scroll','.m36-mobile-dialogue-fixed','.m36-mobile-store-status'].map(s=>[s,rect(one(s))])),
                pageHasIntro:/이해하고 동의합니다|법정 성인 연령|성인 콘텐츠 안내/.test(document.body.innerText),
                buttons:[...document.querySelectorAll('button')].slice(0,25).map(b=>(b.innerText||b.getAttribute('aria-label')||'').trim().slice(0,50))};
            },label);
            const landscape=await inspect('landscape');
            await page.screenshot({path:'/tmp/m36-landscape.png',fullPage:false});
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(900);
            const portrait=await inspect('portrait');
            console.log('LANDSCAPE_RESULT',JSON.stringify(landscape));
            console.log('PORTRAIT_RESULT',JSON.stringify(portrait));
            console.log('PAGE_ERRORS',JSON.stringify(errors));
            if (landscape.hasLayout) {
              const p=landscape.selectors['.mobile-portrait-panel'];
              const t=landscape.selectors['.m36-mobile-tabs'];
              const a=landscape.selectors['.mobile-action-panel'];
              if (!p || p.display==='none' || !t || !a) throw new Error('Landscape columns or tab rail not rendered');
              if (portrait.selectors['.mobile-portrait-panel']?.display!=='none') throw new Error('Portrait mode must hide the added landscape-only portrait column');
            } else {
              console.log('LAYOUT_CHECK_NOTE: Game start gate is still present; CSS loaded without runtime errors, but live component geometry could not be asserted.');
            }
            if (errors.length) throw new Error('Browser page errors: '+errors.join('; '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
          node /tmp/m36-layout-check.cjs
      - name: Commit patch and remove temporary audit workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git rm -f .github/workflows/m36-landscape-audit.yml .github/workflows/m36-landscape-runtime.yml .github/workflows/m36-landscape-patch.yml
          git diff --cached --check
          git commit -m "feat(mobile): add four-column landscape layout"
          git push origin HEAD:mobile-migration-v1
