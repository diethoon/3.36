name: m36-shared-return-helper-scan
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Extract helper definitions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          for name in ["bw","Lo","co","ti","be","M$","Bt","Hf","Th","Sh"]:
              tokens=[f"function {name}(",f"const {name}=",f"let {name}=",f"var {name}="]
              positions=[]
              for tok in tokens:
                  positions += [m.start() for m in re.finditer(re.escape(tok),s)]
              positions=sorted(set(positions))
              print(f"\n===== {name} MATCHES {len(positions)} =====")
              for p in positions[-5:]:
                  a=max(0,p-500); b=min(len(s),p+5000)
                  print(f"--- POS {p} ---")
                  print(s[a:b].replace("\n"," ")[:5600])
          PY