name: Faith image loader fix package
on:
  push:
    branches:
      - faith-image-loader-fix-20261028
      - faith-image-loader-generation-gate-fix-20261029
      - faith-zip-direct-loader-20261029
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: node --check 'Wayward_MOD_v4.0_WML_검수완료/wml/mods/faith-image-loader/mod.js'
      - name: Package standalone mod
        run: |
          mkdir -p dist/faith-image-loader
          cp 'Wayward_MOD_v4.0_WML_검수완료/wml/mods/faith-image-loader/mod.js' dist/faith-image-loader/
          cp 'Wayward_MOD_v4.0_WML_검수완료/wml/mods/faith-image-loader/README_ko.txt' dist/faith-image-loader/
          cd dist
          zip -r ../faith-image-loader-zip-direct-v0.4.0.zip faith-image-loader
      - uses: actions/upload-artifact@v4
        with:
          name: faith-image-loader-zip-direct-v0.4.0
          path: faith-image-loader-zip-direct-v0.4.0.zip
          if-no-files-found: error
