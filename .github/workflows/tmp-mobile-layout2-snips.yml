name: tmp-mobile-layout2-snips
on:
  push:
    branches: [mobile-migration-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Apply and validate mobile layout patch
        shell: bash
        run: |
          python3 .github/mobile-layout2-patch.py
          git diff --check
          for f in .github/workflows/tmp-mobile-layout2-* .github/tmp-mobile-layout2-* .github/mobile-layout2-patch.py; do
            [ -e "$f" ] && git rm -f "$f" || true
          done
          git add -A
          if git diff --cached --quiet; then
            echo "NO_FINAL_CHANGES"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(mobile): compact wife status and activity layout"
          git push --force origin HEAD:refs/heads/actions/mobile-layout2
