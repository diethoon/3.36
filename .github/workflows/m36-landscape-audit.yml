name: Temporary landscape layout audit
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-landscape-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Stream-scan relevant markup and selectors in bounded chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          p = 'Wayward_MOD_v3.36.html'
          size = os.path.getsize(p)
          needles = [
            b'<body', b'id="m36-mobile-next-ui-script"', b'id="m36-mobile-space-layout-v2"',
            b'm36-mobile-store-status', b'm36-mobile-dialogue-fixed', b'mobile-action-scroll',
            b'orientation: landscape', b'@media (orientation: landscape)', b'@media(orientation: landscape)',
          ]
          hits = {n: [] for n in needles}
          keys = re.compile(r'(status|portrait|character|dialog|choice|story|layout|header|menu|main|tab|action|panel|nav|screen|sidebar|image|left|right|landscape)', re.I)
          attrs = {}
          pos = 0
          carry = b''
          with open(p, 'rb') as f:
            while True:
              chunk = f.read(65536)
              if not chunk: break
              data = carry + chunk
              base = pos - len(carry)
              for n in needles:
                start = 0
                while True:
                  j = data.find(n, start)
                  if j < 0: break
                  at = base + j
                  if at >= 0 and len(hits[n]) < 30 and (not hits[n] or hits[n][-1] != at):
                    hits[n].append(at)
                  start = j + 1
              for m in re.finditer(rb'\b(id|class)=[\"\']([^\"\']{1,300})[\"\']', data):
                val = m.group(2).decode('utf-8','replace')
                if keys.search(val):
                  key = (m.group(1).decode(), val)
                  attrs.setdefault(key, base + m.start())
              pos += len(chunk)
              carry = data[-4096:]
          with open('/tmp/m36-landscape-audit.txt','w',encoding='utf-8') as out:
            out.write(f'FILE_SIZE={size}\n')
            for n, arr in hits.items():
              out.write(f'\n## NEEDLE {n.decode()} offsets={arr}\n')
              for at in arr[:8]:
                with open(p,'rb') as f:
                  f.seek(max(0,at-850)); context=f.read(1900).decode('utf-8','replace')
                out.write(f'--- offset {at} ---\n{context}\n')
            out.write('\n## MATCHING id/class ATTRIBUTES (offset, attribute, value)\n')
            for (typ,val), at in sorted(attrs.items(), key=lambda x:x[1]):
              out.write(f'{at}\t{typ}\t{val}\n')
          print(open('/tmp/m36-landscape-audit.txt',encoding='utf-8').read()[:26000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m36-landscape-audit
          path: /tmp/m36-landscape-audit.txt
          retention-days: 3
