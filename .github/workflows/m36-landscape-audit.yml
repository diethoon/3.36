name: Temporary landscape layout audit
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-landscape-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Inspect bounded component snippets
        shell: bash
        run: |
          python3 - <<'PY'
          p='Wayward_MOD_v3.36.html'
          windows=[(18870000,18963283,'mobile component'),(19210000,19225000,'header component')]
          for lo,hi,label in windows:
            with open(p,'rb') as f:
              f.seek(lo); data=f.read(hi-lo)
            print('##',label,'range',lo,hi,'len',len(data))
            patterns=[b'T=',b',T=',b'm34-header-control',b'm34-header-stats',b'm34-header-tools',b'm34-header"']
            for needle in patterns:
              start=0; count=0
              while True:
                j=data.find(needle,start)
                if j<0: break
                at=lo+j
                print(f'--- {needle.decode()} @ {at} ---')
                print(data[max(0,j-220):min(len(data),j+620)].decode('utf-8','replace'))
                count+=1; start=j+len(needle)
                if count>=5: break
          PY
