name: Temporary landscape layout audit
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-landscape-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Stream-scan layout code in 64 KB chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          p='Wayward_MOD_v3.36.html'
          needles=[b'mobile-layout',b'mobile-narration',b'mobile-action-scroll',b'mobile-character',b'mobile-nav',b'm36-mobile-status-panel',b'm36-mobile-dialogue-fixed',b'm36-mobile-store-status',b'm36-mobile-prep-compact',b'orientation:landscape',b'orientation: landscape']
          hits={n:[] for n in needles}; classes={}; ids={}
          pos=0; carry=b''
          pat=re.compile(rb'(className|id):"([^"]{1,240})"')
          with open(p,'rb') as f:
            while True:
              ch=f.read(65536)
              if not ch: break
              data=carry+ch; base=pos-len(carry)
              for n in needles:
                start=0
                while True:
                  j=data.find(n,start)
                  if j<0: break
                  at=base+j
                  if at>=0 and (not hits[n] or hits[n][-1]!=at) and len(hits[n])<20: hits[n].append(at)
                  start=j+1
              for m in pat.finditer(data):
                typ=m.group(1).decode(); val=m.group(2).decode('utf-8','replace')
                if re.search(r'(mobile|portrait|landscape|narration|action|choice|sidebar|character|status|panel|header|navigation|menu|tab|dialogue|image|screen|fixed)',val,re.I):
                  d=classes if typ=='className' else ids
                  d.setdefault(val,base+m.start())
              pos+=len(ch); carry=data[-4096:]
          out=[]
          out.append('FILE_SIZE='+str(os.path.getsize(p)))
          out.append('\n## MARKER OFFSETS')
          for n,arr in hits.items(): out.append(n.decode()+': '+str(arr))
          out.append('\n## UNIQUE RELEVANT className VALUES AND OFFSETS')
          out += [f'{at}\t{val}' for val,at in sorted(classes.items(),key=lambda x:x[1])]
          out.append('\n## IDS')
          out += [f'{at}\t{val}' for val,at in sorted(ids.items(),key=lambda x:x[1])]
          out.append('\n## CONTEXTS (bounded 1700-byte windows)')
          seen=set()
          with open(p,'rb') as f:
            for n,arr in hits.items():
              if n in (b'mobile-layout',b'mobile-narration',b'mobile-action-scroll',b'm36-mobile-dialogue-fixed',b'm36-mobile-status-panel') or n.startswith(b'orientation'):
                for at in arr[:3]:
                  if at in seen: continue
                  seen.add(at); f.seek(max(0,at-700)); ctx=f.read(1700).decode('utf-8','replace')
                  out.append(f'--- {n.decode()} offset {at} ---\n{ctx}')
          report='\n'.join(out)
          open('/tmp/m36-landscape-audit.txt','w',encoding='utf-8').write(report)
          print(report[:36000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m36-landscape-audit
          path: /tmp/m36-landscape-audit.txt
          retention-days: 3
