name: m36-assay-call-trace
on:
  push:
    branches: [mobile-migration-v1]
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8",errors="ignore")
          for n in ["function Ace","Ace(","kw(","P$(","zL(","activeAssay","assay_purse"]:
            ps=[m.start() for m in re.finditer(re.escape(n),s)]
            print(f"### {n} COUNT={len(ps)}")
            for i in ps[:12]:
              print(f"@{i}\n{s[max(0,i-1000):min(len(s),i+1800)]}\n")
          PY