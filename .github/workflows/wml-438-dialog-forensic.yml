name: Temporary WML 4.38MB dialog forensic

on:
  pull_request:
    branches:
      - forensic/wml-438-dialog-investigation-20261103

permissions:
  contents: read

jobs:
  inspect-exact-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact WML source commit
        uses: actions/checkout@v4
        with:
          ref: 5e5c78c4e32198e460ba040256e920d37ed1711c
          fetch-depth: 1

      - name: Stream all source bytes and extract targeted contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess

          source = Path("Wayward_WML_ko.html")
          expected_size = 4_383_674
          expected_blob = "8d998b50e82febe18b5c1d1159b16663b9169775"
          expected_sha256 = "35a0ccf79ff18d8650554f6788d5a0952ba7c683b63aea1c17c0b4f1273817f2"
          chunk_size = 4096
          if not source.is_file():
              raise SystemExit("TARGET_SOURCE_MISSING")
          size = source.stat().st_size
          git_blob = subprocess.check_output(
              ["git", "hash-object", str(source)], text=True
          ).strip()
          whole = hashlib.sha256()
          manifest = []
          patterns = {
              "function_loe": re.compile(rb"function\s+loe\b"),
              "assign_loe": re.compile(rb"(?:const|let|var)?\s*loe\s*="),
              "function_itt": re.compile(rb"function\s+itt\b"),
              "assign_itt": re.compile(rb"(?:const|let|var)?\s*itt\s*="),
              "function_hoe": re.compile(rb"function\s+hoe\b"),
              "assign_hoe": re.compile(rb"(?:const|let|var)?\s*hoe\s*="),
              "function_Z0": re.compile(rb"function\s+Z0\b"),
              "assign_Z0": re.compile(rb"(?:const|let|var)?\s*Z0\s*="),
              "function_Ast": re.compile(rb"function\s+Ast\b"),
              "function_sB": re.compile(rb"function\s+sB\b"),
              "function_utt": re.compile(rb"function\s+utt\b"),
              "function_fb": re.compile(rb"function\s+fb\b"),
              "function_Znt": re.compile(rb"function\s+Znt\b"),
              "function_iB": re.compile(rb"function\s+iB\b"),
              "function__B": re.compile(rb"function\s+_B\b"),
              "function_wst": re.compile(rb"function\s+wst\b"),
              "dialogue_terms": re.compile("대화|당신|그녀|대답|말한다|말했습니다".encode("utf-8")),
              "gauge_terms": re.compile("기력|기분|신뢰|이목|흥분도|게이지|상태".encode("utf-8")),
              "dialog_class_terms": re.compile(rb"dialogue|conversation|speech|gauge|meter|progressbar", re.I),
          }
          hits = {key: [] for key in patterns}
          counts = {key: 0 for key in patterns}
          previous_tail = b""
          offset = 0
          with source.open("rb") as fh:
              while True:
                  chunk = fh.read(chunk_size)
                  if not chunk:
                      break
                  chunk_hash = hashlib.sha256(chunk).hexdigest()
                  manifest.append((offset, len(chunk), chunk_hash))
                  whole.update(chunk)
                  combined = previous_tail + chunk
                  base_offset = offset - len(previous_tail)
                  for key, pattern in patterns.items():
                      for match in pattern.finditer(combined):
                          absolute = base_offset + match.start()
                          if absolute < offset and absolute + len(match.group(0)) <= offset:
                              continue
                          counts[key] += 1
                          if len(hits[key]) < 40:
                              hits[key].append(absolute)
                  previous_tail = combined[-1024:]
                  offset += len(chunk)

          Path("evidence").mkdir(exist_ok=True)
          with Path("evidence/chunk-manifest.tsv").open("w", encoding="utf-8") as out:
              out.write("offset\tlength\tsha256\n")
              for off, length, digest in manifest:
                  out.write(f"{off}\t{length}\t{digest}\n")

          excerpts = []
          with source.open("rb") as excerpt_file:
              for key, positions in hits.items():
                  for pos in positions[:12]:
                      start = max(0, pos - 700)
                      end = min(size, pos + 1100)
                      excerpt_file.seek(start)
                      excerpt_bytes = excerpt_file.read(end - start)
                      excerpts.append({
                          "pattern": key,
                          "offset": pos,
                          "start": start,
                          "end": end,
                          "text": excerpt_bytes.decode("utf-8", "replace")
                      })

          renderer_windows = []
          source_windows = {
              "sB_action_renderer_0": (3575639, 3575639 + 6200),
              "sB_action_renderer_1": (3581839, 3581839 + 6200),
              "sB_action_renderer_2": (3588039, 3588039 + 6200),
              "sB_action_renderer_3": (3594239, 3594239 + 6200),
              "Ast_layout_renderer": (3738349, 3738349 + 5200),
              "loe_native_status": (3717824, 3717824 + 5200),
              "itt_story_log": (3465439, 3465439 + 5200),
              "Z0_portrait_card": (3619151, 3619151 + 6200),
              "hoe_response_alert": (3731117, 3731117 + 3000),
          }
          for key in ("function_utt", "function_fb", "function_Znt", "function_iB", "function__B", "function_wst"):
              for index, position in enumerate(hits.get(key, [])[:2]):
                  source_windows[f"{key}_{index}"] = (position, position + 6200)
          with source.open("rb") as source_file:
              for label, (start, end) in source_windows.items():
                  source_file.seek(start)
                  data = source_file.read(min(end, size) - start)
                  renderer_windows.append({
                      "label": label,
                      "start": start,
                      "end": start + len(data),
                      "length": len(data),
                      "text": data.decode("utf-8", "replace")
                  })
          Path("evidence/renderer-windows.json").write_text(
              json.dumps(renderer_windows, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          late_terms = ["당신", "그녀", "대화", "기력", "기분", "신뢰", "이목", "흥분도", "게이지", "name:", "speech", "dialogue", "mood", "energy", "trust"]
          late_hits = {}
          with source.open("rb") as source_file:
              source_file.seek(3_400_000)
              late_data = source_file.read()
          for term in late_terms:
              needle = term.encode("utf-8")
              positions = []
              cursor = 0
              while len(positions) < 100:
                  found = late_data.find(needle, cursor)
                  if found < 0:
                      break
                  positions.append(3_400_000 + found)
                  cursor = found + len(needle)
              late_hits[term] = positions
          Path("evidence/late-ui-terms.json").write_text(
              json.dumps(late_hits, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          evidence = {
              "target": "Wayward_WML_ko.html",
              "checkout_head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "size_bytes": size,
              "chunk_size": chunk_size,
              "chunk_count": len(manifest),
              "final_chunk_length": manifest[-1][1] if manifest else 0,
              "git_blob_sha1": git_blob,
              "sha256": whole.hexdigest(),
              "expected_size_bytes": expected_size,
              "expected_git_blob_sha1": expected_blob,
              "expected_sha256": expected_sha256,
              "identity_match": size == expected_size and git_blob == expected_blob and whole.hexdigest() == expected_sha256,
              "pattern_counts": counts,
              "pattern_offsets": hits,
              "excerpts": excerpts
          }
          Path("evidence/targeted-contexts.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({k:v for k,v in evidence.items() if k != "excerpts"}, ensure_ascii=False, indent=2))
          if not evidence["identity_match"]:
              raise SystemExit("EXACT_SOURCE_IDENTITY_MISMATCH")
          PY

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wml-438-dialog-forensic-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 3


  verify-mobile-ui-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check module and regression harness syntax
        run: |
          node --check mobile-ui-migration/mod.js
          node --check mobile-ui-migration/tests/pinned-renderers.test.cjs

      - name: Run React-tree regression harness
        run: node mobile-ui-migration/tests/pinned-renderers.test.cjs

      - name: Inspect existing ZIP layout and verify repository diff
        run: |
          set -euo pipefail
          unzip -t mobile-ui-migration/mobile-ui-migration-438.zip
          echo "Existing package paths:"
          unzip -Z1 mobile-ui-migration/mobile-ui-migration-438.zip | head -n 30
          git diff --check \${{ github.event.pull_request.base.sha }}...\${{ github.event.pull_request.head.sha }}
