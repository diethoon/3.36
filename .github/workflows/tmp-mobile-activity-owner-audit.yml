name: tmp-mobile-activity-owner-audit

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stream owner definitions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          SRC=Path("Wayward_MOD_v3.36.html")
          CHUNK=65536
          needles=[
            ("GF","function GF("),
            ("HD","function HD("),
            ("a3e_use","a3e["),
            ("arrived_use",'"arrived"'),
            ("M36Activity","function M36MobileCurrentActivity("),
            ("portrait","function rI("),
          ]
          hits={k:[] for k,_ in needles}
          carry=b"";offset=0
          mx=max(len(n.encode("utf-8")) for _,n in needles)
          with SRC.open("rb") as f:
            while True:
              b=f.read(CHUNK)
              if not b: break
              q=carry+b
              base=offset-len(carry)
              for k,n in needles:
                nb=n.encode("utf-8");p=0
                while True:
                  i=q.find(nb,p)
                  if i<0: break
                  hits[k].append(base+i);p=i+1
              carry=q[-(mx-1):];offset+=len(b)

          print("FILE_BYTES",SRC.stat().st_size)
          for k,_ in needles:
            print(k,len(hits[k]),hits[k][:20])

          def ctx(pos,r=3000):
            with SRC.open("rb") as f:
              f.seek(max(0,pos-r))
              return f.read(2*r).decode("utf-8","replace")

          positions=[]
          for k in ["GF","HD","a3e_use","arrived_use","M36Activity"]:
            positions += hits[k][:6]

          for i,pos in enumerate(sorted(set(positions))):
            print(f"--- TARGET {i} POS {pos} ---")
            print(ctx(pos))
            print(f"--- END TARGET {i} ---")
          PY
      - name: Remove temporary audit workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-mobile-activity-owner-audit.yml
          git commit -m "chore: remove temporary activity owner audit"
          git push
