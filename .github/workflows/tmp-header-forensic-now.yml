name: tmp-header-forensic-now
on:
  push:
    branches: [main]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Tiny header units forensic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          needles=[b"m34-header",b"m34-header-tools",b"m34-system-tools",b"m33-launchers",b"m33-theme-button",b"m34-header-control"]
          CH=4096
          for n in needles:
              hits=[]; carry=b""; base=0
              with p.open("rb") as f:
                  while True:
                      c=f.read(CH)
                      if not c: break
                      d=carry+c; start=base-len(carry); at=0
                      while True:
                          i=d.find(n,at)
                          if i<0: break
                          hits.append(start+i); at=i+1
                      keep=len(n)-1; carry=d[-keep:]; base+=len(c)
              print(f"NEEDLE={n.decode()} HITS={len(hits)}")
              for pos in hits[:2]:
                  lo=max(0,pos-250); hi=min(p.stat().st_size,pos+900)
                  with p.open("rb") as f: f.seek(lo); chunk=f.read(hi-lo)
                  s=chunk.decode("utf-8","replace")
                  if any(x in s for x in ["rem","em","%","font-size","line-height","clamp"]):
                      print(f"---OFFSET {pos}---")
                      print(s)
          PY