name: tmp-header-forensic-now
on:
  push:
    branches: [main]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Tiny launcher forensic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          n=b"NPe"; CH=4096; hits=[]; carry=b""; base=0
          with p.open("rb") as f:
              while True:
                  c=f.read(CH)
                  if not c: break
                  d=carry+c; start=base-len(carry); at=0
                  while True:
                      i=d.find(n,at)
                      if i<0: break
                      hits.append(start+i); at=i+1
                  keep=len(n)-1; carry=d[-keep:]; base += len(c)
          print("BYTES=",p.stat().st_size,"HITS=",len(hits))
          for pos in hits[:3]:
              lo=max(0,pos-1000); hi=min(p.stat().st_size,pos+2200)
              with p.open("rb") as f: f.seek(lo); chunk=f.read(hi-lo)
              print(f"---OFFSET {pos}---")
              print(chunk.decode("utf-8","replace"))
          PY