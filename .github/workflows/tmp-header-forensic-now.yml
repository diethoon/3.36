name: tmp-header-forensic-now
on:
  push:
    branches: [main]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: One chunk header CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          pos=19479767
          lo=max(0,pos-150); hi=min(p.stat().st_size,pos+2400)
          with p.open("rb") as f:
              f.seek(lo); chunk=f.read(hi-lo)
          print(chunk.decode("utf-8","replace"))
          PY