name: tmp-mobile-layout2-run
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Patch and verify
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
          git diff --check
          git add Wayward_MOD_v3.36.html
          for f in $(git ls-files '.github/workflows/tmp-mobile-layout2-*' '.github/tmp-mobile-layout2-*'); do git rm -f "$f"; done
          git rm -f .github/workflows/tmp-mobile-probe.yml || true
          git commit -m "fix(mobile): compact choice tabs and relocate room activity"
          git push origin mobile-migration-v1
