name: tmp-finalize-mobile-v2

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Squash temporary workflow history into final mobile patch
        run: |
          set -e
          BASE=e00f38d17383d09ae404040b9577dd0732861a3a
          EXPECTED=c1b0ff3b0949aff121209df827cd16ca4f011121
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=1 origin $BASE
          git reset --soft $BASE
          find .github/workflows -maxdepth 1 -type f -name 'tmp-*' -delete
          git add -A
          git diff --cached --check
          echo "FINAL_DIFF_STAT"
          git diff --cached --stat
          test -f Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): compact prep controls and wife detail tabs"
          git push --force-with-lease=refs/heads/mobile-migration-v1:$EXPECTED origin HEAD:mobile-migration-v1
