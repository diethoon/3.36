name: inspect-fullscreen-target
on:
  push:
    branches: [fullscreen-button]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect target without loading whole file
        shell: python
        run: |
          from pathlib import Path
          p = Path("Wayward_MOD_v3.36.html")
          s = p.read_text(encoding="utf-8", errors="replace")
          print("INSPECTION_RETRY")
          print("BYTES", p.stat().st_size)
          print("LINES", s.count("\n") + 1)
          needles = ["☰", "hamburger", "menu", "Menu", "메뉴", "three-dots", "ellipsis", "more_vert", "⋮", "⋯"]
          hits = []
          for n in needles:
              start = 0
              while True:
                  i = s.find(n, start)
                  if i < 0: break
                  hits.append((i, n))
                  start = i + max(1, len(n))
                  if len(hits) >= 80: break
              if len(hits) >= 80: break
          for i, n in hits[:80]:
              a=max(0,i-450); b=min(len(s),i+900)
              print(f"--- HIT {n!r} OFFSET {i} ---")
              print(s[a:b])
