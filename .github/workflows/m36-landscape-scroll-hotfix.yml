name: M36 landscape geometry repair runtime verifier (one-shot)
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/m36-landscape-scroll-hotfix.yml"
permissions:
  contents: write
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Prepare bounded runtime verifier
        run: |
          cat > /tmp/m36-runtime-test.cjs <<'NODE'
          const fs = require('fs');
          const http = require('http');
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const file = 'Wayward_MOD_v3.36.html';
          const reportFile = '/tmp/m36-report.json';
          const stateFile = '/tmp/m36-storage.json';
          const origin = 'http://127.0.0.1:4173/Wayward_MOD_v3.36.html';
          const readReport = () => JSON.parse(fs.readFileSync(reportFile, 'utf8'));
          const saveReport = r => fs.writeFileSync(reportFile, JSON.stringify(r, null, 2));
          const box = e => {
            if (!e) return null;
            const r = e.getBoundingClientRect();
            return {x:+r.x.toFixed(2), y:+r.y.toFixed(2), right:+r.right.toFixed(2),
              width:+r.width.toFixed(2), height:+r.height.toFixed(2)};
          };
          async function startServer() {
            const s = http.createServer((req, res) => {
              res.writeHead(200, {'content-type':'text/html; charset=utf-8','cache-control':'no-store'});
              fs.createReadStream(file).pipe(res);
            });
            await new Promise((resolve, reject) => s.listen(4173, '127.0.0.1', resolve).once('error', reject));
            return s;
          }
          async function clickVisible(page, regex) {
            const b = page.getByRole('button', {name:regex}).first();
            if (!(await b.count().catch(()=>0)) || !(await b.isVisible().catch(()=>false))) return false;
            await b.evaluate(e => e.click());
            await page.waitForTimeout(450);
            return true;
          }
          async function enterGame(page, label, report) {
            const actions = [];
            for (let n=0; n<70; n++) {
              const ready = await page.evaluate(() => {
                const l=document.querySelector('.mobile-layout');
                const p=document.querySelector('.mobile-action-panel');
                const c=document.querySelector('.mobile-action-scroll');
                return !!(l && p && c && l.getBoundingClientRect().width>120 && p.getBoundingClientRect().width>50);
              }).catch(()=>false);
              if (ready) { report.boot.push({label,ok:true,actions}); return; }
              if (await clickVisible(page, /^예$/)) { actions.push('confirmed age'); continue; }
              if (await clickVisible(page, /이해하고 동의합니다/)) { actions.push('accepted content notice'); continue; }
              if (await clickVisible(page, /계속하기/)) { actions.push('continued saved game'); continue; }
              if (actions.includes('selected wife relationship') && await clickVisible(page, /엘레나/)) { actions.push('selected Elena'); continue; }
              if (!actions.includes('selected wife relationship') && await clickVisible(page, /아내/)) { actions.push('selected wife relationship'); continue; }
              if (await clickVisible(page, /엘레나/)) { actions.push('selected Elena'); continue; }
              if (await clickVisible(page, /^새 게임$/)) { actions.push('started new game'); continue; }
              if (await clickVisible(page, /건너뛰기/)) { actions.push('skipped prologue'); continue; }
              if (await clickVisible(page, /^다음$/)) { actions.push('advanced prologue'); continue; }
              await page.waitForTimeout(250);
            }
            const tail = (await page.locator('body').innerText().catch(()=>'' )).slice(-1800);
            report.boot.push({label,ok:false,actions,tail});
            saveReport(report);
            throw new Error(label + ': game UI selectors not reached; actions=' + JSON.stringify(actions) + '; page tail=' + tail);
          }
          async function snapshot(page, label) {
            return await page.evaluate(label => {
              const b=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2)};};
              const l=document.querySelector('.mobile-layout'), p=document.querySelector('.mobile-action-panel');
              const i=document.querySelector('.m36-landscape-info-scroll'), c=document.querySelector('.mobile-action-scroll');
              const ps=p?getComputedStyle(p):null;
              return {label,viewport:{innerWidth,innerHeight,clientWidth:document.documentElement.clientWidth,
                clientHeight:document.documentElement.clientHeight,docWidth:document.documentElement.scrollWidth,
                fullscreen:!!document.fullscreenElement},
                layout:b(l),grid:l?getComputedStyle(l).gridTemplateColumns:null,
                panel:b(p),panelGrid:ps?{column:ps.gridColumn,start:ps.gridColumnStart,end:ps.gridColumnEnd}:null,
                info:b(i),choices:b(c),choicesPosition:c?getComputedStyle(c).position:null,
                pleasure:b(document.querySelector('.m36-mobile-pleasure-fixed')),
                dialogue:b(document.querySelector('.m36-mobile-dialogue-fixed')),
                nodes:{layout:!!l,panel:!!p,info:!!i,choices:!!c,pleasure:!!document.querySelector('.m36-mobile-pleasure-fixed')}};
            },label);
          }
          function assertClose(a,b,tolerance,why) {
            if (a==null || b==null || Math.abs(a-b)>tolerance) throw new Error(why+': '+a+' versus '+b);
          }
          function assertLandscape(m) {
            if (!m.layout || !m.panel || !m.info || !m.choices) throw new Error(m.label+': missing layout node '+JSON.stringify(m.nodes));
            if (m.panelGrid.start!=='3' || m.panelGrid.end!=='5') throw new Error(m.label+': action panel must span columns 3–4; actual '+JSON.stringify(m.panelGrid));
            assertClose(m.layout.right,m.viewport.clientWidth,2,m.label+' layout must end at viewport edge');
            assertClose(m.panel.right,m.layout.right,3,m.label+' action panel must reach layout edge');
            assertClose(m.choices.right,m.layout.right,4,m.label+' choices must reach layout edge');
            if (m.viewport.docWidth>m.viewport.clientWidth+1) throw new Error(m.label+': horizontal page overflow '+m.viewport.docWidth+' > '+m.viewport.clientWidth);
          }
          async function main() {
            const mode=process.argv[2];
            let server,browser;
            if(mode==='baseline') {
              const report={branch:'mobile-migration-v1',sourceHead:require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
                sourceHtmlBlob:require('child_process').execFileSync('git',['rev-parse','HEAD:'+file],{encoding:'utf8'}).trim(),
                sourceBytes:fs.statSync(file).size,boot:[],portraitBefore:null,measurements:[],patch:null,failures:[],verdict:'BASELINE_PENDING'};
              fs.copyFileSync(file,'/tmp/m36-original.html');
              try {
                server=await startServer(); browser=await chromium.launch({headless:true,args:['--no-sandbox']});
                const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
                const page=await ctx.newPage(); page.on('pageerror',e=>report.failures.push(String(e)));
                await page.goto(origin,{waitUntil:'domcontentloaded',timeout:120000});
                await enterGame(page,'portrait baseline',report);
                report.portraitBefore=await snapshot(page,'portrait before patch');
                if(!report.portraitBefore.nodes.layout||!report.portraitBefore.nodes.panel||!report.portraitBefore.nodes.choices) throw new Error('Portrait baseline missing required layout nodes');
                await ctx.storageState({path:stateFile});
                report.verdict='BASELINE_PASS'; saveReport(report);
              } catch(e) {
                report.verdict='FAIL'; report.failures.push(String(e&&e.stack||e).slice(0,5000)); saveReport(report); throw e;
              } finally { if(browser) await browser.close().catch(()=>{}); if(server) await new Promise(r=>server.close(r)); }
            } else if(mode==='final') {
              const report=readReport();
              try {
                server=await startServer(); browser=await chromium.launch({headless:true,args:['--no-sandbox']});
                const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1,storageState:stateFile});
                const page=await ctx.newPage(); page.on('pageerror',e=>report.failures.push(String(e)));
                await page.goto(origin,{waitUntil:'domcontentloaded',timeout:120000});
                await enterGame(page,'portrait after patch',report);
                const after=await snapshot(page,'portrait after patch'); report.portraitAfter=after;
                if(after.nodes.layout!==report.portraitBefore.nodes.layout || after.nodes.pleasure!==report.portraitBefore.nodes.pleasure) throw new Error('Portrait required nodes changed');
                for(const key of ['x','y','right','width','height']) assertClose(after.layout[key],report.portraitBefore.layout[key],1.5,'Portrait layout '+key+' changed');
                if(after.pleasure && report.portraitBefore.pleasure) for(const key of ['x','y','right','width','height']) assertClose(after.pleasure[key],report.portraitBefore.pleasure[key],1.5,'Portrait fixed gauge '+key+' changed');
                for(const vp of [{w:1280,h:720},{w:915,h:412},{w:720,h:360}]) {
                  await page.setViewportSize({width:vp.w,height:vp.h});
                  await page.waitForTimeout(800);
                  const m=await snapshot(page,'landscape '+vp.w+'x'+vp.h);
                  report.measurements.push(m); assertLandscape(m);
                }
                const fsButton=page.getByRole('button',{name:/전체화면/}).first();
                if(await fsButton.count().catch(()=>0) && await fsButton.isVisible().catch(()=>false)) {
                  await fsButton.click({timeout:1500}).catch(()=>{});
                  await page.waitForTimeout(450);
                  const full=await page.evaluate(()=>!!document.fullscreenElement);
                  report.fullscreen={controlFound:true,entered:full};
                  if(full) {
                    const m=await snapshot(page,'landscape fullscreen');
                    report.measurements.push(m); assertLandscape(m);
                    await page.evaluate(()=>document.exitFullscreen()).catch(()=>{});
                    await page.waitForTimeout(350);
                  }
                } else report.fullscreen={controlFound:false,entered:false};
                if(report.failures.length) throw new Error('Browser page errors: '+report.failures.join(' | '));
                report.verdict='PASS'; saveReport(report); fs.writeFileSync('/tmp/m36-pass','PASS');
              } catch(e) {
                report.verdict='FAIL'; report.failures.push(String(e&&e.stack||e).slice(0,5000)); saveReport(report);
                if(fs.existsSync('/tmp/m36-original.html')) fs.copyFileSync('/tmp/m36-original.html',file);
                throw e;
              } finally { if(browser) await browser.close().catch(()=>{}); if(server) await new Promise(r=>server.close(r)); }
            } else throw new Error('Expected baseline or final mode');
          }
          main().catch(e=>{console.error(e&&e.stack||e);process.exitCode=1;});
          NODE
      - name: Capture baseline gameplay and portrait geometry
        id: baseline
        run: |
          set -euo pipefail
          node /tmp/m36-runtime-test.cjs baseline
      - name: Apply narrowly scoped landscape-only grid correction
        if: success()
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, os
          p=Path('Wayward_MOD_v3.36.html')
          marker=b'm36-landscape-grid-contract-20261016'
          body=b'</body>'
          terms=[b'wayward-save-share',b'm36-mobile-disabled-choice',b'm36-mobile-pleasure-fixed',
                 b'M36MobileStoreStatus','물자 채우기'.encode(), '시설 업그레이드'.encode(), '인사하기'.encode()]
          positions={marker:set(),body:set()}
          counts={t:set() for t in terms}
          overlap=b''; total=0
          with p.open('rb') as f:
              while True:
                  chunk=f.read(256*1024)
                  if not chunk: break
                  buf=overlap+chunk; base=total-len(overlap)
                  for target in positions:
                      at=0
                      while True:
                          i=buf.find(target,at)
                          if i<0: break
                          positions[target].add(base+i); at=i+1
                  for target,found in counts.items():
                      at=0
                      while True:
                          i=buf.find(target,at)
                          if i<0: break
                          found.add(base+i); at=i+1
                  total+=len(chunk); overlap=buf[-512:]
          if positions[marker]: raise SystemExit('Refusing duplicate landscape patch marker')
          if not positions[body]: raise SystemExit('Closing body tag not found')
          before={t.decode('utf-8'):len(v) for t,v in counts.items()}
          style=('''<style id="m36-landscape-grid-contract-20261016">
          @media (orientation:landscape) and (min-width:600px) {
            .mobile-layout {
              left:28px!important;
              width:calc(100% - 28px)!important;
              max-width:calc(100% - 28px)!important;
              box-sizing:border-box!important;
            }
            .mobile-action-panel {
              grid-column:3 / 5!important;
              min-width:0!important;
            }
          }
          </style>
          ''').encode('utf-8')
          body_at=max(positions[body]); tmp=p.with_suffix('.html.m36tmp')
          with p.open('rb') as src, tmp.open('wb') as dst:
              remaining=body_at
              while remaining:
                  chunk=src.read(min(256*1024,remaining))
                  if not chunk: raise SystemExit('Source ended unexpectedly before body tag')
                  dst.write(chunk); remaining-=len(chunk)
              dst.write(style)
              while True:
                  chunk=src.read(256*1024)
                  if not chunk: break
                  dst.write(chunk)
          os.replace(tmp,p)
          after_counts={t:set() for t in terms}; overlap=b''; total=0
          with p.open('rb') as f:
              while True:
                  chunk=f.read(256*1024)
                  if not chunk: break
                  buf=overlap+chunk; base=total-len(overlap)
                  for target,found in after_counts.items():
                      at=0
                      while True:
                          i=buf.find(target,at)
                          if i<0: break
                          found.add(base+i); at=i+1
                  total+=len(chunk); overlap=buf[-512:]
          after={t.decode('utf-8'):len(v) for t,v in after_counts.items()}
          if before!=after: raise SystemExit('Feature marker counts changed: '+json.dumps({'before':before,'after':after},ensure_ascii=False))
          ev={'styleMarker':'m36-landscape-grid-contract-20261016','bytesBefore':p.stat().st_size-len(style),
              'bytesAfter':p.stat().st_size,'insertedBytes':len(style),'featureMarkerCountsBefore':before,
              'featureMarkerCountsAfter':after,'patchScope':'landscape CSS only; original bytes otherwise streamed unchanged'}
          Path('/tmp/m36-patch-evidence.json').write_text(json.dumps(ev,ensure_ascii=False,indent=2))
          print(json.dumps(ev,ensure_ascii=False))
          PY
          git diff --check
      - name: Verify portrait preservation and landscape grid geometry
        if: success()
        run: |
          set -euo pipefail
          node /tmp/m36-runtime-test.cjs final
      - name: Write evidence and commit result; remove one-shot runner
        if: always()
        run: |
          set -euo pipefail
          mkdir -p idea
          if [ -f /tmp/m36-patch-evidence.json ]; then
            node -e "const fs=require('fs');const p='/tmp/m36-report.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));r.patch=JSON.parse(fs.readFileSync('/tmp/m36-patch-evidence.json','utf8'));fs.writeFileSync(p,JSON.stringify(r,null,2))"
          fi
          if [ -f /tmp/m36-report.json ]; then
            { echo "# M36 Landscape Geometry Repair — 2026-10-16"; echo; echo "Result: **$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/m36-report.json','utf8')).verdict)")**"; echo; echo "JSON evidence:"; cat /tmp/m36-report.json; } > idea/M36_LANDSCAPE_GEOMETRY_REPAIR_20261016.md
          else
            printf '%s\n' '# M36 Landscape Geometry Repair — 2026-10-16' '' 'Result: **FAIL**' '' 'No runtime report was produced; inspect this workflow run logs.' > idea/M36_LANDSCAPE_GEOMETRY_REPAIR_20261016.md
          fi
          if [ ! -f /tmp/m36-pass ] && [ -f /tmp/m36-original.html ]; then cp /tmp/m36-original.html Wayward_MOD_v3.36.html; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/m36-landscape-scroll-hotfix.yml || true
          if [ -f /tmp/m36-pass ]; then
            git add Wayward_MOD_v3.36.html idea/M36_LANDSCAPE_GEOMETRY_REPAIR_20261016.md
            git commit -m "fix(mobile): correct landscape columns without changing portrait"
          else
            git add idea/M36_LANDSCAPE_GEOMETRY_REPAIR_20261016.md
            git commit -m "test(mobile): record geometry verification and remove runner"
          fi
          git push origin HEAD:mobile-migration-v1
      - name: Require verified result
        if: always()
        run: |
          test -f /tmp/m36-pass || (echo "Runtime verification failed; the original HTML was restored." && exit 1)
