name: M36 landscape third-column scroll fix

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-landscape-scroll-hotfix.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact triggering branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inspect, patch only the EOF landscape scroll override, and validate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'Wayward_MOD_v3.36.html';
          const marker = 'm36-landscape-third-column-scroll-touch-fix-20261014';
          const src = fs.readFileSync(p, 'utf8');
          console.log('SOURCE_BYTES=' + Buffer.byteLength(src));
          console.log('EXISTING_MARKER=' + (src.includes(marker) ? 'yes' : 'no'));
          for (const token of ['.m36-landscape-info-scroll', 'touchmove', 'preventDefault()', 'overflow-y:auto', 'overflow-y: auto']) {
            let count = 0, at = -1;
            while ((at = src.indexOf(token, at + 1)) !== -1) count++;
            console.log('TOKEN ' + JSON.stringify(token) + ' count=' + count);
            const first = src.indexOf(token);
            if (first >= 0 && (token === '.m36-landscape-info-scroll' || token === 'touchmove' || token === 'preventDefault()')) {
              console.log('CONTEXT ' + JSON.stringify(token) + ': ' + src.slice(Math.max(0, first - 180), Math.min(src.length, first + 600)).replace(/\s+/g, ' ').slice(0, 800));
            }
          }
          if (!src.includes(marker)) {
            const css = `
          <style id="${marker}">
          @media (orientation: landscape) and (min-width: 600px) {
            /* The info/status/prep/facility column must be the actual touch scroll owner. */
            .m36-landscape-info-scroll {
              box-sizing: border-box !important;
              min-width: 0 !important;
              min-height: 0 !important;
              height: 100% !important;
              max-height: 100% !important;
              flex: 1 1 0px !important;
              overflow-x: hidden !important;
              overflow-y: scroll !important;
              -webkit-overflow-scrolling: touch !important;
              overscroll-behavior-y: contain !important;
              touch-action: pan-y !important;
              pointer-events: auto !important;
              scrollbar-width: thin !important;
            }
            .m36-landscape-info-scroll * {
              touch-action: pan-y;
            }
            .m36-landscape-info-scroll > * {
              min-width: 0;
            }
          }
          </style>
          `;
            const bodyEnd = src.toLowerCase().lastIndexOf('</body>');
            if (bodyEnd < 0) throw new Error('Cannot safely locate </body> for bounded append');
            const patched = src.slice(0, bodyEnd) + css + String.fromCharCode(10) + src.slice(bodyEnd);
            fs.writeFileSync(p, patched, 'utf8');
            console.log('PATCH_APPLIED=yes');
          } else {
            console.log('PATCH_APPLIED=no (already present)');
          }
          const out = fs.readFileSync(p, 'utf8');
          if (!out.includes(marker) || !out.includes('overflow-y: scroll !important') || !out.includes('touch-action: pan-y !important')) throw new Error('CSS invariant failed');
          if (out.toLowerCase().split('<body').length !== 2 || out.toLowerCase().split('</body>').length !== 2) throw new Error('body boundary invariant failed');
          console.log('HTML_BYTES_AFTER=' + Buffer.byteLength(out));
          NODE
          git diff --check
          git diff --stat

      - name: Install browser and test actual scroll input on mobile landscape viewport
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 >/tmp/m36-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 820, height: 360 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            const response = await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html', { waitUntil: 'domcontentloaded', timeout: 90000 });
            console.log('M36_HTTP_RESPONSE=' + response?.status());
            await page.waitForFunction(() => document.body && document.body.innerText.trim().length > 10, null, { timeout: 60000 }).catch(() => {});
            await wait(1200);
            for (let i = 0; i < 40; i++) {
              const body = await page.locator('body').innerText().catch(() => '');
              if (body.includes('물자 채우기') && body.includes('대출')) break;
              const next = page.getByRole('button', { name: /^예$|이해하고 동의합니다|다음|계속|시작|확인|완료|진행|게임 시작|새 게임/ });
              let clicked = false;
              for (let j = 0; j < await next.count(); j++) {
                try {
                  const b = next.nth(j);
                  if (await b.isVisible() && await b.isEnabled()) {
                    await b.evaluate(e => e.click());
                    await wait(180);
                    clicked = true;
                    break;
                  }
                } catch {}
              }
              if (!clicked && body.includes('그녀는 당신에게 어떤 존재인가요')) {
                const wifeType = page.getByRole('button', { name: /^아내$/ });
                if (await wifeType.count() && await wifeType.first().isVisible() && await wifeType.first().isEnabled()) {
                  await wifeType.first().evaluate(e => e.click());
                  await wait(220);
                  clicked = true;
                }
                const woman = page.getByRole('button', { name: /^(엘레나|마라|피파)/ });
                if (await woman.count() && await woman.first().isVisible() && await woman.first().isEnabled()) {
                  await woman.first().evaluate(e => e.click());
                  await wait(250);
                  clicked = true;
                }
              }
              if (!clicked) {
                const woman = page.getByRole('button', { name: /^(엘레나|마라|피파)/ });
                if (await woman.count() && await woman.first().isVisible() && await woman.first().isEnabled()) {
                  await woman.first().evaluate(e => e.click());
                  await wait(250);
                  clicked = true;
                }
              }
              if (!clicked) await wait(220);
            }
            await wait(700);
            const info = page.locator('.m36-landscape-info-scroll').first();
            if (!await info.count()) {
              console.log('BODY_AFTER_BOOT=' + (await page.locator('body').innerText()).slice(0, 800));
              throw new Error('Actual game did not render the landscape third-column scroll container after startup choices');
            }
            const initial = await info.evaluate(el => {
              const r = el.getBoundingClientRect(), s = getComputedStyle(el);
              return { x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height),
                display: s.display, overflowY: s.overflowY, scrollHeight: el.scrollHeight, clientHeight: el.clientHeight,
                touchAction: s.touchAction, bodyText: document.body.innerText.slice(0, 300) };
            });
            console.log('M36_NARROW_LANDSCAPE_INITIAL=' + JSON.stringify(initial));
            if (initial.width < 20 || initial.height < 100 || initial.display !== 'flex' || !['auto', 'scroll'].includes(initial.overflowY)) {
              throw new Error('Third-column region does not own a full-height vertical scroll');
            }
            await info.evaluate(el => {
              const sentinel = document.createElement('div');
              sentinel.dataset.testSentinel = 'scroll-test';
              sentinel.style.cssText = 'height:1800px;min-height:1800px;display:block;pointer-events:none;';
              el.appendChild(sentinel);
              el.scrollTop = 0;
            });
            const box = await info.boundingBox();
            await page.mouse.move(box.x + box.width / 2, box.y + Math.min(100, box.height / 2));
            await page.mouse.wheel(0, 550);
            await wait(350);
            const afterWheel = await info.evaluate(el => ({ scrollTop: el.scrollTop, max: el.scrollHeight - el.clientHeight }));
            console.log('M36_AFTER_WHEEL=' + JSON.stringify(afterWheel));
            const cdp = await page.context().newCDPSession(page);
            const x = Math.round(box.x + box.width / 2);
            const y = Math.max(80, Math.min(300, Math.round(box.y + box.height - 30)));
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x, y }] });
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x, y: y - 100 }] });
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x, y: y - 200 }] });
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
            await wait(350);
            const afterTouch = await info.evaluate(el => ({ scrollTop: el.scrollTop, max: el.scrollHeight - el.clientHeight }));
            console.log('M36_AFTER_TOUCH=' + JSON.stringify(afterTouch));
            if (afterWheel.scrollTop <= 0) throw new Error('Wheel input did not scroll the actual third-column container');
            if (afterTouch.scrollTop <= afterWheel.scrollTop) throw new Error('Touch drag did not advance the third-column scroll');
            if (errors.length) throw new Error('Browser page errors: ' + errors.join(' | '));
            console.log('M36_THIRD_COLUMN_WHEEL_AND_TOUCH_SCROLL_PASSED');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Commit only the targeted HTML fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git rm .github/workflows/m36-landscape-scroll-hotfix.yml
          git commit -m "fix(mobile): restore touch scrolling in landscape third column"
          git push origin HEAD:mobile-migration-v1
