name: One-time cloud load button patch

on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/apply-cloud-load-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout mobile migration branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          persist-credentials: true
      - name: Apply three exact streaming replacements without loading the full HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("Wayward_MOD_v3.36.html")
          temp = path.with_name(path.name + ".patch.tmp")
          replacements = [
              (
                  "function M36CloudImportControl({onDone}){".encode("utf-8"),
                  "function M36CloudImportControl({onDone,compact=false}){".encode("utf-8"),
              ),
              (
                  'children:busy?"세이브 가져오는 중…":"공유 코드로 세이브 가져오기"'.encode("utf-8"),
                  'children:busy?"세이브 가져오는 중…":compact?"클라우드에서 불러오기":"공유 코드로 세이브 가져오기"'.encode("utf-8"),
              ),
              (
                  'I==="saves"&&u.jsxs(u.Fragment,{children:['.encode("utf-8"),
                  'e==="load"&&u.jsx(M36CloudImportControl,{onDone:o,compact:true}),I==="saves"&&u.jsxs(u.Fragment,{children:['.encode("utf-8"),
              ),
          ]
          max_len = max(len(old) for old, _ in replacements)
          counts = [0] * len(replacements)
          buffer = bytearray()

          def drain(out, final=False):
              while len(buffer) >= max_len or (final and buffer):
                  match = None
                  for i, (old, new) in enumerate(replacements):
                      if buffer.startswith(old):
                          match = (i, old, new)
                          break
                  if match:
                      i, old, new = match
                      out.write(new)
                      del buffer[:len(old)]
                      counts[i] += 1
                  else:
                      out.write(buffer[:1])
                      del buffer[:1]

          try:
              with path.open("rb") as src, temp.open("wb") as dst:
                  while True:
                      chunk = src.read(65536)
                      if not chunk:
                          break
                      buffer.extend(chunk)
                      drain(dst)
                  drain(dst, final=True)
              if counts != [1, 1, 1]:
                  raise RuntimeError(f"Patch anchors must each match once; counts={counts}")
              os.replace(temp, path)
              print("PATCH_COUNTS=" + ",".join(map(str, counts)))
              print(f"OUTPUT_SIZE_BYTES={path.stat().st_size}")
          except Exception:
              try:
                  temp.unlink()
              except FileNotFoundError:
                  pass
              raise
          PY
      - name: Validate only the intended diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F -o 'function M36CloudImportControl({onDone,compact=false}){' Wayward_MOD_v3.36.html | wc -l
          grep -F -o 'children:busy?"세이브 가져오는 중…":compact?"클라우드에서 불러오기":"공유 코드로 세이브 가져오기"' Wayward_MOD_v3.36.html | wc -l
          grep -F -o 'e==="load"&&u.jsx(M36CloudImportControl,{onDone:o,compact:true}),I==="saves"&&u.jsxs' Wayward_MOD_v3.36.html | wc -l
          grep -F -o 'u.jsx(M36CloudImportControl,{onDone:e})' Wayward_MOD_v3.36.html | wc -l
          git diff --numstat
      - name: Remove this one-time workflow and commit the single-file patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-cloud-load-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html .github/workflows/apply-cloud-load-ui.yml
          git commit -m "feat(save-share): add cloud load button to save dialog"
          git push origin HEAD:mobile-migration-v1
