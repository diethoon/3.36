name: M36 change value rendering inspection v2
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/m36-change-value-inspection-v2-20261014.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Inspect narrow byte regions and status-change labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          with p.open("rb") as f:
            f.seek(0,2); size=f.tell()
            print("FILE_BYTES",size)
            for start,length in [(18_530_000,14_000),(18_565_000,14_000),(18_730_000,15_000)]:
              f.seek(start); data=f.read(length)
              print(f"\n===== RANGE {start}:{start+len(data)} =====")
              print(data.decode("utf-8","replace").replace("\\n"," ")[:14500])
          PY
      - name: Remove temporary inspection workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/m36-change-value-inspection-v2-20261014.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then git commit -m "chore: remove temporary change value inspection"; git push origin mobile-migration-v1; fi
