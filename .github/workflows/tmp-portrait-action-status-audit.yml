name: tmp-portrait-action-status-audit

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate portrait action status call
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          SRC=Path("Wayward_MOD_v3.36.html")
          needles=[
            ("portrait_surface",'surface:"portrait"'),
            ("status_component","M331ActionStatus"),
            ("portrait_wrapper",'data-m331-action-status:"portrait"'),
          ]
          hits={k:[] for k,_ in needles}
          CHUNK=65536; carry=b""; offset=0
          mx=max(len(n.encode()) for _,n in needles)
          with SRC.open("rb") as f:
            while True:
              b=f.read(CHUNK)
              if not b: break
              q=carry+b;base=offset-len(carry)
              for k,n in needles:
                nb=n.encode();p=0
                while True:
                  i=q.find(nb,p)
                  if i<0:break
                  hits[k].append(base+i);p=i+1
              carry=q[-(mx-1):];offset+=len(b)
          print("FILE_BYTES",SRC.stat().st_size)
          for k,_ in needles:print(k,len(hits[k]),hits[k][:20])
          pos=(hits["portrait_surface"]+hits["status_component"])[:10]
          for p in sorted(set(pos)):
            with SRC.open("rb") as f:
              f.seek(max(0,p-2500))
              print("--- POS",p,"---")
              print(f.read(6000).decode("utf-8","replace"))
      - name: Remove temporary audit workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-portrait-action-status-audit.yml
          git commit -m "chore: remove temporary portrait action status audit"
          git push
