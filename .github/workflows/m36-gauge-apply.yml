name: m36-gauge-apply

on:
  push:
    branches: [mobile-migration-v1]
    paths-ignore:
      - "__m36_gauge_trigger.txt"
      - "__m36_smoke_trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1

      - name: Apply gauge patch
        run: python3 tools/m36_apply_gauge_patch.py

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          if git diff --cached --quiet; then
            echo "M36_GAUGE_NO_CHANGES"
          else
            git commit -m "fix(mobile): keep pleasure gauges above choice scroll"
            git push
          fi
