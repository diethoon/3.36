name: fix-mobile-right-status
on:
  pull_request:
    branches:
      - mobile-migration-v1
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: patch validate commit cleanup
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("Wayward_MOD_v3.36.html")
          data=p.read_bytes()

          def rep(old,new,label):
              global data
              n=data.count(old)
              print(label,n)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1, got {n}")
              data=data.replace(old,new,1)

          rep(
            b'function M36MobileStoreStatus(){',
            b'function M36MobileStoreStatus({showAllRooms=false}={}){',
            'store signature'
          )
          rep(
            b'const state=re(d=>d.state),dispatch=re(d=>d.dispatch),wife=g(state),playerLoc=be(state),activePatronInteraction=G9(state),',
            b'const state=re(d=>d.state),dispatch=re(d=>d.dispatch),wife=g(state),playerLoc=re(d=>be(d.state)),activePatronInteraction=G9(state),',
            'live player location'
          )
          rep(
            b'u.jsx(M36MobileRoomActivity,{room:playerLoc,canSee:!0})',
            b'u.jsx(M36MobileRoomActivity,{room:playerLoc,canSee:!0,showAllRooms})',
            'store room activity props'
          )
          rep(
            b'function M36MobileRoomActivity({room:targetRoom,canSee:targetCanSee}={}){',
            b'function M36MobileRoomActivity({room:targetRoom,canSee:targetCanSee,showAllRooms=false}={}){',
            'room activity signature'
          )
          rep(
            b'const state=re(d=>d.state),proximity=Rt(d=>d.proximityMode),current=vt(state),rooms=targetRoom?[targetRoom]:Yie(state,wx,{proximity}),activePatronInteraction=Y(state),wife=g(state);',
            b'const state=re(d=>d.state),proximity=Rt(d=>d.proximityMode),current=vt(state),rooms=showAllRooms?[...Xi]:(targetRoom?[targetRoom]:Yie(state,wx,{proximity})),activePatronInteraction=Y(state),wife=g(state);',
            'all room source'
          )
          rep(
            b'const canSee=targetCanSee??(room===current||!proximity);',
            b'const canSee=targetCanSee??(showAllRooms||room===current||!proximity);',
            'all room visibility'
          )
          rep(
            b'u.jsx(M36MobileStoreStatus,{})',
            b'u.jsx(M36MobileStoreStatus,{showAllRooms:!0})',
            'existing top status block'
          )

          p.write_bytes(data)

          text=p.read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>",text,re.S)
          target=next((x for x in scripts if "function AOe(" in x and "function M36MobileStoreStatus(" in x),None)
          if target is None:
              raise SystemExit("main JS block not found")
          Path("/tmp/wayward-main.js").write_text(target,encoding="utf-8")
          PY
          node --check /tmp/wayward-main.js
          git diff --check -- Wayward_MOD_v3.36.html
          git diff --stat 43da5b22e91648f1c57e7e99d57da4a9f551dc73 -- Wayward_MOD_v3.36.html
          git diff -- Wayward_MOD_v3.36.html
          git config user.name "diethoon"
          git config user.email "jhy67439787@gmail.com"
          git add Wayward_MOD_v3.36.html
          git rm -f .github/workflows/fix-mobile-right-status.yml
          git commit -m "fix(mobile): keep right status location and customers live"
          git push origin "HEAD:$HEAD_BRANCH"
