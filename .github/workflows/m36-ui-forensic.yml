name: One-shot mobile UI forensic scan
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-ui-forensic.yml
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Stream-scan only relevant UI anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/m36-ui-forensic-report.txt
          from pathlib import Path
          import re
          import subprocess

          p = Path("Wayward_MOD_v3.36.html")
          print("SOURCE", p, "BYTES", p.stat().st_size)
          print("CHECKOUT_SHA", subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          # Only 64 KiB chunks + a small overlap; never load the whole HTML.
          specs = [
              ("STICKY_FIXED_CSS", re.compile(rb"position\s*:\s*(?:sticky|fixed)", re.I)),
              ("TAILWIND_STICKY", re.compile(rb"(?:^|[\s\"'\x60])sticky\s+top-[^\s\"'\x60,}]+", re.I)),
              ("OVERFLOW_SCROLL", re.compile(rb"(?:overflow(?:-y)?\s*:\s*(?:auto|scroll|hidden)|overflow-y-auto|overflow-auto|overflow-hidden|overscroll-contain)", re.I)),
              ("M36_UI_IDENTIFIERS", re.compile(rb"m36-[a-z0-9_-]*(?:choice|sticky|scroll|fold|collaps|inactive|complete|activity|dialog|header|gauge|event|panel|status|top|content|layout)[a-z0-9_-]*", re.I)),
              ("FOLD_STATE_WORDS", re.compile("collaps|expanded|completed|inactive|isdisabled|disabled|iscomplete|folded|hidden|접기|비활성|완료".encode("utf-8"), re.I)),
              ("ACTIVITY_LABELS", re.compile("외출|마을 둘러보기|홀로 돌아가기|선택지|대화|상태".encode("utf-8"))),
              ("LOCATION_SWITCH_HINTS", re.compile(rb"(?:playerLoc|wifeLoc|currentLocation|locationId|goToLocation|setLocation|hall|corridor)", re.I)),
          ]
          counts = {name: 0 for name, _ in specs}
          samples = {name: [] for name, _ in specs}
          unique_names = set()
          buffer = b""
          base = 0
          processed_until = 0
          lookahead = 1800

          def compact(raw):
              return re.sub(r"\s+", " ", raw.decode("utf-8", "replace")).strip()[:1150]

          def process(safe_local):
              nonlocal buffer, base, processed_until
              safe_global = base + safe_local
              start_local = max(0, processed_until - base)
              for name, pat in specs:
                  pos = start_local
                  while True:
                      m = pat.search(buffer, pos)
                      if not m or m.start() >= safe_local:
                          break
                      counts[name] += 1
                      if name == "M36_UI_IDENTIFIERS":
                          unique_names.add(m.group(0).decode("ascii", "ignore"))
                      max_samples = 30 if name == "M36_UI_IDENTIFIERS" else 5
                      if len(samples[name]) < max_samples:
                          gp = base + m.start()
                          if not samples[name] or all(abs(gp - item[0]) > 220 for item in samples[name]):
                              a = max(0, m.start() - 360)
                              b = min(len(buffer), m.end() + 650)
                              samples[name].append((gp, compact(buffer[a:b])))
                      pos = m.start() + 1
              processed_until = safe_global
              buffer = buffer[safe_local:]
              base = safe_global

          with p.open("rb") as src:
              while True:
                  chunk = src.read(65536)
                  if not chunk:
                      break
                  buffer += chunk
                  safe = max(0, len(buffer) - lookahead)
                  if safe:
                      process(safe)
              if buffer:
                  process(len(buffer))

          for name, _ in specs:
              print(f"\n=== {name}: {counts[name]} matches ===")
              if name == "M36_UI_IDENTIFIERS":
                  for item in sorted(unique_names)[:180]:
                      print(item)
              for offset, excerpt in samples[name]:
                  print(f"@{offset}: {excerpt}")
          print("\nSCAN_COMPLETE=PASS")
          PY
      - name: Remove temporary scanner workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m36-ui-forensic.yml
          git add -u .github/workflows/m36-ui-forensic.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove temporary mobile UI forensic scanner"
            git push origin HEAD:mobile-migration-v1
          fi
