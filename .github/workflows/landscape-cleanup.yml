name: One-time landscape CSS repair
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/landscape-cleanup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Replace conflicting landscape overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path("Wayward_MOD_v3.36.html")
          s = p.read_text(encoding="utf-8")
          start_marker = '<style id="wayward-mobile-landscape-v1">'
          script_marker = '<script id="wayward-landscape-header-fit-v10">'
          assert s.count(start_marker) == 1, "landscape start anchor count mismatch"
          assert s.count(script_marker) == 1, "v10 script anchor count mismatch"
          start = s.index(start_marker)
          end = s.index("</script>", s.index(script_marker)) + len("</script>")
          replacement = r'''<style id="wayward-mobile-landscape-clean-v11">
          /* Landscape: portrait-style responsive header, three natural-flow columns, no nested scroll panes. */
          @media (orientation:landscape) and (max-height:900px) {
            html,body {height:auto!important;min-height:100%!important;max-height:none!important;overflow-x:hidden!important;overflow-y:auto!important;}
            #root,#root>div {height:auto!important;min-height:100dvh!important;max-height:none!important;overflow:visible!important;}
            .m34-header {box-sizing:border-box!important;display:flex!important;flex-flow:row wrap!important;align-items:center!important;justify-content:flex-start!important;width:100%!important;height:auto!important;min-height:38px!important;max-height:none!important;flex:0 0 auto!important;position:sticky!important;top:0!important;z-index:40!important;overflow:visible!important;padding:2px max(6px,env(safe-area-inset-right)) 2px max(6px,env(safe-area-inset-left))!important;gap:0 6px!important;}
            .m34-header-stats {box-sizing:border-box!important;display:flex!important;flex:1 1 max-content!important;flex-flow:row wrap!important;align-items:center!important;width:auto!important;min-width:0!important;max-width:100%!important;height:auto!important;min-height:34px!important;max-height:none!important;overflow:visible!important;padding:0!important;gap:0!important;}
            .m34-header-stats>div:first-child,.m34-header-stats>div:nth-child(2) {box-sizing:border-box!important;display:flex!important;flex:0 1 max-content!important;width:max-content!important;min-width:0!important;max-width:100%!important;height:34px!important;min-height:34px!important;max-height:none!important;overflow:visible!important;padding:2px 5px!important;align-items:center!important;}
            .m34-header-stats>div:first-child>*,.m34-header-stats>div:nth-child(2)>* {min-width:0!important;max-width:100%!important;white-space:nowrap!important;}
            .m34-header-tools {box-sizing:border-box!important;position:static!important;display:flex!important;flex:0 1 max-content!important;flex-flow:row wrap!important;align-items:center!important;justify-content:flex-end!important;gap:4px!important;width:auto!important;min-width:0!important;max-width:100%!important;height:auto!important;min-height:34px!important;max-height:none!important;overflow:visible!important;margin:0!important;padding:2px 0!important;background:transparent!important;border:0!important;}
            .m33-launchers,.m34-system-tools {display:flex!important;flex:0 1 auto!important;flex-flow:row wrap!important;align-items:center!important;justify-content:flex-end!important;gap:4px!important;width:auto!important;min-width:0!important;max-width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;}
            .m33-launchers>button:has(svg),.m33-launchers>button.m33-editor-launch,.m34-system-tools .m33-theme-holder,.m34-system-tools .m33-theme-button,.m34-system-tools .m34-header-control {box-sizing:border-box!important;display:inline-flex!important;position:relative!important;flex:0 1 auto!important;width:auto!important;min-width:28px!important;max-width:100%!important;height:32px!important;min-height:32px!important;max-height:none!important;margin:0!important;padding:4px 7px!important;align-items:center!important;justify-content:center!important;overflow:visible!important;font-size:inherit!important;border-radius:4px!important;}
            .m33-launchers>button:has(svg) svg {width:18px!important;height:18px!important;flex:0 0 18px!important;}
            .m33-launchers>button:has(svg) small,.m33-launchers>button:has(svg) span,.m33-launchers>button.m33-editor-launch small {display:revert!important;}
            .m33-launchers>button.m33-editor-launch:before {content:none!important;}
            .flex.flex-col.min-h-0.flex-1:has(> .mobile-layout) > .hidden[class~="lg:flex"] {display:none!important;}
            .mobile-layout {box-sizing:border-box!important;position:relative!important;display:grid!important;grid-template-columns:minmax(0,.72fr) minmax(0,1fr) minmax(0,1.3fr)!important;grid-template-rows:auto!important;align-items:start!important;gap:4px!important;width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-height:none!important;margin:0!important;overflow:visible!important;flex:0 0 auto!important;}
            .mobile-portrait-panel {grid-column:1!important;grid-row:1!important;position:relative!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;box-sizing:border-box!important;width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;overflow:visible!important;}
            .mobile-portrait-panel>* {box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;justify-content:flex-start!important;width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;margin:0!important;padding:0!important;overflow:visible!important;}
            .mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:first-child,.mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:nth-child(n+3) {display:none!important;}
            .mobile-portrait-panel>.divide-y.divide-stone-800.pb-2>:nth-child(2) {display:flex!important;flex:0 1 auto!important;width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;margin:0!important;padding:0!important;overflow:visible!important;}
            .mobile-portrait-panel img {display:block!important;width:100%!important;height:auto!important;max-width:100%!important;max-height:78vh!important;min-width:0!important;min-height:0!important;object-fit:contain!important;object-position:top center!important;}
            .mobile-main-panel {box-sizing:border-box!important;grid-column:2!important;grid-row:1!important;position:relative!important;display:flex!important;flex-direction:column!important;width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;margin:0!important;padding:0!important;overflow:visible!important;border:0!important;}
            .mobile-main-panel>.shrink-0 {display:block!important;flex:0 0 auto!important;min-width:0!important;padding:2px!important;}
            .mobile-main-panel>.flex-1 {box-sizing:border-box!important;display:block!important;flex:0 0 auto!important;width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-height:none!important;padding:2px!important;overflow:visible!important;}
            .mobile-main-panel .m36-mobile-tabs {position:static!important;display:flex!important;flex-flow:row wrap!important;align-items:center!important;justify-content:flex-start!important;gap:3px!important;width:100%!important;min-width:0!important;max-width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;margin:0!important;padding:2px!important;overflow:visible!important;border:0!important;background:transparent!important;}
            .mobile-main-panel .m36-mobile-tabs>* {display:inline-flex!important;flex:0 1 auto!important;width:auto!important;min-width:0!important;max-width:100%!important;height:auto!important;min-height:30px!important;max-height:none!important;margin:0!important;padding:4px 7px!important;overflow:visible!important;font-size:inherit!important;}
            .mobile-action-panel {box-sizing:border-box!important;grid-column:3!important;grid-row:1!important;position:relative!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;margin:0!important;padding:0!important;overflow:visible!important;border:0!important;gap:4px!important;}
            .mobile-action-panel>* {box-sizing:border-box!important;position:static!important;display:block!important;flex:0 0 auto!important;width:100%!important;min-width:0!important;max-width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;margin:0!important;overflow:visible!important;}
            .mobile-action-panel>.flex-1.min-h-0.flex.flex-col {display:flex!important;flex-direction:column!important;flex:0 0 auto!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;}
            .mobile-action-panel>.shrink-0.flex.items-center {display:flex!important;}
            .mobile-action-panel .m36-mobile-dialogue-fixed,.mobile-action-panel .m36-mobile-pleasure-fixed,.mobile-action-panel .m36-mobile-store-status,.mobile-action-panel .m36-mobile-status-panel,.mobile-action-panel .m36-mobile-prep-compact,.mobile-action-panel .m36-mobile-current-activity {flex:0 0 auto!important;width:100%!important;min-width:0!important;max-width:100%!important;max-height:none!important;height:auto!important;overflow:visible!important;}
            .mobile-action-panel .m36-mobile-dialogue-box {height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;}
            .mobile-action-panel .mobile-action-scroll {position:static!important;display:block!important;flex:0 0 auto!important;width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:none!important;margin:0!important;padding:2px!important;overflow:visible!important;border:0!important;}
            .mobile-action-panel .mobile-action-scroll>div {width:100%!important;min-width:0!important;max-width:100%!important;}
            .mobile-action-panel .mobile-action-scroll button {box-sizing:border-box!important;min-width:0!important;max-width:100%!important;white-space:normal!important;}
          }
          </style>'''
          new = s[:start] + replacement + s[end:]
          assert len(new) == len(s) - (end-start) + len(replacement)
          assert "wayward-landscape-header-fit-v10" not in new
          assert new.count('id="wayward-mobile-landscape-clean-v11"') == 1
          assert new[:start] == s[:start] and new[start+len(replacement):] == s[end:]
          assert replacement.count("{") == replacement.count("}")
          p.write_text(new, encoding="utf-8")
          subprocess.run(["git","diff","--check"],check=True)
          # Ensure game code outside the targeted CSS block remains byte-for-byte identical.
          subprocess.run(["git","diff","--numstat","--",str(p)],check=True)
          print(f"PATCH_OK source_chars={len(s)} changed_range={end-start} replacement_chars={len(replacement)}")
          PY
          rm .github/workflows/landscape-cleanup.yml
          git config user.name "GPT Runtime Patch"
          git config user.email "gpt-runtime-patch@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html .github/workflows/landscape-cleanup.yml
          git commit -m "fix(mobile): simplify landscape layout flow and header wrapping"
          git push origin HEAD:mobile-migration-v1
