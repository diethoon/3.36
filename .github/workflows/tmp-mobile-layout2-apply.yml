name: tmp-mobile-layout2-apply
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Apply mobile UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess,re
          p=Path("Wayward_MOD_v3.36.html")
          CH=65536

          def replace_once(old,new):
              tmp=p.with_suffix(".tmp")
              keep=max(0,len(old)-1)
              carry=b""
              hits=0
              with p.open("rb") as s,tmp.open("wb") as d:
                  while True:
                      c=s.read(CH)
                      if not c: break
                      data=carry+c
                      pos=0
                      while True:
                          i=data.find(old,pos)
                          if i<0: break
                          d.write(data[pos:i]); d.write(new)
                          pos=i+len(old); hits+=1
                      data=data[pos:]
                      if len(data)>keep:
                          if keep: d.write(data[:-keep]); carry=data[-keep:]
                          else: d.write(data); carry=b""
                      else:
                          carry=data
                  d.write(carry)
              if hits!=1:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f"replace_once expected 1 got {hits}")
              tmp.replace(p)

          replace_once(
            b'women.map(({id,index,wife})=>u.jsx(BD,{id,wife,index,canSee},id))',
            b'women.map(({id,index,wife})=>u.jsx(BD,{id,wife,index,canSee},id)),u.jsx(M36MobileRoomActivity,{room,canSee})'
          )

          replace_once(
            b'function M36MobileRoomActivity(){',
            b'function M36MobileRoomActivity({room:targetRoom,canSee:targetCanSee}={}){'
          )

          replace_once(
            b'''  const state=re(d=>d.state),proximity=Rt(d=>d.proximityMode),current=vt(state),ids=Object.keys(state.characters);
  const rooms=Yie(state,wx,{proximity}),extra=new Set;
  if(!wx.includes(current))extra.add(current);
  for(const id of ids){const room=Hn(state,id);if(room&&!wx.includes(room))extra.add(room)}
  const order=[...extra,...rooms];''',
            b'''  const state=re(d=>d.state),proximity=Rt(d=>d.proximityMode),current=vt(state);
  const order=targetRoom?[targetRoom]:Yie(state,wx,{proximity});'''
          )

          replace_once(
            b'const canSee=room===current||!proximity;',
            b'const canSee=targetCanSee??(room===current||!proximity);'
          )

          replace_once(
            b'u.jsx(M36MobileRoomActivity,{})',
            b''
          )

          css=b'''<style id="wayward-mobile-cleanup-v7">
          @media(max-width:1023px){
            .m36-mobile-tabs{flex:0 0 22px !important;height:22px !important;min-height:22px !important;max-height:22px !important}
            .m36-mobile-tabs > button{height:22px !important;min-height:0 !important;padding:0 .15rem !important;font-size:.52rem !important;line-height:22px !important;letter-spacing:.03em !important;white-space:nowrap !important}
            .m36-mobile-room-activity{padding:0 !important;margin:.08rem 0 .22rem !important}
            .m36-mobile-room-activity > div > div:first-child{display:none !important}
            .m36-mobile-room-activity > div{margin:0 !important}
            .m36-mobile-room-activity .group{min-width:0 !important;display:flex !important;flex-wrap:wrap !important;align-items:center !important;gap:.12rem !important;padding:.05rem .08rem !important;margin:0 !important;line-height:1 !important}
            .m36-mobile-room-activity .group > span{min-width:0 !important;font-size:.55rem !important;line-height:1 !important}
            .m36-mobile-room-activity .group > span:nth-child(2){max-width:5rem !important}
            .m36-mobile-room-activity .group > span.text-pink-400{flex:0 0 100% !important;margin-left:.4rem !important;font-size:.54rem !important;line-height:1.05 !important}
            .m36-mobile-room-activity .group > span.flex{flex-shrink:0 !important;white-space:nowrap !important}
            .m36-mobile-wife-status{min-width:0 !important}
            .m36-mobile-wife-status > div{margin:.08rem 0 !important;padding:.2rem .22rem !important}
            .m36-mobile-wife-status .grid{grid-template-columns:repeat(5,minmax(0,1fr)) !important;gap:.1rem !important;margin-top:.12rem !important}
            .m36-mobile-wife-status .grid > span{min-width:0 !important;flex-direction:column !important;align-items:stretch !important;gap:.05rem !important}
            .m36-mobile-wife-status .grid > span > span:first-child{width:auto !important;text-align:center !important;font-size:.45rem !important;letter-spacing:0 !important;white-space:nowrap !important;overflow:hidden !important}
            .m36-mobile-wife-status .grid > span > span:nth-child(2){width:100% !important;min-width:0 !important;height:3px !important}
          }
          </style>'''
          replace_once(b"</head>",css+b"</head>")

          # Extract each script in 64KB streaming chunks and syntax-check with Node.
          out=Path("/tmp/nodecheck"); out.mkdir(exist_ok=True)
          for f in out.glob("*.js"): f.unlink()
          buf=b""; active=False; idx=0; h=None; keep=2048
          with p.open("rb") as f:
              while True:
                  c=f.read(CH)
                  if not c: break
                  buf+=c
                  while True:
                      if not active:
                          m=re.search(br"<script\\b[^>]*>",buf,re.I)
                          if not m:
                              if len(buf)>keep: buf=buf[-keep:]
                              break
                          buf=buf[m.end():]; idx+=1; h=(out/f"s{idx}.js").open("wb"); active=True
                      else:
                          m=re.search(br"</script\\s*>",buf,re.I)
                          if not m:
                              if len(buf)>keep: h.write(buf[:-keep]); buf=buf[-keep:]
                              break
                          h.write(buf[:m.start()]); buf=buf[m.end():]; h.close(); h=None; active=False
          if active and h: h.close()
          scripts=list(out.glob("*.js"))
          if not scripts: raise SystemExit("NO_SCRIPT_BLOCKS")
          for f in scripts:
              r=subprocess.run(["node","--check",str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit("NODE_CHECK_FAIL "+f.name)

          print("NODE_CHECK=PASS",len(scripts))
          print("HTML_BYTES=",p.stat().st_size)
          print("EOF_STREAM=PASS")
          PY

          git diff --check
          git add Wayward_MOD_v3.36.html
          for f in $(git ls-files '.github/workflows/tmp-mobile-layout2-*' '.github/tmp-mobile-layout2-*'); do git rm -f "$f"; done
          git rm -f .github/workflows/tmp-mobile-probe.yml || true
          git commit -m "fix(mobile): compact choice tabs and relocate room activity"
          git push origin mobile-migration-v1
