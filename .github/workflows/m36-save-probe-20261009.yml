name: M36 temporary save inspection
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  inspect-save-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inspected branch only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Extract compact save and storage evidence
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/m36-save-inspection-report.txt
          from pathlib import Path
          import re

          p = Path("Wayward_MOD_v3.36.html")
          if not p.exists():
              candidates = list(Path(".").glob("*.html"))
              if len(candidates) == 1:
                  p = candidates[0]
              else:
                  print("SOURCE_NOT_FOUND", [str(x) for x in candidates[:20]])
                  raise SystemExit(1)

          s = p.read_text(encoding="utf-8", errors="replace")
          print("=== FILE METADATA ===")
          print("FILE", p, "BYTES", p.stat().st_size, "CHARS", len(s), "LINES", s.count("\n") + 1)
          scripts = list(re.finditer(r"<script\b([^>]*)>(.*?)</script\s*>", s, re.I | re.S))
          print("SCRIPT_TAGS", len(scripts), "SCRIPT_BYTES", [len(m.group(2)) for m in scripts[:12]])

          pats = [
              ("localStorage", r"localStorage"),
              ("sessionStorage", r"sessionStorage"),
              ("indexedDB", r"indexedDB"),
              ("storage wrappers", r"localforage|Dexie|idb-keyval|\.transaction\s*\(|createObjectStore"),
              ("save/load API names", r"(?i)(?:save.?game|load.?game|save.?world|load.?world|saved.?game|saved.?world|save.?file|load.?file|saveState|loadState|exportSave|importSave)"),
              ("JSON serialization", r"JSON\.(?:stringify|parse)"),
              ("file transfer APIs", r"(?i)(?:FileReader|createObjectURL|new Blob|showSaveFilePicker|showOpenFilePicker|download=)"),
              ("Korean save/load UI", r"(저장|불러오기|세이브|저장 파일|세이브 파일)"),
              ("English save/load words", r"(?i)\b(?:save|load|export|import)\b"),
          ]

          def compact(x):
              return re.sub(r"\s+", " ", x).strip()

          print("=== COUNTS + TARGETED CONTEXTS ===")
          for label, pat in pats:
              ms = list(re.finditer(pat, s))
              print(f"\n-- {label}: {len(ms)} matches --")
              if not ms:
                  continue
              chosen = []
              indices = list(range(min(2, len(ms))))
              if len(ms) > 4:
                  indices += [len(ms)//2, len(ms)-2, len(ms)-1]
              elif len(ms) > 2:
                  indices += list(range(2, len(ms)))
              for i in indices:
                  m = ms[i]
                  if any(abs(m.start()-z) < 320 for z in chosen):
                      continue
                  chosen.append(m.start())
                  a, b = max(0, m.start()-260), min(len(s), m.end()+500)
                  print(f"@{m.start()} [{i+1}/{len(ms)}] {compact(s[a:b])[:800]}")
                  if len(chosen) >= 5:
                      break

          print("\n=== STORAGE KEY LITERALS ===")
          key_pat = re.compile(r"""(?:localStorage|sessionStorage)\.(?:getItem|setItem|removeItem)\s*\(\s*['"]([^'"]{1,160})['"]""", re.I)
          keys = []
          for m in key_pat.finditer(s):
              item = (m.group(1), m.start())
              if item[0] not in [x[0] for x in keys]:
                  keys.append(item)
              if len(keys) >= 40:
                  break
          print(keys if keys else "No literal storage keys detected by this pattern.")
          print("=== END COMPACT INSPECTION ===")
          PY
      - name: Save report as PR comment and clean temporary files
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROBE_BRANCH: m36-save-probe-20261009
        run: |
          set +e
          if [ -s /tmp/m36-save-inspection-report.txt ] && [ -n "$PR_NUMBER" ]; then
            {
              echo "One-time static save/load inspection output. Source HTML was analyzed only inside the runner; no game file was modified."
              echo
              cat /tmp/m36-save-inspection-report.txt
            } > /tmp/m36-save-inspection-comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/m36-save-inspection-comment.md >/tmp/m36-report-comment.log 2>&1
          fi
          if [ -n "$PR_NUMBER" ]; then
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Temporary source-inspection PR; closed after report extraction." >/tmp/m36-pr-close.log 2>&1
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PROBE_BRANCH" >/tmp/m36-branch-delete.log 2>&1
          WF_PATH=".github/workflows/m36-save-probe-20261009.yml"
          WF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WF_PATH?ref=main" --jq .sha 2>/dev/null)"
          if [ -n "$WF_SHA" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WF_PATH" \
              -f message="chore: remove temporary save inspection workflow" \
              -f sha="$WF_SHA" -f branch=main >/tmp/m36-workflow-delete.log 2>&1
          fi
          echo "Temporary PR/branch/workflow cleanup attempted."
