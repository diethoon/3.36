name: Locate original room overview call
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - ".github/workflows/locate-room-overview-call.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Search xOe call site in bounded chunks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          CH=65536
          needles=[b"xOe",b"u.jsx(xOe,{})",b"u.jsx(xOe,{}),",b"u.jsx(xOe"]
          hits={n:[] for n in needles}
          carry=b""
          base=0
          for_chunk=0
          with p.open("rb") as f:
            while True:
              c=f.read(CH)
              if not c: break
              d=carry+c
              db=base-len(carry)
              for n in needles:
                start=0
                while True:
                  i=d.find(n,start)
                  if i<0: break
                  hits[n].append(db+i)
                  start=i+1
              carry=d[-20:]
              base+=len(c)
          for n,ps in hits.items():
            print("\nNEEDLE",n.decode(),"COUNT",len(ps))
            for pos in ps[:20]:
              with p.open("rb") as f:
                f.seek(max(0,pos-700))
                print("\nOFFSET",pos)
                print(f.read(1800).decode("utf-8","replace"))
          PY
