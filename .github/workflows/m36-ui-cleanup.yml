name: One-shot mobile UI cleanup
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-ui-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Remove dead status markup and avoid style observer churn
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          p = Path("Wayward_MOD_v3.36.html")
          temp = p.with_name(p.name + ".cleanup.tmp")
          replacements = [
              (
                  b'''  function choiceStatus(value) {
              const text = norm(value);
              if (text.includes("완료")) return "완료";
              if (text.includes("오후 5시") || text.includes("영업 전") || text.includes("영업시간")) return "영업 전";
              if (text.includes("시간이 부족") || text.includes("시간 부족") ||
                  text.includes("시간이 너무") || text.includes("너무 늦") || text.includes("늦었습니다")) return "시간 부족";
              if (text.includes("종료") || text.includes("마감") || text.includes("끝났")) return "종료";
              if (text.includes("없습니다") || text.includes("없어요") || text.includes("방 안에")) return "이용 불가";
              return "사용 불가";
            }

            function clearButton(button) {''',
                  b'''  function clearButton(button) {'''
              ),
              (
                  b'''      button.removeAttribute("data-m36-disabled-choice-status");
            }''',
                  b'''    }'''
              ),
              (
                  b'''              const label = choiceLabel(button);
              const status = choiceStatus(button.textContent);
              if (button.getAttribute("data-m36-disabled-choice-label") !== label) {
                button.setAttribute("data-m36-disabled-choice-label", label);
              }
              if (button.getAttribute("data-m36-disabled-choice-status") !== status) {
                button.setAttribute("data-m36-disabled-choice-status", status);
              }''',
                  b'''              const label = choiceLabel(button);
              if (button.getAttribute("data-m36-disabled-choice-label") !== label) {
                button.setAttribute("data-m36-disabled-choice-label", label);
              }'''
              ),
              (
                  b'''      attributeFilter: ["disabled", "style"]''',
                  b'''      attributeFilter: ["disabled"]'''
              )
          ]
          counts = [0] * len(replacements)
          max_len = max(len(old) for old, _ in replacements)
          buffer = bytearray()
          try:
              with p.open("rb") as src, temp.open("wb") as dst:
                  def drain(final=False):
                      while len(buffer) >= max_len or (final and buffer):
                          found = None
                          for i, (old, new) in enumerate(replacements):
                              if buffer.startswith(old):
                                  found = (i, old, new)
                                  break
                          if found:
                              i, old, new = found
                              dst.write(new)
                              del buffer[:len(old)]
                              counts[i] += 1
                          else:
                              dst.write(buffer[:1])
                              del buffer[:1]
                  while True:
                      chunk = src.read(65536)
                      if not chunk: break
                      buffer.extend(chunk)
                      drain()
                  drain(final=True)
              if counts != [1, 1, 1, 1]:
                  raise RuntimeError(f"ANCHOR_COUNTS_FAIL {counts}")
              check = Path("/tmp/m36-mobile-next-ui-script.js")
              data_start = b'<script id="m36-mobile-next-ui-script">'
              data_end = b"</script>"
              # Extract only the target script using bounded reads.
              script_buffer = bytearray()
              state = 0
              with temp.open("rb") as src:
                  while True:
                      chunk = src.read(65536)
                      if not chunk: break
                      if state == 0:
                          idx = chunk.find(data_start)
                          if idx >= 0:
                              script_buffer.extend(chunk[idx+len(data_start):])
                              state = 1
                          continue
                      if state == 1:
                          idx = chunk.find(data_end)
                          if idx >= 0:
                              script_buffer.extend(chunk[:idx])
                              break
                          script_buffer.extend(chunk)
              if state != 1: raise RuntimeError("SCRIPT_EXTRACTION_FAIL")
              check.write_bytes(script_buffer)
              result = subprocess.run(["node", "--check", str(check)], capture_output=True, text=True)
              if result.returncode: raise RuntimeError("NODE_CHECK_FAIL\\n" + result.stderr)
              # Confirm balanced style/script tags with a streaming scanner.
              for token, expected in [(b"</style>", 26), (b'<script id="m36-mobile-next-ui-script">', 1)]:
                  total = 0; carry = b""
                  with temp.open("rb") as src:
                      while True:
                          chunk = src.read(65536)
                          if not chunk: break
                          data = carry + chunk
                          total += data.count(token)
                          carry = data[-(len(token)-1):]
                  print("TOKEN_COUNT", token.decode("ascii"), total)
                  if total != expected: raise RuntimeError("TOKEN_COUNT_FAIL " + token.decode("ascii"))
              if b"choiceStatus(" in script_buffer or b"data-m36-disabled-choice-status" in script_buffer:
                  raise RuntimeError("DEAD_STATUS_CODE_REMAINS")
              if b'attributeFilter: ["disabled"]' not in script_buffer:
                  raise RuntimeError("OBSERVER_FILTER_FAIL")
              temp.replace(p)
              print("REPLACEMENT_COUNTS", counts)
              print("INJECTED_JS_NODE_CHECK=PASS")
              print("CLEANUP=PASS")
          except Exception:
              try: temp.unlink()
              except FileNotFoundError: pass
              raise
          PY
      - name: Verify, commit, and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --numstat -- Wayward_MOD_v3.36.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          rm .github/workflows/m36-ui-cleanup.yml
          git add -u .github/workflows/m36-ui-cleanup.yml
          git commit -m "refactor(mobile): simplify disabled choices and observer"
          git push origin HEAD:mobile-migration-v1
