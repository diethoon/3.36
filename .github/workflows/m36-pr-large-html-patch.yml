name: M36 PR large HTML patch

on:
  pull_request:
    branches:
      - mobile-migration-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0

      - name: Forensic patch and validation
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 20398ad533fa2702dbafe4497ad1d2ab11a081e8 HEAD

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Wayward_MOD_v3.36.html")
          data = p.read_bytes()
          old = b'wifeLoc!==playerLoc&&u.jsxs("div",{className:"m36-mobile-store-status-line",children:['
          new = b'u.jsxs("div",{className:"m36-mobile-store-status-line",children:['

          assert data.count(b'function M36MobileStoreStatus') == 1
          assert data.count(old) == 1
          data = data.replace(old, new, 1)
          p.write_bytes(data)

          assert data.count(b'wifeLoc!==playerLoc') == 0
          assert data.count(b'wifeLoc=re(d=>be(d.state))') == 1
          assert data.count(b'wifeRoomCount=') == 1

          for a in (
              b'function M36MobileRoomCustomer',
              'label:"인사하기"'.encode(),
              'label:"주문받기"'.encode(),
              b'type:"serve",customerId:e.id',
          ):
              assert data.count(a) == 1, (a, data.count(a))
          print("TARGET_FORENSIC_PASS")
          print("SIZE", len(data))

          target = data.find(b'function M36MobileStoreStatus')
          scan = 0
          while True:
              s = data.find(b'<script', scan)
              assert s >= 0
              gt = data.find(b'>', s)
              assert gt >= 0
              e = data.find(b'</script>', gt + 1)
              assert e >= 0
              if gt < target < e:
                  Path("/tmp/m36-main.js").write_bytes(data[gt + 1:e])
                  break
              scan = e + 9
          PY

          node --check /tmp/m36-main.js
          git diff --check
          test "$(git diff --name-only)" = "Wayward_MOD_v3.36.html"
          echo "STATIC_VALIDATION_PASS"

      - name: Update forensic documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("idea/GPT_RUNTIME_FORENSIC_FALLBACK.md")
          text = p.read_text(encoding="utf-8")
          marker = "\n### 12-C-8. 2026-10-08 GitHub Actions PR-triggered large-file patch success path\n"
          section = """
### 12-C-8. 2026-10-08 GitHub Actions PR-triggered large-file patch success path

For 19MB-class single HTML files, when direct push-triggered Actions has infrastructure failure such as jobs=[], use a same-repository temporary branch plus pull request as the runner entry point.

Actual sequence:

    exact clean base SHA
    → temporary branch from exact SHA
    → add one temporary pull_request workflow
    → open PR against mobile-migration-v1
    → GitHub Actions checkout of PR head
    → runner filesystem targeted byte patch
    → target-count assertions
    → extract actual containing script only
    → node --check
    → git diff --check
    → verify changed-file list
    → update the forensic handoff document in the same temporary commit
    → delete the temporary workflow
    → commit/push with Actions GITHUB_TOKEN
    → verify run conclusion and job success
    → reuse the final tree to create one clean commit whose parent is the exact starting SHA
    → move the real branch ref to that clean commit
    → delete temporary branch/PR

Why this route:

    GitHub connector cannot safely load the 19MB blob into ChatGPT context.
    The runner can checkout the full blob on its filesystem.
    The final Git object can be retained without sending the file through model context.
    PR-triggered Actions was previously observed to start successfully when push-triggered runs returned jobs=[].

Cautions:

    - Do not treat jobs=[] from push-triggered runs as a source-code failure.
    - Expected base SHA must be checked before touching the file.
    - Refuse the patch unless the old byte anchor occurs exactly once.
    - Syntax-check the actual containing script; do not use a naive rfind that can land inside a JavaScript string containing <script>.
    - Never commit the temporary workflow.
    - Do not print or store GITHUB_TOKEN.
    - After success, create the final clean commit from the verified tree and set the production branch to that commit only after checking its current HEAD.
    - No DigitalOcean or other paid remote machine is required for this path.
"""
          if marker in text:
              raise SystemExit("documentation section already exists")
          text = text.replace("\n### 12-C-7. 현재 clean state", section + "\n### 12-C-7. 현재 clean state", 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Remove workflow and commit final temporary-branch tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/m36-pr-large-html-patch.yml
          git add Wayward_MOD_v3.36.html idea/GPT_RUNTIME_FORENSIC_FALLBACK.md .github/workflows/m36-pr-large-html-patch.yml
          git commit -m "fix(mobile): always show Elena location in right status"
          git push origin "${{ github.event.pull_request.head.ref }}"
