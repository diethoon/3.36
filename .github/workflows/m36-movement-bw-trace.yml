name: m36-movement-bw-trace
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Trace shared return helper
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          for name in ["bw","Lo","co","ti","be","M$","Bt","Hf","Th","Sh"]:
              pat=rf"(?:function {re.escape(name)}\\b|const {re.escape(name)}=)"
              ms=[m.start() for m in re.finditer(pat,s)]
              print(f"\n===== {name} MATCHES {len(ms)} =====")
              for p in ms[-4:]:
                  a=max(0,p-400);b=min(len(s),p+4200)
                  print(f"--- POS {p} ---")
                  print(s[a:b].replace("\n"," ")[:4800])
          PY