name: Diagnose Elena choice placement
on:
  push:
    branches: [mobile-migration-v1]
    paths: [.github/workflows/diagnose-elena-choice.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Stream inspect choice text and render contexts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html"); CH=65536
          needles=[
            "계속 일하기".encode(),
            "상황은 그대로 두기".encode(),
            "대화에 끼기".encode(),
            "그녀를 부르기".encode(),
            b"function M36MobileStoreStatus(){",
            b"u.jsx(M36MobileStoreStatus,{})",
            b"function HD(",
            b"function xOe("
          ]
          hits={n:[] for n in needles}
          carry=b""; base=0
          with p.open("rb") as f:
            while True:
              c=f.read(CH)
              if not c: break
              d=carry+c; db=base-len(carry)
              for n in needles:
                s=0
                while True:
                  i=d.find(n,s)
                  if i<0: break
                  hits[n].append(db+i); s=i+1
              carry=d[-max(len(n) for n in needles)+1:]
              base += len(c)
          for n,pos in hits.items():
            print("\n###",n.decode("utf-8","replace"),"COUNT",len(pos))
            for off in pos[:12]:
              print("OFFSET",off)
              with p.open("rb") as f:
                f.seek(max(0,off-1400)); ctx=f.read(len(n)+2800)
              print(ctx.decode("utf-8","replace"))
          print("\n### EOF")
          with p.open("rb") as f:
            f.seek(max(0,p.stat().st_size-512))
            print(f.read().decode("utf-8","replace"))
          PY
