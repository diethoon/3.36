name: Temporary mobile UI diagnosis (2026-10-14)
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/diagnose-mobile-ui-20261014.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply two byte-bounded mobile UI fixes
        shell: bash
        run: |
          cp Wayward_MOD_v3.36.html before.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Wayward_MOD_v3.36.html")
          marker = b'id="m36-landscape-work-choice-width-20261014"'
          icon_start = b'/* High contrast: light physical buttons with dark glyphs, including SVG paths and raster icons. */'
          icon_end = b'/* Keep the portrait panel dominant; the change summary only consumes its text height. */'
          css = """<style id="m36-landscape-work-choice-width-20261014">
          @media (orientation:landscape) {
            /* The 5-minute control is the second button in a split action row. It must stay
               content-sized; the generic landscape rule makes all action buttons 100% wide. */
            .mobile-action-panel .mobile-action-scroll button[title*="동안 자동으로 일하기"] {
              box-sizing:border-box!important;
              display:inline-flex!important;
              align-items:center!important;
              justify-content:center!important;
              width:auto!important;
              min-width:2.25rem!important;
              max-width:none!important;
              flex:0 0 auto!important;
              padding:0 6px!important;
              white-space:nowrap!important;
              overflow-wrap:normal!important;
              text-align:center!important;
              font-size:11px!important;
              line-height:1.2!important;
            }
            /* The disabled-choice marker is intended for the main action, not its 5-minute
               duration control. Undo only that marker's label/pseudo-element treatment here. */
            .mobile-action-panel .mobile-action-scroll button[title*="동안 자동으로 일하기"].m36-mobile-disabled-choice {
              position:relative!important;
              width:auto!important;
              min-width:2.25rem!important;
              max-width:none!important;
              flex:0 0 auto!important;
              margin:0!important;
              padding:0 6px!important;
              border:0!important;
              border-left:1px solid #44403c!important;
              border-radius:0!important;
              background:#292524!important;
              color:#d6d3d1!important;
              -webkit-text-fill-color:#d6d3d1!important;
              font-size:11px!important;
              line-height:1.2!important;
              opacity:1!important;
              white-space:nowrap!important;
              overflow-wrap:normal!important;
              text-align:center!important;
            }
            .mobile-action-panel .mobile-action-scroll button[title*="동안 자동으로 일하기"].m36-mobile-disabled-choice > * {
              display:revert!important;
            }
            .mobile-action-panel .mobile-action-scroll button[title*="동안 자동으로 일하기"].m36-mobile-disabled-choice::before,
            .mobile-action-panel .mobile-action-scroll button[title*="동안 자동으로 일하기"].m36-mobile-disabled-choice::after {
              content:none!important;
              display:none!important;
            }
          }
          </style>
          """.encode("utf-8")
          with p.open("r+b") as f:
              f.seek(0, 2)
              size = f.tell()
              start = max(0, size - 256 * 1024)
              f.seek(start)
              tail = f.read(size - start)
              if marker in tail:
                  print("MOBILE_UI_FIX_ALREADY_PRESENT; source unchanged")
                  raise SystemExit(0)
              if tail.count(icon_start) != 1 or tail.count(icon_end) != 1:
                  raise SystemExit(
                      f"expected one landscape icon-style block in EOF window; "
                      f"start={tail.count(icon_start)} end={tail.count(icon_end)}; HTML unchanged"
                  )
              a = tail.find(icon_start)
              b = tail.find(icon_end, a + len(icon_start))
              if b < 0:
                  raise SystemExit("end of icon style block not found; HTML unchanged")
              # Remove only the landscape-only high-contrast overrides. Leave all rail
              # placement/sizing and every other landscape layout rule in place.
              tail = tail[:a] + tail[b:]
              body = tail.rfind(b"</body>")
              if body < 0:
                  raise SystemExit("</body> not found in bounded EOF window; HTML unchanged")
              tail = tail[:body] + css + b"\n" + tail[body:]
              f.seek(start)
              f.write(tail)
              f.truncate(start + len(tail))
          print(f"LANDSCAPE_ICON_OVERRIDES_REMOVED_AND_TIMER_WIDTH_FIXED; bytes_before={size}; bytes_after={start+len(tail)}")
          PY
          git diff --check
      - name: Verify portrait baseline and landscape behavior in Chromium
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/wayward-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const failures=[],pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function startGame(page,file){
            await page.goto('http://127.0.0.1:4173/'+file,{waitUntil:'domcontentloaded',timeout:60000});
            await pause(450);
            for(let i=0;i<28;i++){
              const body=await page.locator('body').innerText().catch(()=> '');
              if(body.includes('물자 채우기')&&body.includes('대출')) return;
              let clicked=false;
              const next=page.getByRole('button',{name:/^예$|이해하고 동의합니다|다음|계속|시작|확인|완료|진행|게임 시작|새 게임/});
              for(let k=0;k<await next.count();k++){try{const b=next.nth(k);if(await b.isVisible()&&await b.isEnabled()){await b.evaluate(e=>e.click());await pause(200);clicked=true;break}}catch{}}
              const elena=page.getByRole('button',{name:/^엘레나/});
              if(!clicked&&await elena.count()){try{await elena.first().evaluate(e=>e.click());await pause(200);clicked=true}catch{}}
              if(!clicked)break;
            }
            const body=await page.locator('body').innerText().catch(()=> '');
            if(!(body.includes('물자 채우기')&&body.includes('대출')))throw new Error('gameplay not reached: '+body.slice(0,180));
            const hall=page.getByRole('button',{name:/홀로 내려가기/});
            if(await hall.count()){await hall.first().evaluate(e=>e.click());await pause(350);}
          }
          async function measure(page,label){
            return page.evaluate(label=>{
              const r=e=>{if(!e)return null;const b=e.getBoundingClientRect();return{x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),right:+b.right.toFixed(1),bottom:+b.bottom.toFixed(1)}};
              const s=e=>{if(!e)return null;const c=getComputedStyle(e);return{rect:r(e),display:c.display,position:c.position,flex:c.flex,width:c.width,minWidth:c.minWidth,maxWidth:c.maxWidth,fontSize:c.fontSize,lineHeight:c.lineHeight,whiteSpace:c.whiteSpace,bg:c.backgroundColor,color:c.color,border:c.border,borderRadius:c.borderRadius,cls:typeof e.className==='string'?e.className:String(e.className||''),text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,90)}};
              const launch=[...document.querySelectorAll('.m34-header .m33-launchers button')];
              const tools=[...document.querySelectorAll('.m34-header .m34-system-tools button')];
              const icons=[...launch,...tools].map(e=>({self:s(e),icon:s(e.querySelector('svg,img,i,[class*=icon]')),swatch:s(e.querySelector('.m33-theme-button > span,span'))}));
              const row=[...document.querySelectorAll('.mobile-action-panel .mobile-action-scroll .w-full.flex.rounded-lg.border.overflow-hidden')].find(e=>e.innerText.includes('선술집에서 일하기')&&r(e)?.w>0&&getComputedStyle(e).display!=='none');
              const timer=row?.querySelector('button[title*="동안 자동으로 일하기"]');
              const main=row?.querySelector('button:first-child');
              const rows={row:s(row),main:s(main),timer:s(timer),timerBefore:timer?getComputedStyle(timer,'::before').content:null,timerAfter:timer?getComputedStyle(timer,'::after').content:null};
              const layout=document.querySelector('.mobile-layout'),head=document.querySelector('.m34-header'),action=document.querySelector('.mobile-action-panel'),scroll=document.querySelector('.mobile-action-scroll');
              return{label,viewport:{w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth},grid:layout?getComputedStyle(layout).gridTemplateColumns:null,layout:r(layout),header:r(head),action:r(action),scroll:r(scroll),railDirection:launch[0]?getComputedStyle(launch[0].parentElement).flexDirection:null,icons,rows};
            },label);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            async function pageAt(file,w,h){
              const p=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
              p.on('pageerror',e=>failures.push(file+' pageerror: '+e.message));
              await startGame(p,file);
              await p.setViewportSize({width:w,height:h});await pause(200);
              await p.evaluate(()=>{
                const row=[...document.querySelectorAll('.mobile-action-panel .mobile-action-scroll .w-full.flex.rounded-lg.border.overflow-hidden')].find(e=>e.innerText.includes('선술집에서 일하기')&&e.getBoundingClientRect().width>0&&getComputedStyle(e).display!=='none');
                row?.querySelector('button[title*="동안 자동으로 일하기"]')?.scrollIntoView({block:'center',inline:'nearest'});
              });
              await pause(100);
              return {page:p,measure:await measure(p,file+' '+w+'x'+h)};
            }
            const oldPortrait=await pageAt('before.html',390,844);
            const newPortrait=await pageAt('Wayward_MOD_v3.36.html',390,844);
            const summary=m=>({viewport:m.viewport,grid:m.grid,layout:m.layout,header:m.header,action:m.action,scroll:m.scroll,icons:m.icons.map(x=>({self:x.self,icon:x.icon,swatch:x.swatch})),rows:m.rows});
            const oldP=summary(oldPortrait.measure),newP=summary(newPortrait.measure);
            console.log('PORTRAIT_BEFORE '+JSON.stringify(oldP));
            console.log('PORTRAIT_AFTER '+JSON.stringify(newP));
            if(JSON.stringify(oldP)!==JSON.stringify(newP))failures.push('portrait DOM/style geometry changed');
            if(newP.viewport.scrollWidth>390)failures.push('portrait horizontal overflow');
            await oldPortrait.page.close();await newPortrait.page.close();
            for(const [w,h] of [[900,400],[1024,600]]){
              const got=await pageAt('Wayward_MOD_v3.36.html',w,h),m=got.measure;
              console.log('LANDSCAPE_RESULT '+JSON.stringify(m));
              if(m.viewport.scrollWidth>w)failures.push(w+': horizontal page overflow');
              if(!m.grid||m.grid.trim().split(/\\s+/).length!==4)failures.push(w+': expected 4 landscape columns');
              if(m.railDirection!=='column')failures.push(w+': launcher icons are not vertically aligned');
              for(const b of m.icons){
                const launch=b.self.cls.includes('m33-editor-launch')||b.self.rect&&b.self.rect.x<28&&b.self.borderRadius==='8px';
                if(b.self.bg==='rgb(254, 243, 199)')failures.push(w+': light-yellow icon button remains');
                if(b.self.bg==='rgb(254, 243, 199)'||b.self.color==='rgb(28, 25, 23)')failures.push(w+': portrait icon colors not restored: '+b.self.text);
                if(!b.self.rect||b.self.rect.x<0||b.self.rect.right>28)failures.push(w+': an icon button escaped the left rail');
              }
              const launcher=m.icons.slice(0,3),sys=m.icons.slice(3);
              if(launcher.some(x=>x.self.bg!=='rgb(28, 25, 23)'||x.self.borderRadius!=='8px'))failures.push(w+': launcher background/shape differs from portrait');
              if(sys.some(x=>x.self.bg!=='rgb(41, 37, 36)'||x.self.color!=='rgb(231, 229, 228)'||x.self.borderRadius!=='7px'))failures.push(w+': system icon background/color/shape differs from portrait');
              if(m.icons[2]?.self.color!=='rgb(251, 191, 36)'||m.icons[2]?.self.border!=='1px solid rgb(245, 158, 11)')failures.push(w+': editor launcher accent differs from portrait');
              if(m.icons[4]?.swatch?.borderRadius!=='50%')failures.push(w+': theme swatch is not circular');
              if(!m.rows.row||!m.rows.main||!m.rows.timer)failures.push(w+': tavern work/5-minute composite row missing');
              else{
                if(m.rows.timer.rect.right>m.rows.row.rect.right+1)failures.push(w+': 5-minute control overflows its row');
                if(m.rows.timer.rect.w>=m.rows.row.rect.w*.5)failures.push(w+': 5-minute control is not content-sized');
                if(m.rows.main.rect.w<m.rows.row.rect.w*.5)failures.push(w+': tavern work label is squeezed too narrow');
                if(m.rows.timer.text!=='5분')failures.push(w+': timer label is not 5분');
                if(parseFloat(m.rows.timer.fontSize)<9)failures.push(w+': timer text font size collapsed');
                if(m.rows.timerBefore!=='none'||m.rows.timerAfter!=='none')failures.push(w+': disabled-choice pseudo labels still affect timer control');
              }
              await got.page.close();
            }
            await browser.close();
            if(failures.length){console.error('MOBILE_UI_FAILURES '+JSON.stringify(failures));process.exit(1)}
            console.log('MOBILE_UI_ALL_TESTS_PASSED');
          })().catch(e=>{console.error('VERIFY_FAILED '+e.stack);process.exit(1)});
          JS
      - name: Commit only the verified HTML
        if: success()
        shell: bash
        run: |
          git add Wayward_MOD_v3.36.html
          if git diff --cached --quiet; then
            echo "NO_HTML_CHANGES"
          else
            git commit -m "fix(mobile): restore portrait icon styling and work timer width"
            git push
          fi
