name: Temporary mobile UI diagnosis (2026-10-14)
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/diagnose-mobile-ui-20261014.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Measure portrait and landscape DOM without changing the HTML
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/wayward-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function startGame(page){
            await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:60000});
            await pause(500);
            for(let i=0;i<28;i++){
              const body=await page.locator('body').innerText().catch(()=> '');
              if(body.includes('물자 채우기')&&body.includes('대출')) return;
              let clicked=false;
              const next=page.getByRole('button',{name:/^예$|이해하고 동의합니다|다음|계속|시작|확인|완료|진행|게임 시작|새 게임/});
              for(let k=0;k<await next.count();k++){
                try{const b=next.nth(k);if(await b.isVisible()&&await b.isEnabled()){await b.evaluate(e=>e.click());await pause(200);clicked=true;break}}catch{}
              }
              const elena=page.getByRole('button',{name:/^엘레나/});
              if(!clicked&&await elena.count()){
                try{await elena.first().evaluate(e=>e.click());await pause(200);clicked=true}catch{}
              }
              if(!clicked)break;
            }
          }
          async function inspect(page,label){
            return await page.evaluate((label)=>{
              const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),right:+r.right.toFixed(1),bottom:+r.bottom.toFixed(1)}};
              const rules=()=>{const out=[];const walk=(rs,media=[])=>{for(const r of rs){try{if(r.type===4){walk(r.cssRules,media.concat(r.conditionText+'='+matchMedia(r.conditionText).matches));continue}if(!r.selectorText||!r.style)continue;const sel=r.selectorText;const relevant=sel.includes('m36-mobile-disabled-choice')||(sel.includes('mobile-action')&&/button|flex|scroll/i.test(sel))||(sel.includes('m34-header')&&/launchers|system-tools|theme-button|header-control/i.test(sel));if(relevant&&out.length<100)out.push({media,selector:sel,css:r.style.cssText})}catch{}}};for(const s of document.styleSheets){try{walk(s.cssRules)}catch{}}return out};
              const norm=s=>(s||'').trim().replace(/\\s+/g,' ').slice(0,100);
              const style=e=>{if(!e)return null;const s=getComputedStyle(e);return{tag:e.tagName,cls:typeof e.className==='string'?e.className:String(e.className||''),text:norm(e.innerText||e.textContent),rect:rect(e),display:s.display,position:s.position,gridColumn:s.gridColumn,gridRow:s.gridRow,flex:s.flex,flexGrow:s.flexGrow,flexShrink:s.flexShrink,flexBasis:s.flexBasis,boxSizing:s.boxSizing,width:s.width,minWidth:s.minWidth,maxWidth:s.maxWidth,height:s.height,padding:s.padding,margin:s.margin,fontSize:s.fontSize,lineHeight:s.lineHeight,whiteSpace:s.whiteSpace,overflowX:s.overflowX,overflowY:s.overflowY,bg:s.backgroundColor,color:s.color,border:s.border,borderRadius:s.borderRadius}};
              const layout=document.querySelector('.mobile-layout');
              const icons=[...document.querySelectorAll('.m34-header .m33-launchers button,.m34-header .m34-system-tools button')].map(e=>({self:style(e),html:e.innerHTML.slice(0,100),icon:style(e.querySelector('svg,img,i,[class*=icon],span'))}));
              const candidates=[...document.querySelectorAll('button,[role=button],a,.cursor-pointer')].filter(e=>{const t=norm(e.innerText||e.textContent);return /선술집에서 일하기/.test(t)||/(^|\\s)5분($|\\s)/.test(t)}).slice(0,12).map(e=>{const chain=[];let p=e;for(let i=0;p&&i<5;i++,p=p.parentElement)chain.push(style(p));return{self:style(e),html:e.outerHTML.slice(0,450),chain}});
              const body=document.body.innerText||'', idx=body.indexOf('선술집에서 일하기');
              return{label,viewport:{w:innerWidth,h:innerHeight,scrollWidth:document.documentElement.scrollWidth},grid:layout?getComputedStyle(layout).gridTemplateColumns:null,layout:style(layout),header:style(document.querySelector('.m34-header')),action:style(document.querySelector('.mobile-action-panel')),scroll:style(document.querySelector('.mobile-action-scroll')),icons,candidates,bodyTarget:idx>=0?body.slice(Math.max(0,idx-100),idx+250):'NOT_FOUND',rules:label==='PORTRAIT'?rules():undefined};
            },label);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            page.on('pageerror',e=>console.log('PAGE_ERROR '+e.message));
            await startGame(page);
            const nav=page.getByRole('button',{name:/홀로 내려가기/});
            console.log('NAV_COUNT '+await nav.count());
            if(await nav.count()){try{await nav.first().evaluate(e=>e.click());await pause(500)}catch(e){console.log('NAV_CLICK_ERROR '+e.message)}}
            console.log('AFTER_NAV '+JSON.stringify((await page.locator('body').innerText().catch(()=>'' )).slice(-700)));
            for(const [w,h,label] of [[390,844,'PORTRAIT'],[900,400,'LANDSCAPE'],[1024,600,'LANDSCAPE_WIDE']]){
              await page.setViewportSize({width:w,height:h});await pause(250);
              console.log('UI_DIAG_'+label+' '+JSON.stringify(await inspect(page,label)));
            }
            await browser.close();
          })().catch(e=>{console.error('DIAG_FAILED '+e.stack);process.exit(1)});
          JS
