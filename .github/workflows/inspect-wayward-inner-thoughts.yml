name: Temporary inspect Wayward inner thoughts
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-migration-438-v6-fixed-inner-thoughts
          fetch-depth: 0
      - name: Verify and scan source in bounded chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          p='Wayward_WML_ko.html'
          terms=[s.encode() for s in ['그녀의 속마음','속마음','이야기','가게','피파','innerThought','thoughts','function _B','M36MobileRoomCustomer','M36MobileRoomActivity','stock_up','물자 채우기','물자채우기','영업 준비','facilityOnly','M36MobileStockStatus','position:sticky','$ot','u.jsx($ot','u.jsxs($ot','function $ot']]
          h=hashlib.sha256(); manifest=hashlib.sha256(); overlap=b''; off=0; chunks=0; hits={t:[] for t in terms}
          with open(p,'rb') as f:
            while True:
              c=f.read(4096)
              if not c: break
              h.update(c); manifest.update(off.to_bytes(8,'big')+len(c).to_bytes(4,'big')+hashlib.sha256(c).digest()); chunks+=1
              d=overlap+c; base=off-len(overlap)
              for t in terms:
                i=0
                while True:
                  j=d.find(t,i)
                  if j<0: break
                  pos=base+j
                  if pos+len(t)>off and (not hits[t] or hits[t][-1]!=pos): hits[t].append(pos)
                  i=j+1
              overlap=d[-max(map(len,terms)):]; off+=len(c)
          print('SOURCE bytes=%d chunks=%d sha256=%s manifest=%s'%(off,chunks,h.hexdigest(),manifest.hexdigest()))
          for term in terms:
            print('HIT %s count=%d offsets=%s'%(term.decode('utf-8','replace'),len(hits[term]),hits[term][:20]))
          selected=[]
          for label in ['function _B','M36MobileRoomCustomer','stock_up','물자 채우기','물자채우기','영업 준비','facilityOnly','M36MobileStockStatus','M36MobileRoomActivity','innerThought']:
            term=label.encode()
            if hits.get(term): selected.append((label,hits[term][0]))
          for label,pos in selected[:10]:
            a=max(0,pos-1600); b=min(off,a+5600)
            with open(p,'rb') as f: f.seek(a); raw=f.read(b-a)
            print('\\n===== CONTEXT %s %d..%d bytes=%d ====='%(label,a,b,len(raw)))
            print(raw.decode('utf-8','replace'))
          for label,pos in [('customer-row-second-function',3712585),('stock-up-ui',3593085),('stock-up-label-ui',3593346),('prep-tab-area',3572104),('prep-tab-area-2',3590712),('prep-tab-area-3',3597388)]:
            a=max(0,pos-1800); b=min(off,a+6000)
            with open(p,'rb') as f: f.seek(a); raw=f.read(b-a)
            print('\\n===== CONTEXT %s %d..%d bytes=%d ====='%(label,a,b,len(raw)))
            print(raw.decode('utf-8','replace'))
          for label in ['$ot','u.jsx($ot','u.jsxs($ot','function $ot']:
            term=label.encode()
            print('CALLSITE %s offsets=%s'%(label,hits.get(term,[])[:40]))
            for pos in hits.get(term,[])[:4]:
              a=max(0,pos-1400); b=min(off,a+5200)
              with open(p,'rb') as f: f.seek(a); raw=f.read(b-a)
              print('\\n===== CONTEXT %s %d..%d bytes=%d ====='%(label,a,b,len(raw)))
              print(raw.decode('utf-8','replace'))
          PY
      - name: Syntax and regression tests
        run: |
          node --check mobile-ui-migration/mod.js
          node mobile-ui-migration/tests/pinned-renderers.test.cjs
      - name: Diff check and build package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mobile-ui-migration-438-v5-dialog-gauges
          git diff --check origin/mobile-ui-migration-438-v5-dialog-gauges...HEAD
          rm -rf /tmp/m36-mobile-package
          mkdir -p /tmp/m36-mobile-package/mobile-ui-migration
          cp mobile-ui-migration/mod.js /tmp/m36-mobile-package/mobile-ui-migration/mod.js
          cp mobile-ui-migration/README_ko.md /tmp/m36-mobile-package/mobile-ui-migration/README_ko.md
          rm -f mobile-ui-migration/mobile-ui-migration-438.zip
          (cd /tmp/m36-mobile-package && zip -qr "$GITHUB_WORKSPACE/mobile-ui-migration/mobile-ui-migration-438.zip" mobile-ui-migration)
          unzip -t mobile-ui-migration/mobile-ui-migration-438.zip
          unzip -p mobile-ui-migration/mobile-ui-migration-438.zip mobile-ui-migration/mod.js | cmp - mobile-ui-migration/mod.js
          unzip -p mobile-ui-migration/mobile-ui-migration-438.zip mobile-ui-migration/README_ko.md | cmp - mobile-ui-migration/README_ko.md
          sha256sum mobile-ui-migration/mobile-ui-migration-438.zip
      - name: Commit validated ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-ui-migration/mobile-ui-migration-438.zip
          if git diff --cached --quiet; then echo "ZIP already current"; exit 0; fi
          git commit -m "build(mobile): package validated UI 1.3.2 [skip ci]"
          git push origin "HEAD:refs/heads/mobile-ui-migration-438-v6-fixed-inner-thoughts"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-migration-438-v1.3.2
          path: mobile-ui-migration/mobile-ui-migration-438.zip
          if-no-files-found: error
