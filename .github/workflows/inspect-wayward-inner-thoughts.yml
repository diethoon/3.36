name: Temporary inspect Wayward inner thoughts
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-migration-438-v5-dialog-gauges
      - name: Verify and scan source in bounded chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os
          p='Wayward_WML_ko.html'
          terms=['그녀의 속마음','속마음','이야기','가게','피파','narration','thought','innerThought','thoughts','마음']
          terms=[t.encode() for t in terms]
          h=hashlib.sha256(); manifest=hashlib.sha256(); overlap=b''; off=0; chunks=0; hits={t:[] for t in terms}
          target=3692801
          with open(p,'rb') as f:
            f.seek(0); data=f.read()
          fn=data.rfind(b'function ',0,target)
          print('PREVIOUS_FUNCTION offset=%d context=%r'%(fn,data[fn:fn+500]))
          for term in ['이야기','가게','피파','그녀의 속마음']:
            t=term.encode()
            ps=[]; start=max(0,target-250000)
            while True:
              j=data.find(t,start)
              if j<0 or j>target+250000: break
              ps.append(j); start=j+1
            print('NEAR_TERM %s %s'%(term,ps[:100]))
          centers=[fn,3649082,3688829,3692801]
          windows=[]
          for pos in centers:
            if pos<0: continue
            a=max(0,pos-200); b=min(off,pos+7600)
            if any(not (b<=x or a>=y) for x,y in windows): continue
            windows.append((a,b))
          for a,b in windows[:16]:
            with open(p,'rb') as f: f.seek(a); raw=f.read(min(7600,b-a))
            print('\\n===== CONTEXT %d..%d bytes=%d ====='%(a,b,len(raw)))
            print(raw.decode('utf-8','replace'))
          PY
