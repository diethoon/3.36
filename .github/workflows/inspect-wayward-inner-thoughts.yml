name: Temporary inspect Wayward inner thoughts
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-migration-438-v5-dialog-gauges
      - name: Verify and scan source in bounded chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os
          p='Wayward_WML_ko.html'
          terms=[x.encode() for x in ['그녀의 속마음','속마음','이야기','가게','피파','narration','thought','innerThought','thoughts','마음','function ']]
          h=hashlib.sha256(); manifest=hashlib.sha256(); overlap=b''; off=0; chunks=0
          hits={t:[] for t in terms}; last_function=-1
          target=3692801
          with open(p,'rb') as f:
            while True:
              c=f.read(4096)
              if not c: break
              h.update(c)
              manifest.update(off.to_bytes(8,'big')+len(c).to_bytes(4,'big')+hashlib.sha256(c).digest())
              chunks+=1
              d=overlap+c; base=off-len(overlap)
              for t in terms:
                i=0
                while True:
                  j=d.find(t,i)
                  if j<0: break
                  pos=base+j
                  if pos+len(t)>off and (not hits[t] or hits[t][-1]!=pos):
                    hits[t].append(pos)
                    if t==b'function ' and pos<=target: last_function=pos
                  i=j+1
              overlap=d[-max(map(len,terms)):]
              off+=len(c)
          print('SOURCE bytes=%d chunks=%d sha256=%s manifest=%s'%(off,chunks,h.hexdigest(),manifest.hexdigest()))
          for t,ps in hits.items():
            if t in [b'그녀의 속마음',b'속마음',b'innerThought',b'thoughts']:
              print('HIT %r count=%d offsets=%s'%(t,len(ps),ps[:30]))
          for label in ['이야기','가게','피파','그녀의 속마음']:
            t=label.encode()
            ps=[x for x in hits[t] if abs(x-target)<250000]
            print('NEAR_TERM %s offsets=%s'%(label,ps[:100]))
          print('PREVIOUS_FUNCTION_OFFSET',last_function)
          centers=[last_function,3649082,3688829,3692801]
          windows=[]
          for pos in centers:
            if pos<0: continue
            a=max(0,pos-200); b=min(off,a+7800)
            if any(not (b<=x or a>=y) for x,y in windows): continue
            windows.append((a,b))
          for a,b in windows[:8]:
            with open(p,'rb') as f:
              f.seek(a); raw=f.read(b-a)
            print('\\n===== CONTEXT %d..%d bytes=%d ====='%(a,b,len(raw)))
            print(raw.decode('utf-8','replace'))
          PY
