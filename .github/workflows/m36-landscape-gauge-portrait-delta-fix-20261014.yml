name: M36 landscape icon rail repair (one-shot)
on:
  push:
    branches: [mobile-migration-v1]
    paths:
      - ".github/workflows/m36-landscape-gauge-portrait-delta-fix-20261014.yml"
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Apply landscape-only icon visibility repair
        run: |
          set -euo pipefail
          cp Wayward_MOD_v3.36.html /tmp/m36-original.html
          python3 <<'PY'
          from pathlib import Path
          import json, os
          p=Path("Wayward_MOD_v3.36.html"); marker=b'm36-landscape-icon-visibility-20261016'; body=b'</body>'
          terms=[b'wayward-save-share',b'm36-mobile-disabled-choice',b'm36-mobile-pleasure-fixed',b'M36MobileStoreStatus',
                 '물자 채우기'.encode(),'시설 업그레이드'.encode(),'인사하기'.encode()]
          found={marker:set(),body:set()}; counts={t:set() for t in terms}; overlap=b''; total=0
          with p.open('rb') as f:
              while True:
                  chunk=f.read(256*1024)
                  if not chunk: break
                  buf=overlap+chunk; base=total-len(overlap)
                  for target,positions in found.items():
                      i=0
                      while True:
                          n=buf.find(target,i)
                          if n<0: break
                          positions.add(base+n); i=n+1
                  for target,positions in counts.items():
                      i=0
                      while True:
                          n=buf.find(target,i)
                          if n<0: break
                          positions.add(base+n); i=n+1
                  total+=len(chunk); overlap=buf[-512:]
          if found[marker]: raise SystemExit('Duplicate patch marker found')
          if not found[body]: raise SystemExit('Closing body tag not found')
          before={t.decode():len(v) for t,v in counts.items()}
          css=('''<style id="m36-landscape-icon-visibility-20261016">
          @media (orientation:landscape) and (min-width:600px) {
            .m34-header .m33-launchers,
            .m34-header .m34-system-tools {
              display:flex!important; flex-direction:column!important; align-items:center!important;
              justify-content:flex-start!important; flex:0 0 28px!important; width:28px!important;
              min-width:28px!important; max-width:28px!important; gap:4px!important;
            }
            .m34-header .m33-launchers button,
            .m34-header .m34-system-tools button {
              box-sizing:border-box!important; width:22px!important; min-width:22px!important; max-width:22px!important;
              height:22px!important; min-height:22px!important; max-height:22px!important; padding:2px!important;
              color:#fafaf9!important; background:#44403c!important; border:1px solid #78716c!important;
              box-shadow:0 0 0 1px rgba(250,250,249,.14),0 1px 3px rgba(0,0,0,.55)!important; opacity:1!important;
            }
            .m34-header .m33-launchers button:disabled,
            .m34-header .m34-system-tools button:disabled,
            .m34-header .m33-launchers button[aria-disabled="true"],
            .m34-header .m34-system-tools button[aria-disabled="true"] { opacity:.58!important; }
            .m34-header .m33-launchers button svg,
            .m34-header .m34-system-tools button svg { color:#fafaf9!important; opacity:1!important; filter:brightness(1.12) contrast(1.1)!important; }
            .m34-header .m33-launchers button svg[fill]:not([fill="none"]),
            .m34-header .m34-system-tools button svg[fill]:not([fill="none"]),
            .m34-header .m33-launchers button svg [fill]:not([fill="none"]),
            .m34-header .m34-system-tools button svg [fill]:not([fill="none"]) { fill:#fafaf9!important; }
            .m34-header .m33-launchers button svg[stroke]:not([stroke="none"]),
            .m34-header .m34-system-tools button svg[stroke]:not([stroke="none"]),
            .m34-header .m33-launchers button svg [stroke]:not([stroke="none"]),
            .m34-header .m34-system-tools button svg [stroke]:not([stroke="none"]) { stroke:#fafaf9!important; }
            .m34-header .m33-launchers button svg [style*="fill"]:not([style*="fill:none"]):not([style*="fill: none"]),
            .m34-header .m34-system-tools button svg [style*="fill"]:not([style*="fill:none"]):not([style*="fill: none"]) { fill:#fafaf9!important; }
            .m34-header .m33-launchers button svg [style*="stroke"]:not([style*="stroke:none"]):not([style*="stroke: none"]),
            .m34-header .m34-system-tools button svg [style*="stroke"]:not([style*="stroke:none"]):not([style*="stroke: none"]) { stroke:#fafaf9!important; }
          }
          </style>
          ''').encode()
          at=max(found[body]); tmp=p.with_suffix('.html.m36tmp')
          with p.open('rb') as src,tmp.open('wb') as dst:
              remaining=at
              while remaining:
                  b=src.read(min(256*1024,remaining))
                  if not b: raise SystemExit('Unexpected EOF')
                  dst.write(b); remaining-=len(b)
              dst.write(css)
              while True:
                  b=src.read(256*1024)
                  if not b: break
                  dst.write(b)
          os.replace(tmp,p)
          after={t:set() for t in terms}; overlap=b''; total=0
          with p.open('rb') as f:
              while True:
                  chunk=f.read(256*1024)
                  if not chunk: break
                  buf=overlap+chunk; base=total-len(overlap)
                  for target,positions in after.items():
                      i=0
                      while True:
                          n=buf.find(target,i)
                          if n<0: break
                          positions.add(base+n); i=n+1
                  total+=len(chunk); overlap=buf[-512:]
          after_counts={t.decode():len(v) for t,v in after.items()}
          if before!=after_counts: raise SystemExit('Gameplay markers changed: '+json.dumps({'before':before,'after':after_counts},ensure_ascii=False))
          evidence={'marker':'m36-landscape-icon-visibility-20261016','bytesBefore':p.stat().st_size-len(css),
                    'bytesAfter':p.stat().st_size,'insertedBytes':len(css),'featureMarkerCountsBefore':before,
                    'featureMarkerCountsAfter':after_counts,'scope':'landscape toolbar CSS only'}
          Path('/tmp/m36-icon-patch-evidence.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2))
          print(json.dumps(evidence,ensure_ascii=False))
          PY
          git diff --check
      - name: Verify browser layout, icon contrast and portrait preservation
        id: runtime
        continue-on-error: true
        run: |
          cat > /tmp/m36-icon-repair.cjs <<'NODE'
          const fs=require('fs'),http=require('http'),cp=require('child_process');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const file='Wayward_MOD_v3.36.html';
          const report={head:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),boot:[],views:[],errors:[],verdict:'FAIL'};
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const lum=c=>{const m=String(c||'').match(/rgba?\(([^)]+)\)/);if(!m)return null;const a=m[1].split(',').slice(0,3).map(Number).map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*a[0]+.7152*a[1]+.0722*a[2];};
          const contrast=(a,b)=>{const x=lum(a),y=lum(b);return x===null||y===null?null:+((Math.max(x,y)+.05)/(Math.min(x,y)+.05)).toFixed(2);};
          const server=http.createServer((req,res)=>{if(String(req.url||'').split('?')[0]!=='/Wayward_MOD_v3.36.html'){res.writeHead(404);res.end();return;}res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-store'});fs.createReadStream(file).pipe(res);});
          async function click(page,re){const b=page.getByRole('button',{name:re}).first();if(!await b.count().catch(()=>0)||!await b.isVisible().catch(()=>false))return false;await b.evaluate(e=>e.click());await wait(400);return true;}
          async function boot(page){
            const actions=[];
            for(let i=0;i<70;i++){
              const ready=await page.evaluate(()=>!!(document.querySelector('.mobile-layout')&&document.querySelector('.mobile-action-panel')&&document.querySelector('.mobile-action-scroll'))).catch(()=>false);
              if(ready){report.boot.push({ok:true,actions});return;}
              if(await click(page,/^예$/)){actions.push('age');continue;}
              if(await click(page,/이해하고 동의합니다/)){actions.push('consent');continue;}
              if(await click(page,/계속하기/)){actions.push('continue');continue;}
              if(actions.includes('wife')&&await click(page,/엘레나/)){actions.push('Elena');continue;}
              if(!actions.includes('wife')&&await click(page,/아내/)){actions.push('wife');continue;}
              if(await click(page,/엘레나/)){actions.push('Elena');continue;}
              if(await click(page,/^새 게임$/)){actions.push('new game');continue;}
              if(await click(page,/건너뛰기/)){actions.push('skip prologue');continue;}
              if(await click(page,/^다음$/)){actions.push('next prologue');continue;}
              await wait(200);
            }
            throw new Error('Game boot failed: '+JSON.stringify(actions)+'; '+(await page.locator('body').innerText().catch(()=>'' )).slice(-1000));
          }
          async function inspect(page,label){
            const m=await page.evaluate(label=>{
              const box=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2),display:s.display,direction:s.flexDirection,gap:s.gap,opacity:s.opacity};};
              const controls=root=>root?[...root.querySelectorAll('button,[role="button"]')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0;}).map(e=>{
                const r=e.getBoundingClientRect(),s=getComputedStyle(e),svg=e.querySelector('svg'),ss=svg?getComputedStyle(svg):null;
                const shapes=svg?[...svg.querySelectorAll('path,circle,rect,line,polyline,polygon,ellipse')].map(n=>{const q=getComputedStyle(n);return {tag:n.tagName,fill:q.fill,stroke:q.stroke,fillAttr:n.getAttribute('fill'),strokeAttr:n.getAttribute('stroke'),opacity:q.opacity};}):[];
                const ink=[];if(ss)ink.push({kind:'svg-color',color:ss.color});
                for(const sh of shapes){if(sh.fill!=='none'&&Number(sh.opacity||1)>.05)ink.push({kind:'fill',color:sh.fill});if(sh.stroke!=='none'&&Number(sh.opacity||1)>.05)ink.push({kind:'stroke',color:sh.stroke});}
                return {label:(e.getAttribute('aria-label')||e.title||e.innerText||e.textContent||'').trim().slice(0,65),disabled:!!(e.disabled||e.getAttribute('aria-disabled')==='true'),
                  rect:{x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2),opacity:s.opacity},
                  color:s.color,background:s.backgroundColor,svgColor:ss&&ss.color,ink,shapes:shapes.slice(0,8)};
              }):[];
              const launch=document.querySelector('.m34-header .m33-launchers'),tools=document.querySelector('.m34-header .m34-system-tools');
              const l=controls(launch),t=controls(tools),all=[...l,...t],overlaps=[];
              for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const A=all[i].rect,B=all[j].rect;if(A.x<B.right&&A.right>B.x&&A.y<B.bottom&&A.bottom>B.y)overlaps.push([all[i].label,all[j].label]);}
              const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2)};};
              const layout=document.querySelector('.mobile-layout'),panel=document.querySelector('.mobile-action-panel'),choices=document.querySelector('.mobile-action-scroll');
              return {label,viewport:{width:innerWidth,height:innerHeight,clientWidth:document.documentElement.clientWidth,docWidth:document.documentElement.scrollWidth,fullscreen:!!document.fullscreenElement},
                launchers:box(launch),launcherCount:l.length,launcherItems:l,systemTools:box(tools),systemCount:t.length,systemItems:t,overlaps,
                layout:rect(layout),panel:rect(panel),panelGrid:panel?getComputedStyle(panel).gridColumn:null,choices:rect(choices)};
            },label);
            for(const c of [...m.launcherItems,...m.systemItems]){
              c.contrast=contrast(c.color,c.background);
              c.ink=(c.ink||[]).map(i=>({...i,contrast:contrast(i.color,c.background)}));
            }
            report.views.push(m);return m;
          }
          async function validate(page,label){
            const m=await inspect(page,label),fail=[],controls=[...m.launcherItems,...m.systemItems];
            if(!m.launchers||m.launchers.display!=='flex'||m.launchers.direction!=='column'||m.launchers.width<27||m.launchers.width>29)fail.push('launchers not a 28px vertical rail');
            if(!m.systemTools||m.systemTools.display!=='flex'||m.systemTools.direction!=='column'||m.systemTools.width<27||m.systemTools.width>29)fail.push('system tools not a 28px vertical rail');
            if(m.launcherCount<3||m.systemCount<4)fail.push('toolbar controls missing');
            for(const c of controls){
              if(c.rect.x < -1||c.rect.right>29.5)fail.push(c.label+': outside left rail');
              if(c.rect.width<20||c.rect.height<20)fail.push(c.label+': button undersized');
              if(!c.disabled&&Number(c.rect.opacity)<.95)fail.push(c.label+': active icon opacity below .95');
              if(c.disabled&&Number(c.rect.opacity)<.5)fail.push(c.label+': disabled icon opacity below .5');
              if(c.contrast!==null&&c.contrast<3)fail.push(c.label+': foreground contrast <3:1');
              for(const ink of c.ink||[])if(ink.contrast!==null&&ink.contrast<3)fail.push(c.label+': SVG '+ink.kind+' contrast <3:1 ('+ink.color+')');
            }
            if(m.overlaps.length)fail.push('toolbar controls overlap');
            if(m.viewport.docWidth>m.viewport.clientWidth+1)fail.push('horizontal document overflow');
            m.checks={pass:fail.length===0,failures:fail};
            await page.screenshot({path:'/tmp/m36-'+label.replace(/[^a-z0-9]+/gi,'-')+'.png'}).catch(()=>{});
            if(fail.length)throw new Error(label+': '+fail.join('; '));
          }
          async function dims(page){return await page.evaluate(()=>{const q=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2)}};return {layout:q('.mobile-layout'),panel:q('.mobile-action-panel'),choices:q('.mobile-action-scroll'),viewport:{width:innerWidth,height:innerHeight,docWidth:document.documentElement.scrollWidth}};});}
          async function main(){
            let browser;
            try{
              await new Promise((ok,no)=>server.listen(4173,'127.0.0.1',ok).once('error',no));
              browser=await chromium.launch({headless:true,args:['--no-sandbox']});
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
              page.on('pageerror',e=>report.errors.push(String(e)));
              await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});await boot(page);
              report.portraitBefore=await dims(page);
              for(const v of [{w:1280,h:720},{w:915,h:412},{w:720,h:360}]){await page.setViewportSize({width:v.w,height:v.h});await wait(500);await validate(page,v.w+'x'+v.h);}
              const full=page.getByRole('button',{name:/전체화면/}).first();
              if(await full.count().catch(()=>0)&&await full.isVisible().catch(()=>false)){
                await full.click({timeout:2000}).catch(()=>{});await wait(500);
                report.fullscreenEntered=await page.evaluate(()=>!!document.fullscreenElement);
                if(report.fullscreenEntered)await validate(page,'fullscreen');
                await page.evaluate(()=>document.exitFullscreen()).catch(()=>{});await wait(250);
              }else report.fullscreenEntered=false;
              await page.setViewportSize({width:390,height:844});await wait(500);report.portraitAfter=await dims(page);
              for(const k of ['layout','panel','choices']){const a=report.portraitBefore[k],b=report.portraitAfter[k];if(!!a!==!!b)throw new Error('Portrait '+k+' presence changed');if(a&&b)for(const d of ['x','y','right','bottom','width','height'])if(Math.abs(a[d]-b[d])>1.5)throw new Error('Portrait '+k+' '+d+' changed '+a[d]+' -> '+b[d]);}
              if(report.errors.length)throw new Error('page errors: '+report.errors.join(' | '));
              report.verdict='PASS';fs.writeFileSync('/tmp/m36-icon-rail-pass','PASS');
            }catch(e){report.failure=String(e&&e.stack||e).slice(0,6000);}
            finally{fs.writeFileSync('/tmp/m36-icon-rail-report.json',JSON.stringify(report,null,2));if(browser)await browser.close().catch(()=>{});await new Promise(r=>server.close(r)).catch(()=>{});}
            console.log(JSON.stringify(report));if(report.verdict!=='PASS')process.exitCode=1;
          }
          main().catch(e=>{console.error(e&&e.stack||e);process.exitCode=1;});
          NODE
          node /tmp/m36-icon-repair.cjs
      - name: Record evidence and remove one-shot runner
        if: always()
        run: |
          set -euo pipefail
          mkdir -p idea
          if [ -f /tmp/m36-icon-patch-evidence.json ] && [ -f /tmp/m36-icon-rail-report.json ]; then
            node -e "const fs=require('fs'),p='/tmp/m36-icon-rail-report.json',r=JSON.parse(fs.readFileSync(p,'utf8'));r.patch=JSON.parse(fs.readFileSync('/tmp/m36-icon-patch-evidence.json','utf8'));fs.writeFileSync(p,JSON.stringify(r,null,2))"
          fi
          if [ -f /tmp/m36-icon-rail-report.json ]; then
            { echo "# M36 Landscape Icon Rail Repair — 2026-10-16"; echo; echo "Result: **$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/m36-icon-rail-report.json','utf8')).verdict)")**"; echo; echo "Runtime evidence:"; cat /tmp/m36-icon-rail-report.json; } > idea/M36_LANDSCAPE_ICON_RAIL_REPAIR_20261016.md
          else
            printf '%s\n' '# M36 Landscape Icon Rail Repair — 2026-10-16' '' 'Result: **FAIL**' '' 'No runtime report was generated.' > idea/M36_LANDSCAPE_ICON_RAIL_REPAIR_20261016.md
          fi
          if [ ! -f /tmp/m36-icon-rail-pass ] && [ -f /tmp/m36-original.html ]; then cp /tmp/m36-original.html Wayward_MOD_v3.36.html; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/m36-landscape-gauge-portrait-delta-fix-20261014.yml || true
          if [ -f /tmp/m36-icon-rail-pass ]; then
            cat >> idea/GPT_RUNTIME_FORENSIC_FALLBACK.md <<'DOC'

## 2026-10-16 — Landscape icon rail bounded repair

A one-shot GitHub Actions runner streamed Wayward_MOD_v3.36.html in 256 KiB chunks and inserted one landscape-only CSS block before the closing body tag. Before committing the source change it booted the game in Chromium and checked the left launcher and system-tool rails at 1280×720, 915×412, 720×360, and fullscreen, including SVG contrast and overlap. It also compared portrait layout geometry before and after the landscape round-trip and counted existing gameplay/save/visitor feature markers before and after patching. The runner is removed after the evidence report is committed. Disabled controls use a lower visibility threshold than active controls; do not treat an intentionally dimmed Undo control as a layout failure.
DOC
            git add Wayward_MOD_v3.36.html idea/M36_LANDSCAPE_ICON_RAIL_REPAIR_20261016.md idea/GPT_RUNTIME_FORENSIC_FALLBACK.md
            git commit -m "fix(mobile): improve landscape left icon rail visibility"
          else
            git add idea/M36_LANDSCAPE_ICON_RAIL_REPAIR_20261016.md
            git commit -m "test(mobile): record landscape icon rail runtime result"
          fi
          git push origin HEAD:mobile-migration-v1
      - name: Require browser verification pass
        if: always()
        run: test -f /tmp/m36-icon-rail-pass
