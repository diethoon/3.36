name: M36 landscape gauge and portrait delta fix
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/m36-landscape-gauge-portrait-delta-fix-20261014.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Apply precise byte-range patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          p=Path("Wayward_MOD_v3.36.html")
          # Build the exact unique fallback span without reading the minified file in one operation.
          needle = (b'u.jsx("span",{className:' + bytes([96]) +
                    b'text-xs leading-tight ' + bytes([36,123]) +
                    b'Wt}' + bytes([96]) + b',children:xe})')
          replacement = ('''u.jsx("div",{className:"m36-portrait-inline-delta",children:(m312State.lastActionDelta&&(sMe(m312State.lastActionDelta).length>0||(Rt.getState().devMode&&rMe(m312State.lastActionDelta).length>0)))?u.jsx(nOe,{delta:m312State.lastActionDelta,ageSlot:m312State.slot}):(xe==="대기 중"?"변화 기록 없음":xe)})''').encode("utf-8")
          body_tag=b"</body>"
          style=b"""<style id="m36-landscape-gauge-and-portrait-delta-20261014">
          @media (orientation:landscape) {
            .mobile-action-panel .m36-mobile-pleasure-fixed {
              display:grid!important;
              visibility:visible!important;
              flex:0 0 auto!important;
              position:relative!important;
              z-index:29!important;
              grid-template-columns:repeat(2,minmax(0,1fr))!important;
              gap:4px!important;
              padding:.25rem .45rem .4rem!important;
              background:rgb(28 25 23)!important;
              border-bottom:1px solid rgba(68,64,60,.78)!important;
            }
            .mobile-action-panel .mobile-action-scroll .m36-mobile-choice-gauge {
              display:none!important;
            }
          }
          .m36-portrait-inline-delta {
            display:block;
            width:100%;
            max-width:100%;
            min-width:0;
            overflow:hidden;
            color:rgb(168 162 158);
            font-size:.75rem;
            line-height:1.2;
          }
          .m36-portrait-inline-delta>.px-3.py-2 {
            padding:0!important;
            background:transparent!important;
            font-size:.62rem!important;
          }
          .m36-portrait-inline-delta>.px-3.py-2>.flex:first-child {
            flex-wrap:nowrap!important;
            overflow-x:auto!important;
            white-space:nowrap!important;
            max-width:100%;
            gap:.25rem .5rem!important;
          }
          .m36-portrait-inline-delta>.px-3.py-2>.flex:first-child>span {
            flex:0 0 auto!important;
          }
          </style>"""

          targets=[needle,body_tag]
          found={x:set() for x in targets}
          overlap=b""
          offset=0
          with p.open("rb") as f:
            while True:
              chunk=f.read(256*1024)
              if not chunk: break
              buf=overlap+chunk
              base=offset-len(overlap)
              for target in targets:
                pos=0
                while True:
                  i=buf.find(target,pos)
                  if i<0: break
                  found[target].add(base+i)
                  pos=i+1
              offset+=len(chunk)
              overlap=buf[-4096:]

          spans=sorted(found[needle])
          bodies=sorted(found[body_tag])
          if len(spans)!=1:
            raise SystemExit(f"Expected one portrait fallback span, found {len(spans)}")
          if not bodies:
            raise SystemExit("Closing body tag not found")
          if b'm36-landscape-gauge-and-portrait-delta-20261014' in p.open("rb").read(0):
            raise SystemExit("Unexpected existing patch marker")
          body_pos=bodies[-1]
          with p.open("rb") as f:
            f.seek(body_pos+len(body_tag))
            tail=f.read(128)
          if b"</html>" not in tail:
            raise SystemExit("The final body tag was not followed by the HTML close tag")

          edits=[
            (spans[0],spans[0]+len(needle),replacement),
            (body_pos,body_pos+len(body_tag),style+body_tag)
          ]
          if edits[0][1]>=edits[1][0]:
            raise SystemExit("Patch locations overlap")
          tmp=p.with_name(p.name+".m36tmp")
          def copy_n(src,dst,count):
            remaining=count
            while remaining:
              part=src.read(min(128*1024,remaining))
              if not part: raise EOFError("Unexpected EOF during bounded copy")
              dst.write(part)
              remaining-=len(part)

          with p.open("rb") as src, tmp.open("wb") as dst:
            cursor=0
            for start,end,data in edits:
              src.seek(cursor)
              copy_n(src,dst,start-cursor)
              dst.write(data)
              cursor=end
            src.seek(cursor)
            while True:
              part=src.read(128*1024)
              if not part: break
              dst.write(part)

          os.replace(tmp,p)

          # Verify the two intended edits in bounded chunks; never materialize the full HTML in memory.
          required=[b'm36-portrait-inline-delta',b'm36-landscape-gauge-and-portrait-delta-20261014',
                    b'display:grid!important',b'children:xe})']
          counts={x:0 for x in required}
          overlap=b""
          with p.open("rb") as f:
            offset=0
            while True:
              chunk=f.read(256*1024)
              if not chunk: break
              buf=overlap+chunk
              for marker in required:
                counts[marker]+=buf.count(marker)
              offset+=len(chunk)
              overlap=buf[-4096:]
          if counts[required[0]]<1 or counts[required[1]]!=1 or counts[required[2]]<1:
            raise SystemExit(f"Post-patch verification failed: {counts}")
          if counts[required[3]]!=0:
            raise SystemExit("Old fallback markup unexpectedly remains")
          print("PATCH_OK")
          print("FILE_BYTES",p.stat().st_size)
          print("PORTRAIT_DELTA_AND_LANDSCAPE_GAUGE_MARKERS",counts)
          PY
          git diff --check
          # Syntax-check the inserted expression independently.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          needle=b'm36-portrait-inline-delta",children:'
          with p.open("rb") as f:
            overlap=b""; found=False
            while True:
              c=f.read(256*1024)
              if not c: break
              if needle in overlap+c: found=True; break
              overlap=(overlap+c)[-4096:]
          if not found: raise SystemExit("Inserted portrait delta expression not found")
          Path("/tmp/m36-patch-expression.js").write_text(
            'function render(u,m312State,Rt,sMe,rMe,nOe,xe){return u.jsx("div",{className:"m36-portrait-inline-delta",children:(m312State.lastActionDelta&&(sMe(m312State.lastActionDelta).length>0||(Rt.getState().devMode&&rMe(m312State.lastActionDelta).length>0)))?u.jsx(nOe,{delta:m312State.lastActionDelta,ageSlot:m312State.slot}):(xe==="대기 중"?"변화 기록 없음":xe)})}\n',
            encoding="utf-8")
          PY
          node --check /tmp/m36-patch-expression.js
          touch /tmp/m36-mobile-patch-success
      - name: Commit patch and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/m36-landscape-gauge-portrait-delta-fix-20261014.yml
          if [ -f /tmp/m36-mobile-patch-success ]; then
            git add Wayward_MOD_v3.36.html .github/workflows
            git commit -m "fix(mobile): show landscape gauges and portrait status deltas"
          else
            git add -A .github/workflows
            if ! git diff --cached --quiet; then
              git commit -m "chore: remove temporary mobile status patch runner"
            fi
          fi
          if ! git diff --cached --quiet || [ -f /tmp/m36-mobile-patch-success ]; then
            git push origin mobile-migration-v1
          fi
