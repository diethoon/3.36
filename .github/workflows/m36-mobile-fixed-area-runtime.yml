name: One-shot mobile fixed-area runtime verification
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-mobile-fixed-area-runtime.yml
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Test live mobile choice scroll
        shell: bash
        run: |
          set -euo pipefail
          cat > mobile-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url='https://static-3-36.onrender.com/Wayward_MOD_v3.36.html';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:390,height:844},
            deviceScaleFactor:1,
            isMobile:true,
            hasTouch:true
          });
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(1200);

          async function clickIfVisible(text) {
            const loc=page.getByText(text,{exact:true}).first();
            if(await loc.count() && await loc.isVisible().catch(()=>false)) {
              await loc.click({timeout:8000}).catch(()=>{});
              await page.waitForTimeout(800);
              return true;
            }
            return false;
          }

          await clickIfVisible('예');
          await clickIfVisible('이해하고 동의합니다');
          if(await page.getByText('설정',{exact:true}).count()) {
            await clickIfVisible('설정');
            await clickIfVisible('✕');
          }

          await clickIfVisible('새 게임');
          await page.waitForTimeout(1500);
          await clickIfVisible('피파');
          await page.waitForTimeout(700);
          await clickIfVisible('계속하기 — 피파 →');
          await page.waitForTimeout(700);
          const fate=page.getByText('운명에 맡김',{exact:true});
          for(const el of await fate.all()) {
            if(await el.isVisible().catch(()=>false) && await el.isEnabled().catch(()=>false)) {
              await el.click().catch(()=>{});
              await page.waitForTimeout(80);
            }
          }
          await clickIfVisible('시작 — 피파 →');
          await page.waitForTimeout(2200);
          await clickIfVisible('건너뛰기');
          await page.waitForTimeout(1600);

          const before=await page.evaluate(()=>{
            const q=s=>document.querySelector(s);
            const box=el=>{
              if(!el)return null;
              const r=el.getBoundingClientRect(), c=getComputedStyle(el);
              return {top:r.top,bottom:r.bottom,height:r.height,clientHeight:el.clientHeight,
                scrollHeight:el.scrollHeight,scrollTop:el.scrollTop,overflowY:c.overflowY,
                position:c.position,display:c.display};
            };
            const root=q('.mobile-layout'),panel=q('.mobile-action-panel'),
              wrapper=panel?.querySelector(':scope > .flex-1.min-h-0.flex.flex-col'),
              sc=q('.mobile-action-scroll');
            const fixed={dialogue:box(q('.m36-mobile-dialogue-fixed')),
              gauges:box(q('.m36-mobile-pleasure-fixed')),
              choiceHeading:box(q('.m36-mobile-choice-fixed'))};
            return {viewport:{w:innerWidth,h:innerHeight,scrollY:scrollY},
              root:box(root),panel:box(panel),wrapper:box(wrapper),scroll:box(sc),
              fixed,disabledReasons:[...document.querySelectorAll('.m36-mobile-disabled-choice')].slice(0,4).map(el=>({
                label:el.getAttribute('data-m36-disabled-choice-label'),
                reason:el.getAttribute('data-m36-disabled-choice-status'),
                before:getComputedStyle(el,'::before').content,
                after:getComputedStyle(el,'::after').content
              })),
              visibleText:document.body.innerText.slice(-1000)};
          });
          const scrollResult=await page.evaluate(()=>{
            const sc=document.querySelector('.mobile-action-scroll');
            if(!sc)return {found:false};
            const nodes=['.m36-mobile-dialogue-fixed','.m36-mobile-pleasure-fixed','.m36-mobile-choice-fixed']
              .map(s=>({selector:s,el:document.querySelector(s)})).filter(x=>x.el);
            const rects=()=>nodes.map(x=>({selector:x.selector,top:x.el.getBoundingClientRect().top}));
            const before=rects();
            const oldY=scrollY, oldTop=sc.scrollTop;
            sc.scrollTop=Math.min(Math.max(120,sc.clientHeight),Math.max(0,sc.scrollHeight-sc.clientHeight));
            sc.dispatchEvent(new Event('scroll',{bubbles:true}));
            return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
              const after=rects();
              resolve({found:true,clientHeight:sc.clientHeight,scrollHeight:sc.scrollHeight,
                oldScrollTop:oldTop,newScrollTop:sc.scrollTop,pageScrollYBefore:oldY,pageScrollYAfter:scrollY,
                before,after,deltas:before.map((x,i)=>({selector:x.selector,delta:after[i].top-x.top}))});
            })));
          });
          await page.screenshot({path:'mobile-fixed-area-runtime.png',fullPage:false});
          fs.writeFileSync('mobile-fixed-area-runtime.json',JSON.stringify({url,before,scrollResult,errors},null,2));
          console.log('RUNTIME_REPORT',JSON.stringify({before,scrollResult,errors}));
          const failed=[];
          if(!before.root)failed.push('MOBILE_LAYOUT_NOT_REACHED');
          if(!before.scroll)failed.push('CHOICE_SCROLL_NOT_FOUND');
          if(before.scroll && before.scroll.clientHeight<=0)failed.push('CHOICE_SCROLL_HAS_ZERO_HEIGHT');
          if(scrollResult.found && scrollResult.scrollHeight>scrollResult.clientHeight+2 &&
              scrollResult.newScrollTop<=scrollResult.oldScrollTop)failed.push('CHOICE_LIST_DID_NOT_SCROLL');
          for(const item of scrollResult.deltas||[]) {
            if(item.selector!=='.m36-mobile-choice-fixed' && Math.abs(item.delta)>2)
              failed.push('UPPER_CONTENT_MOVED:'+item.selector+':'+item.delta);
          }
          if(scrollResult.found && scrollResult.pageScrollYAfter!==scrollResult.pageScrollYBefore)
            failed.push('PAGE_SCROLL_MOVED');
          if(errors.length)failed.push('PAGE_RUNTIME_ERRORS:'+errors.slice(0,3).join('|'));
          await browser.close();
          if(failed.length){console.error('RUNTIME_TEST_FAILED',JSON.stringify(failed));process.exit(1);}
          console.log('RUNTIME_TEST_PASS');
          EOF
          node mobile-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-fixed-area-runtime
          path: |
            mobile-fixed-area-runtime.png
            mobile-fixed-area-runtime.json
          if-no-files-found: ignore
      - name: Remove temporary runtime workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/m36-mobile-fixed-area-runtime.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary mobile fixed-area runtime test"
            git push origin HEAD:mobile-migration-v1
          fi
