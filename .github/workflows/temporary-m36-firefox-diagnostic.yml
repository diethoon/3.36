name: M36 Firefox scroll and icon root-cause diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/temporary-m36-firefox-diagnostic.yml"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current game branch read-only for diagnostics
        uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Test actual game DOM and CSS in Chromium and Firefox, without editing game source
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium firefox >/dev/null
          python3 -m http.server 4173 >/tmp/m36-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium, firefox } = require('playwright');
          const wait = ms => new Promise(r => setTimeout(r, ms));
          async function bootAndInspect(engineName, engine) {
            const browser = await engine.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 820, height: 360 }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            const resp = await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html?m36-root-cause=' + engineName, { waitUntil: 'domcontentloaded', timeout: 90000 });
            if (resp?.status() !== 200) throw new Error(engineName + ': HTML response was not 200');
            await page.waitForFunction(() => document.body && document.body.innerText.trim().length > 10, null, { timeout: 60000 }).catch(() => {});
            for (let i = 0; i < 45; i++) {
              const body = await page.locator('body').innerText().catch(() => '');
              if (body.includes('물자 채우기') && body.includes('대출')) break;
              const next = page.getByRole('button', { name: /^예$|이해하고 동의합니다|다음|계속|시작|확인|완료|진행|게임 시작|새 게임/ });
              let clicked = false;
              for (let j = 0; j < await next.count(); j++) {
                try { const b = next.nth(j); if (await b.isVisible() && await b.isEnabled()) { await b.evaluate(e => e.click()); await wait(180); clicked = true; break; } } catch {}
              }
              const text = await page.locator('body').innerText().catch(() => '');
              if (!clicked && text.includes('그녀는 당신에게 어떤 존재인가요')) {
                const wifeType = page.getByRole('button', { name: /^아내$/ });
                if (await wifeType.count() && await wifeType.first().isVisible() && await wifeType.first().isEnabled()) { await wifeType.first().evaluate(e => e.click()); await wait(220); clicked = true; }
                const woman = page.getByRole('button', { name: /^(엘레나|마라|피파)/ });
                if (await woman.count() && await woman.first().isVisible() && await woman.first().isEnabled()) { await woman.first().evaluate(e => e.click()); await wait(250); clicked = true; }
              }
              if (!clicked) {
                const woman = page.getByRole('button', { name: /^(엘레나|마라|피파)/ });
                if (await woman.count() && await woman.first().isVisible() && await woman.first().isEnabled()) { await woman.first().evaluate(e => e.click()); await wait(250); clicked = true; }
              }
              if (!clicked) await wait(250);
            }
            await wait(500);
            const initial = await page.evaluate(() => {
              const sum = e => { if (!e) return null; const r=e.getBoundingClientRect(),s=getComputedStyle(e); return {tag:e.tagName,cls:String(e.className||'').slice(0,120),text:(e.innerText||'').trim().slice(0,70),rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},position:s.position,display:s.display,overflowY:s.overflowY,touchAction:s.touchAction,pointerEvents:s.pointerEvents,zIndex:s.zIndex,opacity:s.opacity,color:s.color,background:s.backgroundColor,border:s.border,clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,scrollTop:e.scrollTop}; };
              const sc=document.querySelector('.mobile-action-panel .mobile-action-scroll');
              const panel=document.querySelector('.mobile-action-panel');
              const info=document.querySelector('.m36-landscape-info-scroll');
              const launch=document.querySelector('.m33-launchers button');
              const sys=document.querySelector('.m34-system-tools .m34-header-control');
              const media=matchMedia('(orientation:landscape)').matches;
              const rules=[];
              for(const sh of [...document.styleSheets]){ let rr; try{rr=sh.cssRules}catch{continue}
                const scan=(arr,mediaText='')=>{for(const rule of [...arr]){if(rule.cssRules){scan(rule.cssRules,mediaText+(rule.conditionText||'')+' ');continue}
                  if(!rule.selectorText||!rule.style)continue;
                  let targets=[];try{if(sc&&sc.matches(rule.selectorText))targets.push('scroll');if(launch&&launch.matches(rule.selectorText))targets.push('launcher');if(sys&&sys.matches(rule.selectorText))targets.push('system')}catch{}
                  if(targets.length){const vals={};for(const prop of ['display','position','height','min-height','max-height','overflow','overflow-y','touch-action','pointer-events','opacity','color','background','background-color','filter','z-index']){const v=rule.style.getPropertyValue(prop);if(v)vals[prop]=v+(rule.style.getPropertyPriority(prop)==='important'?' !important':'')}
                    rules.push({targets,selector:rule.selectorText,media:mediaText.trim(),values:vals});}
                }};
                scan(rr);
              }
              const ancestors=e=>{const out=[];for(let p=e,i=0;p&&i<7;p=p.parentElement,i++){out.push(sum(p))}return out};
              return {viewport:{innerWidth,innerHeight,orientation:media?'landscape':'portrait'},markers:{scrollFallback:!!document.getElementById('m36-landscape-action-pane-touch-fallback-20261014'),style:!!document.getElementById('m36-landscape-action-scroll-and-icon-contrast-20261014')},
                panel:sum(panel),info:sum(info),scroller:sum(sc),scrollAncestors:ancestors(sc),launcher:sum(launch),launcherAncestors:ancestors(launch),system:sum(sys),systemAncestors:ancestors(sys),matchingRules:rules.slice(-100)};
            });
            let synthetic = null;
            try {
              synthetic = await page.evaluate(() => {
                const sc=document.querySelector('.mobile-action-panel .mobile-action-scroll');
                if(!sc)return {error:'missing scroller'};
                const inner=sc.querySelector('p,button,div')||sc;
                const rect=sc.getBoundingClientRect();
                const x=rect.left+Math.min(rect.width/2,30), y=rect.top+Math.min(rect.height-15,rect.height*.75);
                const before=sc.scrollTop;
                const make=(type,clientY)=> {
                  const touch=new Touch({identifier:44,target:inner,clientX:x,clientY,screenX:x,screenY:clientY,pageX:x+scrollX,pageY:clientY+scrollY});
                  const ending=type==='touchend'||type==='touchcancel';
                  const ev=new TouchEvent(type,{bubbles:true,cancelable:type==='touchmove',touches:ending?[]:[touch],targetTouches:ending?[]:[touch],changedTouches:[touch]});
                  inner.dispatchEvent(ev);return {type,defaultPrevented:ev.defaultPrevented};
                };
                const a=make('touchstart',y),b=make('touchmove',y-80),c=make('touchmove',y-170),d=make('touchend',y-170);
                return {targetClass:String(inner.className||inner.tagName),before,after:sc.scrollTop,max:sc.scrollHeight-sc.clientHeight,customOwner:sc.getAttribute('data-m36-touch-scroll-owned'),events:[a,b,c,d]};
              });
            } catch(e) { synthetic={error:String(e)}; }
            console.log('M36_ENGINE_DIAG_'+engineName+'='+JSON.stringify({initial,synthetic,errors}));
            await browser.close();
          }
          (async()=>{await bootAndInspect('chromium',chromium);await bootAndInspect('firefox',firefox)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Always remove this temporary diagnostic workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch --detach origin/main
          if [ -f .github/workflows/temporary-m36-firefox-diagnostic.yml ]; then
            git rm .github/workflows/temporary-m36-firefox-diagnostic.yml
            git commit -m "chore: remove temporary Firefox scroll diagnostics"
            git push origin HEAD:main
          fi
