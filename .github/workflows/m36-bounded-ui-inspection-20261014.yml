name: M36 bounded mobile UI inspection
on:
  push:
    branches: [mobile-migration-v1]
    paths: [".github/workflows/m36-bounded-ui-inspection-20261014.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Inspect small byte windows only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          terms=["대기 중","m36-mobile-pleasure-fixed","m36-mobile-choice-gauge",
                 "u.jsx(M36MobilePleasureFixed","상태변화","상태 변화",
                 "portrait","초상화","대기","waitStatus","currentTask"]
          print("FILE_BYTES",p.stat().st_size)
          found={t:0 for t in terms}; seen=set(); overlap=b""; offset=0
          with p.open("rb") as f:
            while True:
              chunk=f.read(256*1024)
              if not chunk: break
              buf=overlap+chunk; base=offset-len(overlap)
              for term in terms:
                needle=term.encode("utf-8"); pos=0
                while True:
                  i=buf.find(needle,pos)
                  if i<0: break
                  absolute=base+i; key=(term,absolute)
                  if key not in seen:
                    seen.add(key); found[term]+=1
                    limit=20 if term in ("대기 중","대기","currentTask","u.jsx(M36MobilePleasureFixed") else 8
                    if found[term] <= limit:
                      a=max(0,i-300); b=min(len(buf),i+len(needle)+500)
                      print(f"\n--- TERM={term} N={found[term]} OFFSET={absolute} ---")
                      print(buf[a:b].decode("utf-8","replace").replace("\\n"," ")[:900])
                  pos=i+len(needle)
              offset+=len(chunk); overlap=buf[-2048:]
          print("\n--- COUNTS ---")
          for term,n in found.items(): print(f"{term}: {n}")
          PY
