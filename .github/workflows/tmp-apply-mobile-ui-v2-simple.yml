name: tmp-apply-mobile-ui-v2-simple

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/m36_mobile_ui_v2_patch.py
      - name: Validate diff
        run: |
          git diff --check
          git diff --numstat
          git status --short
      - name: Commit HTML and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Wayward_MOD_v3.36.html
          git commit -m "feat(mobile): add persistent status activity and direct navigation"
          git rm tools/m36_mobile_ui_v2_patch.py .github/workflows/tmp-apply-mobile-ui-v2-simple.yml .github/workflows/tmp-current-owner-scan3.yml 2>/dev/null || true
          git commit -m "chore: remove temporary mobile patch tooling" || true
          git push
