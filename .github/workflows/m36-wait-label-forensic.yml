name: m36-wait-label-forensic
on:
  push:
    branches: [mobile-migration-v1]
    paths-ignore: ["__m36_wait_forensic_trigger.txt"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - name: Extract
        shell: python
        run: |
          from pathlib import Path
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          needles=["시간 보내기","기다리기","1분","5분","15분","손님 올 때까지 기다리기","그대로 누워 있기"]
          out=[]
          for n in needles:
              out.append(f"### {n} count={s.count(n)}")
              pos=0
              for _ in range(5):
                  p=s.find(n,pos)
                  if p<0: break
                  out.append(f"--- offset={p} ---")
                  out.append(s[max(0,p-3500):min(len(s),p+5000)])
                  pos=p+len(n)
          Path("__m36_wait_forensic.txt").write_text("\n".join(out),encoding="utf-8")
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __m36_wait_forensic.txt
          git commit -m "chore: temporary wait label forensic report" || exit 0
          git push
