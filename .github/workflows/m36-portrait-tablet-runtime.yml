name: m36 portrait tablet runtime
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture portrait tablet at four font sizes
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const url='https://static-3-36.onrender.com/Wayward_MOD_v3.36.html';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({
            viewport:{width:800,height:1280},
            deviceScaleFactor:1,
            isMobile:false
          });

          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(1500);

          const yes=page.getByText('예',{exact:true}).first();
          if(await yes.count()) { await yes.click(); await page.waitForTimeout(1800); }

          const agree=page.getByText('이해하고 동의합니다',{exact:true}).first();
          if(await agree.count()) { await agree.click({force:true}); await page.waitForTimeout(2500); }
          await page.keyboard.press('Escape').catch(()=>{});
          await page.waitForTimeout(700);
          const remainingConsent=page.getByText('이해하고 동의합니다',{exact:true}).first();
          if(await remainingConsent.count()) { await remainingConsent.click({force:true}).catch(()=>{}); await page.waitForTimeout(1000); }

          const settings=page.getByText('설정',{exact:true}).first();
          if(await settings.count()) {
            await settings.click();
            await page.waitForTimeout(700);
          }
          const sel0=page.locator('select').first();
          if(await sel0.count()) { await sel0.selectOption({label:'보통'}); }
          await page.keyboard.press('Escape');
          await page.waitForTimeout(500);

          const overlays=page.locator('div.fixed.inset-0');
          const overlayTexts=[];
          for(const el of await overlays.all()){
            overlayTexts.push((await el.innerText()).slice(0,2000));
          }
          console.log('OVERLAYS',JSON.stringify(overlayTexts));
          const overlayButtons=await page.locator('div.fixed.inset-0 button').allTextContents();
          console.log('OVERLAY_BUTTONS',JSON.stringify(overlayButtons));
          for(const txt of ['동의합니다','확인','닫기','계속','이해하고 동의합니다']){
            const b=page.getByText(txt,{exact:true}).last();
            if(await b.count()) { await b.click({force:true}).catch(()=>{}); await page.waitForTimeout(700); }
          }
          const newGame=page.getByText('새 게임',{exact:true}).first();
          if(await newGame.count()) { await newGame.click({force:true}); await page.waitForTimeout(2500); }

          const pipa=page.getByText('피파',{exact:true}).first();
          if(await pipa.count()) { await pipa.click(); await page.waitForTimeout(1500); }

          const cont=page.getByText('계속하기 — 피파 →',{exact:true}).first();
          if(await cont.count()) { await cont.click(); await page.waitForTimeout(1800); }

          const fateChoices=page.getByText('운명에 맡김',{exact:true});
          for(const b of await fateChoices.all()) {
            if(await b.isEnabled()) {
              await b.click();
              await page.waitForTimeout(60);
            }
          }

          const start=page.getByText('시작 — 피파 →',{exact:true}).first();
          if(await start.count()) { await start.click(); await page.waitForTimeout(4000); }

          const skip=page.getByText('건너뛰기',{exact:true}).first();
          if(await skip.count()) {
            await skip.click();
            await page.waitForTimeout(3000);
          }

          fs.mkdirSync('shots',{recursive:true});

          async function closeModal(){
            const overlay=page.locator('div.fixed.inset-0.z-40').last();
            if(await overlay.count()){
              const close=overlay.getByText('✕',{exact:true}).last();
              if(await close.count()) {
                await close.click({force:true}).catch(()=>{});
                await page.waitForTimeout(500);
              }
            }
            if(await page.locator('div.fixed.inset-0.z-40').count()){
              await page.keyboard.press('Escape').catch(()=>{});
              await page.waitForTimeout(600);
            }
          }

          async function openSettings(){
            await closeModal();
            const menu=page.getByText('☰',{exact:true}).last();
            await menu.click({force:true});
            await page.waitForTimeout(350);
            const btn=page.getByText('설정',{exact:true}).last();
            await btn.click({force:true});
            await page.waitForTimeout(350);
          }

          async function setFont(label,file){
            await openSettings();
            const select=page.locator('select').filter({has:page.locator('option[value="0.9"]')}).first();
            await select.selectOption({label});
            await page.waitForTimeout(500);
            await closeModal();
            await page.screenshot({path:file,fullPage:false});
          }

          await setFont('작게','shots/portrait-small.png');
          await setFont('보통','shots/portrait-normal.png');
          await setFont('크게','shots/portrait-large.png');
          await setFont('매우 크게','shots/portrait-xlarge.png');

          await page.screenshot({path:'shots/portrait-final.png',fullPage:false});
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: m36-portrait-tablet-font-screens
          path: shots/
