name: m36-find-tab-choice-components
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8",errors="ignore")
          pats=[
            r'label:"이야기"',
            r'label:"가게"',
            r'label:"엘레나"',
            r'children:"이야기"',
            r'children:"가게"',
            r'children:"엘레나"',
            r'function Xe\(',
            r'function [A-Za-z0-9_$]+\(\{label:e[^\n]{0,500}disabled',
          ]
          for p in pats:
            ms=list(re.finditer(p,s))
            print("\n###",p,"COUNT",len(ms))
            for m in ms[-8:]:
              i=m.start(); print("\n@",i,"\n",s[max(0,i-2500):min(len(s),i+6500)])
          PY