name: Cloud save WML static checks

on:
  push:
    branches:
      - feature/wml-cloud-save-20261020
    paths:
      - ".github/workflows/cloud-save-static-check.yml"
      - "Wayward_MOD_v4.0_WML_검수완료/wml/mods/cloud-save/**"
      - "Wayward_MOD_v4.0_WML_검수완료/wml/mods/mods.js"
      - "workers/wayward-save-share/index.js"
      - "workers/wayward-save-share/schema.sql"
      - "workers/wayward-save-share/test-worker.mjs"
  pull_request:
    branches:
      - wml
    paths:
      - "Wayward_MOD_v4.0_WML_검수완료/wml/mods/cloud-save/**"
      - "Wayward_MOD_v4.0_WML_검수완료/wml/mods/mods.js"
      - "workers/wayward-save-share/index.js"
      - "workers/wayward-save-share/schema.sql"
      - "workers/wayward-save-share/test-worker.mjs"

permissions:
  contents: read

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < "Wayward_MOD_v4.0_WML_검수완료/wml/mods/cloud-save/mod.js"
          node --input-type=module --check < "workers/wayward-save-share/index.js"
      - name: Exercise Worker API with D1/R2 test doubles
        run: node --no-warnings workers/wayward-save-share/test-worker.mjs
      - name: Validate D1 schema and slot limit
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.executescript(Path("workers/wayward-save-share/schema.sql").read_text(encoding="utf-8"))
          expected = {"save_shares", "cloud_accounts", "cloud_sessions", "cloud_saves", "cloud_auth_limits"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          assert not missing, f"Missing tables: {sorted(missing)}"
          db.execute(
              "INSERT INTO cloud_accounts (id, username, username_norm, password_salt, password_hash, created_at) VALUES (?, ?, ?, ?, ?, ?)",
              ("a1", "test_user", "test_user", "00", "00", 1),
          )
          db.execute(
              "INSERT INTO cloud_saves (account_id, slot, object_key, title, saved_at, byte_length) VALUES (?, ?, ?, ?, ?, ?)",
              ("a1", 5, "accounts/a1/5.json", "test", 1, 1),
          )
          try:
              db.execute(
                  "INSERT INTO cloud_saves (account_id, slot, object_key, title, saved_at, byte_length) VALUES (?, ?, ?, ?, ?, ?)",
                  ("a1", 6, "accounts/a1/6.json", "invalid", 1, 1),
              )
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError("slot 6 was incorrectly accepted")
          print("D1 schema checks passed; slots are constrained to 1–5.")
          PY
      - name: Verify frontend and Worker contract strings
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'/api/account/register'" "Wayward_MOD_v4.0_WML_검수완료/wml/mods/cloud-save/mod.js"
          grep -q "'/api/account/login'" "Wayward_MOD_v4.0_WML_검수완료/wml/mods/cloud-save/mod.js"
          grep -q "'/api/account/saves'" "Wayward_MOD_v4.0_WML_검수완료/wml/mods/cloud-save/mod.js"
          grep -q "/api/account/register" "workers/wayward-save-share/index.js"
          grep -q "/api/account/login" "workers/wayward-save-share/index.js"
          grep -q "/api/account/saves" "workers/wayward-save-share/index.js"
          echo "Frontend/Worker route strings verified."
