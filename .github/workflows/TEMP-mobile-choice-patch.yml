name: TEMP mobile choice patch
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.number == 46 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 2
      - name: Patch from clean accepted commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Wayward_MOD_v3.36.html")
          b=p.read_bytes()
          old1=b'px-[0.6rem] py-[0.35rem] desk:p-3 min-h-0 desk:min-h-0'
          new1=b'px-[0.6rem] py-[0.4rem] desk:p-3 min-h-0 desk:min-h-0'
          old2=b'.m36-mobile-stock-button{width:100%;min-height:32px;margin-top:.25rem;padding:.25rem .45rem;display:flex;align-items:center;justify-content:space-between;gap:.3rem;border:1px solid rgb(120 53 15);border-radius:.3rem;background:rgb(124 45 18);color:rgb(255 247 237);font-size:.66rem}'
          new2=b'.m36-mobile-stock-button{width:100%;min-height:34px;margin-top:.25rem;padding:.35rem .55rem;display:flex;align-items:center;justify-content:space-between;gap:.3rem;border:1px solid rgb(217 119 6);border-radius:.4rem;background:rgb(146 64 14);color:rgb(255 247 237);font-size:.68rem;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.35);cursor:pointer}'
          for label,old,new in [("CHOICE",old1,new1),("STOCK",old2,new2)]:
              n=b.count(old); print(label+"_OLD_COUNT",n)
              if n!=1: raise SystemExit(label+"_COUNT_FAIL")
              b=b.replace(old,new)
              if b.count(new)!=1: raise SystemExit(label+"_NEW_COUNT_FAIL")
          p.write_bytes(b)
          print("PATCH=PASS")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, shutil
          p=Path("Wayward_MOD_v3.36.html")
          out=Path("/tmp/nodecheck"); shutil.rmtree(out,ignore_errors=True); out.mkdir()
          data=p.read_bytes(); idx=0
          for m in re.finditer(br'<script\b[^>]*>(.*?)</script\s*>',data,re.I|re.S):
              idx+=1; s=out/f"s{idx}.js"; s.write_bytes(m.group(1))
              r=subprocess.run(["node","--check",str(s)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit("NODE_CHECK_FAIL")
          if idx==0: raise SystemExit("NO_SCRIPTS")
          print("NODE_CHECK=PASS",idx)
          PY
          git diff --check
          git diff --numstat -- Wayward_MOD_v3.36.html
          git status --short
      - name: Commit clean final patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v3.36.html
          git commit -m "fix(mobile): slightly increase action choices and clarify stock button"
          git push origin HEAD:mobile-migration-v1 --force
