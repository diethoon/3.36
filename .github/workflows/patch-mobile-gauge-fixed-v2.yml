name: patch mobile gauge fixed v2
on:
  push:
    branches:
      - mobile-migration-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo  | base64 -d > /tmp/patch.py && python3 /tmp/patch.py
      - run: rm -f .github/workflows/patch-mobile-gauge-fixed.yml __gauge_patch_trigger.txt && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add Wayward_MOD_v3.36.html .github/workflows/patch-mobile-gauge-fixed.yml __gauge_patch_trigger.txt && git commit -m "fix(mobile): keep dialogue gauges fixed above choices" && git push
