name: M36 forensic document EOF cleanup

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Fix only the newly appended section heading and EOF escape
        shell: bash
        run: |
          set -e
          {
            git fetch --depth=1 origin refs/heads/mobile-migration-v1:refs/remotes/origin/mobile-migration-v1
            git checkout -B mobile-migration-v1 refs/remotes/origin/mobile-migration-v1
            python3 - <<'PY'
          from pathlib import Path
          import mmap, os

          path = Path("idea/GPT_RUNTIME_FORENSIC_FALLBACK.md")
          marker = b'\\n\\n### 31. 2026-10-12 mobile landscape four-column UI patch'
          replacement = b"\n\n### 33. 2026-10-12 mobile landscape four-column UI patch"
          literal_tail = b'\\n'
          with path.open("rb") as f, mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ) as mm:
              at = mm.find(marker)
              if at < 0: raise SystemExit("APPENDED_SECTION_PREFIX_NOT_FOUND")
              if mm.find(marker, at + 1) >= 0: raise SystemExit("APPENDED_SECTION_PREFIX_AMBIGUOUS")
              size = len(mm)
              f.seek(size - 2)
              tail = f.read(2)
              if tail != literal_tail:
                  raise SystemExit("EXPECTED_LITERAL_BACKSLASH_N_AT_EOF_NOT_FOUND: " + repr(tail))
              print("DOC_BYTES", size, "PREFIX_OFFSET", at, "EOF_LITERAL_OFFSET", size - 2)
          ops = [
              (at, at + len(marker), replacement),
              (size - 2, size, b"\n"),
          ]
          ops.sort()
          temp = path.with_suffix(".md.m36tmp")
          cursor = 0
          with path.open("rb") as src, temp.open("wb") as dst:
              for start, end, repl in ops:
                  if start < cursor: raise SystemExit("PATCH_RANGES_OVERLAP")
                  src.seek(cursor)
                  remaining = start - cursor
                  while remaining:
                      block = src.read(min(65536, remaining))
                      if not block: raise SystemExit("UNEXPECTED_EOF")
                      dst.write(block); remaining -= len(block)
                  dst.write(repl); cursor = end
              src.seek(cursor)
              while True:
                  block = src.read(65536)
                  if not block: break
                  dst.write(block)
          os.replace(temp, path)
          with path.open("rb") as f:
              f.seek(max(0, path.stat().st_size - 1200))
              print("EOF_CHUNK")
              print(f.read().decode("utf-8", "replace"))
          PY
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add idea/GPT_RUNTIME_FORENSIC_FALLBACK.md
            git commit -m "docs: normalize landscape evidence section at EOF"
            git push origin HEAD:mobile-migration-v1
            git rev-parse HEAD > /tmp/m36-landscape-doc-cleanup-commit.txt
            echo "DOC_EOF_CLEANUP_PASS"
          } 2>&1 | tee /tmp/m36-landscape-doc-cleanup-report.txt
      - name: Report and remove temporary runner
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROBE_BRANCH: m36-landscape-doc-cleanup-20261012
          WF_PATH: .github/workflows/m36-landscape-doc-cleanup-20261012.yml
        run: |
          set +e
          {
            [ -f /tmp/m36-landscape-doc-cleanup-report.txt ] && cat /tmp/m36-landscape-doc-cleanup-report.txt
            [ -f /tmp/m36-landscape-doc-cleanup-commit.txt ] && echo "COMMIT $(cat /tmp/m36-landscape-doc-cleanup-commit.txt)"
            echo "JOB_STATUS: ${{ job.status }}"
          } > /tmp/m36-landscape-doc-cleanup-final.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/m36-landscape-doc-cleanup-final.txt)" >/tmp/m36-landscape-doc-cleanup-comment.log 2>&1
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Temporary EOF cleanup runner completed; no merge performed." >/tmp/m36-landscape-doc-cleanup-close.log 2>&1
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PROBE_BRANCH" >/tmp/m36-landscape-doc-cleanup-branch-delete.log 2>&1
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WF_PATH?ref=main" --jq .sha 2>/dev/null)"
          if [ -n "$SHA" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WF_PATH" -f message="chore: remove temporary landscape EOF cleanup runner" -f sha="$SHA" -f branch=main >/tmp/m36-landscape-doc-cleanup-wf-delete.log 2>&1; fi
