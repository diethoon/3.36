name: tmp-apply-mobile-ui-v2

on:
  push:
    branches: [mobile-migration-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply compact status and activity UI
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("Wayward_MOD_v3.36.html")
          data=p.read_bytes()

          if b"wayward-mobile-ui-v2" in data:
              raise SystemExit("PATCH_ALREADY_PRESENT")

          css=b"""<style id="wayward-mobile-ui-v2">
@media (max-width:1023px) {
  .wayward-mobile-status { flex:0 0 auto; padding:.2rem .25rem; border-bottom:1px solid rgba(68,64,60,.72); }
  .wayward-mobile-status-row { display:flex; align-items:baseline; gap:.4rem; min-width:0; line-height:1.15; }
  .wayward-mobile-status-label { flex:0 0 auto; color:rgb(168 162 158); font-size:.66rem; white-space:nowrap; }
  .wayward-mobile-status-value { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgb(231 229 228); font-size:.66rem; }
  .wayward-mobile-status-meta { margin-left:auto; color:rgb(120 113 108); font-size:.58rem; white-space:nowrap; }
  .wayward-mobile-nav-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.3rem; margin-top:.45rem; }
  .wayward-mobile-nav-button { min-height:32px; padding:.25rem .35rem; border:1px solid rgb(68 64 60); border-radius:.3rem; background:rgb(28 25 23); color:rgb(214 211 209); font-size:.68rem; text-align:left; }
  .mobile-current-activity { flex:0 0 auto; margin:.25rem .25rem .35rem; padding:.35rem .45rem; border:1px solid rgba(120,53,15,.55); border-radius:.3rem; background:rgba(69,26,3,.20); }
  .mobile-current-activity-title { color:rgb(251 191 36); font-size:.62rem; font-weight:700; }
  .mobile-current-activity-text { margin-top:.12rem; color:rgb(231 229 228); font-size:.72rem; line-height:1.2; overflow-wrap:anywhere; }
  .mobile-current-activity-meta { margin-top:.1rem; color:rgb(120 113 108); font-size:.58rem; }
}
</style>
"""
          components=b"""function WaywardMobileStatusLabel(location){
  return ({
    taproom:"홀",
    back_room:"뒷방",
    upstairs_hall:"객실 1",
    upstairs_room_2:"객실 2",
    bedroom:"침실",
    elena_room:"침실",
    bathhouse:"목욕탕",
    bathroom:"욕실",
    kitchen:"주방"
  })[location]??location??"알 수 없음";
}
function WaywardPersistentStatus(){
  const state=re(x=>x.state),dispatch=re(x=>x.dispatch),wife=g(state),playerLoc=be(state),[open,setOpen]=Z.useState(!1);
  const energy=Math.round(state.player?.stats?.energy??0);
  const wifeEnergy=Math.round(wife.stats?.energy??0),wifeMood=Math.round(wife.stats?.mood??0),wifeTrust=Math.round(wife.relationship?.trust??0);
  const wifeTask=jF(wife,state);
  const nav=action=>{dispatch(action);setOpen(!1);};
  return u.jsxs("div",{className:"wayward-mobile-status",children:[
    u.jsx("button",{type:"button",onClick:()=>setOpen(v=>!v),className:"wayward-mobile-status-row",style:{width:"100%",background:"transparent",border:0,padding:0,textAlign:"left"},children:[
      u.jsx("span",{className:"wayward-mobile-status-label",children:"현재 위치"}),
      u.jsx("span",{className:"wayward-mobile-status-value",children:WaywardMobileStatusLabel(playerLoc)}),
      u.jsx("span",{className:"wayward-mobile-status-meta",children:open?"▾":"▸"})
    ]}),
    u.jsxs("div",{className:"wayward-mobile-status-row",children:[
      u.jsx("span",{className:"wayward-mobile-status-label",children:"당신"}),
      u.jsx("span",{className:"wayward-mobile-status-value",children:state.phase==="prep"?"준비 중":"진행 중"}),
      u.jsxs("span",{className:"wayward-mobile-status-meta",children:["기력 ",energy]})
    ]}),
    u.jsxs("div",{className:"wayward-mobile-status-row",children:[
      u.jsx("span",{className:"wayward-mobile-status-label",children:wife.name||"피파"}),
      u.jsx("span",{className:"wayward-mobile-status-value",children:wifeTask}),
      u.jsxs("span",{className:"wayward-mobile-status-meta",children:["기력 ",wifeEnergy," · 기분 ",wifeMood," · 신뢰 ",wifeTrust]})
    ]}),
    open&&u.jsxs("div",{className:"wayward-mobile-nav-grid",children:[
      u.jsx("button",{type:"button",className:"wayward-mobile-nav-button",onClick:()=>nav({type:"return_to_taproom"}),children:"홀"}),
      u.jsx("button",{type:"button",className:"wayward-mobile-nav-button",onClick:()=>nav({type:"go_to_back_room"}),children:"뒷방"}),
      u.jsx("button",{type:"button",className:"wayward-mobile-nav-button",onClick:()=>nav({type:"go_to_bedroom"}),children:"침실"}),
      u.jsx("button",{type:"button",className:"wayward-mobile-nav-button",onClick:()=>nav({type:"go_upstairs"}),children:"객실 1"}),
      u.jsx("button",{type:"button",className:"wayward-mobile-nav-button",onClick:()=>nav({type:"go_upstairs",room:"upstairs_room_2"}),children:"객실 2"}),
      u.jsx("button",{type:"button",className:"wayward-mobile-nav-button",onClick:()=>nav({type:"enter_bathhouse"}),children:"목욕탕"})
    ]})
  ]});
}
function WaywardCurrentActivity(){
  const state=re(x=>x.state),wife=g(state),playerLoc=be(state),task=jF(wife,state);
  const text=state.phase==="prep"?wife.name+"은(는) 영업 준비를 돕고 있습니다.":wife.name+"은(는) "+task+".";
  const meta="현재 위치: "+WaywardMobileStatusLabel(playerLoc)+" · "+task;
  return u.jsxs("section",{className:"mobile-current-activity",children:[
    u.jsx("div",{className:"mobile-current-activity-title",children:"현재 활동"}),
    u.jsx("div",{className:"mobile-current-activity-text",children:text}),
    u.jsx("div",{className:"mobile-current-activity-meta",children:meta})
  ]});
}
"""

          anchor=b"function AOe(){"
          if data.count(anchor)!=1:
              raise SystemExit("AOE_ANCHOR_COUNT")

          end_head=b"</head>"
          if data.count(end_head)!=1:
              raise SystemExit("HEAD_COUNT")

          data=data.replace(end_head,css+end_head,1)
          data=data.replace(anchor,components+anchor,1)

          old1=b'u.jsx("div",{className:"mobile-action-scroll flex-1 min-h-0 overflow-y-auto py-1 text-[0.72rem]",children:u.jsx(HD,{})})'
          new1=b'u.jsx(WaywardPersistentStatus,{}),'+old1
          if data.count(old1)!=1:
              raise SystemExit("ACTION_SCROLL_ANCHOR_COUNT")
          data=data.replace(old1,new1,1)

          old2=b'!y&&u.jsx("div",{className:"shrink-0 border-b border-stone-700",children:u.jsx(rI,{compact:!0})}),'
          new2=old2+b'u.jsx(WaywardCurrentActivity,{}),'
          if data.count(old2)!=1:
              raise SystemExit("ACTIVITY_ANCHOR_COUNT")
          data=data.replace(old2,new2,1)

          p.write_bytes(data)
          print("STATUS_FUNCTIONS",data.count(b"function WaywardPersistentStatus()"),data.count(b"function WaywardCurrentActivity()"))
          print("STATUS_RENDER",data.count(b"u.jsx(WaywardPersistentStatus,{})"))
          print("ACTIVITY_RENDER",data.count(b"u.jsx(WaywardCurrentActivity,{})"))
          print("MARKER",data.count(b"wayward-mobile-ui-v2"))

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("Wayward_MOD_v3.36.html")
          d=p.read_bytes()
          assert d.count(b"function WaywardPersistentStatus()")==1
          assert d.count(b"function WaywardCurrentActivity()")==1
          assert d.count(b"u.jsx(WaywardPersistentStatus,{})")==1
          assert d.count(b"u.jsx(WaywardCurrentActivity,{})")==1
          assert d.count(b"wayward-mobile-ui-v2")==1
          scripts=re.findall(br"<script[^>]*>(.*?)</script>",d,re.S)
          out=Path("/tmp/wayward-v2"); out.mkdir(exist_ok=True)
          for i,s in enumerate(scripts,1):
              (out/f"{i}.js").write_bytes(s)
          print("INLINE_SCRIPTS",len(scripts))
          PY
          for f in /tmp/wayward-v2/*.js; do node --check "$f"; done
          git diff --check
          git diff --numstat

      - name: Commit and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Wayward_MOD_v3.36.html
          git commit -m "feat(mobile): add persistent status activity and direct navigation"
          git rm .github/workflows/tmp-current-owner-scan3.yml .github/workflows/tmp-apply-mobile-ui-v2.yml 2>/dev/null || true
          git commit -m "chore: remove temporary mobile workflows" || true
          git push
