name: Temporary landscape runtime layout audit
on:
  push:
    branches:
      - mobile-migration-v1
    paths:
      - .github/workflows/m36-landscape-runtime.yml
permissions:
  contents: read
jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Inspect rendered layout in landscape viewport
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/m36-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          cat > /tmp/m36-runtime-audit.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:844,height:390},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(1200);
            for (const pattern of [/^예$/, /^(새 게임|새로 시작)$/, /^(시작|계속|이어하기)$/]) {
              const button=page.getByRole('button').filter({hasText:pattern});
              if (await button.count()) { try { await button.first().click({timeout:1500}); await page.waitForTimeout(1200); } catch {} }
            }
            await page.waitForTimeout(3500);
            const report = await page.evaluate(() => {
              const slim = (el) => {
                const r=el.getBoundingClientRect(), cs=getComputedStyle(el);
                return {tag:el.tagName.toLowerCase(),id:el.id||'',cls:typeof el.className==='string'?el.className.slice(0,220):'',text:(el.innerText||'').replace(/\\s+/g,' ').slice(0,90),
                  rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},
                  display:cs.display,position:cs.position,overflow:cs.overflow,flex:cs.flex,grid:cs.gridTemplateColumns,
                  children:el.children.length};
              };
              const root=document.querySelector('#root');
              const targets=['.mobile-layout','.mobile-narration','.mobile-action-scroll','.m36-mobile-dialogue-fixed','.m36-mobile-status-panel','.m36-mobile-store-status','.m36-mobile-prep-compact'];
              const found={};
              for(const sel of targets){
                found[sel]=[...document.querySelectorAll(sel)].slice(0,5).map(el=>({
                  ...slim(el), parent:el.parentElement?slim(el.parentElement):null,
                  grandparent:el.parentElement?.parentElement?slim(el.parentElement.parentElement):null,
                  directChildren:[...el.children].slice(0,16).map(slim)
                }));
              }
              const tree=(el,depth=0,maxDepth=4)=>{
                if(!el || depth>maxDepth) return null;
                return {...slim(el),kids:[...el.children].slice(0,14).map(c=>tree(c,depth+1,maxDepth))};
              };
              return {viewport:{w:innerWidth,h:innerHeight},buttons:[...document.querySelectorAll('button')].slice(0,50).map(b=>(b.innerText||b.getAttribute('aria-label')||'').trim().slice(0,60)),body:slim(document.body),root:root?tree(root,0,4):null,found,
                classes:[...document.querySelectorAll('[class]')].map(e=>String(e.className)).filter(v=>/mobile|portrait|landscape|narration|action-scroll|status-panel|character|sidebar|dialogue/i.test(v)).slice(0,100)};
            });
            await page.screenshot({path:'/tmp/m36-landscape-runtime.png',fullPage:false});
            console.log('M36_LANDSCAPE_RUNTIME_BEGIN');
            console.log(JSON.stringify({...report,pageErrors:errors},null,2).slice(0,30000));
            console.log('M36_LANDSCAPE_RUNTIME_END');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/m36-runtime-audit.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: m36-landscape-runtime-audit
          path: /tmp/m36-landscape-runtime.png
          retention-days: 3
