name: M36 one-shot landscape header DOM probe

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Report header group structure from real browser
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m36-header-probe-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/Wayward_MOD_v3.36.html >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS' > /tmp/m36-header-probe-report.txt 2>&1
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          for(const c of [{w:900,h:400},{w:1280,h:720}]) {
            const page=await browser.newPage({viewport:{width:c.w,height:c.h}});
            await page.goto('http://127.0.0.1:8080/Wayward_MOD_v3.36.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(800);
            const r=await page.evaluate(()=>{
              const box=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,cls:String(e.className||'').slice(0,180),text:(e.innerText||e.textContent||'').replace(/\\s+/g,' ').slice(0,90),x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),fs:s.fontSize,display:s.display,flex:s.flex,dir:s.flexDirection,wrap:s.flexWrap,gap:s.gap,overflow:s.overflowX};};
              const tree=(e,d=0)=>!e||d>3?[]:[...e.children].slice(0,16).map(c=>({...box(c),children:tree(c,d+1)}));
              const el=document.querySelector('.m34-header');
              return {viewport:{w:innerWidth,h:innerHeight,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight},
                header:box(el),stats:box(document.querySelector('.m34-header-stats')),tools:box(document.querySelector('.m34-header-tools')),
                tree:tree(el),stock:[...document.querySelectorAll('.m34-header *')].filter(e=>e.children.length===0&&e.textContent.includes('재고')).map(box).slice(0,5)};
            });
            console.log('HEADER '+c.w+'x'+c.h+' '+JSON.stringify(r));
            await page.close();
          }
          await browser.close();
          JS
          cat /tmp/m36-header-probe-report.txt
      - name: Post compact report and clean runner
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROBE_BRANCH: m36-header-probe-20261012
          WF_PATH: .github/workflows/m36-header-probe-20261012.yml
        run: |
          set +e
          [ -s /tmp/m36-header-probe-report.txt ] || echo "HEADER_PROBE_REPORT_MISSING" > /tmp/m36-header-probe-report.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/m36-header-probe-report.txt)" >/tmp/m36-header-comment.log 2>&1
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "One-shot header DOM probe completed; no game source modified." >/tmp/m36-header-close.log 2>&1
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PROBE_BRANCH" >/tmp/m36-header-delete.log 2>&1
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WF_PATH?ref=main" --jq .sha 2>/dev/null)"
          if [ -n "$SHA" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WF_PATH" -f message="chore: remove temporary header probe" -f sha="$SHA" -f branch=main >/tmp/m36-header-wf-delete.log 2>&1; fi
