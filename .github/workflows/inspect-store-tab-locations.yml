name: inspect-store-tab-locations
on:
  pull_request:
    branches:
      - mobile-migration-v1
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("Wayward_MOD_v3.36.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>",s,re.S)
          script=next((x for x in scripts if "function AOe(" in x and "function M36MobileStoreStatus(" in x),None)
          if script is None: raise SystemExit("main JS not found")
          for needle in ["가게 안","현재 위치","홀1","엘레나대기","욕실1","시구르드","M36MobileStore","m36-mobile-store-status","function s3(","function wOe("]:
              print("\n=== "+needle+" ===")
              hits=[m.start() for m in re.finditer(re.escape(needle),script)]
              print("COUNT",len(hits))
              for k,i in enumerate(hits[:12]):
                  print(f"\n-- {k} @ {i} --\n"+script[max(0,i-2400):i+5000])
          PY