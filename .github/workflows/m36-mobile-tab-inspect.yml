name: m36 mobile tab runtime inspect
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-migration-v1
          fetch-depth: 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect mobile tabs at xlarge
        run: |
          cat > inspect.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true});
          await page.goto('https://static-3-36.onrender.com/Wayward_MOD_v3.36.html',{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(1200);
          const yes=page.getByText('예',{exact:true}).first();
          if(await yes.count()) { await yes.click({force:true}); await page.waitForTimeout(1200); }
          const agree=page.getByText('이해하고 동의합니다',{exact:true}).first();
          if(await agree.count()) { await agree.click({force:true}); await page.waitForTimeout(1800); await page.keyboard.press('Escape').catch(()=>{}); }
          const newGame=page.getByText('새 게임',{exact:true}).first();
          if(await newGame.count()) { await newGame.click({force:true}); await page.waitForTimeout(1800); }
          const pipa=page.getByText('피파',{exact:true}).first();
          if(await pipa.count()) { await pipa.click(); await page.waitForTimeout(1200); }
          const cont=page.getByText('계속하기 — 피파 →',{exact:true}).first();
          if(await cont.count()) { await cont.click(); await page.waitForTimeout(1500); }
          const fate=page.getByText('운명에 맡김',{exact:true});
          for(const b of await fate.all()) if(await b.isEnabled()) { await b.click(); }
          const start=page.getByText('시작 — 피파 →',{exact:true}).first();
          if(await start.count()) { await start.click(); await page.waitForTimeout(2500); }
          const skip=page.getByText('건너뛰기',{exact:true}).first();
          if(await skip.count()) { await skip.click(); await page.waitForTimeout(2200); }

          const menu=page.getByText('☰',{exact:true}).last();
          if(await menu.count()) { await menu.click({force:true}); await page.waitForTimeout(250); }
          const settings=page.getByText('설정',{exact:true}).last();
          if(await settings.count()) { await settings.click({force:true}); await page.waitForTimeout(250); }
          const select=page.locator('select').filter({has:page.locator('option[value="0.9"]')}).first();
          if(await select.count()) { await select.selectOption({label:'매우 크게'}); await page.waitForTimeout(400); }
          const overlay=page.locator('div.fixed.inset-0').last();
          const close=overlay.getByText('✕',{exact:true}).last();
          if(await close.count()) { await close.click({force:true}).catch(()=>{}); await page.keyboard.press('Escape').catch(()=>{}); await page.waitForTimeout(500); }

          await page.screenshot({path:'mobile-tabs-after.png',fullPage:false});
          for(const label of ['전체','관계·감정','금화','성인']){
            const loc=page.getByText(label,{exact:true});
            const n=await loc.count();
            console.log('LABEL',label,'COUNT',n);
            for(let i=0;i<n;i++){
              const e=loc.nth(i);
              console.log('OUTER',label,i,(await e.evaluate(el=>el.outerHTML)).slice(0,1400));
              console.log('RECT',label,i,JSON.stringify(await e.boundingBox()));
              console.log('STYLE',label,i,JSON.stringify(await e.evaluate(el=>{
                const s=getComputedStyle(el); return {display:s.display,width:s.width,minWidth:s.minWidth,maxWidth:s.maxWidth,whiteSpace:s.whiteSpace,overflowWrap:s.overflowWrap,wordBreak:s.wordBreak,fontSize:s.fontSize,lineHeight:s.lineHeight,padding:s.padding};
              })));
              console.log('ANCESTORS',label,i,JSON.stringify(await e.evaluate(el=>{
                const arr=[]; let n=el;
                for(let k=0;k<5 && n;k++,n=n.parentElement){
                  const s=getComputedStyle(n),r=n.getBoundingClientRect();
                  arr.push({tag:n.tagName,cls:String(n.className),text:(n.innerText||'').slice(0,180),rect:{x:r.x,y:r.y,w:r.width,h:r.height},display:s.display,width:s.width,minWidth:s.minWidth,maxWidth:s.maxWidth,whiteSpace:s.whiteSpace,flexWrap:s.flexWrap,grid:s.gridTemplateColumns,gap:s.gap,justify:s.justifyContent,overflow:s.overflow});
                }
                return arr;
              })));
            }
          }
          const fs=await import('fs');
          console.log('SCREENSHOT_READY',fs.existsSync('mobile-tabs-after.png'));
          await browser.close();
          EOF
          node inspect.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: m36-mobile-tabs-after
          path: mobile-tabs-after.png
