<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Wayward 클라우드세이브 인증</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
    main { width: min(100%, 460px); box-sizing: border-box; border: 1px solid #8886; border-radius: 14px; padding: 22px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <h1>Wayward 클라우드세이브</h1>
    <p>이 사이트는 Wayward 게임의 Google Drive 로그인 팝업을 위한 정적 인증 페이지를 제공합니다.</p>
    <p>게임에서 <strong>클라우드세이브 → Google 계정으로 로그인</strong>을 선택해 인증 창을 여세요. 이 페이지를 직접 열면 로그인은 시작되지 않습니다.</p>
    <p>세이브 데이터는 이 사이트를 거치지 않습니다. 게임에서 암호화한 뒤 Google Drive 앱 전용 공간에 직접 저장합니다.</p>
  </main>
</body>
</html>
